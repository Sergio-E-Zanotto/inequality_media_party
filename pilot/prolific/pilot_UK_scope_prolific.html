<script id="data" type="application/json">{"built": "20261023101128", "mode": "crowd", "task": "T1_scope", "language": "UK", "lang": "en", "title": "Political articles: national or international? (pilot)", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics. This is a short pilot run; at the end we ask for your comments.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics is also yes.\nNO = politics is absent or only mentioned in passing: sport, culture, lifestyle, celebrity and human-interest stories, business news without a policy angle, accidents or crime. A politician appearing as a private person or as a celebrity does not make an article political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line on the screen is one sentence. Decide whether it contains one unit of meaning or several, and mark where each new unit begins.\nA quasi-sentence is one unit of meaning: one statement, demand, measure, judgement or fact. A sentence can contain one or several; a quasi-sentence never runs across two sentences. Boundaries usually fall at a semicolon, at a comma, or at “and” / “but” — but you decide where one unit ends and the next begins.\nTo mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole sentence is one unit of meaning, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "UK_S25", "press": true, "title": "", "paras": ["Mr Speaker, I would like to thank the Prime Minister for the advance copy of her statement. Today we embark on the country’s most important negotiations in modern times. The British people made the decision to leave the European Union and Labour respects that decision. The next steps along this journey are the most crucial and if the Prime Minister is to unite this country, as she says she aims to do the Government needs to listen, consult and represent the whole country, not just the hard-line Tory ideologues on her own benches. Britain is going to change as a result of leaving the European Union.", "The question is how. The Conservatives want to use Brexit to turn our country into a low wage tax haven. Labour is determined to invest in a high skill, high tech, high wage future, to rebuild and transform Britain, so no one and no community is left behind. Mr Speaker, the direction the Prime Minister is threatening to take this Country is both reckless and damaging and Labour will not give this Government a free hand to use Brexit to attack rights and protections, cut services and create a tax dodgers’ paradise. So let me be clear, the Prime Minister says that no deal is better than a bad deal but the reality is; no deal is a bad deal.", "Less than a year ago the Treasury estimated that leaving the European Union on World Trade Organisation terms would lead to a 7.5 per cent fall in GDP and a £45 billion loss of tax receipts. Has the Treasury updated those figures or do they still stand? If updated, can they be published? If not, what deal could be worse than those consequences of ‘no deal’? It would be a national failure of historic proportions if the Prime Minister comes back from Brussels without having secured protection for jobs and living standards.", "So we will use every parliamentary opportunity to ensure the Government is held to account at every stage of the negotiations. Mr Speaker, We all have an interest in ensuring the Prime Minister gets the best deal for this country. To safeguard jobs and living standards Britain needs full access to the single market. The Secretary of State for exiting the EU seems to agree with this. He stated in this House on 24 January the Government’s plan is a: “comprehensive free trade agreement and a comprehensive customs agreement that will deliver the exact same benefits as we have” That is what they have pledged.", "So will the Prime Minister confirm today, that she intends to deliver a trade and customs agreement with “the exact same benefits”? The same goes for protecting workers’ rights and environmental standards, protecting Britain’s nations and regions, protecting Britain’s financial sector and services and making sure there is no return to a hard border in Northern Ireland. And when does she expect to be able to guarantee the rights of all those EU nationals who live, work and contribute to this country? And for those British nationals who live in the EU, including guaranteeing their UK pensions will not be frozen post-Brexit? Mr Speaker, Brexit would be a huge task for any government.", "Yet so far they seem utterly complacent about the scale of the task ahead and government ministers can’t make up their minds about their real objectives. The Foreign Secretary said in October: “Our policy is having our cake and eating it.” Today the Chancellor said: “We can’t have our cake and eat it.” These might seem flippant exchanges from ministers, but these reflect serious differences about Britain’s negotiating aims. The Government must speak with a united voice. The Foreign Secretary is the same man who promised our NHS £350 million pounds a week once we left the EU. Now he believes that leaving the EU without a deal would be “perfectly ok”.", "It would not be “perfectly OK”. It would damage our economy and people’s living standards. Will the Prime Minister confirm she rejects such complacency? Labour has set out our tests for this Government’s Brexit negotiations And we will use all means possible to make sure we hold the Government to their word on full access to the single market, on protecting Britain from being dragged into a race to the bottom, and ensuring our future relationship with the EU is strong and co-operative. A relationship where we can work together to bring prosperity and peace to our continent.", "If the Prime Minister can deliver a deal that meets our tests, we will back her. More than ever, Britain needs a government that will deliver for the whole country, not just the few. And that is the ultimate test of the Brexit deal that the Prime Minister must now secure. Ends"], "gold": {"q2": "national"}, "note": "both experts agree on scope (second UK entry item; no international UK article exists in the gold)"}, {"id": "UK_S18", "press": false, "title": "", "paras": ["Gordon Brown is expected to give assurances to Labour MPs on Monday about his future election strategy and possibly the personnel that will lead it. It will be his first meeting with the parliamentary party since it rejected this week's extraordinary calls for a coup against his leadership, but senior figures in the cabinet want assurances that it will be a balanced strategy that will be more open about the need for some spending cuts, and so reach out to those in middle Britain concerned by the scale of the budget deficit. The cabinet met for 90 minutes today and did not discuss the plot or its causes, but was instead told by Brown to focus on the economy and a co-ordinated response to the weather. But separately Brown met the defence secretary Bob Ainsworth, cited as being unhappy with Brown's leadership in the week, and had a further meeting with the justice secretary, Jack Straw. He was also understood to have had a joint meeting with Lord Mandelson, the business secretary, and Douglas Alexander, the international development secretary, to discuss the election and the likelihood of holding a special political cabinet next week.", "The meeting of the parliamentary party on Monday is being billed as a call to arms rather than a post-mortem. Nevertheless there have been tensions at the top of the party over strategy and decision-making style ever since the pre-budget report in early December appeared to bundle the party back to a crude \"Labour investment versus Tory cuts\" line. The prime minister will need to galvanise MPs in the face of a ComRes poll for the BBC today showing Labour is seen as by the far most divided party, and a YouGov poll for the Sun which saw the Tories ahead by 11 points. \"I am sure every cabinet member believes that if they could get back to Monday by paying £500 they would do so because we were winning on Monday. Divided parties are toxic with the electorate.", "We all know that,\" said one cabinet minister. Some advisers are urging Brown to set out precisely how the election campaign team will function, including the respective roles of Lord Mandelson, Douglas Alexander and Harman. The issue is developing emblematic significance it probably does not warrant, but is still seen as important. Behind it lies the question of the extent of the influence of Ed Balls, the schools secretary, on election strategy – an influence that is resented elsewhere in the cabinet. And behind that lies the issue of whether the government has adopted a sufficiently balanced and open account of how it will halve the deficit in four years.", "Balls, repeatedly accused of wanting to fighting a class war – something he has denied in repeated interviews – does want to run a more traditional \"investment v cuts\" attack that colleagues say is largely unsustainable given the scale of the deficit. Yet even this dispute has been one of emphasis, rather than deep ideology: the budget numbers have been set out and agreed in the pre-budget report. Newspaper reports suggested that some cabinet ministers held meetings with Brown on Wednesday in which they urged him to change his style and emphasis. But Mandelson said today: \" I don't think that the discussions that have taken place have quite followed those lines.\" Asked if Brown had been told not to pursue a \"core vote strategy\", Mandelson said: \"I have never heard any of my colleagues, and certainly not the prime minister, ever suggest that the Labour party can or should win on the basis simply of those who are supporting us now.\" Brown was given further space to show leadership when the former defence secretary Geoff Hoon, one of the instigators of the call for a secret ballot of Labour MPs on Brown's leadership, accepted defeat. He said \"I think it's probably over.", "I accept that we made that opportunity and we don't appear to have succeeded.\" Brown is unlikely on Monday to adopt the apologetic tone he did when he spoke to Labour MPs after the last challenge to his leadership, in June 2009. The pledge of more collegiate government and to consult colleagues is familiar fare for a leader in trouble, and if Brown did renew these promises in private conversations over Wednesday with cabinet minsters such as Jack Straw and Harriet Harman, few will be betting the windfarm on the prime minister changing his ways this time. Similarly there is little prospect of a new Brown in public. As Mandelson said a year ago in a leaked private email to Derek Draper: \"A new public persona cannot be glued on to [Brown]. It cannot be found, it has to emerge.", "It will do so from self-confidence ... when he is being successful and receiving approval. Then he will visibly relax. He will be enjoying himself. Not so angry.\" It is possible Brown, finally relieved of threat to his leadership, will relax, but it is unlikely he will ever excel in emotional intelligence. Yet many Labour MPs may not anyway have an appetite for a big post-mortem into what happened.", "Most of them want a clearer idea about how to take on the Tories in the run-up to the election. They liked the Labour dossier, drawn up by Alistair Darling's office on Monday, \"exposing\" the so-called £34bn black hole in Tory spending plans, and they liked even more David Cameron's admission that he \"messed up\" in response by initially suggesting he was going to drop his party's commitment to recognise marriage in the tax system. One Balls supporter strongly praised Darling's work, saying \"It was probably the first proper day of scrutiny the Tories have come under, and they crumbled.\" Brown is also facing pressure to start getting out an upbeat message and there has been disagreement on how much the election can be won simply by attacking the Tories, or by putting out a positive message for a fourth term. \"Let us remember that you win elections on the future, not the past,\" Mandelson told the party conference last year. This week the Labour party looked back.", "Now, very late in the day, it has to set out that credible future agenda."], "gold": {"q2": "national", "q1": "yes"}, "note": "both experts agree on scope"}, {"id": "UK_X02", "press": false, "title": "", "paras": ["David Cameron left his eight-year-old daughter in the pub following a Sunday lunch, after a mix-up with his wife Samantha, Downing Street has admitted. The couple's daughter Nancy wandered off to the toilets while they were arranging lifts and they only realised she was not with them when they got home, the Sun said. The prime minister rushed back to the Plough Inn in Cadsden, Buckinghamshire, where he found his daughter with staff. A Downing Street spokesman said: \"The prime minister and Samantha were distraught when they realised Nancy wasn't with them. \"Thankfully when they phoned the pub she was there safe and well.", "The prime minister went down straight away to get her.\" Downing Street said the incident happened \"a couple of months ago\". The story could prove embarrassing for the prime minister, coming on the same day as the government relaunches its £450m troubled families programme. The Camerons were at the Plough Inn, near Chequers, with Nancy and their other children, Arthur, six, and 22-month-old Florence, as well as two other families. When Cameron left the pub he went home in one car with his bodyguards and thought Nancy was with his wife and their other children in another car. Samantha Cameron had assumed her eldest daughter was with her father.", "The mistake was only discovered when they got home. The prime minister drove back to the pub and found Nancy helping staff. She was away from her parents for about 15 minutes. A Downing Street spokeswoman said there was no question of the Camerons blaming security for the incident. \"Sam thought the PM had Nancy, the PM thought Sam had Nancy,\" he said.", "\"They take responsibility for their own children. No one is going to face disciplinary action.\" The spokeswoman declined to discuss whether Cameron had drunk alcohol with his meal. \"He had gone with friends at lunchtime, with a number of families with children, and they left in various different vehicles,\" she said. \"As you know, the prime minister is a very busy man but he always tries to live as normal a life as possible with his family.\" The Sun quoted a Plough insider as telling the paper: \"You'd have thought someone would have done a headcount or something. \"Pub staff found their daughter in the toilet and didn't know what to do.", "\"It's not like you can look up David Cameron in the phone book and then ring to say, 'You've left your daughter behind'. \"It's frightening the prime minister of Britain can forget something so important as his own daughter.\""], "gold": {"q1": "no"}, "note": "both experts: not political (coded 20-21 Oct 2026); non-political entry-test item (Q1 must be right)"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "UK_T1_01", "press": false, "title": "Capitalism and the death of conservatism", "paras": ["There is an omission in Jonathan Aldred’s account of how western capitalism began to shortchange many people from 1980 onwards (The long read, 6 June). For decades after 1945, communist tanks lined the borders of western Europe and communist parties were strong in Italy and France. The western system strove to retain popular loyalty by successfully providing the masses with better lifestyles than could communism – through the NHS, welfare benefits and reasonable wages. This was maintained at least in part by the heavy taxes on the super-rich, whose post-1980 reduction Jonathan Aldred describes. From 1980, Reagan and Thatcher launched a climate of credible military confrontation with Soviet communism, leading to the demise of the latter – and hence no need to moderate capitalism in order to compete with a rival system.", "The gloves are off, the super-rich are getting ever richer, and step by step the benign features of 1945-79 UK capitalism are being dismantled. Charles Patmore York • Jonathan Freedland’s “How Brexit caused the strange death of British conservatism” (8 June) is an extraordinary headline because the conservatism of Edmund Burke and Michael Oakeshott died long ago during Thatcher’s time under the influence of the Institute of Economic Affairs and the Chicago school economists, when Farage was himself a Tory. So now, while the Brexit party may “rail against” a hated elite, their unexplained substantial funding implies reliance on an elite’s money, possibly even the same elite that funds the Tory party. And while its philosophy may be “slash and burn”, the Tory cabinet’s (many now standing for leader) cuts to health, social care, including care for disabled people, and education make them the destroyers. With such alternatives, voting Labour is the best option.", "David Murray Wallington, Surrey • Jonathan Freedland suggests that the current Conservative party is anything but. The Conservative party lost its conservative nature in May 1979. For all the championing of Victorian values, Margaret Thatcher was a radical. Subsequently, any Conservative politician with ambitions has been required to worship at the altar of the blessed Margaret, and to fight others on the field of who can out-Thatcher the other. In the current Conservative and Unionist party (for how much longer?) she would be dismissed for being far too leftwing.", "Nick Pattinson Stockport, Greater Manchester • Join the debate – email guardian.letters@theguardian.com • Read more Guardian letters – click here to visit gu.com/letters • Do you have a photo you’d like to share with Guardian readers? Click here to upload it and we’ll publish the best submissions in the letters spread of our print edition"]}, {"id": "UK_T1_02", "press": false, "title": "Sajid Javid: Why we are changing how charities claim gift aid", "paras": ["Fundraising has changed. Today, people are more likely to be asked to sponsor a friend for charity through online giving pages, or to send a text to donate money to a cause close to their heart on their commute home rather than through more traditional fundraising routes. The government wants to make sure gift aid keeps pace with how charities fundraise. Gift aid is a hugely important source of income for the charity sector, worth more than £1bn a year. We want to make sure that charities can claim their gift aid repayments as quickly and easily as possible.", "To achieve this, we've listened to charities and introduced a way to file gift aid claims online. At Budget 2011 we announced a new IT system – Charities Online – which allows charities to make a gift aid claim through an online portal. Charities Online went live on 22 April and almost 30,000 charities have already signed up to use it. Following conversations with the charity sector, we've also introduced a six-month transition period to allow charities to continue claiming gift aid using the old R68(i) claim forms whilst they prepare for the new system. This transition period is coming to an end on 30 September, so all claims made from 1 October onwards will need to be made using Charities Online.", "HMRC is currently writing to all charities that have claimed gift aid in the last three years reminding them about this change. The new system will make it significantly easier to make repayment claims and shorten the standard processing time from around 27 days under the old R68(i) forms to just five days. This should also significantly reduce the time and money spent by charities on administering their claims. There are three ways for charities to claim – using an online claim form, a database-to-database solution, and a new paper form for those organisations that don't have access to the internet. Built-in checks will make sure errors in claims are identified and can be amended before the claim is submitted, so they aren't sent back to charities and delaying payments.", "And charities will receive their payments much more quickly when they use Charities Online. It is also worth remembering that gift aid can be claimed up to four years after the donation is received. So although all claims will need to be made using the three Charities Online claiming options from 1 October, charities shouldn't miss out on gift aid repayments. Charities Online also enables charities to claim payments under the new gift aid small donations scheme. This is a new scheme, separate from gift aid, which enables charities to claim top-up payments of 25p for every £1 collected on cash donations of £20 or less that it's difficult to get a gift aid declaration for.", "Once the scheme is up and running it's expected this will be worth another £100 million annually to the charity sector. Alongside this we launched the consultation Gift Aid and Digital Giving in July this year, seeking views on a variety of ways gift aid could be changed to make it work better with new ways of fundraising. We want to make it easier for charities to get the money they need to get on with the vital work they're doing and make a difference. The consultation closes on 20 September and so I would urge you to contribute your views to this important debate. Sajid Javid is economic secretary to the Treasury This content is brought to you by Guardian Professional.", "To join the voluntary sector network, click here."]}, {"id": "UK_T1_03", "press": false, "title": "Bin strike was no triumph for workers", "paras": ["It is astonishing how myths perpetuate themselves. Owen Hatherley refers to \"the triumphant outcome of the Leeds bin workers' strike against privatisation and pay cuts\" (The bins that tidy, 25 September). Nothing could be further from the truth. The Liberal Democrat-Conservative administration set up the process to implement equal pay legislation. An independent evaluation, with full trade union involvement, examined all city council jobs.", "Under this evaluation the vast majority remained at the same pay level. Some, including care workers and cleaners, who are currently predominantly women, received substantial pay rises. But a third group, including the bin workers, were evaluated at a lower level than their existing pay. The administration immediately safeguarded the last group's pay for three years while a solution was sought. Initial council proposals were rejected and then, catastrophically for the workers, the unions called a strike with 18 months of the protected-pay period still to run.", "An efficiency savings package that would have safeguarded pay levels was initially rejected, but almost identical proposals were later accepted – after a strike lasting 17 weeks. Thus the Liberal Democrat-Conservative controlled council implemented equal pay, safeguarded threatened pay reductions, and found a solution to the reductions recommended by the independent evaluation. The precipitate and ill-advised strike action of the trade unions failed to make any difference to the proposals and cost their members more than £4,000 each. Some triumph. Michael Meadowcroft Honorary alderman, City of Leeds"]}, {"id": "UK_T1_04", "press": false, "title": "John Prescott's son calls radio station to defend father's peerage", "paras": ["John Prescott's son took the unusual decision to call a radio phone-in today, to defend his father over his decision to accept a seat in the House of Lords. David Prescott called London's LBC radio to scotch claims that Prescott, the former deputy prime minister, had agreed to become a member of the House of Lords for money or to please his wife of 48 years, Pauline. He felt the need to call in and tell listeners that his 72-year-old father had only accepted the peerage in order to continue contributing to political life. David Prescott, who unsuccessfully bid to be a Labour parliamentary candidate at the 2010 general election, called James O'Brien, a presenter on LBC 97.3, to put the record straight the day after his father was sworn in to the Lords as Baron Prescott of Kingston Upon Hull. John Prescott had previously said he would never enter the Lords, despite the wishes of his wife.", "Prescott Jr reiterated the argument that his mother did not need her husband to have a title to be a lady — a comment first publicly expressed by his father. On the suggestion that Prescott Sr was pushed into it by his wife, he said: \"I mean it's very sweet and it makes a very good story, but quite frankly, the reason why John is going in and becoming a lord is because he wants to stay in the Houses of Parliament — not for the money, he just wants to stay there and campaign for the things he really still believes in, like social justice. \"Things that made him become a shop steward in the unions back in the 60s, and then become an MP and then spend 18 years in opposition and then to go on a fight for a Labour victory …\" On his mother, Prescott Jr added: \"We've always said she's always been a lady and she always will remain it and she doesn't need a title or so to basically confirm that in our eyes. We know that anyway...\" Asked by O'Brien why Prescott Sr didn't just remain as MP for Kingston Upon Hull to pursue his political aims, his son pointed out the veteran politician's age and the pace of life in the Commons. \"I think anybody who's been an MP will know the kind of workrate that that actually involves and at the age of 72, and for Pauline as well, I think it's just a case that he wants to do other things now but he still wants to be involved in the finest platform.", "Whether it's as a lord or not, the second chamber is still the Houses of Parliament.\" On the eve of his swearing-in ceremony, John Prescott tweeted that he would use the position to hold the government to account, and as a platform to campaign for issues he believes in. Prescott ruled out a peerage during an interview in 2008 with the Scotsman. The deputy prime minister had by this time announced his intention to stand down as MP at the 2010 general election. Asked about a possible future in the Lords, he said: \"I'm against too much flunkery and titles. But Paul would like me to.", "I tell her, 'What do you want to be Lady Prescott for? You're a lady already'.\" The same year, the Daily Mail reported quotes given by Prescott which firmly ruled out peerage. \"I don't want to be a member of the House of Lords. I will not accept it. My wife Pauline would quite like me to accept it, but why should I be sidelined to the Lords when I could do so much more for the Labour movement?", "\"Being a lord is not for three years or four years, it is for life. There are other things I want to get involved in. People think already that I have retired from public life — I haven't. I am still an MP and after that I still want to make a contribution.\""]}]], "screeners": [{"id": "UK_S19", "press": false, "title": "", "paras": ["David Cameron’s promise during his address to the Conservative party conference that “an all-out assault on poverty” would be at the centre of his second term is undermined by a report that reveals planned welfare cuts will lead to an increase of 200,000 working households living in poverty by 2020. The findings, published on Thursday by the Resolution Foundation, appear to contradict the prime minister’s vow to devote the second five years of his premiership to creating a “Greater Britain” marked by social reform, real equality and less racial discrimination. In a speech that was clearly designed to respond to Jeremy Corbyn’s election as Labour leader, Cameron sought to position his party as the dominant force on the centre ground of politics. The prime minister argued the best way to tackle the deep roots of poverty lay in getting people into better paid work. The Conservatives, Cameron said, must live up to their great traditions of social reform and be the right party “for those who work hard, want to get on and want more money at the end of the month”.", "Insisting Britain was on the brink of something special, he claimed “hope is returning and we are moving into the light”, allowing the Conservatives to be seen as the “party of the fair chance, the party of the equal shot”. But the new research by the Resolution Foundation – now chaired by former Conservative minister David Willetts – suggests the government’s welfare cuts introduced in the budget in a bid to cut the deficit will drive at least 200,000 working households into poverty under a definition that the government is abolishing. The thinktank’s analysis also indicates that the number of all households – both in and out of work – that will be in poverty at the end of the parliament is projected to rise by 700,000 to nearly 4 million. The report will pile further pressure on ministers to rethink how they protect the working poor, following the introduction of controversial plans to cut tax credits in the first budget immediately after the election. Conservative MPs are already braced for protests next April when the cuts to tax credit thresholds, set out in the summer budget, start to bite.", "There are reports that Treasury ministers are considering delaying sending out letters spelling out the details of the cuts until after Christmas. As part of the tax credit reforms ministers are abolishing the long-standing child poverty target that measures the number of children living in households with an income lower than 60% of median household income. The research compiled by the Resolution Foundation shows that under this definition 100,000 working households will fall into poverty next year alone as a result of the summer budget. The calculations take into account planned rises in the national minimum wage towards £9 an hour by the end of the parliament. Willetts has also been pressing ministers to rethink the tax credit cuts due to the damaging impact on the working poor.", "In its key findings the report also estimated that: • A further 200,000 children (predominantly from working households) will fall into poverty in 2016 simply as a result of the tax and benefit measures announced at the summer budget, including the increases in the national minimum wage. • The total number of working households in poverty will have reached 2 million in 2020. • The summer budget measures will lead to income falls of more than 4% in the bottom fifth of earners, contrasting with income rises of 4% for the top third. • The number of children in poverty in working and non-working households is estimated to reach up to 3.9 million by 2020. This is 1.2 million higher than the 2016-17 baseline and 600,000 higher than was projected for 2020 prior to the budget. Cameron made no direct mention of George Osborne’s controversial plans to cut tax credits, which will mean a loss of £1,000 for 3 million of the lowest-paid workers. But he said he would seek to tackle the “scourge of poverty”, which is best achieved by helping people back into work where the new “national living wage” will mark a “giant leap forward”. The prime minister’s aides positioned his conference speech as a pillar of the optimistic narrative put forward by the Conservatives in the wake of Corbyn’s election as they strive to emphasise the need for “social reform”.", "“You can’t have true opportunity without real equality,” said the prime minister, citing examples of black and minority ethnic Britons denied opportunities. “And I want our party to get this right. Yes us – the party of the fair chance, the party of the equal shot, the party that doesn’t care where you come from, but only where you’re going. Us, the Conservatives, I want us to end discrimination and finish the fight for real equality in our country today.” Cameron, who knows he has been defined largely by his privileged background, said he recognised that the reality that someone’s salary depended on what their father’s was was more prevalent in the UK than in any other country in the developed world. “I’m sorry, but for us Conservatives, the party of aspiration, we cannot accept that,” he said.", "In a speech that frequently attacked Labour, Cameron said: “Labour: you’re not for working people, but hurting people. “If you want a lecture about poverty, ask Labour. If you want something done about it, come to us, the Conservatives. There’s another argument we need to win.” Late on Wednesday night, a Treasury spokesperson said: “We’re determined to deliver a new settlement for the British people, one that will create a higher wage, lower tax and lower welfare economy. “Our welfare reforms are fair and necessary, and will take tax credit spending back only to 2008 levels, with most working households better off once all welfare reforms have come into force by 2017.", "“But there’s more to be done. That’s why we’re introducing a new National Living Wage which the independent OBR expect will benefit up to 2.7 million people directly. Together with the further increases to the personal allowance next year, this will mean people will keep more of the money they earn by paying less income tax.”"], "gold": {"q2": "national", "q1": "yes"}, "note": "both experts: national; attention check only (cannot catch a national default)"}], "screener_every": 2, "pilot": true, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political articles: national or international? — UK</h1>\n<p class=\"lead\">You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Political article:</b> an article in which politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics counts as political.</p><p class=\"gnum\"><b>1.2 National scope:</b> the main political issue sits in the UK national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the national government, parliament or parties respond to it.</p><p class=\"gnum\"><b>1.3 International scope:</b> the article is mainly about another country&#x27;s politics, or about international affairs with no domestic focus.</p>\n<h2>2. Task description</h2><p>You read one article at a time. For a newspaper article answer Q1 (is it about politics?) and, if yes, Q2 (mainly national or international?). Party press releases are political by definition, so for them only Q2 is asked. Judge the whole article, not a single sentence.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q1 when politics is a main theme of the article, not merely mentioned.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"en\"><p>Ed Miliband is suffering more vicious attacks at the hands of newspapers than his predecessors, according to former Labour leader Lord Kinnock, including his own famously hostile treatment during the 1992 general election campaign. Kinnock said the Daily Mail&#x27;s attacks on Miliband&#x27;s late father, Ralph, were &quot;worse than I had&quot; and accused the media of being out to &quot;scrag Ed from the start&quot;. He spoke out as Miliband&#x27;s …</p></div><p class=\"how\">Both experts: political and national — a former Labour leader on press treatment of the current one; Westminster politics is the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A politician appearing as a private person or as a celebrity does not make an article political. Human-interest stories without a political actor, institution or policy are NO.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = NO</div><p class=\"ttl\">Shaken Vince Cable proves he can still be a mover on the Strictly Come Dancing Christmas special</p><div class=\"text\" lang=\"en\"><p>Like so much else this Boxing Day and whenever we&#x27;re festooned in snow – novelty underwear for a fiancee, or even thinking of drinking eggnog – it must have &quot;seemed like a good idea at the time&quot;. Dr Vincent Cable had been on track for superfast upgrade to the lobby of the waiting hall of &quot;national treasure&quot;: just a twitch behind the likes of Bruce Forsyth, who hosted Vince&#x27;s vaunted appearance last night on the …</p></div><p class=\"how\">Not political: a minister appears as a celebrity on a dance show. A politician as a private person or entertainer does not make the article political. [Pending: enters the training only if both expert codings say “not political”.]</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Coding the article above as political because a politician or a newspaper politics page is involved.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Decide Q2 by the main topic: domestic institutions, parties and laws → NATIONAL; another country&#x27;s politics or international affairs → INTERNATIONAL. A foreign event discussed through the national reaction to it is NATIONAL.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"en\"><p>Ed Miliband is suffering more vicious attacks at the hands of newspapers than his predecessors, according to former Labour leader Lord Kinnock, including his own famously hostile treatment during the 1992 general election campaign. Kinnock said the Daily Mail&#x27;s attacks on Miliband&#x27;s late father, Ralph, were &quot;worse than I had&quot; and accused the media of being out to &quot;scrag Ed from the start&quot;. He spoke out as Miliband&#x27;s …</p></div><p class=\"how\">Both experts: political and national — a former Labour leader on press treatment of the current one; Westminster politics is the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> One sentence about another country does not make a national article international, and vice versa — the article as a whole decides.</p></div>"}</script>
<script id="config" type="application/json">{

<script>
// app.js v11 — practice phase is hands-on (answer first, then the research team's answer), skipped when a task has no practice items; v10 — guidelines screen (embedded TRAINING_*.html) shown first after the introduction; Guidelines button in the header reopens it.
(function () {

  var D = JSON.parse(document.getElementById('data').textContent);
  var CFG = JSON.parse(document.getElementById('config').textContent);
  var KEY = 'annotation-' + D.mode + '-' + D.built;
  var GOLD = D.mode === 'gold';
  var app = document.getElementById('app');

  // ---------- platform context (Prolific / CloudResearch Connect) ----------
  function params() {
    var q = {}, s = String(location.search || '').replace(/^\?/, '');
    if (!s) return q;
    s.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); }
      catch (e) { q[k] = v; }
    });
    return q;
  }
  function detect(q) {
    var names = Object.keys(q), lower = {};
    names.forEach(function (n) { lower[n.toLowerCase()] = n; });
    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        var hit = lower[list[i].toLowerCase()];
        if (hit && q[hit]) return hit;
      }
      return null;
    }
    var plat = { name: 'none', pid: '', study: '', session: '', query: location.search || '' };
    var pp = pick(CFG.id_params.prolific);
    var cc = pick(CFG.id_params.cloudresearch);
    if (pp) plat.name = 'prolific';
    else if (cc) plat.name = 'cloudresearch';
    else if (q.platform === 'prolific' || q.platform === 'cloudresearch') plat.name = q.platform;
    var order = plat.name === 'cloudresearch'
      ? CFG.id_params.cloudresearch.concat(CFG.id_params.prolific)
      : CFG.id_params.prolific.concat(CFG.id_params.cloudresearch);
    var idk = pick(order);
    if (idk) plat.pid = q[idk];
    var sk = pick(['STUDY_ID', 'projectId', 'project_id']);
    if (sk) plat.study = q[sk];
    var ssk = pick(['SESSION_ID', 'assignmentId', 'assignment_id']);
    if (ssk) plat.session = q[ssk];
    plat.dry = q.dry_run === '1' || q.preview === '1';
    return plat;
  }
  var Q = params();
  var PLAT = detect(Q);

  // ---------- state ----------
  // Health probe. A sandboxed preview (Dropbox, Drive, an e-mail client) can make
  // localStorage throw and block downloads; silently swallowing that is how a whole
  // session gets lost, so it is detected up front and shown on every screen.
  var STORAGE_OK = (function () {
    try {
      var t = '__probe_' + Date.now();
      localStorage.setItem(t, '1');
      var ok = localStorage.getItem(t) === '1';
      localStorage.removeItem(t);
      return ok;
    } catch (e) { return false; }
  })();
  var FRAMED = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
  var SAVE_FAILED = false;

  function load() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { SAVE_FAILED = true; }
  }
  var S = load() || { coder: '', ans: {}, started: new Date().toISOString() };
  if (!S.started) S.started = new Date().toISOString();
  S.plat = PLAT;
  save();

  // ---------- older builds (answers from a previous version of this page) ----------
  var CARRY = ['q1', 'q2', 'q4', 'q5', 'econ', 'chances', 'rights', 'note', 'cuts'];
  function coded(st) {
    var n = 0;
    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {
      var a = st.ans[ik];
      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }
    });
    return n;
  }
  // Older slots for this mode, richest first: a build that was merely opened must not
  // shadow one that was actually coded in.
  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('annotation-' + D.mode + '-') !== 0 || k === KEY) continue;
        var n = 0;
        try { n = coded(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        if (n) out.push({ key: k, n: n, build: k.slice(('annotation-' + D.mode + '-').length) });
      }
    } catch (e) {}
    out.sort(function (x, y) { return y.n - x.n || (x.build < y.build ? 1 : -1); });
    return out;
  }
  function importOlder(k) {
    var old;
    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) { return 0; }
    if (!old || !old.ans) return 0;
    var n = 0;
    Object.keys(old.ans).forEach(function (ik) {
      var from = old.ans[ik], to = S.ans[ik] || (S.ans[ik] = {}), took = false;
      CARRY.forEach(function (f) {
        if (from[f] !== undefined && to[f] === undefined) { to[f] = from[f]; took = true; }
      });
      if (took) n++;
    });
    if (!S.coder && old.coder) S.coder = old.coder;
    save();
    return n;
  }

  // ---------- helpers ----------
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'cls') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function items(t) {
    if (t.type === 'crowd') return t.items.map(function (x) { return { kind: x.kind || crowdKind(), d: x }; });
    if (t.type === 't1') {
      return t.articles.map(function (a) { return { kind: 'article', d: a }; })
        .concat(t.splits.map(function (p) { return { kind: 'split', d: p }; }));
    }
    return t.items.map(function (q) { return { kind: 'qs', d: q }; });
  }
  function lang(t) { if (CROWD) return D.lang || 'en'; return /-DE$/.test(t.id) ? 'de' : 'en'; }
  function key(t, it) { return t.id + '|' + it.d.id; }
  function A(t, it) { var k = key(t, it); if (!S.ans[k]) S.ans[k] = {}; return S.ans[k]; }
  function peek(t, it) { return S.ans[key(t, it)] || {}; }
  function toks(s) { return s.text.split(/\s+/).filter(Boolean); }

  // a split line is resolved when it carries a cut or was marked as one quasi-sentence
  function lineState(a, si) {
    var c = (a.cuts || {})[si] || [];
    if (c.length) return 'split';
    if ((a.nosplit || {})[si]) return 'one_qs';
    return 'unresolved';
  }
  function done(t, it) {
    var a = peek(t, it);
    if (it.kind === 'article') return it.d.press ? !!a.q2 : (a.q1 === 'no' || (a.q1 === 'yes' && !!a.q2));
    if (it.kind === 'split') {
      for (var si = 0; si < it.d.sentences.length; si++) if (lineState(a, si) === 'unresolved') return false;
      return true;
    }
    return a.q4 === 'no' || (a.q4 === 'yes' && !!a.q5 && !!(a.econ || a.chances || a.rights));
  }
  function progress(t) {
    var its = items(t), n = 0;
    its.forEach(function (it) { if (done(t, it)) n++; });
    return [n, its.length];
  }
  function allDone() {
    for (var i = 0; i < D.tasks.length; i++) { var p = progress(D.tasks[i]); if (p[0] < p[1]) return false; }
    return true;
  }

  function banner() {
    if (STORAGE_OK && !FRAMED && !SAVE_FAILED) return null;
    var why = (!STORAGE_OK || SAVE_FAILED)
      ? 'This browser is NOT saving your answers. '
      : 'This page is open inside another website, so the download may be blocked. ';
    return el('div', { cls: 'alarm' }, [
      el('strong', { text: 'Stop \u2014 do not code in this window. ' }),

      out.push(el('div', { cls: 'card stop', text: 'Press release: political by definition, so Q1 is skipped.' }));
    } else {
      out.push(qcard(D.instr.q1.q, D.instr.q1.how, radio(a, 'q1', ['yes', 'no'], null, function () {
        if (a.q1 === 'no') delete a.q2;
        refresh();
      })));
    }
    if (it.d.press || a.q1 === 'yes') {
      out.push(qcard(t.q2.q, t.q2.how, radio(a, 'q2', ['national', 'international'], null, refresh)));
    } else if (a.q1 === 'no') {
      out.push(el('div', { cls: 'card stop', text: 'Not political: no further question for this article. Click Next.' }));
    }
    return out;
  }

  function qsQs(t, it, a, refresh) {
    var out = [qcard(D.instr.q4.q, D.instr.q4.how, radio(a, 'q4', ['yes', 'no'], null, function () {
      if (a.q4 === 'no') { delete a.q5; delete a.econ; delete a.chances; delete a.rights; }
      refresh();
    }))];
    if (a.q4 === 'yes') {
      out.push(qcard(D.instr.q5.q, D.instr.q5.how || '', el('div', { cls: 'opts' }, D.instr.q5.opts.map(function (o) {
        return el('button', { cls: 'opt' + (a[o.key] ? ' on' : ''), type: 'button',
          onclick: function () { var was = !!a[o.key]; delete a.econ; delete a.chances; delete a.rights; if (!was) a[o.key] = true; refresh(); } },
          [el('span', { text: (a[o.key] ? '\u25c9 ' : '\u25cb ') + o.name }), el('small', { text: o.desc })]);
      }))));
      out.push(qcard(D.instr.q6.q, D.instr.q6.how,
        radio(a, 'q5', ['supports', 'against', 'mentions'], ['supports', 'against', 'mentions only'], refresh)));
    } else if (a.q4 === 'no') {
      out.push(el('div', { cls: 'card stop', text: 'No reference to equality: Q5 and Q6 are skipped. Click Next.' }));
    }
    return out;
  }

  // ---------- the splitting widget ----------
  function sentence(a, s, si, lg, onchange) {
    var tk = toks(s);
    if (!a.cuts) a.cuts = {};
    if (!a.nosplit) a.nosplit = {};
    var box = el('div', { cls: 'sent', lang: lg });
    var last = 0, lastJ = -1;

    function toggle(j) {
      var now = Date.now();
      if (j === lastJ && now - last < 400) return;   // only a repeat on the SAME gap is a double-click
      last = now; lastJ = j;
      var c = (a.cuts[si] || []).slice(), k = c.indexOf(j);
      if (k >= 0) c.splice(k, 1); else c.push(j);
      c.sort(function (x, y) { return x - y; });
      a.cuts[si] = c;
      if (c.length) delete a.nosplit[si];            // a split answers the line
      draw(); onchange();
    }
    function one() {
      if (a.nosplit[si]) delete a.nosplit[si];
      else { a.nosplit[si] = true; a.cuts[si] = []; }
      draw(); onchange();
    }
    function draw() {
      var cuts = a.cuts[si] || [], seg = 0, st = lineState(a, si);
      box.innerHTML = '';
      box.className = 'sent' + (st === 'unresolved' ? ' todo' : '');
      function shade() { return seg === 0 ? '' : (seg % 2 ? ' seg1' : ' seg2'); }
      tk.forEach(function (w, j) {
        if (j > 0) {
          var on = cuts.indexOf(j) >= 0;
          if (on) seg++;
          box.appendChild(el('span', { cls: 'gap' + (on ? ' cut' : shade()), title: on ? 'Remove this split' : 'Split here',
            onclick: function () { toggle(j); } }));
        }
        box.appendChild(el('span', { cls: 'w' + shade(), text: w }));
      });
      // offered only while the line carries no split, so marking it can never discard one
      if (!cuts.length) {
        box.appendChild(el('button', { cls: 'nos' + (st === 'one_qs' ? ' on' : ''), type: 'button',
          text: (st === 'one_qs' ? '\u2611' : '\u2610') + ' one quasi-sentence', onclick: one }));
      } else {
        box.appendChild(el('span', { cls: 'cnt', text: (cuts.length + 1) + ' quasi-sentences' }));
      }
    }
    draw();
    return box;
  }

  // ---------- finish ----------
  function pilotFeedback(t) {
    setHead(t.title, null);
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var box = el('textarea', { cls: 'note', placeholder: 'Optional: anything unclear in the instructions or the examples? Anything that did not work on your screen?' });
    box.style.minHeight = '120px';
    app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'One last question (pilot)' }),
      el('p', { text: 'This is a pilot run. Your comments help us fix the instructions before the main study. You can leave the box empty.' }), box]));
    app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: 'Send and get my code', onclick: function () {
      S.feedback = box.value || ''; S.feedback_done = true; save(); finish(t); } })]));
  }
  function finish(t) {
    if (CROWD && t.phase === 'training') { S.t.training_end = new Date().toISOString(); save(); return PREVIEW ? previewEnd() : startPhase('entry'); }
    if (CROWD && t.phase === 'entry') return entryFinish();
    if (CROWD && t.phase === 'production' && !S.t.production_end) { S.t.production_end = new Date().toISOString(); save(); }
    if (CROWD && D.pilot && t.phase === 'production' && !S.feedback_done) return pilotFeedback(t);
    setHead(t.title, null);
    app.innerHTML = '';
    if (GOLD) {
      app.appendChild(el('div', { cls: 'card' }, [
        el('h2', { text: 'Task finished' }),
        el('p', { text: 'Thanks. Click Download answers and put the file in the shared Dropbox folder.' })]));
      app.appendChild(el('div', { cls: 'nav' }, [
        el('button', { text: 'Back to tasks', onclick: menu }),
        el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
        el('button', { cls: 'primary', text: 'Download answers (CSV)', onclick: download })]));
      return;
    }
    var card = el('div', { cls: 'card' }, [el('h2', { text: 'Task finished' })]);
    app.appendChild(card);
    var nav = el('div', { cls: 'nav' }, [CROWD ? el('span') : el('button', { text: 'Back to tasks', onclick: menu })]);
    app.appendChild(nav);

    function completion() {
      var code = CFG.completion_code || '';
      card.appendChild(el('p', { text: 'Your completion code is:' }));
      card.appendChild(el('p', null, [el('span', { cls: 'code', text: code })]));
      var url = '';
      if (PLAT.name === 'prolific') {
        url = CFG.prolific_return_url || ('https://app.prolific.com/submissions/complete?cc=' + encodeURIComponent(code));
      } else if (PLAT.name === 'cloudresearch') {
        url = CFG.cloudresearch_return_url || '';
      }
      if (url) {
        card.appendChild(el('p', { text: 'Click the button to register your submission. ' +
          'If the page does not return, copy the code above into the platform.' }));
        nav.appendChild(el('a', { cls: 'btn primary', href: url, text: 'Return to ' +
          (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') }));
      } else {
        card.appendChild(el('p', { text: 'Copy this code into the platform to register your submission.' }));
      }
      nav.appendChild(el('button', { text: 'Download a copy (CSV)', onclick: download }));
      nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
