<script id="data" type="application/json">{"built": "20261028125942", "mode": "crowd", "task": "T2_sentences", "language": "German", "lang": "de", "title": "Political statements about equality (pilot)", "intro": "You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes. This is a short pilot run; at the end we ask for your comments.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "T2G_DE_57", "qs": "Über eine Erhöhung der Riester-Grundzulage und eine Neuaufstellung der staatlichen Förderung wollen wir gerade Menschen mit geringen Einkommen fördern.", "prev": "Ein Basisprodukt in öffentlicher Verwaltung soll eine bessere, transparentere und kostengünstigere Alternative zu den heutigen Riester-Produkten darstellen.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0, "q5": "supports", "note": "Both experts: refers to equality — economic equality (support for people on low incomes through the Riester allowance). Position: supports — it proposes a measure that helps the worse-off."}}, {"id": "T2G_DE_32", "qs": "Einstiege sind zu ermöglichen, Übergänge im Bildungswesen dürfen nicht weiter Selektionsstufen bleiben.", "prev": "Die SPD-Bundestagsfraktion versteht Inklusion als eine Aufgabe für alle Etappen und Bereiche des Bildungswesens – von der frühkindlichen Bildung über Schule und Berufseinstieg bis hin zu Hochschulen und Weiterbildungseinrichtungen.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0, "q5": "supports", "note": "Both experts: refers to equality — equal chances (transitions in the education system must stop acting as selection stages). Position: supports."}}, {"id": "T2G_DE_17", "qs": "Internationale Studien schätzen, dass fünf bis 20 Prozent aller Menstruierenden dadurch in ihren täglichen Aktivitäten beeinträchtigt sind.", "prev": "Menstruationsbeschwerden zählen zu den häufigsten Gründen, weshalb Frauen gynäkologische Praxen aufsuchen.", "next": "", "gold": {"q4": "no", "note": "Both experts: no reference to equality. A health statistic about menstruating people; nobody is said to get more or less than others, and no fair treatment of a group is at stake."}}], "entry": {"items": [{"id": "T2G_DE_23", "qs": "Und 130 Euro mehr im Monat bekommen sie auch.", "prev": "Wenn sie mehr Entlastung brauchen, können sie Gehalt in weitere freie Tage umwandeln.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_62", "qs": "Sie wird einkommensschwache Mieter angesichts der stetig steigenden Wohnkosten kaum entlasten.", "prev": "Die geplante Wohngeldreform von Bauministerin Hendricks fällt zu klein aus.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_DE_61", "qs": "Erbärmlich ist, dass dies mit einer ganz unappetitlichen Verschärfung des Aufenthaltsrechts verbunden wurden, die ausgerechnet zu Lasten von misshandelten Migrantinnen geht:", "prev": "Ein Aufenthaltstitel bei einer Zwangsverheiratung im Ausland soll nicht mehr automatisch sechs Monate nach der Ausreise erlöschen.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_DE_59", "qs": "Studenten, die von ihren Universitäten verwiesen wurden, müssen bei uns in Europa Stipendien und damit Lebenschancen bekommen - und mehr als wir uns bisher abgerungen haben.", "prev": "Die Menschen sollen reisen können und sehen, was Demokratie und Freiheit bedeutet.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_DE_33", "qs": "Es ist nicht nur ungerecht sondern auch sozialpolitisch äußerst problematisch, wenn hohe Löhne weiter steigen, Menschen mit niedrigen Einkommen dagegen nahezu leer ausgehen.", "prev": "Die prognostizierte Lohnentwicklung bis 2020 droht die Beschäftigten in Deutschland weiter zu spalten.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_DE_40", "qs": "Die bisher untätige Bundesregierung ist dringend gefordert, endlich zu handeln, erklärt Hans-Joachim Hacker.", "prev": "Wir haben es mit einem echten Problem für die Flugsicherheit und die Gesundheit von Flugpersonal und Passagieren zu tun.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_21", "qs": "Bundeskanzler Gerhard Schröder hat in seiner Neujahrsansprache starke Worte gefunden und zugesichert, dass Deutschland die Menschen in den am stärksten betroffenen Regionen nicht allein lassen wird, „nicht jetzt, aber auch nicht in Zukunft”.", "prev": "Nicht die private, nicht die der deutschen Politik.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_03", "qs": "Alle Jugendlichen hätten ein Ausbildungsangebot bekommen.", "prev": "Viele Unternehmen seien für die Ausbildung neu gewonnen worden.", "next": "", "gold": {"q4": "no"}}], "rule": {"min_q4_correct": 6, "min_type_hit": 3}}, "batches": [[{"id": "DE_T2_0122", "qs": "Als Mindeststandard soll eine armutsfeste und steuerfinanzierte Solidarische Mindestrente eingeführt werden, die nach einer Einkommens- und Vermögensprüfung gezahlt werden soll.", "prev": "Alle Erwerbstätigen müssen in die gesetzliche Rentenversicherung einbezogen werden.", "next": "Niemand soll im Alter von weniger als 1050 Euro netto leben müssen."}, {"id": "DE_T2_0089", "qs": "Wer von steigenden Immobilienpreisen profitiert, soll auch dafür zahlen.", "prev": "", "next": ""}, {"id": "DE_T2_0014", "qs": "Der Deutsche Bundestag will allen Opfern von Misshandlungen wirksam, gleichermaßen und diskriminierungsfrei helfen.", "prev": "Zur Einbringung des interfraktionellen Antrags Opfern von Unrecht und Misshandlungen in der Heimerziehung wirksam helfen erklärt die zuständige Berichterstatterin der SPD-Bundestagsfraktion Marlene Rupprecht:", "next": "Dieses wichtige Signal sendet der interfraktionelle Antrag an die ehemaligen Heimkinder."}, {"id": "DE_T2_0387", "qs": "Gut fünf Monate nach dem Freispruch Mollaths im Wiederaufnahmeverfahren vor dem Landgericht Regensburg legte die Arbeitsgruppe nun einen „Diskussionsentwurf“ vor, auf dessen Basis Bundesjustizminister Heiko Maas (SPD) das neue Unterbringungsrecht erarbeiten will.", "prev": "", "next": ""}, {"id": "DE_T2_0139", "qs": "Bei den Generälen handelt es sich um den Befehlshaber von Gaddafis Luftwaffe und zwei seiner Regionalkommandeure.", "prev": "", "next": ""}, {"id": "DE_T2_0084", "qs": "Das wäre auch ungerecht – stärker belastet wären ja nur kinderlose Rentenversicherte, nicht aber Beamte oder Selbständige.", "prev": "", "next": ""}, {"id": "DE_T2_0218", "qs": "Dennoch bleibt der Anteil von Frauen in Parlamenten von Bund, Ländern und Kommunen in Deutschland weiter klein.", "prev": "„Frauen wollen Politik machen – genauso wie Männer.", "next": "Mit nur 30,7 Prozent sitzen derzeit so wenige Frauen im Deutschen Bundestag wie seit knapp 20 Jahren nicht mehr."}, {"id": "DE_T2_0068", "qs": "Jedes Jahr wird an diesem Tag der Millionen Menschen gedacht, die unter der nationalsozialistischen Gewaltherrschaft unterdrückt, verfolgt und umgebracht wurden, darunter zahlreiche Menschen mit Behinderung.", "prev": "Morgen vor 73 Jahren wurde das Vernichtungslager Auschwitz befreit.", "next": "Deren Schicksale dürfen nicht in Vergessenheit geraten."}, {"id": "DE_T2_0188", "qs": "Oder ist die Kompetenzfrage nur vorgeschoben?", "prev": "", "next": ""}, {"id": "DE_T2_0352", "qs": "Zudem ist die Tarifbindung mit 53 Prozent der Beschäftigungsverhältnisse eher schwach.", "prev": "Das macht nach Adam Riese ein Minus bei den Reallöhnen von 0,4 Prozent.", "next": "Dieser Aufschwung bleibt ein Aufschwung der miesen Jobs."}, {"id": "DE_T2_0220", "qs": "Die Justiz dagegen hat völlig andere Aufgaben.", "prev": "", "next": ""}, {"id": "DE_T2_0241", "qs": "Aber die Ausgangslage zur Regierungsbildung ist für Netanjahu schlechter als nach der Wahl im April.", "prev": "", "next": ""}, {"id": "DE_T2_0103", "qs": "Hauptsache, es sitzen möglichst bald sämtliche Kinder mit Behinderungen irgendwo in einer Regelschule und sollen ohne Ansehen ihrer speziellen Handicaps teilhaben an einem Rennen, bei dem kaum eines mithalten kann.", "prev": "", "next": ""}, {"id": "DE_T2_0373", "qs": "Den betreuten Kindern müsse unabhängig vom Wohnort eine gute Qualität in der frühkindlichen Bildung geboten werden.", "prev": "", "next": ""}, {"id": "DE_T2_0138", "qs": "Normalerweise bringt so ein Sachbuch allenfalls die Elfenbeintürme zum Zittern oder die Feuilletons, und wenn es so fakten- und zahlengesättigt daherkommt wie dieses, dann hat es gute Chancen auf eine Karriere als Ladenhüter.", "prev": "", "next": ""}]], "screeners": [{"id": "T2G_DE_31", "qs": "Außerdem wünschen wir uns, dass die Belange von Menschen mit Behinderung bei der Wohnsitzauflage berücksichtigt werden.", "prev": "Für die SPD-Bundestagsfraktion ist es besonders wichtig, dass genügend Angebote für Integrations- und Sprachkurse vorhanden sind.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_DE_42", "qs": "Die Lage kleiner und mittlerer Zulieferer und damit ganzer Regionen sei zum Teil noch ernster als die der global aufgestellten Autohersteller, gibt sie zu Protokoll.", "prev": "„Die CDU-Politikerin, die selbst aus einer Unternehmerfamilie stammt, befürchtet, dass 50 Prozent aller Arbeitsplätze im produzierenden Bereich gefährdet sind, wenn 2030 jedes zweite verkaufte Auto ein reines E-Auto sein sollte, wie von der Regierung gewünscht.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_45", "qs": "Die HIS-Studie (Hochschul-Informations-System) zeigt, dass finanzielle Schwierigkeiten für viele Studieninteressierte ein großes Problem darstellen und Einfluss auf die Studiumsentscheidung haben können.", "prev": "Denn die heutige Anhörung im Ausschuss für Bildung und Forschung hat keine neuen Erkenntnisse gebracht.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_DE_65", "qs": "und ein Zukunftsprogramm für den sozial-ökologischen Umbau der Gesellschaft in Höhe von 125 Milliarden Euro jährlich", "prev": "Erreicht werden kann dies durch die Einführung des flächendeckenden gesetzlichen Mindestlohns von zehn Euro, die Aufstockung der Hartz IV-Regelsätze auf 500 Euro", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}], "screener_every": 8, "pilot": true, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political statements about equality — German</h1><p class=\"lead\">You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Statement:</b> the unit you code: one quasi-sentence, highlighted on the screen. The grey text before and after is context only and is not coded.</p><p class=\"gnum\"><b>1.2 Reference to equality:</b> the statement mentions equality, social justice or the equal treatment of all people in one of the three kinds below — whatever position it takes. Not a reference: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime.</p><p class=\"gnum\"><b>1.3 Economic equality:</b> Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all.</p><p class=\"gnum\"><b>1.4 Equal chances / social mobility:</b> Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child&#x27;s social background should not determine its future; everyone must be given a fair chance regardless of their parents&#x27; income.</p><p class=\"gnum\"><b>1.5 Equal rights / anti-discrimination:</b> Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards.</p><p class=\"gnum\"><b>1.6 Position:</b> SUPPORTS = in favour of more equality or against inequality (demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts). AGAINST = argues against more equality or the measures for it, or presents inequality as acceptable, deserved or necessary. MENTIONS = refers to the topic without taking a position.</p><h2>2. Task description</h2><p>For each highlighted statement answer Q4: does it mention equality? If yes, answer Q5: which ONE kind of equality (economic / equal chances / equal rights) — if more than one applies, choose the one most clearly emphasized — and Q6: what position does the statement take (supports / against / mentions)? If no, Q5 and Q6 are skipped.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All ✓ examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q4 when the statement itself mentions one of the three kinds of equality — who gets more or less, who has which chances, who is treated equally.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: economic equality · Q6: supports</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">DIE LINKE fordert die Anerkennung des Praktikums als Lernverhältnis, das eine begrenzte Dauer aufweist und der Praktikantin bzw. dem Praktikanten eine Mindestvergütung sowie volle Mitbestimmungsrechte bietet.</p><p><span class=\"qs\">Die jungen Leute sollten die Schutzregeln des Berufsbildungsgesetzes genießen, statt sich auf die Selbstverpflichtung der Unternehmen verlassen zu müssen.</span></p></div><p class=\"ans\">Q4: yes · Q5: economic equality · Q6: supports</p><p class=\"how\">Both experts: about inequality — young people should get legal protection instead of depending on employers&#x27; goodwill: who is protected and who is not → economic equality; the statement demands more protection → supports.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A political statement that does not mention equality is NO, even when the surrounding context is about equality.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: no</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Sollte der Mann, der als Flüchtling kam, zu einem Gefährder wurde und im November als solcher auf dem Schirm aller Sicherheitsbehörden gewesen ist, wirklich der Täter sein, verbindet er in seiner Person jene Mischung, die für viele Menschen schwer auszuhalten wäre.</p><p><span class=\"qs\">Am Dienstag hatten Hofreiter und Özdemir mit ihren Co-Vorsitzenden Katrin Göring- Eckardt und Simone Peter erklärt, es gehe „uns alle an, unsere offene Gesellschaft gegen Hass und Fanatismus zu verteidigen“.</span></p></div><p class=\"ans\">Q4: no</p><p class=\"how\">Both experts: political (party leaders defend the open society) but not about who gets what, opportunities or discrimination → not about inequality.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Q5: exactly one kind per statement. Money, poverty, wages, redistribution, affordability → economic equality; opportunities in education, work and social mobility → equal chances; discrimination or the rights of a group → equal rights. If two apply, choose the one most clearly emphasized.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal chances / social mobility · Q6: supports</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Der Bund muss die Länder mit einer echten Bildungsoffensive in Höhe von mehreren Milliarden Euro für die kommenden zehn Jahre unterstützen.</p><p><span class=\"qs\">Damit alle jungen Geflüchteten schnell an Gesellschaft und Arbeitsmarkt teilhaben können, müssen Willkommensklassen und begleitende Sprachangebote an Schulen und Berufsschulen flächendeckend unterstützt werden.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal chances / social mobility · Q6: supports</p><p class=\"how\">Both experts: about inequality — participation of young refugees in society and the labour market through schooling → equal chances; it demands support → supports.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal rights / anti-discrimination · Q6: against</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Deswegen fordern wir ein Verbandsklagerecht, beispielsweise für Gewerkschaften und Verbände.</p><p><span class=\"qs\">Trotz all dieser Mängel formiert sich gleich wieder Widerstand in den Unionsfraktionen mit der Begründung, für die unterschiedliche Entlohnung von Frauen und Männern sei beispielsweise die unterschiedliche Berufswahl verantwortlich.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal rights / anti-discrimination · Q6: against</p><p class=\"how\">Both experts: about inequality — unequal pay of women and men → equal rights. The statement reports the Union&#x27;s argument that the pay gap is due to career choice, i.e. a justification of the inequality → position against (as reported). To be confirmed.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Choosing two kinds for one statement, or choosing the kind suggested by the context rather than by the highlighted statement itself.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> Q6: demands, measures or criticism that aim at more equality → SUPPORTS; a justification of inequality or opposition to equalising measures → AGAINST; neutral facts, events and agendas → MENTIONS.</p></div><div class=\"gl\"><p class=\"gnum\"><b>3.5</b> Reported speech: code the position of the actor who is reported (“Labour calls for a wealth tax” = supports). The position is about equality, not about a party: “The tax cuts only help the rich” = supports.</p></div>"}</script>

        card.appendChild(el('p', { text: 'Click the button to register your submission. ' +
          'If the page does not return, copy the code above into the platform.' }));
        nav.appendChild(el('a', { cls: 'btn primary', href: url, text: 'Return to ' +
          (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') }));
      } else {
        card.appendChild(el('p', { text: 'Copy this code into the platform to register your submission.' }));
      }
      nav.appendChild(el('button', { text: 'Download a copy (CSV)', onclick: download }));
      nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
