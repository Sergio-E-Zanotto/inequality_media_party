<script id="data" type="application/json">{"built": "20261023130252", "mode": "crowd", "task": "T2_sentences", "language": "UK", "lang": "en", "title": "Political statements about equality (pilot)", "intro": "You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes. This is a short pilot run; at the end we ask for your comments.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics is also yes.\nNO = politics is absent or only mentioned in passing: sport, culture, lifestyle, celebrity and human-interest stories, business news without a policy angle, accidents or crime. A politician appearing as a private person or as a celebrity does not make an article political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line on the screen is one sentence. Decide whether it contains one unit of meaning or several, and mark where each new unit begins.\nA quasi-sentence is one unit of meaning: one statement, demand, measure, judgement or fact. A sentence can contain one or several; a quasi-sentence never runs across two sentences. Boundaries usually fall at a semicolon, at a comma, or at “and” / “but” — but you decide where one unit ends and the next begins.\nTo mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole sentence is one unit of meaning, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "T2G_UK_47", "qs": "Reacting to the news that more than 70 finance firms have signed up to the target of having 30 percent of women in senior posts, the Shadow Minister for Women and Equalities Sarah Champion MP said: “Finance has always been seen as male-dominated and it’s well past time for that to change.", "prev": "30 percent target by 2021 is simply not good enough - Sarah Champion", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1, "q5": "supports", "note": "Both experts: refers to equality — equal rights (women in senior finance posts, male-dominated sector). Position: supports — she welcomes the target and wants the change."}}, {"id": "T2G_UK_49", "qs": "that investigated and reported on antisemitism in the Labour Party.", "prev": "Last year the Claimant made a BBC Panorama programme, Is Labour Anti-Semitic?", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1, "q5": "mentions", "note": "Both experts: refers to equality — equal rights (antisemitism = discrimination against a group). Position: mentions only — the statement describes a programme that investigated it, without taking a stance itself."}}, {"id": "T2G_UK_05", "qs": "Trickett pointed to a speech given by May in 2005, where she said those with intolerant views would not be welcome in the Conservative party.", "prev": "However, you failed to do so, sadly demonstrating the weakness that has characterised the Conservative party’s election campaign to date.”", "next": "", "gold": {"q4": "no", "note": "Both experts: political (a speech about intolerant views in the party) but not about who gets what, opportunities or discrimination of a group → not about inequality."}}], "entry": {"items": [{"id": "T2G_UK_48", "qs": "Up to 15,000 affordable homes and bringing 5,000 empty homes back into use, using new capital funding of £300m and the infrastructure guarantee.", "prev": "The Infrastructure (Financial Assistance) Bill will include guaranteeing the debt of Housing Associations and private sector developers.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_UK_34", "qs": "“It just goes to show that while the UK Government punishes vulnerable and disabled people with cruel benefit cuts, Westminster works for the likes of Ian Taylor - no wonder he wants to keep the system exactly as it is, by giving half-a-million pounds to the No campaign.", "prev": "Commenting on the latest news Angus Robertson MP, the SNP’s Westminster Leader, said:", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_UK_52", "qs": "That report independently, so not my office, not me, said, we really should now press ahead with providing more free school meals.", "prev": "Then, an independent group of people looked into this issue of the quality of, and the provision of school meals in our schools, provided it to Michael Gove in the Department for Education.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_UK_68", "qs": "The Green Party is committed to massive investment in new social housing and more secure tenancies and smart controls to stabilise rapidly rising rents (3).“Years of bad policies from the Labour and the Coalition governments have benefitted wealthy landlords rather than ordinary Londoners”, said Green Party Leader Natalie Bennett.", "prev": "The London Green Party’s Crumbs for Londoners report (2) calls for a sustainable housing policy, which prioritises providing affordable homes for Londoners over generating investment opportunities for investor-owners.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_UK_37", "qs": "“But my biggest concern with this announcement is that the Welsh Government could be using education as a wedge to drive through local government reform.", "prev": "I also noted that the previous review lost focus on the issue of Welsh language provision and have called on the Minister to ensure that this does not happen this time round.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_UK_07", "qs": "They liked the Labour dossier, drawn up by Alistair Darling's office on Monday, \"exposing\" the so-called £34bn black hole in Tory spending plans, and they liked even more David Cameron's admission that he \"messed up\" in response by initially suggesting he was going to drop his party's commitment to recognise marriage in the tax system.", "prev": "Most of them want a clearer idea about how to take on the Tories in the run-up to the election.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_UK_56", "qs": "So we will use every parliamentary opportunity to ensure the Government is held to account at every stage of the negotiations.", "prev": "It would be a national failure of historic proportions if the Prime Minister comes back from Brussels without having secured protection for jobs and li next": ""}, {"id": "UK_T2_0188", "qs": "and approve Scotland’s first low-emissions zone in Glasgow.", "prev": "", "next": ""}, {"id": "UK_T2_0352", "qs": "And there is no bigger symbol of this failure to expect people right to the top to play by fair rules than the failure to deal with tax avoidance.", "prev": "", "next": ""}, {"id": "UK_T2_0220", "qs": "Gulliver says he has lost £1.7m in bonus payments because of what went wrong.", "prev": "", "next": ""}, {"id": "UK_T2_0241", "qs": "She said: “Conservatives in the coalition are trying to drive effective trade unionism out of the public sector, just as their manifesto ballot proposals will make almost every strike illegal.", "prev": "", "next": ""}, {"id": "UK_T2_0103", "qs": "It felt like an opportunity missed.", "prev": "", "next": ""}, {"id": "UK_T2_0373", "qs": "It may well be that it will be more comfortable for everyone all round that we remain close friends but we’re living in different houses, as it were.”", "prev": "", "next": ""}, {"id": "UK_T2_0138", "qs": "I also believe in promoting universal education and innovation: the UK should be modelling its policies on the Scandinavian countries, who provide free university education to their citizens.", "prev": "", "next": ""}]], "screeners": [{"id": "T2G_UK_10", "qs": "The Labour leader said he did not want to pick a fight with the newspaper group and did not believe the article has antisemitic implications, but he wanted to stand up for other families who have suffered similar treatment.", "prev": "Miliband on Friday attempted to partially draw a line under the affair by saying he has \"had his say\" by writing to Lord Rothermere, the owner of the Mail newspapers, to call for an inquiry into the culture and practices of the titles.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_UK_46", "qs": "According to the Office for National Statistics last year that was 244,000 people, each and every one of them needing a roof over their head.", "prev": "Gerard Batten MEP, the UKIP leader said, \"The PM managed to manage to make this speech without mentioning the root cause of this problem, that is the year on year total of people moving to this country.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_UK_43", "qs": "But this Government must do much more to stop women offending in the first place.", "prev": "The public want confidence that the criminal justice system is effectively punishing and reforming all those found guilty of committing crimes.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_UK_26", "qs": "we will extend people’s rights in the workplace and give employees a real voice in the organisations they work for.", "prev": "He said: “Not only will we repeal the trade union bill when we get back in in 2020,", "next": "", "gold": {"q4": "no"}}], "screener_every": 8, "pilot": true, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political statements about equality — UK</h1><p class=\"lead\">You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Statement:</b> the unit you code: one quasi-sentence, highlighted on the screen. The grey text before and after is context only and is not coded.</p><p class=\"gnum\"><b>1.2 Reference to equality:</b> the statement mentions equality, social justice or the equal treatment of all people in one of the three kinds below — whatever position it takes. Not a reference: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime.</p><p class=\"gnum\"><b>1.3 Economic equality:</b> Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all.</p><p class=\"gnum\"><b>1.4 Equal chances / social mobility:</b> Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child&#x27;s social background should not determine its future; everyone must be given a fair chance regardless of their parents&#x27; income.</p><p class=\"gnum\"><b>1.5 Equal rights / anti-discrimination:</b> Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards.</p><p class=\"gnum\"><b>1.6 Position:</b> SUPPORTS = in favour of more equality or against inequality (demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts). AGAINST = argues against more equality or the measures for it, or presents inequality as acceptable, deserved or necessary. MENTIONS = refers to the topic without taking a position.</p><h2>2. Task description</h2><p>For each highlighted statement answer Q4: does it mention equality? If yes, answer Q5: which ONE kind of equality (economic / equal chances / equal rights) — if more than one applies, choose the one most clearly emphasized — and Q6: what position does the statement take (supports / against / mentions)? If no, Q5 and Q6 are skipped.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All ✓ examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q4 when the statement itself mentions one of the three kinds of equality — who gets more or less, who has which chances, who is treated equally.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: economic equality · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">“The reality of the Tories’ 40 per cent cuts to budgets is: overworked and underpaid care staff with fewer care packages and worse quality for both older people and working age people with care needs.</p><p><span class=\"qs\">“The Tories need to take action in the Spring Statement to avert the crisis which is gripping social care so that people get the care they so desperately need.”</span></p></div><p class=\"ans\">Q4: yes · Q5: economic equality · Q6: supports</p><p class=\"how\">Both experts: about inequality — people not getting the care they need because of budget cuts → economic equality (access to care); demands action → supports.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A political statement that does not mention equality is NO, even when the surrounding context is about equality.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: no</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">However, you failed to do so, sadly demonstrating the weakness that has characterised the Conservative party’s election campaign to date.”</p><p><span class=\"qs\">Trickett pointed to a speech given by May in 2005, where she said those with intolerant views would not be welcome in the Conservative party.</span></p></div><p class=\"ans\">Q4: no</p><p class=\"how\">Both experts: political (a speech about intolerant views in the party) but not about who gets what, opportunities or discrimination of a group → not about inequality.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Q5: exactly one kind per statement. Money, poverty, wages, redistribution, affordability → economic equality; opportunities in education, work and social mobility → equal chances; discrimination or the rights of a group → equal rights. If two apply, choose the one most clearly emphasized.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal chances / social mobility · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">Labour’s priority will be to build on and spread this success across the country.</p><p><span class=\"qs\">“The progress Labour made is being undermined by this Government, as last year around half of local authorities reported a rise in the attainment gap between disadvantaged children and their peers.“</span></p></div><p class=\"ans\">Q4: yes · Q5: equal chances / social mobility · Q6: supports</p><p class=\"how\">Both experts: about inequality — the attainment gap between disadvantaged children and their peers → equal chances; criticises its growth → supports.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal rights / anti-discrimination · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">“David Lammy’s review shone a spotlight on the widespread discrimination in our criminal justice system.</p><p><span class=\"qs\">His finding that there is a greater disproportionality in the number of black people in our prisons than in the USA is a source of shame for our society.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal rights / anti-discrimination · Q6: supports</p><p class=\"how\">Both experts: about inequality — disproportionate imprisonment of black people → equal rights; called “a source of shame” → supports.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Choosing two kinds for one statement, or choosing the kind suggested by the context rather than by the highlighted statement itself.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> Q6: demands, measures or criticism that aim at more equality → SUPPORTS; a justification of inequality or opposition to equalising measures → AGAINST; neutral facts, events and agendas → MENTIONS.</p></div><div class=\"gl\"><p class=\"gnum\"><b>3.5</b> Reported speech: code the position of the actor who is reported (“Labour calls for a wealth tax” = supports). The position is about equality, not about a party: “The tax cuts only help the rich” = supports.</p></div>"}</script>

<script>
// app.js v12 — per-page localStorage key (pilot 23 Oct: a coder who had failed DE articles opened DE paragraphs and inherited the failed session); v11 — practice phase is hands-on (answer first, then the research team's answer), skipped when a task has no practice items; v10 — guidelines screen (embedded TRAINING_*.html) shown first after the introduction; Guidelines button in the header reopens it.
(function () {

  var app = document.getElementById('app');

  // ---------- platform context (Prolific / CloudResearch Connect) ----------
  function params() {

  }
  function detect(q) {

    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        var hit = lower[list[i].toLowerCase()];

    var pp = pick(CFG.id_params.prolific);

      ? CFG.id_params.cloudresearch.concat(CFG.id_params.prolific)

  var Q = params();
  var PLAT = detect(Q);

  // ---------- state ----------
  // Health probe. A sandboxed preview (Dropbox, Drive, an e-mail client) can make

  }
  var S = load() || { coder: '', ans: {}, started: new Date().toISOString() };
  if (!S.started) S.started = new Date().toISOString();
  S.plat = PLAT;
  save();

  // ---------- older builds (answers from a previous version of this page) ----------
  var CARRY = ['q1', 'q2', 'q4', 'q5', 'econ', 'chances', 'rights', 'note', 'cuts'];
  function coded(st) {
    var n = 0;
    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {

      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }

  }

  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('annotation-' + D.mode + '-') !== 0 || k === KEY) continue;

        try { n = coded(JSON.parse(localStorage.getItem(k))); } catch (e) {}

      }
    } catch (e) {}

  }
  function importOlder(k) {

    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) { return 0; }
    if (!old || !old.ans) return 0;
    var n = 0;
    Object.keys(old.ans).forEach(function (ik) {
      var from = old.ans[ik], to = S.ans[ik] || (S.ans[ik] = {}), took = false;
      CARRY.forEach(function (f) {

      });
      if (took) n++;
    });
    if (!S.coder && old.coder) S.coder = old.coder;
    save();
    return n;
  }

  // ---------- helpers ----------
  function el(tag, props, kids) {

    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'cls') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);

    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function items(t) {
    if (t.type === 'crowd') return t.items.map(function (x) { return { kind: x.kind || crowdKind(), d: x }; });
    if (t.type === 't1') {
      return t.articles.map(function (a) { return { kind: 'article', d: a }; })
        .concat(t.splits.map(function (p) { return { kind: 'split', d: p }; }));
    }
    return t.items.map(function (q) { return { kind: 'qs', d: q }; });
  }
  function lang(t) { if (CROWD) return D.lang || 'en'; return /-DE$/.test(t.id) ? 'de' : 'en'; }
  function key(t, it) { return t.id + '|' + it.d.id; }
  function A(t, it) { var k = key(t, it); if (!S.ans[k]) S.ans[k] = {}; return S.ans[k]; }
  function peek(t, it) { return S.ans[key(t, it)] || {}; }
  function toks(s) { return s.text.split(/\s+/).filter(Boolean); }

      for (var si = 0; si < it.d.sentences.length; si++) if (lineState(a, si) === 'unresolved') return false;

  }

    return true;
  }

  function banner() {

  function setHead(title, i, n) {

  // ================= crowd mode: training -> entry test -> production (+ hidden screeners) =================
  var CROWD = D.mode === 'crowd';
  function crowdKind() { return D.task === 'T1_scope' ? 'article' : D.task === 'T1_split' ? 'split' : 'qs'; }
  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);
    h = ((h & 0xffff) * 16777619 + ((((h >>> 16) * 16777619) & 0xffff) << 16)) >>> 0; } return h >>> 0; }
  function chooseBatch() {
    var n = (D.batches || []).length || 1, q = parseInt(Q.batch, 10);

  }
  // one screener after every `every` production items, never two in a row, never as the last item

    }

  }

      { id: 'training', phase: 'training', type: 'crowd', title: 'Practice', items: D.training || [], q2: D.q2 },

  function phaseTask(name) { for (var i = 0; i < D.tasks.length; i++) if (D.tasks[i].phase === name) return D.tasks[i]; return null; }
  function stamp(name) { if (CROWD && !S.t[name]) { S.t[name] = new Date().toISOString(); save(); } }
  function secs(a, b) { return (a && b) ? Math.round((new Date(b) - new Date(a)) / 1000) : null; }

  // ---- per-item scoring against gold (shared by entry test and screeners) ----
  function scoreItem(t, it) {
    var a = peek(t, it), g = it.d.gold || {}, r = { item_id: it.d.id, kind: it.kind };
    if (it.kind === 'article') {
      r.q1_correct = (g.q1 === undefined) ? true : a.q1 === g.q1;

        var detected = false;
        if (gl.status === 'split') {

          if (detected) det++;

        r.lines.push({ si: si, status_correct: statusOk, detected: detected });
      });

      r.pass = ok === lines.length && det === nsplit;
    } else {

        ((g.econ && a.econ) || (g.chances && a.chances) || (g.rights && a.rights)) ? true : false;

    var per = its.map(function (it) { return scoreItem(t, it); });

    if (D.task === 'T1_scope') {

    } else {

  }
  function scoreScreeners() {
    var t = phaseTask('production'); if (!t) return [];
    return items(t).filter(function (it) { return !!it.d.gold; }).map(function (it) {

  // ---- crowd screens ----
  var PREVIEW = (params().preview === 'training') || !!D.preview_training;
  function previewEnd() {

      : 'Opened from ' + (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') +

    app.appendChild(el('div', { cls: 'card' }, [

      el('ol', null, steps.filter(function (x) { return x; }).map(function (x) { return el('li', { text: x }); })),

    var label = 'Start', target = 'training';
    if (S.entry && S.entry.passed) { label = 'Continue coding'; target = 'production'; }
    else if (S.entry && !S.entry.passed) { label = 'Show result'; target = 'screenout'; }
    else if (S.t.training_end) { label = 'Continue to qualification'; target = 'entry'; }

    else if (D.guide_html && !S.t.guide_read) { label = 'Start'; target = 'guide'; }
    app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: label, onclick: function () {

  }
  // ---- guidelines: the first screen after the introduction; reopenable from the header at any time ----
  function guideNode() { var n = el('div', { cls: 'card guide' }); n.innerHTML = D.guide_html || ''; return n; }
  function showGuide() {
    setHead(D.title || 'Annotation task', null); stamp('guide_open');

          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
