<script id="data" type="application/json">{"built": "20261023101128", "mode": "crowd", "task": "T1_scope", "language": "German", "lang": "de", "title": "Political articles: national or international? (pilot)", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics. This is a short pilot run; at the end we ask for your comments.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics is also yes.\nNO = politics is absent or only mentioned in passing: sport, culture, lifestyle, celebrity and human-interest stories, business news without a policy angle, accidents or crime. A politician appearing as a private person or as a celebrity does not make an article political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line on the screen is one sentence. Decide whether it contains one unit of meaning or several, and mark where each new unit begins.\nA quasi-sentence is one unit of meaning: one statement, demand, measure, judgement or fact. A sentence can contain one or several; a quasi-sentence never runs across two sentences. Boundaries usually fall at a semicolon, at a comma, or at “and” / “but” — but you decide where one unit ends and the next begins.\nTo mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole sentence is one unit of meaning, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "DE_S01", "press": false, "title": "", "paras": ["Im Grundsatz ist sich der Weltsicherheitsrat einig: Man will einen Aufruf von UN- Generalsekretär Guterres zur weltweiten Waffenruhe unterstützen. An den Details allerdings entzünden sich schwere Konflikte VON CHRISTIAN ZASCHKE New York – Die Sprache der Diplomatie ist eine Sprache der Details, der vermeintlichen Kleinig- und Winzigkeiten. Wenn es um gemeinsame Kommuniqués oder Resolutionen geht, kann es vorkommen, dass die Diplomaten um einzelne Wörter ringen, und zwar stundenlang. Oder, wie aktuell im Sicherheitsrat der Vereinten Nationen, wochenlang. Vermutlich trägt außerhalb der Lyrik nirgends sonst ein einzelnes Wort so eine Bedeutung wie in der Diplomatie.", "Aktuell geht es darum, dass der UN-Sicherheitsrat eine Resolution zur Corona-Krise verabschieden will. Im Grundsatz sind sich die fünf ständigen Mitglieder und die zehn nicht-ständigen Mitglieder einig darüber, dass sie einen Aufruf des UN-Generalsekretärs António Guterres unterstützen wollen. Dieser hat eine weltweite Waffenruhe gefordert, um den Kampf gegen die Pandemie zu erleichtern. Auf den ersten Blick stellt sich die Frage: Wo sollte das Problem sein? Niemand kann ernsthaft etwas gegen einen solchen Aufruf haben.", "Guterres hat diesen Aufruf allerdings bereits am 23. März gemacht, und seither wird am Sitz der UN in New York um Worte und Wörter gerungen. Frankreich und Tunesien hatten die Initiative übernommen und an einem Text für die Resolution gearbeitet. Die Zusammenarbeit mit den anderen Staaten lief zunächst gedeihlich, viele Vorschläge der übrigen Mitglieder wurden eingearbeitet. Zum Beispiel sollte der Aufruf zur Waffenruhe zunächst für 30 Tage gelten.", "Auf Drängen Deutschlands wurde die Frist auf 90 Tage ausgeweitet. Allmählich schälte sich ein Problem heraus. Ein ehemaliger hochrangiger Mitarbeiter der US- Delegation im Sicherheitsrat sagte der SZ: „Aus unserer Sicht war das Problem ganz klar China.“ Das sehen die Chinesen wenig überraschend anders. Konkret ging es darum, ob – und wenn ja, wie – die Weltgesundheitsorganisation (WHO) im Resolutionstext erwähnt wird. China wollte die WHO verankert wissen, die USA waren strikt dagegen.", "Die amerikanische Regierung wirft der WHO Versagen in der Corona-Krise vor und zudem übergroße China-Freundlichkeit. Die Amerikaner sind der Ansicht, dass die WHO mitschuldig daran sei, dass China die Verbreitung des Virus lange habe kleinreden können. Präsident Donald Trump hat daher Anfang April die US-Zahlungen an die WHO aussetzen lassen. Die amerikanische Befürchtung war, dass die Aufnahme der WHO in den Resolutionstext die chinesische Darstellung unterstütze, Peking habe in Sachen Virus angemessen reagiert. „Sie wollten das Gesicht wahren“, sagt der ehemalige Mitarbeiter, „und genau das wollten wir nicht.“ Nach langen Verhandlungen tauchte die WHO schließlich im Text nicht namentlich auf, dafür aber der Hinweis auf „spezialisierte Gesundheitsagenturen“ der UN.", "Alle wussten, dass damit nur die WHO gemeint sein konnte. Zunächst schienen sich die Amerikaner auf diese Formulierung einzulassen, dann aber ließen sie die Resolution vor einer Woche platzen. Besonders die deutsche Delegation unter Führung des UN-Botschafters Christoph Heusgen wollte sich damit nicht abfinden. Heusgen ist bekannt dafür, dass er im Rat ungewöhnlich deutliche Worte findet. Im vergangenen Jahr hat er zum Beispiel die amerikanische Nahostpolitik offen kritisiert.", "„Wir glauben nicht an die Macht des Stärkeren. Für uns ist Völkerrecht kein À-la-carte-Menü\", sagte er damals, was für diplomatische Verhältnisse fast einer Rüge gleichkommt. Nun machte er sich gemeinsam mit der Delegation Estlands daran, einen neuen Text zu gestalten. Dieser neue Text ist wesentlich schlanker, er klammert das Konfliktthema WHO komplett aus und konzentriert sich rein auf das Thema Waffenstillstand. Besonders in Krisenregionen wie Libyen, Syrien, Jemen, der Demokratischen Republik Kongo sowie dem Südsudan sollen die Waffen ruhen.", "Nicht betroffen von dem Aufruf wären militärische Operationen gegen Terrormilizen wie den Islamischen Staat oder al-Qaida. Heusgen sagte im Rat, die Unterstützung des Aufrufs von Guterres müsse „Vorrang vor allen anderen Prioritäten“ haben. Seit Dienstag kursiert der Entwurf unter den Mitgliedsstaaten. Zugleich unternahmen jedoch Frankreich und Tunesien den Versuch, ihren Entwurf zu retten, was die Debatten nicht unbedingt vereinfacht. Die entscheidende Frage wird sein, ob sich China auf den verschlankten Entwurf einlässt.", "Die USA hatten ursprünglich gewollt, dass in dem Text auch Transparenz im Umgang mit dem Ausbruch der Pandemie verlangt wird. Das richtete sich gegen China. Die Amerikaner wären nun wohl bereit, auf diesen Punkt zu verzichten – allerdings nur, wenn China einwilligt, der Resolution ohne auch nur den leisesten Hinweis auf die WHO zuzustimmen. Ob der deutsch-estnische Vorstoß den Durchbruch bringt, ist ungewiss. Einerseits sollte der Entwurf zustimmungsfähig sein.", "Andererseits geht es eben nicht nur um Inhalte. Diese seit nun schon acht Wochen dauernde Debatte im Sicherheitsrat ist längst auch Ausdruck des sich verschärfenden Machtkampfs zwischen China und den USA geworden. Den Aufruf des UN-Generalsekretärs zu einer weltweiten Waffenruhe zu unterstützen, muss Vorrang vor allen anderen Prioritäten haben.“ UN-Botschafter Heusgen Wo sollte das Problem sein? UN-Generalsekretär António Guterres will eine Welt ohne Krieg, wenigstens während Corona wütet."], "gold": {"q2": "international", "q1": "yes"}, "note": "both experts agree on scope (the only international article in the gold)"}, {"id": "DE_S03", "press": false, "title": "", "paras": ["Manches Lob schmerzt die Gelobten. Ganz zufrieden sei er mit dem Gewerkschaftskurs des vergangenen Jahres, verkündete kürzlich der Präsident des Arbeitgeberverbandes. Die vereinbarten Lohnerhöhungen betrügen im Schnitt ganze 1,5 Prozent und bewegten sich damit im Rahmen der Produktivitätssteigerung. Das bedeutet: Für die Arbeitgeber hat das Jahr, was Löhne und Gehälter angeht, nichts gekostet. Da schwingt mit: So soll es auch 2005 weitergehen.", "Das hören die Gewerkschaften gar nicht gern. Klingt es für sie doch so, als seien sie allzu zahm. Einerseits: Die Gewerkschaften haben in schwierigen Zeiten bewiesen, dass sie eben nicht immer nur die Gierschlünde und Blockierer sind, als die sie gern hingestellt werden. Darauf sollten sie stolz sein. In der darbenden Baubranche etwa haben sie von vornherein auf eine Entgeltforderung verzichtet, dennoch quälen sich die Verhandlungen seit Monaten dahin.", "Allein die IG Metall hat seit ihrem Tarifabschluss vor einem Jahr in rund 400 Betrieben meist ganz pragmatisch Abweichungen vom Flächentarif organisiert, um mit Kostensenkungen Entlassungen oder Standortverlagerungen vermeiden zu helfen. Andererseits: Während die Arbeitnehmer in vielen Betrieben zurückstecken mussten, erzielten manche Unternehmen Rekordgewinne. Mitten in der viel beschworenen Krise machten sie Kasse. Mehr als 60 Milliarden Euro werden wohl allein die 30 im Aktienindex Dax verzeichneten Firmen verdienen, doppelt soviel wie ein Jahr zuvor. Börsendienste erwarten 40 Prozent höhere Dividenden.", "Nun sind Gewinne nichts Schlimmes. Sie erinnern aber an einen alten Gedanken: an Umverteilung. Solch ein provokantes Wort macht doch bloß böses Blut? Böses Blut macht aber auch, wenn die Deutsche Bank zugleich gute Profite erzielt und weiter Stellen streicht. Oder wenn Siemens floriert, in Werken desselben Konzerns Beschäftigte aber Verzicht üben müssen.", "Dabei kann es aber nicht um Umverteilung alter gewerkschaftlicher Machart gehen: Mehr Geld für alle, rauf mit dem Flächentarif. Die Situation der Betriebe ist dafür heute viel zu differen- ziert. Ziel sollte vielmehr schlicht sein, dass die Arbeitnehmer genauso an den Gewinnen der Unternehmen beteiligt werden sollen, wie sie heute schon die Folgen von Verlusten mitzutragen haben – indem sie nämlich vernünftigerweise oder notgedrungen für weniger Geld mehr arbeiten. Es geht also um eine Tarifpolitik neuer Art. Sie würde nicht das Ende des Flächentarifs bedeuten, im Gegenteil.", "Verbindlich für alle Betriebe könnten die Tarifparteien ganz transparent Regeln vereinbaren, nach denen sich die differenzierte Entlohnung richtet. Dann könnte sich keine Firma benachteiligt fühlen, kein Betriebsrat wäre mit der Situation überfordert. Dass der Unternehmensgewinn dabei eines der betrieblichen Kriterien sein muss, drängt sich auf. Ein bisschen in diese Richtung gehen Überlegungen des IG-Metall-Vize Berthold Huber. Zweistufige Tarifpolitik hat er dies genannt.", "Gemeint war: niedrige Abschlüsse in der Fläche, her mit mehr Geld in den Betrieben. In seiner eigenen Organisation fand Huber hierfür bislang keine Mehrheit – die Angst vor Verlusten ist größer als die Hoffnung auf Gewinne. Auch die Arbeitgeber lehnten ab, weil sich die Idee so anhörte, als gehe es um eine zweite Verhandlungsrunde in den Unternehmen. Die Metallarbeitgeber haben für die- ses Jahr eine Revision des Tarifab- schlusses gefordert, er sei immer noch zu teuer, klagen sie. Zugleich hat ihr Verbands-Chef erklärt, Einmalzahlungen statt Steigerungen des Tabellenlohns seien angezeigt.", "Die Gewerkschaft sollte dies nicht als Kampfansage werten, sondern zur Offensive nutzen. Dass im Betrieb alle in einem Boot sitzen, muss für schlechte Zeiten wie für gute gelten."], "gold": {"q2": "national", "q1": "yes"}, "note": "both experts agree on scope"}, {"id": "DE_X02", "press": false, "title": "", "paras": ["Prinzessin Diana hält die fünf Jahre alte und völlig aufgelöste Clementine Hambro, ihre jüngste Brautjungfer, auf dem Arm und tröstet sie. Es ist eine private Momentaufnahme bei der Hochzeit von Charles und Diana, die bislang nur der engste Familienkreis kannte, aufgenommen von Lord Patrick Lichfield (1939 bis 2005). Dem Großcousin der Königin, den sie zugleich als ihren Hoffotografen schätzte, war es als einzigem Gast der Trauung am 29. Juli 1981 erlaubt, Fotos zu machen. Mehr als 30 Jahre lang waren die Aufnahmen unter Verschluss, doch Mitte September wird die Sammlung von 14 Schwarzweiß- und Farbaufnahmen nun von einem Auktionshaus in Boston versteigert.", "Die Bilder sind allesamt nach der Vermählung entstanden, kurz bevor die offiziellen Hochzeitsfotos im Thronsaal aufgenommen wurden. Mindestgebot pro Bild: 300 Dollar. Auf mehreren Aufnahmen ist die kleine Clementine Hambro zu sehen, eine Urenkelin von Sir Winston Churchill. Der Grund für ihre Tränen: Kurz zuvor war sie auf der Galerie gestürzt und hatte sich den Kopf gestoßen. Für das Kind war der kleine Fauxpas eine große Katastrophe.", "Lange hatten die Brautjungfern sich auf diesen Tag akribisch vorbereitet - und dann stolperte Clementine in einem entscheidenden Moment über die eigenen Füße. Die Königin hingegen war von dem Malheur auch amüsiert. Zu Clementines Mutter soll sie gesagt haben: \"Clemmie ist in der Bildergalerie hingefallen, aber kein Grund zur Sorge - dort waren genügend Staatschefs, um ihr wieder auf die Füße zu helfen.\" (judo.)"], "gold": {"q1": "no"}, "note": "both experts: not political (coded 20-21 Oct 2026); non-political entry-test item (Q1 must be right)"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "DE_T1_01", "press": false, "title": "Prozess gegen Glaeseker und Schmidt beginnt", "paras": ["vL. HANNOVER, 8. Dezember. An diesem Montag beginnt vor dem Landgericht Hannover ein weiterer Korruptionsprozess, bei dem es um das Umfeld des früheren Bundespräsidenten und niedersächsischen Ministerpräsidenten Wulff geht. Dabei wird dessen früherer Sprecher und engster Berater in Hannover und später in Berlin, Olaf Glaeseker, wegen Bestechlichkeit angeklagt, sein Freund Manfred Schmidt wegen Bestechung.", "Mit dem Prozess gegen Wulff wegen Vorteilsannahme, der möglicherweise in zehn Tagen verkürzt oder vorzeitig beendet wird, ist der Prozess gegen Glaeseker und Schmidt nicht nur wegen der handelnden Personen eng verbunden. Aussagen in dem Glaeseker-Prozess könnten dem Ansehen Wulffs stärker schaden als jene im bereits laufenden Verfahren gegen ihn. Der Sachverhalt, um den es dort geht - drei sogenannte Nord-Süd-Dialoge der beiden Bundesländer Niedersachsen und Baden-Württemberg, die der Eventmanager Schmidt mit einigem finanziellen Gewinn organisierte -, ist nicht Gegenstand des Wulff-Verfahrens. Die Staatsanwaltschaft, in beiden Prozessen sind es dieselben Kläger, hatte die Vorgänge dazu untersucht, in der Frage der Nord-Süd-Dialoge aber nur Anklage gegen Glaeseker und Schmidt, nicht gegen Wulff erhoben. Vorgeworfen wird dem früheren Staatssekretär Glaeseker, er habe in den Jahren 2007 bis 2009 Sponsoren aus der Wirtschaft für die Netzwerk-Treffen in Hannover und Stuttgart gesucht und sich dafür vom Veranstalter Schmidt mehrfach nach Spanien und nach Portugal einladen lassen.", "Glaeseker - er wurde ebenso wie im Wulff-Prozess der mitangeklagte Filmproduzent David Groenewold niemals von den Staatsanwälten zu den Vorwürfen vernommen - hält dem entgegen, zwischen Schmidt und ihm gebe es eine alte und tiefe Freundschaft, bei denen es beiderseitige und ausgeglichene Einladungen gegeben habe. Zudem sei die Sponsorensuche nicht eine - als Teil des Straftatbestandes vorausgesetzte - \"dienstliche Handlung\" gewesen, sondern eine Privathandlung im Landesinteresse. Die Vorsitzende Richterin hat zwanzig Verhandlungstermine bis zunächst April angesetzt. Im Prozess sind mehrere bekannte Zeugen vorgeladen, darunter die Fernsehmoderatorin Sabine Christiansen. Wulff soll im Februar als Zeuge befragt werden.", "Das niedersächsische Kabinett entband Wulff am vergangenen Dienstag von seiner Schweigepflicht und erteilte ihm eine Aussagegenehmigung im Glaeseker-Prozess. Bei polizeilichen Vernehmungen soll Wulff sich von Glaeseker distanziert und behauptet haben, er habe von vielen Vorgängen und Urlauben nichts gewusst. Dem widersprachen andere Beteiligte: Er habe von den Urlauben Glaesekers gewusst und mit ihm in dieser Zeit auch Kontakt gehabt. Wulff hatte Glaeseker im Dezember 2011, wenige Wochen vor seinem Rücktritt vom Amt des Bundespräsidenten, ohne Begründung entlassen, ihn aber zuvor vielfach als seinen siamesischen Zwilling bezeichnet, ohne den nichts gehe. Im Rahmen der langjährigen Zweckfreundschaft hatte Glaeseker als \"Spindoctor\" das Bild Wulffs gewandelt von einem farblosen Oppositionsführer im Niedersächsischen Landtag zu einem \"Liebling aller Schwiegermütter\" und die Trennung Wulffs von seiner ersten Ehefrau durch Zusammenarbeit mit der \"Bild\"-Zeitung publizistisch wohlwollend begleiten lassen.", "Die Freundschaft zwischen Wulff und Glaeseker ist inzwischen, wie es heißt, zerbrochen. (Kommentar Seite 10.)"]}, {"id": "DE_T1_02", "press": false, "title": "Wieder deutlich mehr Kirchentagsbesucher", "paras": ["Nach Angaben der Veranstalter haben sich in Dresden 117 957 Dauerteilnehmer für den Evangelischen Kirchentag angemeldet. Das ist ein deutlicher Zuwachs im Vergleich mit dem Evangelischen Kirchentag in Bremen vor zwei Jahren, als die - für die Veranstalter wichtige - Schwelle von 100 000 Teilnehmern erreicht wurde. 1997 in Leipzig, beim ersten Evangelischen Kirchentag in Ostdeutschland nach der friedlichen Revolution, war die Zahl der Teilnehmer noch hinter den Erwartungen der Veranstalter zurückgeblieben. Das wurde vor allem auf das mäßige Interesse an Religion in den neuen Ländern zurückgeführt, während der Besucherstrom aus dem Westen damals recht konstant blieb. Befürchtungen, dies könnte sich dieses Jahr in Dresden wiederholen, haben sich nicht bestätigt: Unter den Dauerteilnehmern sind allein 26930 aus der lutherischen Landeskirche Sachsens - ein für eine Minderheitskirche erstaunlich hoher Mobilisierungsgrad. 89 Prozent der Kirchentagsbesucher sind evangelisch, acht Prozent katholisch. Mit 60 Prozent sind auch in Dresden wieder die Frauen in der klaren Mehrheit. 38 Prozent der Teilnehmer sind jünger als 30 Jahre.", "Wie gewohnt stellen Einzelteilnehmer, Gruppenteilnehmer und Mitwirkende jeweils etwa ein Drittel der Teilnehmer. Aus den Gemeinden sind allein 527 Bläserchöre mit 6151 Bläsern angereist. Zur Finanzierung des Kirchentagshaushalts von 14,8 Millionen Euro tragen laut Veranstalterangaben Teilnehmerbeiträge und Sponsoren sechs Millionen Euro, der Freistaat Sachsen 5,5 Millionen Euro, die Stadt Dresden zwei Millionen Euro, die Landeskirche eine Million Euro und der Bund 400000 Euro bei. (bin.)"]}, {"id": "DE_T1_03", "press": false, "title": "Hofft auf Obama", "paras": ["Die Hohepriesterin der spanischen Sozialistischen Partei hat für das neue Jahr ein \"historisches Ereignis\" von geradezu \"planetarischer\" Bedeutung vorausgesagt. Leire Pajín, Organisationssekretärin der PSOE, sah bei einem Blick in ihre politische Kristallkugel ein kosmisches Zusammentreffen \"zweier fortschrittlicher Führungskräfte auf beiden Seiten des Atlantiks\": Drüben die fortdauernd wohltuende Präsidentschaft Barack Obamas und hüben die Übernahme der rotierenden EU-Ratspräsidentschaft durch Spanien und dessen Ministerpräsidenten José Luis Rodríguez Zapatero. Der spanische Außenminister Moratinos hielt es dann zum Stichtag am 1. Januar eine Nummer kleiner, indem er versicherte, sein Chef und er würden ihre Aufgaben an der Spitze der Union \"mit Demut und Bescheidenheit\" verrichten. Zum Beweis beteuerte auch Zapatero, dass Madrid nicht daran denke, dem neuen EU-Führungsduo Herman van Rompuy und Catherine Ashton das Rampenlicht streitig zu machen.", "Im Gegenteil: Die Spanier wollen nach dem Inkrafttreten des Lissabonner Vertrags sogleich einen protokollarischen Präzedenzfall schaffen und den ständigen Präsidenten aus Belgien auch ständig präsidieren lassen. Wie sich doch die Zeiten geändert haben, seit der stets auf die Innenpolitik konzentrierte damalige Oppositionsführer sitzen blieb, als auf einer Madrider Militärparade die amerikanische Fahne an ihm vorbeizog. Es folgten nach seinem Wahlsieg 2004 (er hatte 2000 den Vorsitz der Sozialistischen Partei errungen) fünf Jahre der absichtsvollen Nichtzurkenntnisnahme im Weißen Haus, weil der Hausherr George W. Bush dem spanischen Regierungschef den abrupten Abzug der spanischen Soldaten aus dem Irak nicht verzieh. Erst mit Obama kam die erste Einladung.", "Nun hofft der Spanier, der als Gastgeschenk gerade eine Erhöhung des Truppenkontingents in Afghanistan ankündigte, so sehr zu Obamas Liebling zu werden, wie sein Vorgänger Aznar dies bei Bush gewesen war. Der unvermittelte internationale Ehrgeiz des 1960 in Valladolid geborenen Zapatero in seiner zweiten Amtsperiode fällt mit einer schweren Wirtschaftskrise daheim und dem entsprechendem Niedergang seiner Popularität zusammen. Sein Motto für die sechs Monate des EU-Postens, nämlich \"mehr Europa\", ist daher auch eine Flucht nach vorn. Die Themen Abbau der Arbeitslosigkeit (sie beträgt 20 Prozent), Wachstum (noch negativ) und Staatsdefizit (10 Prozent) will er in einen europäischen Rahmen einbetten. Das Gleiche soll für die Nachbereitung von Kopenhagen (Klimawandel), Sicherheitsfragen (Terrorismus, Immigration, Piraterie) gelten.", "Schließlich steht noch ein ganzer Strauß profilierungsfähiger EU-Gipfeltreffen auf der Tagesordnung: mit Obama, Russland, Japan, Marokko, der Mittelmeerunion, Lateinamerika, dem Maghreb. Und sogar auf einem heimischen Feld will der diskrete Büroraucher für alle EU-Gäste sichtbar Führungskraft vorführen: bei der Verschärfung des löchrigen Rauchverbots in Spanien. LEO WIELAND"]}, {"id": "DE_T1_04", "press": false, "title": "Risiko Pilot", "paras": ["Es ist verständlich, dass die Lufthansa den Absturz in Frankreich im ersten Schreck als Folge eines extremen Einzelfalls dargestellt hat, der nichts über die Flugtauglichkeit und Gesundheit ihres übrigen Personals aussagt. Dass der Kopilot den Dienst antrat, obwohl er krankgeschrieben war, ist ein Hinweis darauf, dass da in der Tat jemand am Werke war, der - aus welchen Gründen auch immer - seinen Arbeitgeber und die ihm anvertrauten Menschen in einem Maße hintergangen hat, das in einem verantwortungsvollen Beruf eine seltene Ausnahme sein sollte. Trotzdem ist der Vorfall so schwerwiegend, dass grundsätzlich darüber nachzudenken ist, wie der Flugverkehr vor dem Risiko Pilot besser geschützt werden kann. Wenn 149 Kunden und Mitarbeiter ums Leben kommen, muss das betroffene Unternehmen, aber auch der Gesetzgeber jedes Verfahren überprüfen und in Frage stellen. Dass die deutschen Fluggesellschaften nun vereinbart haben, dass künftig kein Pilot mehr allein im Cockpit bleiben darf, ist ein erster Schritt in die richtige Richtung.", "In einem Szenario, wie es sich vermutlich auf dem Germanwings-Flug abgespielt hat, könnte eine Flugbegleiterin immerhin noch die Tür für den ausgeschlossenen Piloten öffnen oder vielleicht durch ihre bloße Anwesenheit das Schlimmste verhindern. Der andere Schluss, den die bisher bekannten Umstände nahelegen, lautet, dass die Fluglinien sich besser um die mentale Stabilität ihres Personals kümmern müssen. Wenn ein Pilot über längere Zeiträume psychische Probleme hat, dann sollte ein Facharzt durchaus in der Lage sein, das zu erkennen. Auf Hinweise der Arbeitskollegen kann man da nicht vertrauen, denn dafür sind sie nicht geschult. Gegen solche Maßnahmen wird oft eingewandt, dass es keine hundertprozentige Sicherheit geben könne.", "Auch der Vorstandsvorsitzende der Lufthansa hat so argumentiert. Das ist richtig, trifft aber nicht den Kern der Sache. Eine Fluggesellschaft unterlässt ja auch nicht das Warten ihrer Turbinen, weil stets die Gefahr des Vogelschlags besteht. In der Flugsicherheit geht es darum, erkannte Risiken so weit wie möglich zu verringern. Auf dieser langen Liste steht nun auch der Selbst- und Massenmörder im Cockpit.", "Jede Vorkehrung, die nur einen von seiner Tat abhält, rettet viele Menschenleben."]}]], "screeners": [{"id": "DE_S09", "press": true, "title": "", "paras": ["Ein Interview der badenwürttembergischen Wirtschaftsministerin Nicole Hoffmeister-Kraut in der „Wirtschafts Woche“ und ihre Kritik an den Automobilunternehmen belegt exemplarisch, dass die kurzsichtige und ideologische Verkehrs- und Wirtschaftspolitik der Regierung massiv Arbeitsplätze gefährdet. Dirk Spaniel, verkehrspolitischer Sprecher der Af D-Fraktion erklärt dazu: „Die CDU-Politikerin, die selbst aus einer Unternehmerfamilie stammt, befürchtet, dass 50 Prozent aller Arbeitsplätze im produzierenden Bereich gefährdet sind, wenn 2030 jedes zweite verkaufte Auto ein reines E-Auto sein sollte, wie von der Regierung gewünscht. Die Lage kleiner und mittlerer Zulieferer und damit ganzer Regionen sei zum Teil noch ernster als die der global aufgestellten Autohersteller, gibt sie zu Protokoll. Dieselbe Befürchtung äußert die Af D-Fraktion seit sie im Bundestag ist. Ihre Forderung, Hersteller sollten mehr bezahlbare Pkw-Modelle anbieten, ist naiv.", "Die Zellproduktion ist teuer und bislang wird der Löwenanteil aus Asien bezogen. Hier hat es die Politik versäumt, frühzeitig neue Angebote zu machen. Dennoch widerspricht es marktwirtschaftlichen Prinzipien, eine Technologie vorrangig durch Subventionen aus dem Säckel des Steuerzahlers zu fördern. Das Elektroauto ist keine Erfolgsgeschichte. Weltweit gibt es rund eine Milliarde Autos.", "Davon sind sechs Millionen elektrifiziert. Das sind 0,6 Prozent. Weltweit gesehen, ist der Anteil also verschwindend gering, ähnlich wie in Deutschland mit 100 000 Elektroautos auf 47 Millionen Bestandsfahrzeuge. Derzeit wächst die E-Mobilität jährlich um 40 Prozent. Bei den minimalen Prozentzahlen, sind die Zuwächse indes ein Tropfen auf dem heißen Stein.", "In China, wo die meisten Kohlekraftwerke weltweit in Betrieb sind und weiter wachsen, ist dazu der Strommix noch miserabler als in Deutschland (60 Prozent fossile Energie). Die einseitige Propagierung der Elektromobilität wird unserer Schlüsselindustrie nicht helfen. Sinnvoller ist eine Infrastruktur für synthetische Kraftstoffe, um den Verbrennungsmotor CO2-neutral zu betreiben, wie es die Af D-Fraktion im November 2018 (Antrag 19/6007) vorgestellt hatte. Es ist bedauerlich, dass sich alle Fraktionen gegen diesen vernünftigen Beitrag stemmen.“"], "gold": {"q2": "national"}, "note": "both experts: national; attention check only (cannot catch a national default)"}], "screener_every": 2, "pilot": true, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political articles: national or international? — German</h1>\n<p class=\"lead\">You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Political article:</b> an article in which politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics counts as political.</p><p class=\"gnum\"><b>1.2 National scope:</b> the main political issue sits in the German national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the national government, parliament or parties respond to it.</p><p class=\"gnum\"><b>1.3 International scope:</b> the article is mainly about another country&#x27;s politics, or about international affairs with no domestic focus.</p>\n<h2>2. Task description</h2><p>You read one article at a time. For a newspaper article answer Q1 (is it about politics?) and, if yes, Q2 (mainly national or international?). Party press releases are political by definition, so for them only Q2 is asked. Judge the whole article, not a single sentence.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q1 when politics is a main theme of the article, not merely mentioned.</p><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A politician appearing as a private person or as a celebrity does not make an article political. Human-interest stories without a political actor, institution or policy are NO.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = NO</div><p class=\"ttl\">Hund Flecki ist wieder bei seinen Besitzern</p><div class=\"text\" lang=\"de\"><p>STUTTGART, 2. August. Zwölf Tage streunte der kroatische Mischlingshund Flecki durch die Felder und Wiesen am Südrand der Schwäbischen Alb: Am Freitagabend entdeckte eine Frau aus Blaubeuren dann den scheuen Hund bei sich im Garten. Um 19.30 Uhr ging bei der Sanitäterin der &quot;UNA-Tierrettung&quot; sowie bei den Hundehaltern Lisa Metzler und Sven Hossalla die erlösende Meldung ein. Seit Mittwoch hatte ein Team der …</p></div><p class=\"how\">Not political: a lost dog and its owners; no political actor, institution or policy is the topic — although the article appeared in a newspaper&#x27;s politics pages. [Pending: enters the training only if both expert codings say “not political”.]</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Coding the article above as political because a politician or a newspaper politics page is involved.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Decide Q2 by the main topic: domestic institutions, parties and laws → NATIONAL; another country&#x27;s politics or international affairs → INTERNATIONAL. A foreign event discussed through the national reaction to it is NATIONAL.</p><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> One sentence about another country does not make a national article international, and vice versa — the article as a whole decides.</p></div>"}</script>

  // ---------- older builds (answers from a previous version of this page) ----------

  function coded(st) {

    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {
      var a = st.ans[ik];
      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }
    });
    return n;
  }
  // Older slots for this mode, richest first: a build that was merely opened must not

  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);

  function radio(a, field, values, labels, onchange) {
    return el('div', { cls: 'opts' }, values.map(function (v, k) {
      return el('button', { cls: 'opt' + (a[field] === v ? ' on' : ''), type: 'button', text: labels ? labels[k] : v,
        onclick: function () { a[field] = v; onchange(); } });
    }));
  }

  // ---------- one item per screen ----------
  function show(t, i) {
    var its = items(t), it = its[i], a = A(t, it), PRACTICE = t.phase === 'training';
    setHead(t.title, i, its.length);
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    if (PRACTICE) app.appendChild(el('p', { cls: 'how', text: 'Practice example ' + (i + 1) + ' of ' + its.length +
      ' (not scored). Answer first; the answer of the research team then appears below your answer.' }));
    var qbox = el('div'), gbox = el('div');
    var next = el('button', { cls: 'primary', text: i === its.length - 1 ? (PRACTICE ? (PREVIEW ? 'End of the preview' : 'Start the qualification') : 'Finish') : 'Next',
      onclick: function () {
        if (!done(t, it)) return;
        if (i === its.length - 1) finish(t); else show(t, i + 1);
      } });
    function refresh() {
      save();
      qbox.innerHTML = '';
      (it.kind === 'article' ? articleQs : it.kind === 'qs' ? qsQs : function () { return []; })(t, it, a, refresh)
        .forEach(function (n) { if (n) qbox.appendChild(n); });
      next.disabled = !done(t, it);
      if (PRACTICE) { gbox.innerHTML = ''; if (done(t, it)) { if (!a.revealed) { a.revealed = new Date().toISOString(); save(); } gbox.appendChild(expertCard(t, it)); } }
    }

    if (it.kind === 'article') {
      var body = [];
      if (it.d.title) body.push(el('p', { cls: 'ttl', text: it.d.title }));
      it.d.paras.forEach(function (p) { body.push(el('p', { text: p })); });
      app.appendChild(el('div', { cls: 'card' }, [
        el('div', { cls: 'part', text: 'Part A \u00b7 Read the article, then answer' }),
        el('div', { cls: 'text long', lang: lang(t) }, body)]));
    } else if (it.kind === 'split') {
      app.appendChild(qcard(D.instr.q3.q, D.instr.q3.how, null));
      app.appendChild(el('div', { cls: 'card' }, [
        el('div', { cls: 'part', text: 'Part B \u00b7 One paragraph, one sentence per line' }),
        el('div', { cls: 'hint', text: 'Every line needs an answer: either mark the splits inside it, or press ' +
          '\u201cone quasi-sentence\u201d to say it holds just one.' })]
        .concat(it.d.sentences.map(function (s, si) { return sentence(a, s, si, lang(t), refresh); }))));
    } else {
      var ctx = [];
      if (it.d.prev) ctx.push(el('p', { cls: 'ctx', text: it.d.prev }));
      ctx.push(el('p', null, [el('span', { cls: 'qs', text: it.d.qs })]));
      if (it.d.next) ctx.push(el('p', { cls: 'ctx', text: it.d.next }));
      if (!it.d.prev && !it.d.next) {
        ctx.push(el('p', { cls: 'ctxnone', text: 'No surrounding sentences are available for this one. ' +
          'Code it on its own.' }));
      }
      app.appendChild(el('div', { cls: 'card' }, [el('div', { cls: 'text', lang: lang(t) }, ctx)]));
    }
    app.appendChild(qbox); app.appendChild(gbox);

    var note = el('textarea', { cls: 'note', placeholder: 'Expert note (optional; not part of the crowd version)' });
    note.value = a.note || '';
    note.addEventListener('input', function () { a.note = note.value; save(); });
    if (GOLD) app.appendChild(el('div', { cls: 'card' }, [note]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: i === 0 ? (PRACTICE ? 'Back' : 'Tasks') : 'Back', onclick: function () { if (i === 0) menu(); else show(t, i - 1); } }),
      el('span', { cls: 'id', text: PRACTICE ? 'Example ' + (i + 1) : 'Item ID ' + it.d.id }),
      next]));
    refresh();
    window.scrollTo(0, 0);
  }

  function articleQs(t, it, a, refresh) {
    var out = [];
    if (it.d.press) {
      out.push(el('div', { cls: 'card stop', text: 'Press release: political by definition, so Q1 is skipped.' }));
    } else {
      out.push(qcard(D.instr.q1.q, D.instr.q1.how, radio(a, 'q1', ['yes', 'no'], null, function () {
        if (a.q1 === 'no') delete a.q2;
        refresh();
      })));
    }
    if (it.d.press || a.q1 === 'yes') {
      out.push(qcard(t.q2.q, t.q2.how, radio(a, 'q2', ['national', 'international'], null, refresh)));
    } else if (a.q1 === 'no') {
      out.push(el('div', { cls: 'card stop', text: 'Not political: no further question for this article. Click Next.' }));
    }
    return out;
  }

  function qsQs(t, it, a, refresh) {
    var out = [qcard(D.instr.q4.q, D.instr.q4.how, radio(a, 'q4', ['yes', 'no'], null, function () {
      if (a.q4 === 'no') { delete a.q5; delete a.econ; delete a.chances; delete a.rights; }
      refresh();
    }))];
    if (a.q4 === 'yes') {
      out.push(qcard(D.instr.q5.q, D.instr.q5.how || '', el('div', { cls: 'opts' }, D.instr.q5.opts.map(function (o) {
        return el('button', { cls: 'opt' + (a[o.key] ? ' on' : ''), type: 'button',
          onclick: function () { var was = !!a[o.key]; delete a.econ; delete a.chances; delete a.rights; if (!was) a[o.key] = true; refresh(); } },
          [el('span', { text: (a[o.key] ? '\u25c9 ' : '\u25cb ') + o.name }), el('small', { text: o.desc })]);
      }))));
      out.push(qcard(D.instr.q6.q, D.instr.q6.how,
        radio(a, 'q5', ['supports', 'against', 'mentions'], ['supports', 'against', 'mentions only'], refresh)));
    } else if (a.q4 === 'no') {
      out.push(el('div', { cls: 'card stop', text: 'No reference to equality: Q5 and Q6 are skipped. Click Next.' }));
    }
    return out;
  }

  // ---------- the splitting widget ----------
  function sentence(a, s, si, lg, onchange) {
    var tk = toks(s);
    if (!a.cuts) a.cuts = {};
    if (!a.nosplit) a.nosplit = {};
    var box = el('div', { cls: 'sent', lang: lg });
    var last = 0, lastJ = -1;

    function toggle(j) {
      var now = Date.now();
      if (j === lastJ && now - last < 400) return;   // only a repeat on the SAME gap is a double-click
      last = now; lastJ = j;
      var c = (a.cuts[si] || []).slice(), k = c.indexOf(j);
      if (k >= 0) c.splice(k, 1); else c.push(j);
      c.sort(function (x, y) { return x - y; });
      a.cuts[si] = c;
      if (c.length) delete a.nosplit[si];            // a split answers the line
      draw(); onchange();
    }
    function one() {
      if (a.nosplit[si]) delete a.nosplit[si];
      else { a.nosplit[si] = true; a.cuts[si] = []; }
      draw(); onchange();
    }
    function draw() {
      var cuts = a.cuts[si] || [], seg = 0, st = lineState(a, si);
      box.innerHTML = '';
      box.className = 'sent' + (st === 'unresolved' ? ' todo' : '');
      function shade() { return seg === 0 ? '' : (seg % 2 ? ' seg1' : ' seg2'); }
      tk.forEach(function (w, j) {
        if (j > 0) {
          var on = cuts.indexOf(j) >= 0;
          if (on) seg++;
          box.appendChild(el('span', { cls: 'gap' + (on ? ' cut' : shade()), title: on ? 'Remove this split' : 'Split here',
            onclick: function () { toggle(j); } }));
        }
        box.appendChild(el('span', { cls: 'w' + shade(), text: w }));
      });
      // offered only while the line carries no split, so marking it can never discard one
      if (!cuts.length) {
        box.appendChild(el('button', { cls: 'nos' + (st === 'one_qs' ? ' on' : ''), type: 'button',
          text: (st === 'one_qs' ? '\u2611' : '\u2610') + ' one quasi-sentence', onclick: one }));
      } else {
        box.appendChild(el('span', { cls: 'cnt', text: (cuts.length + 1) + ' quasi-sentences' }));
      }
    }
    draw();
    return box;
  }

  // ---------- finish ----------
  function pilotFeedback(t) {
    setHead(t.title, null);
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var box = el('textarea', { cls: 'note', placeholder: 'Optional: anything unclear in the instructions or the examples? Anything that did not work on your screen?' });
    box.style.minHeight = '120px';
    app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'One last question (pilot)' }),
      el('p', { text: 'This is a pilot run. Your comments help us fix the instructions before the main study. You can leave the box empty.' }), box]));
    app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: 'Send and get my code', onclick: function () {
      S.feedback = box.value || ''; S.feedback_done = true; save(); finish(t); } })]));
  }
  function finish(t) {
    if (CROWD && t.phase === 'training') { S.t.training_end = new Date().toISOString(); save(); return PREVIEW ? previewEnd() : startPhase('entry'); }
    if (CROWD && t.phase === 'entry') return entryFinish();
    if (CROWD && t.phase === 'production' && !S.t.production_end) { S.t.production_end = new Date().toISOString(); save(); }
    if (CROWD && D.pilot && t.phase === 'production' && !S.feedback_done) return pilotFeedback(t);
    setHead(t.title, null);
    app.innerHTML = '';
    if (GOLD) {
      app.appendChild(el('div', { cls: 'card' }, [
        el('h2', { text: 'Task finished' }),
        el('p', { text: 'Thanks. Click Download answers and put the file in the shared Dropbox folder.' })]));
      app.appendChild(el('div', { cls: 'nav' }, [
        el('button', { text: 'Back to tasks', onclick: menu }),
        el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
        el('button', { cls: 'primary', text: 'Download answers (CSV)', onclick: download })]));
      return;
    }
    var card = el('div', { cls: 'card' }, [el('h2', { text: 'Task finished' })]);
    app.appendChild(card);
    var nav = el('div', { cls: 'nav' }, [CROWD ? el('span') : el('button', { text: 'Back to tasks', onclick: menu })]);
    app.appendChild(nav);

    function completion() {
      var code = CFG.completion_code || '';
      card.appendChild(el('p', { text: 'Your completion code is:' }));
      card.appendChild(el('p', null, [el('span', { cls: 'code', text: code })]));
      var url = '';
      if (PLAT.name === 'prolific') {
        url = CFG.prolific_return_url || ('https://app.prolific.com/submissions/complete?cc=' + encodeURIComponent(code));
      } else if (PLAT.name === 'cloudresearch') {
        url = CFG.cloudresearch_return_url || '';
      }
      if (url) {
        card.appendChild(el('p', { text: 'Click the button to register your submission. ' +
          'If the page does not return, copy the code above into the platform.' }));
        nav.appendChild(el('a', { cls: 'btn primary', href: url, text: 'Return to ' +
          (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') }));
      } else {
        card.appendChild(el('p', { text: 'Copy this code into the platform to register your submission.' }));
      }
      nav.appendChild(el('button', { text: 'Download a copy (CSV)', onclick: download }));
      nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
