<script id="data" type="application/json">{"built": "20261023101128", "mode": "crowd", "task": "T2_sentences", "language": "German", "lang": "de", "title": "Political statements about equality", "intro": "You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = politics is a main theme: government, parliament, parties, politicians acting as politicians, elections, laws and public policy (taxes, welfare, schools, migration, health), political protest. Foreign politics is also yes.\nNO = politics is absent or only mentioned in passing: sport, culture, lifestyle, celebrity and human-interest stories, business news without a policy angle, accidents or crime. A politician appearing as a private person or as a celebrity does not make an article political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line on the screen is one sentence. Decide whether it contains one unit of meaning or several, and mark where each new unit begins.\nA quasi-sentence is one unit of meaning: one statement, demand, measure, judgement or fact. A sentence can contain one or several; a quasi-sentence never runs across two sentences. Boundaries usually fall at a semicolon, at a comma, or at “and” / “but” — but you decide where one unit ends and the next begins.\nTo mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole sentence is one unit of meaning, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "T2G_DE_57", "qs": "Über eine Erhöhung der Riester-Grundzulage und eine Neuaufstellung der staatlichen Förderung wollen wir gerade Menschen mit geringen Einkommen fördern.", "prev": "Ein Basisprodukt in öffentlicher Verwaltung soll eine bessere, transparentere und kostengünstigere Alternative zu den heutigen Riester-Produkten darstellen.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0, "q5": "supports", "note": "Both experts: refers to equality — economic equality (support for people on low incomes through the Riester allowance). Position: supports — it proposes a measure that helps the worse-off."}}, {"id": "T2G_DE_32", "qs": "Einstiege sind zu ermöglichen, Übergänge im Bildungswesen dürfen nicht weiter Selektionsstufen bleiben.", "prev": "Die SPD-Bundestagsfraktion versteht Inklusion als eine Aufgabe für alle Etappen und Bereiche des Bildungswesens – von der frühkindlichen Bildung über Schule und Berufseinstieg bis hin zu Hochschulen und Weiterbildungseinrichtungen.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0, "q5": "supports", "note": "Both experts: refers to equality — equal chances (transitions in the education system must stop acting as selection stages). Position: supports."}}, {"id": "T2G_DE_17", "qs": "Internationale Studien schätzen, dass fünf bis 20 Prozent aller Menstruierenden dadurch in ihren täglichen Aktivitäten beeinträchtigt sind.", "prev": "Menstruationsbeschwerden zählen zu den häufigsten Gründen, weshalb Frauen gynäkologische Praxen aufsuchen.", "next": "", "gold": {"q4": "no", "note": "Both experts: no reference to equality. A health statistic about menstruating people; nobody is said to get more or less than others, and no fair treatment of a group is at stake."}}], "entry": {"items": [{"id": "T2G_DE_22", "qs": "Die Impfpflicht diene „Verfassungsgütern mit überragendem Stellenwert“, nämlich dem Schutz der vulnerablen Gruppen.", "prev": "Dann freilich folgt ein Schnellkurs in Sachen Grundrechtsabwägung für all jene, die bei der Impfung nur an den eigenen Oberarm denken.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_23", "qs": "Und 130 Euro mehr im Monat bekommen sie auch.", "prev": "Wenn sie mehr Entlastung brauchen, können sie Gehalt in weitere freie Tage umwandeln.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_02", "qs": "Verbindlich für alle Betriebe könnten die Tarifparteien ganz transparent Regeln vereinbaren, nach denen sich die differenzierte Entlohnung richtet.", "prev": "Sie würde nicht das Ende des Flächentarifs bedeuten, im Gegenteil.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_62", "qs": "Sie wird einkommensschwache Mieter angesichts der stetig steigenden Wohnkosten kaum entlasten.", "prev": "Die geplante Wohngeldreform von Bauministerin Hendricks fällt zu klein aus.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_DE_61", "qs": "Erbärmlich ist, dass dies mit einer ganz unappetitlichen Verschärfung des Aufenthaltsrechts verbunden wurden, die ausgerechnet zu Lasten von misshandelten Migrantinnen geht:", "prev": "Ein Aufenthaltstitel bei einer Zwangsverheiratung im Ausland soll nicht mehr automatisch sechs Monate nach der Ausreise erlöschen.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_DE_59", "qs": "Studenten, die von ihren Universitäten verwiesen wurden, müssen bei uns in Europa Stipendien und damit Lebenschancen bekommen - und mehr als wir uns bisher abgerungen haben.", "prev": "Die Menschen sollen reisen können und sehen, was Demokratie und Freiheit bedeutet.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_DE_33", "qs": "Es ist nicht nur ungerecht sondern auch sozialpolitisch äußerst problematisch, wenn hohe Löhne weiter steigen, Menschen mit niedrigen Einkommen dagegen nahezu leer ausgehen.", "prev": "Die prognostizierte Lohnentwicklung bis 2020 droht die Beschäftigten in Deutschland weiter zu spalten.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_DE_40", "qs": "Die bisher untätige Bundesregierung ist dringend gefordert, endlich zu handeln, erklärt Hans-Joachim Hacker.", "prev": "Wir haben es mit einem echten Problem für die Flugsicherheit und die Gesundheit von Flugpersonal und Passagieren zu tun.", "next": "", "gold": {"q4": "no"}}], "rule": {"min_q4_correct": 6, "min_type_hit": 3}}, "batches": [[{"id": "DE_T2_0122", "qs": "Als Mindeststandard soll eine armutsfeste und steuerfinanzierte Solidarische Mindestrente eingeführt werden, die nach einer Einkommens- und Vermögensprüfung gezahlt werden soll.", "prev": "Alle Erwerbstätigen müssen in die gesetzliche Rentenversicherung einbezogen werden.", "next": "Niemand soll im Alter von weniger als 1050 Euro netto leben müssen."}, {"id": "DE_T2_0089", "qs": "Wer von steigenden Immobilienpreisen profitiert, soll auch dafür zahlen.", "prev": "", "next": ""}, {"id": "DE_T2_0014", "qs": "Der Deutsche Bundestag will allen Opfern von Misshandlungen wirksam, gleichermaßen und diskriminierungsfrei helfen.", "prev": "Zur Einbringung des interfraktionellen Antrags Opfern von Unrecht und Misshandlungen in der Heimerziehung wirksam helfen erklärt die zuständige Berichterstatterin der SPD-Bundestagsfraktion Marlene Rupprecht:", "next": "Dieses wichtige Signal sendet der interfraktionelle Antrag an die ehemaligen Heimkinder."}, {"id": "DE_T2_0387", "qs": "Gut fünf Monate nach dem Freispruch Mollaths im Wiederaufnahmeverfahren vor dem Landgericht Regensburg legte die Arbeitsgruppe nun einen „Diskussionsentwurf“ vor, auf dessen Basis Bundesjustizminister Heiko Maas (SPD) das neue Unterbringungsrecht erarbeiten will.", "prev": "", "next": ""}, {"id": "DE_T2_0139", "qs": "Bei den Generälen handelt es sich um den Befehlshaber von Gaddafis Luftwaffe und zwei seiner Regionalkommandeure.", "prev": "", "next": ""}, {"id": "DE_T2_0084", "qs": "Das wäre auch ungerecht – stärker belastet wären ja nur kinderlose Rentenversicherte, nicht aber Beamte oder Selbständige.", "prev": "", "next": ""}, {"id": "DE_T2_0218", "qs": "Dennoch bleibt der Anteil von Frauen in Parlamenten von Bund, Ländern und Kommunen in Deutschland weiter klein.", "prev": "„Frauen wollen Politik machen – genauso wie Männer.", "next": "Mit nur 30,7 Prozent sitzen derzeit so wenige Frauen im Deutschen Bundestag wie seit knapp 20 Jahren nicht mehr."}, {"id": "DE_T2_0068", "qs": "Jedes Jahr wird an diesem Tag der Millionen Menschen gedacht, die unter der nationalsozialistischen Gewaltherrschaft unterdrückt, verfolgt und umgebracht wurden, darunter zahlreiche Menschen mit Behinderung.", "prev": "Morgen vor 73 Jahren wurde das Vernichtungslager Auschwitz befreit.", "next": "Deren Schicksale dürfen nicht in Vergessenheit geraten."}, {"id": "DE_T2_0188", "qs": "Oder ist die Kompetenzfrage nur vorgeschoben?", "prev": "", "next": ""}, {"id": "DE_T2_0352", "qs": "Zudem ist die Tarifbindung mit 53 Proz ev": "Nun sollen offenbar auch Ausländer Soldaten werden können.", "next": "Dass SPD und Grüne die Öffnung der Bundeswehr auch für Migranten begrüßen, ist zynisch."}, {"id": "DE_T2_0167", "qs": "Aus meiner Perspektive ist klar, dass gute Bildungschancen eine Garantie dafür sind, dass Menschen, die nach Deutschland einwandern, ein gutes und selbstbestimmtes Leben führen können.", "prev": "Bessere und professionelle Bildung erhöht das, was viele als ‚gute Integration‘ verstehen.", "next": "Der Jahresbericht problematisiert deutlich die rechtlichen Verschärfungen, die seit 2015 vorgenommen wurden."}, {"id": "DE_T2_0098", "qs": "Wie wäre es mit \"Heil dir im Kaffeekränzchen\"?", "prev": "", "next": ""}, {"id": "DE_T2_0375", "qs": "„Sie hat ein wunderschönes Gesicht“, sagte er zerknirscht über seine Rivalin, „und sie ist eine wunderschöne Frau.“", "prev": "", "next": ""}, {"id": "DE_T2_0256", "qs": "Deswegen fordern wir einen Ausbau der Infrastruktur, damit die Bildungsteilhabe von Kindern - auch von Kindern aus Familien mit niedrigem Einkommen - durch einen kostenfreien Zugang zu Ganztageseinrichtungen, Sport und Kultur und warmem Mittagessen realisiert werden kann.", "prev": "Wir wollen, dass das Geld für Bildungsteilhabe von Kindern ausgegeben wird und nicht für den Aufbau von Bürokratie.", "next": "Das Bundesverfassungsgericht hat in den Leitsätzen zu seinem Urteil eine transparente, nachvollziehbare, realitäts- und sachgerechte Ermittlung der Regelsätze gefordert."}, {"id": "DE_T2_0208", "qs": "Dies werden wir auch am Mittwoch in einer Sondersitzung der Obleute des Entwicklungsausschusses des Deutschen Bundestages zum Ausdruck bringen, nachdem eine von uns beantragte Sondersitzung des gesamten Ausschusses nicht genehmigt wurde.", "prev": "Dazu müsste der deutsche Beitrag noch mindestens verdoppelt, eher verdreifacht werden.", "next": ""}, {"id": "DE_T2_0116", "qs": "Die Sensationsmeldung der Universitätsklinik Heidelberg ließ 41 Millionen deutsche Frauen aufatmen.", "prev": "", "next": ""}, {"id": "DE_T2_0418", "qs": "Wichtig ist ferner eine Arbeitsmarktpolitik, die allen und damit besonders auch Frauen, reelle Chancen auf einen Arbeitsplatz ermöglicht.", "prev": "Die Bekämpfung von Altersarmut fängt schon bei der Bildung an.", "next": "Darüber hinaus brauchen wir auch eine Lohnpolitik, die zu ausreichenden und angemessenen Löhnen führt."}, {"id": "DE_T2_0067", "qs": "Die Höhe der Steuersätze und die Art der Besteuerung differiert weltweit, aber das Prinzip ist fast überall gleich:", "prev": "", "next": ""}, {"id": "DE_T2_0415", "qs": "Zu all dem sagt Frau Wanka kein Wort und spielt so Elitehochschulen gegen gute Ganztagsschulen aus.", "prev": "Mehr Vereinbarkeit mit dem Beruf ist anders nicht zu haben.", "next": "Die SPD wird weiter für mehr Zusammenarbeit im Schulbereich kämpfen."}, {"id": "DE_T2_0267", "qs": "Wir setzen uns für ein selbstbestimmtes solidarisches Leben ein, in dem Erwerbsarbeit, Familienarbeit, gesellschaftliches und politisches Engagement für Männer und Frauen miteinander vereinbar werden\".", "prev": "", "next": ""}, {"id": "DE_T2_0382", "qs": "„Die CDU/CSU-Fraktion im Deutschen Bundestag begrüßt die Ergebnisse des deutschfranzösischen Ministerrats in Paris.", "prev": "", "next": "Bundeskanzlerin Angela Merkel und der französische Präsident Emmanuel Macron haben die Bedeutung einer verstärkten deutschfranzösischen Zusammenarbeit auf zahlreichen Gebieten aufgezeigt."}, {"id": "DE_T2_0127", "qs": "\"Immer offen bleiben für Neues und die eigene Herkunft nicht vergessen.", "prev": "", "next": ""}, {"id": "DE_T2_0282", "qs": "Er rügte alle Beteiligten:", "prev": "", "next": ""}, {"id": "DE_T2_0360", "qs": "Inzwischen sind die Erinnerungsplaketten in Smith' Wahlkreis abmontiert worden.", "prev": "", "next": ""}, {"id": "DE_T2_0190", "qs": "Mehr als 250 000 Euro wurden einbehalten.", "prev": "", "next": ""}, {"id": "DE_T2_0355", "qs": "Ein „Bail In“ erbringt bei einer Bilanzsumme in Höhe von 1.500 Milliarden Euro maximal eine Summe in Höhe von 120 Milliarden Euro.", "prev": "Der europäische Abwicklungsfonds wird entsprechend den bisherigen Plänen über rund 65 Milliarden Euro an Vermögen und einen Kredit des ESM in Höhe von 65 Milliarden Euro, insgesamt 130 Milliarden Euro, verfügen können.", "next": "Insgesamt sind 250 Milliarden Euro verfügbar."}, {"id": "DE_T2_0033", "qs": "Der Zugang zu Bildung darf nicht vom familiären Umfeld oder Geldbeutel abhängen.", "prev": "Während im Jahr 2000 Akademiker noch 45 Prozent mehr als Nichtakademiker verdienten, wuchs im Jahre 2012 der Unterschied auf unglaubliche 74 Prozent an.", "next": "Jeder muss die Chance auf gute Bildung haben."}]], "screeners": [{"id": "T2G_DE_42", "qs": "Die Lage kleiner und mittlerer Zulieferer und damit ganzer Regionen sei zum Teil noch ernster als die der global aufgestellten Autohersteller, gibt sie zu Protokoll.", "prev": "„Die CDU-Politikerin, die selbst aus einer Unternehmerfamilie stammt, befürchtet, dass 50 Prozent aller Arbeitsplätze im produzierenden Bereich gefährdet sind, wenn 2030 jedes zweite verkaufte Auto ein reines E-Auto sein sollte, wie von der Regierung gewünscht.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_03", "qs": "Alle Jugendlichen hätten ein Ausbildungsangebot bekommen.", "prev": "Viele Unternehmen seien für die Ausbildung neu gewonnen worden.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_DE_45", "qs": "Die HIS-Studie (Hochschul-Informations-System) zeigt, dass finanzielle Schwierigkeiten für viele Studieninteressierte ein großes Problem darstellen und Einfluss auf die Studiumsentscheidung haben können.", "prev": "Denn die heutige Anhörung im Ausschuss für Bildung und Forschung hat keine neuen Erkenntnisse gebracht.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_DE_65", "qs": "und ein Zukunftsprogramm für den sozial-ökologischen Umbau der Gesellschaft in Höhe von 125 Milliarden Euro jährlich", "prev": "Erreicht werden kann dies durch die Einführung des flächendeckenden gesetzlichen Mindestlohns von zehn Euro, die Aufstockung der Hartz IV-Regelsätze auf 500 Euro", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political statements about equality — German</h1><p class=\"lead\">You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Statement:</b> the unit you code: one quasi-sentence, highlighted on the screen. The grey text before and after is context only and is not coded.</p><p class=\"gnum\"><b>1.2 Reference to equality:</b> the statement mentions equality, social justice or the equal treatment of all people in one of the three kinds below — whatever position it takes. Not a reference: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime.</p><p class=\"gnum\"><b>1.3 Economic equality:</b> Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all.</p><p class=\"gnum\"><b>1.4 Equal chances / social mobility:</b> Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child&#x27;s social background should not determine its future; everyone must be given a fair chance regardless of their parents&#x27; income.</p><p class=\"gnum\"><b>1.5 Equal rights / anti-discrimination:</b> Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards.</p><p class=\"gnum\"><b>1.6 Position:</b> SUPPORTS = in favour of more equality or against inequality (demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts). AGAINST = argues against more equality or the measures for it, or presents inequality as acceptable, deserved or necessary. MENTIONS = refers to the topic without taking a position.</p><h2>2. Task description</h2><p>For each highlighted statement answer Q4: does it mention equality? If yes, answer Q5: which ONE kind of equality (economic / equal chances / equal rights) — if more than one applies, choose the one most clearly emphasized — and Q6: what position does the statement take (supports / against / mentions)? If no, Q5 and Q6 are skipped.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All ✓ examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q4 when the statement itself mentions one of the three kinds of equality — who gets more or less, who has which chances, who is treated equally.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: economic equality · Q6: supports</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">DIE LINKE fordert die Anerkennung des Praktikums als Lernverhältnis, das eine begrenzte Dauer aufweist und der Praktikantin bzw. dem Praktikanten eine Mindestvergütung sowie volle Mitbestimmungsrechte bietet.</p><p><span class=\"qs\">Die jungen Leute sollten die Schutzregeln des Berufsbildungsgesetzes genießen, statt sich auf die Selbstverpflichtung der Unternehmen verlassen zu müssen.</span></p></div><p class=\"ans\">Q4: yes · Q5: economic equality · Q6: supports</p><p class=\"how\">Both experts: about inequality — young people should get legal protection instead of depending on employers&#x27; goodwill: who is protected and who is not → economic equality; the statement demands more protection → supports.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A political statement that does not mention equality is NO, even when the surrounding context is about equality.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: no</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Sollte der Mann, der als Flüchtling kam, zu einem Gefährder wurde und im November als solcher auf dem Schirm aller Sicherheitsbehörden gewesen ist, wirklich der Täter sein, verbindet er in seiner Person jene Mischung, die für viele Menschen schwer auszuhalten wäre.</p><p><span class=\"qs\">Am Dienstag hatten Hofreiter und Özdemir mit ihren Co-Vorsitzenden Katrin Göring- Eckardt und Simone Peter erklärt, es gehe „uns alle an, unsere offene Gesellschaft gegen Hass und Fanatismus zu verteidigen“.</span></p></div><p class=\"ans\">Q4: no</p><p class=\"how\">Both experts: political (party leaders defend the open society) but not about who gets what, opportunities or discrimination → not about inequality.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Q5: exactly one kind per statement. Money, poverty, wages, redistribution, affordability → economic equality; opportunities in education, work and social mobility → equal chances; discrimination or the rights of a group → equal rights. If two apply, choose the one most clearly emphasized.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal chances / social mobility · Q6: supports</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Der Bund muss die Länder mit einer echten Bildungsoffensive in Höhe von mehreren Milliarden Euro für die kommenden zehn Jahre unterstützen.</p><p><span class=\"qs\">Damit alle jungen Geflüchteten schnell an Gesellschaft und Arbeitsmarkt teilhaben können, müssen Willkommensklassen und begleitende Sprachangebote an Schulen und Berufsschulen flächendeckend unterstützt werden.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal chances / social mobility · Q6: supports</p><p class=\"how\">Both experts: about inequality — participation of young refugees in society and the labour market through schooling → equal chances; it demands support → supports.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal rights / anti-discrimination · Q6: against</div><div class=\"text\" lang=\"de\"><p class=\"ctx\">Deswegen fordern wir ein Verbandsklagerecht, beispielsweise für Gewerkschaften und Verbände.</p><p><span class=\"qs\">Trotz all dieser Mängel formiert sich gleich wieder Widerstand in den Unionsfraktionen mit der Begründung, für die unterschiedliche Entlohnung von Frauen und Männern sei beispielsweise die unterschiedliche Berufswahl verantwortlich.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal rights / anti-discrimination · Q6: against</p><p class=\"how\">Both experts: about inequality — unequal pay of women and men → equal rights. The statement reports the Union&#x27;s argument that the pay gap is due to career choice, i.e. a justification of the inequality → position against (as reported). To be confirmed.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Choosing two kinds for one statement, or choosing the kind suggested by the context rather than by the highlighted statement itself.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> Q6: demands, measures or criticism that aim at more equality → SUPPORTS; a justification of inequality or opposition to equalising measures → AGAINST; neutral facts, events and agendas → MENTIONS.</p></div><div class=\"gl\"><p class=\"gnum\"><b>3.5</b> Reported speech: code the position of the actor who is reported (“Labour calls for a wealth tax” = supports). The position is about equality, not about a party: “The tax cuts only help the rich” = supports.</p></div>"}</script>

(function () {

  // ---------- platform context (Prolific / CloudResearch Connect) ----------

      for (var i = 0; i < list.length; i++) {
        var hit = lower[list[i].toLowerCase()];

    var idk = pick(order);

  // ---------- older builds (answers from a previous version of this page) ----------

  function coded(st) {

  }
  function progress(t) {

  }
  function allDone() {
    for (var i = 0; i < D.tasks.length; i++) { var p = progress(D.tasks[i]); if (p[0] < p[1]) return false; }
    return true;
  }

  function banner() {

  }
  function setHead(title, i, n) {

  }


  // ================= crowd mode: training -> entry test -> production (+ hidden screeners) =================
  var CROWD = D.mode === 'crowd';
  function crowdKind() { return D.task === 'T1_scope' ? 'article' : D.task === 'T1_split' ? 'split' : 'qs'; }
  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);
    h = ((h & 0xffff) * 16777619 + ((((h >>> 16) * 16777619) & 0xffff) << 16)) >>> 0; } return h >>> 0; }
  function chooseBatch() {

    for (var i = 0; i < prod.length; i++) {
      out.push(prod[i]);

    }

  }
  var BATCH = null;

  function stamp(name) { if (CROWD && !S.t[name]) { S.t[name] = new Date().toISOString(); save(); } }

    if (it.kind === 'article') {
      r.q1_correct = (g.q1 === undefined) ? true : a.q1 === g.q1;
      r.scope_correct = (g.q1 === 'no') ? r.q1_correct : (!!g.q2 && a.q2 === g.q2);

        }

  }
  function scoreEntry() {

      res.passed = res.scope_correct >= (rule.min_scope_correct || its.length) &&

  }
  function scoreScreeners() {

  }

  // ---- crowd screens ----
  var PREVIEW = (params().preview === 'training') || !!D.preview_training;
  function previewEnd() {
    setHead(D.title || 'Annotation task', null);
    app.innerHTML = '';
    app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'End of the preview' }),
      el('p', { text: 'In the real study the qualification would start here. This preview shows only the instructions and the practice examples.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [el('button', { text: 'Back to the start', onclick: crowdMenu }), el('button', { cls: 'primary', text: 'See the examples again', onclick: function () { startPhase('training'); } })]));

  // ---------- the splitting widget ----------
  function sentence(a, s, si, lg, onchange) {
    var tk = toks(s);
    if (!a.cuts) a.cuts = {};
    if (!a.nosplit) a.nosplit = {};
    var box = el('div', { cls: 'sent', lang: lg });
    var last = 0, lastJ = -1;

    function toggle(j) {
      var now = Date.now();
      if (j === lastJ && now - last < 400) return;   // only a repeat on the SAME gap is a double-click
      last = now; lastJ = j;
      var c = (a.cuts[si] || []).slice(), k = c.indexOf(j);
      if (k >= 0) c.splice(k, 1); else c.push(j);
      c.sort(function (x, y) { return x - y; });
      a.cuts[si] = c;
      if (c.length) delete a.nosplit[si];            // a split answers the line
      draw(); onchange();
    }
    function one() {
      if (a.nosplit[si]) delete a.nosplit[si];
      else { a.nosplit[si] = true; a.cuts[si] = []; }
      draw(); onchange();
    }
    function draw() {
      var cuts = a.cuts[si] || [], seg = 0, st = lineState(a, si);
      box.innerHTML = '';
      box.className = 'sent' + (st === 'unresolved' ? ' todo' : '');
      function shade() { return seg === 0 ? '' : (seg % 2 ? ' seg1' : ' seg2'); }
      tk.forEach(function (w, j) {
        if (j > 0) {
          var on = cuts.indexOf(j) >= 0;
          if (on) seg++;
          box.appendChild(el('span', { cls: 'gap' + (on ? ' cut' : shade()), title: on ? 'Remove this split' : 'Split here',
            onclick: function () { toggle(j); } }));
        }
        box.appendChild(el('span', { cls: 'w' + shade(), text: w }));
      });
      // offered only while the line carries no split, so marking it can never discard one
      if (!cuts.length) {
        box.appendChild(el('button', { cls: 'nos' + (st === 'one_qs' ? ' on' : ''), type: 'button',
          text: (st === 'one_qs' ? '\u2611' : '\u2610') + ' one quasi-sentence', onclick: one }));
      } else {
        box.appendChild(el('span', { cls: 'cnt', text: (cuts.length + 1) + ' quasi-sentences' }));
      }
    }
    draw();
    return box;
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];

            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));

          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',

            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));

  function csvText() {

  // Tries the real file download and reports whether the browser accepted it. A

  function tryDownload() {

      var link = el('a', { href: url, download: name });

      document.body.appendChild(link2); link2.click(); link2.remove();

      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
