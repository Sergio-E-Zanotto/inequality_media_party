<script id="data" type="application/json">{"built": "20261026173025", "mode": "crowd", "task": "T2_sentences", "language": "UK", "lang": "en", "title": "Political statements about equality", "intro": "You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "T2G_UK_47", "qs": "Reacting to the news that more than 70 finance firms have signed up to the target of having 30 percent of women in senior posts, the Shadow Minister for Women and Equalities Sarah Champion MP said: “Finance has always been seen as male-dominated and it’s well past time for that to change.", "prev": "30 percent target by 2021 is simply not good enough - Sarah Champion", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1, "q5": "supports", "note": "Both experts: refers to equality — equal rights (women in senior finance posts, male-dominated sector). Position: supports — she welcomes the target and wants the change."}}, {"id": "T2G_UK_49", "qs": "that investigated and reported on antisemitism in the Labour Party.", "prev": "Last year the Claimant made a BBC Panorama programme, Is Labour Anti-Semitic?", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1, "q5": "mentions", "note": "Both experts: refers to equality — equal rights (antisemitism = discrimination against a group). Position: mentions only — the statement describes a programme that investigated it, without taking a stance itself."}}, {"id": "T2G_UK_05", "qs": "Trickett pointed to a speech given by May in 2005, where she said those with intolerant views would not be welcome in the Conservative party.", "prev": "However, you failed to do so, sadly demonstrating the weakness that has characterised the Conservative party’s election campaign to date.”", "next": "", "gold": {"q4": "no", "note": "Both experts: political (a speech about intolerant views in the party) but not about who gets what, opportunities or discrimination of a group → not about inequality."}}], "entry": {"items": [{"id": "T2G_UK_48", "qs": "Up to 15,000 affordable homes and bringing 5,000 empty homes back into use, using new capital funding of £300m and the infrastructure guarantee.", "prev": "The Infrastructure (Financial Assistance) Bill will include guaranteeing the debt of Housing Associations and private sector developers.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_UK_34", "qs": "“It just goes to show that while the UK Government punishes vulnerable and disabled people with cruel benefit cuts, Westminster works for the likes of Ian Taylor - no wonder he wants to keep the system exactly as it is, by giving half-a-million pounds to the No campaign.", "prev": "Commenting on the latest news Angus Robertson MP, the SNP’s Westminster Leader, said:", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_UK_52", "qs": "That report independently, so not my office, not me, said, we really should now press ahead with providing more free school meals.", "prev": "Then, an independent group of people looked into this issue of the quality of, and the provision of school meals in our schools, provided it to Michael Gove in the Department for Education.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 1, "rights": 0}}, {"id": "T2G_UK out the behaviour of Lord Rennard, who has been accused of inappropriately touching several women while working in senior positions in the party.", "prev": "", "next": ""}, {"id": "UK_T2_0418", "qs": "First, in an open society there should be no unfair barriers to people’s talent and aspiration.", "prev": "", "next": ""}, {"id": "UK_T2_0067", "qs": "Could “Poll tax, bedroom tax, more tax” be a contender?", "prev": "", "next": ""}, {"id": "UK_T2_0415", "qs": "It has left a generation unsure that their children’s lives will be better than the life they have enjoyed.", "prev": "", "next": ""}, {"id": "UK_T2_0267", "qs": "I think if people are appointed on the basis of ticking a box, that doesn’t necessarily change the attitudes of everyone else around the boardroom table.", "prev": "", "next": ""}, {"id": "UK_T2_0382", "qs": "They’ve got Boris Johnson.", "prev": "", "next": ""}, {"id": "UK_T2_0127", "qs": "Countless young boys and girls are falling behind at school not because of a lack of potential, but because of the circumstances of their birth.", "prev": "", "next": ""}, {"id": "UK_T2_0282", "qs": "Miliband is saying the government is going to cut taxes for people earning £1m a year by £100,000.", "prev": "", "next": ""}, {"id": "UK_T2_0360", "qs": "The Beckley Foundation has consistently promoted the reform of global drugs policy, using money raised from donors such as the financier George Soros.", "prev": "", "next": ""}, {"id": "UK_T2_0190", "qs": "George Osborne has come under pressure to scrap his planned £1bn cut to inheritance tax and pump the money instead into improved childcare.", "prev": "", "next": ""}, {"id": "UK_T2_0355", "qs": "We could do it, for example, by applying the 50% tax rate to incomes above £100,000, abolishing the upper limit for national insurance contributions, raising capital gains tax to the recipient’s highest income tax rate, and helping lower earners by reintroducing the 10% tax band.", "prev": "", "next": ""}, {"id": "UK_T2_0033", "qs": "I want an education system that is an engine of true social mobility, that helps all children be the best they can be.", "prev": "", "next": ""}]], "screeners": [{"id": "T2G_UK_10", "qs": "The Labour leader said he did not want to pick a fight with the newspaper group and did not believe the article has antisemitic implications, but he wanted to stand up for other families who have suffered similar treatment.", "prev": "Miliband on Friday attempted to partially draw a line under the affair by saying he has \"had his say\" by writing to Lord Rothermere, the owner of the Mail newspapers, to call for an inquiry into the culture and practices of the titles.", "next": "", "gold": {"q4": "no"}}, {"id": "T2G_UK_46", "qs": "According to the Office for National Statistics last year that was 244,000 people, each and every one of them needing a roof over their head.", "prev": "Gerard Batten MEP, the UKIP leader said, \"The PM managed to manage to make this speech without mentioning the root cause of this problem, that is the year on year total of people moving to this country.", "next": "", "gold": {"q4": "yes", "econ": 1, "chances": 0, "rights": 0}}, {"id": "T2G_UK_43", "qs": "But this Government must do much more to stop women offending in the first place.", "prev": "The public want confidence that the criminal justice system is effectively punishing and reforming all those found guilty of committing crimes.", "next": "", "gold": {"q4": "yes", "econ": 0, "chances": 0, "rights": 1}}, {"id": "T2G_UK_26", "qs": "we will extend people’s rights in the workplace and give employees a real voice in the organisations they work for.", "prev": "He said: “Not only will we repeal the trade union bill when we get back in in 2020,", "next": "", "gold": {"q4": "no"}}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political statements about equality — UK</h1><p class=\"lead\">You will read one highlighted statement (a quasi-sentence) at a time, with its neighbours as context, and say whether it refers to equality, which kind of equality, and what position it takes.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Statement:</b> the unit you code: one quasi-sentence, highlighted on the screen. The grey text before and after is context only and is not coded.</p><p class=\"gnum\"><b>1.2 Reference to equality:</b> the statement mentions equality, social justice or the equal treatment of all people in one of the three kinds below — whatever position it takes. Not a reference: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime.</p><p class=\"gnum\"><b>1.3 Economic equality:</b> Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all.</p><p class=\"gnum\"><b>1.4 Equal chances / social mobility:</b> Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child&#x27;s social background should not determine its future; everyone must be given a fair chance regardless of their parents&#x27; income.</p><p class=\"gnum\"><b>1.5 Equal rights / anti-discrimination:</b> Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards.</p><p class=\"gnum\"><b>1.6 Position:</b> SUPPORTS = in favour of more equality or against inequality (demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts). AGAINST = argues against more equality or the measures for it, or presents inequality as acceptable, deserved or necessary. MENTIONS = refers to the topic without taking a position.</p><h2>2. Task description</h2><p>For each highlighted statement answer Q4: does it mention equality? If yes, answer Q5: which ONE kind of equality (economic / equal chances / equal rights) — if more than one applies, choose the one most clearly emphasized — and Q6: what position does the statement take (supports / against / mentions)? If no, Q5 and Q6 are skipped.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All ✓ examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q4 when the statement itself mentions one of the three kinds of equality — who gets more or less, who has which chances, who is treated equally.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: economic equality · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">“The reality of the Tories’ 40 per cent cuts to budgets is: overworked and underpaid care staff with fewer care packages and worse quality for both older people and working age people with care needs.</p><p><span class=\"qs\">“The Tories need to take action in the Spring Statement to avert the crisis which is gripping social care so that people get the care they so desperately need.”</span></p></div><p class=\"ans\">Q4: yes · Q5: economic equality · Q6: supports</p><p class=\"how\">Both experts: about inequality — people not getting the care they need because of budget cuts → economic equality (access to care); demands action → supports.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A political statement that does not mention equality is NO, even when the surrounding context is about equality.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: no</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">However, you failed to do so, sadly demonstrating the weakness that has characterised the Conservative party’s election campaign to date.”</p><p><span class=\"qs\">Trickett pointed to a speech given by May in 2005, where she said those with intolerant views would not be welcome in the Conservative party.</span></p></div><p class=\"ans\">Q4: no</p><p class=\"how\">Both experts: political (a speech about intolerant views in the party) but not about who gets what, opportunities or discrimination of a group → not about inequality.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Q5: exactly one kind per statement. Money, poverty, wages, redistribution, affordability → economic equality; opportunities in education, work and social mobility → equal chances; discrimination or the rights of a group → equal rights. If two apply, choose the one most clearly emphasized.</p><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal chances / social mobility · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">Labour’s priority will be to build on and spread this success across the country.</p><p><span class=\"qs\">“The progress Labour made is being undermined by this Government, as last year around half of local authorities reported a rise in the attainment gap between disadvantaged children and their peers.“</span></p></div><p class=\"ans\">Q4: yes · Q5: equal chances / social mobility · Q6: supports</p><p class=\"how\">Both experts: about inequality — the attainment gap between disadvantaged children and their peers → equal chances; criticises its growth → supports.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ Q4: yes · Q5: equal rights / anti-discrimination · Q6: supports</div><div class=\"text\" lang=\"en\"><p class=\"ctx\">“David Lammy’s review shone a spotlight on the widespread discrimination in our criminal justice system.</p><p><span class=\"qs\">His finding that there is a greater disproportionality in the number of black people in our prisons than in the USA is a source of shame for our society.</span></p></div><p class=\"ans\">Q4: yes · Q5: equal rights / anti-discrimination · Q6: supports</p><p class=\"how\">Both experts: about inequality — disproportionate imprisonment of black people → equal rights; called “a source of shame” → supports.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Choosing two kinds for one statement, or choosing the kind suggested by the context rather than by the highlighted statement itself.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> Q6: demands, measures or criticism that aim at more equality → SUPPORTS; a justification of inequality or opposition to equalising measures → AGAINST; neutral facts, events and agendas → MENTIONS.</p></div><div class=\"gl\"><p class=\"gnum\"><b>3.5</b> Reported speech: code the position of the actor who is reported (“Labour calls for a wealth tax” = supports). The position is about equality, not about a party: “The tax cuts only help the rich” = supports.</p></div>"}</script>

<script>
// app.js v12 — per-page localStorage key (pilot 23 Oct: a coder who had failed DE articles opened DE paragraphs and inherited the failed session); v11 — practice phase is hands-on (answer first, then the research team's answer), skipped when a task has no practice items; v10 — guidelines screen (embedded TRAINING_*.html) shown first after the introduction; Guidelines button in the header reopens it.
(function () {

  var D = JSON.parse(document.getElementById('data').textContent);
  var CFG = JSON.parse(document.getElementById('config').textContent);
  var KEY = 'annotation-' + D.mode + '-' + (D.task || '') + '-' + (D.lang || D.language || '') + '-' + D.built;   // v12: per page, so a coder doing several tasks never inherits another page's state
  var GOLD = D.mode === 'gold';
  var app = document.getElementById('app');

  // ---------- platform context (Prolific / CloudResearch Connect) ----------
  function params() {
    var q = {}, s = String(location.search || '').replace(/^\?/, '');
    if (!s) return q;
    s.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); }
      catch (e) { q[k] = v; }
    });
    return q;
  }
  function detect(q) {
    var names = Object.keys(q), lower = {};
    names.forEach(function (n) { lower[n.toLowerCase()] = n; });
    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        var hit = lower[list[i].toLowerCase()];
        if (hit && q[hit]) return hit;
      }
      return null;
    }
    var plat = { name: 'none', pid: '', study: '', session: '', query: location.search || '' };
    var pp = pick(CFG.id_params.prolific);
    var cc = pick(CFG.id_params.cloudresearch);
    if (pp) plat.name = 'prolific';
    else if (cc) plat.name = 'cloudresearch';
    else if (q.platform === 'prolific' || q.platform === 'cloudresearch') plat.name = q.platform;
    var order = plat.name === 'cloudresearch'
      ? CFG.id_params.cloudresearch.concat(CFG.id_params.prolific)
      : CFG.id_params.prolific.concat(CFG.id_params.cloudresearch);
    var idk = pick(order);
    if (idk) plat.pid = q[idk];
    var sk = pick(['STUDY_ID', 'projectId', 'project_id']);
    if (sk) plat.study = q[sk];
    var ssk = pick(['SESSION_ID', 'assignmentId', 'assignment_id']);
    if (ssk) plat.session = q[ssk];
    plat.dry = q.dry_run === '1' || q.preview === '1';
    return plat;
  }
  var Q = params();
  var PLAT = detect(Q);

  // ---------- state ----------
  // Health probe. A sandboxed preview (Dropbox, Drive, an e-mail client) can make
  // localStorage throw and block downloads; silently swallowing that is how a whole
  // session gets lost, so it is detected up front and shown on every screen.
  var STORAGE_OK = (function () {
    try {
      var t = '__probe_' + Date.now();
      localStorage.setItem(t, '1');
      var ok = localStorage.getItem(t) === '1';
      localStorage.removeItem(t);
      return ok;
    } catch (e) { return false; }
  })();
  var FRAMED = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
  var SAVE_FAILED = false;

  function load() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { SAVE_FAILED = true; }
  }
  var S = load() || { coder: '', ans: {}, started: new Date().toISOString() };
  if (!S.started) S.started = new Date().toISOString();
  S.plat = PLAT;
  save();

  // ---------- older builds (answers from a previous version of this page) ----------
  var CARRY = ['q1', 'q2', 'q4', 'q5', 'econ', 'chances', 'rights', 'note', 'cuts'];
  function coded(st) {
    var n = 0;
    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {
      var a = st.ans[ik];
      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }
    });
    return n;
  }
  // Older slots for this mode, richest first: a build that was merely opened must not
  // shadow one that was actually coded in.
  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('annotation-' + D.mode + '-') !== 0 || k === KEY) continue;
        var n = 0;
        try { n = coded(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        if (n) out.push({ key: k, n: n, build: k.slice(('annotation-' + D.mode + '-').length) });
      }
    } catch (e) {}
    out.sort(function (x, y) { return y.n - x.n || (x.build < y.build ? 1 : -1); });
    return out;
  }
  function importOlder(k) {
    var old;
    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) { return 0; }
    if (!old || !old.ans) return 0;
    var n = 0;
    Object.keys(old.ans).forEach(function (ik) {
      var from = old.ans[ik], to = S.ans[ik] || (S.ans[ik] = {}), took = false;
      CARRY.forEach(function (f) {
        if (from[f] !== undefined && to[f] === undefined) { to[f] = from[f]; took = true; }
      });
      if (took) n++;
    });
    if (!S.coder && old.coder) S.coder = old.coder;
    save();
    return n;
  }

  // ---------- helpers ----------
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'cls') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function items(t) {
    if (t.type === 'crowd') return t.items.map(function (x) { return { kind: x.kind || crowdKind(), d: x }; });
    if (t.type === 't1') {
      return t.articles.map(function (a) { return { kind: 'article', d: a }; })
        .concat(t.splits.map(function (p) { return { kind: 'split', d: p }; }));
    }
    return t.items.map(function (q) { return { kind: 'qs', d: q }; });
  }
  function lang(t) { if (CROWD) return D.lang || 'en'; return /-DE$/.test(t.id) ? 'de' : 'en'; }
  function key(t, it) { return t.id + '|' + it.d.id; }
  function A(t, it) { var k = key(t, it); if (!S.ans[k]) S.ans[k] = {}; return S.ans[k]; }
  function peek(t, it) { return S.ans[key(t, it)] || {}; }
  function toks(s) { return s.text.split(/\s+/).filter(Boolean); }

  // a split line is resolved when it carries a cut or was marked as one quasi-sentence
  function lineState(a, si) {
    var c = (a.cuts || {})[si] || [];
    if (c.length) return 'split';
    if ((a.nosplit || {})[si]) return 'one_qs';
    return 'unresolved';
  }
  function done(t, it) {
    var a = peek(t, it);
    if (it.kind === 'article') return it.d.press ? !!a.q2 : (a.q1 === 'no' || (a.q1 === 'yes' && !!a.q2));
    if (it.kind === 'split') {
      for (var si = 0; si < it.d.sentences.length; si++) if (lineState(a, si) === 'unresolved') return false;
      return true;
    }
    return a.q4 === 'no' || (a.q4 === 'yes' && !!a.q5 && !!(a.econ || a.chances || a.rights));
  }
  function progress(t) {
    var its = items(t), n = 0;
    its.forEach(function (it) { if (done(t, it)) n++; });
    return [n, its.length];
  }
  function allDone() {
    for (var i = 0; i < D.tasks.length; i++) { var p = progress(D.tasks[i]); if (p[0] < p[1]) return false; }
    return true;
  }

  function banner() {
    if (STORAGE_OK && !FRAMED && !SAVE_FAILED) return null;
    var why = (!STORAGE_OK || SAVE_FAILED)
      ? 'This browser is NOT saving your answers. '
      : 'This page is open inside another website, so the download may be blocked. ';
    return el('div', { cls: 'alarm' }, [
      el('strong', { text: 'Stop \u2014 do not code in this window. ' }),
      el('span', { text: why +
        'Close it, download the file to your computer, and open it from there (double-click it). ' +
        'The page needs no internet. Opening it from inside Dropbox, Drive or an e-mail preview ' +
        'does not work.' })]);
  }
  function setHead(title, i, n) {
    document.getElementById('htitle').textContent = title;
    document.getElementById('hprog').textContent = i == null ? '' : 'Item ' + (i + 1) + ' of ' + n;
    document.getElementById('hbar').style.width = i == null ? '0' : (100 * (i + 1) / n) + '%';
  }


  // ================= crowd mode: training -> entry test -> production (+ hidden screeners) =================
  var CROWD = D.mode === 'crowd';
  function crowdKind() { return D.task === 'T1_scope' ? 'article' : D.task === 'T1_split' ? 'split' : 'qs'; }
  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);
    h = ((h & 0xffff) * 16777619 + ((((h >>> 16) * 16777619) & 0xffff) << 16)) >>> 0; } return h >>> 0; }
  function chooseBatch() {
    var n = (D.batches || []).length || 1, q = parseInt(Q.batch, 10);
    if (q >= 1 && q <= n) return q;
    if (PLAT.pid) return 1 + (hash32(PLAT.pid) % n);
    return 1;
  }
  // one screener after every `every` production items, never two in a row, never as the last item
  function interleave(prod, scr, every) {
    var out = [], si = 0;
    for (var i = 0; i < prod.length; i++) {
      out.push(prod[i]);
      if (scr.length && every > 0 && (i + 1) % every === 0 && i < prod.length - 1) { out.push(scr[si % scr.length]); si++; }
    }
    return out;
  }
  var BATCH = null;
  if (CROWD) {
    BATCH = chooseBatch();
    D.tasks = [
      { id: 'training', phase: 'training', type: 'crowd', title: 'Practice', items: D.training || [], q2: D.q2 },
      { id: 'entry', phase: 'entry', type: 'crowd', title: 'Qualification', items: (D.entry && D.entry.items) || [], q2: D.q2 },
      { id: 'production', phase: 'production', type: 'crowd', title: 'Coding',
        items: interleave((D.batches || [[]])[BATCH - 1] || [], D.screeners || [], D.screener_every || 15), q2: D.q2 }
    ];
    if (!S.t) S.t = {};
    S.batch = BATCH; save();

    function toggle(j) {
      var now = Date.now();
      if (j === lastJ && now - last < 400) return;   // only a repeat on the SAME gap is a double-click
      last = now; lastJ = j;
      var c = (a.cuts[si] || []).slice(), k = c.indexOf(j);
      if (k >= 0) c.splice(k, 1); else c.push(j);
      c.sort(function (x, y) { return x - y; });
      a.cuts[si] = c;
      if (c.length) delete a.nosplit[si];            // a split answers the line
      draw(); onchange();
    }
    function one() {
      if (a.nosplit[si]) delete a.nosplit[si];
      else { a.nosplit[si] = true; a.cuts[si] = []; }
      draw(); onchange();
    }
    function draw() {
      var cuts = a.cuts[si] || [], seg = 0, st = lineState(a, si);
      box.innerHTML = '';
      box.className = 'sent' + (st === 'unresolved' ? ' todo' : '');
      function shade() { return seg === 0 ? '' : (seg % 2 ? ' seg1' : ' seg2'); }
      tk.forEach(function (w, j) {
        if (j > 0) {
          var on = cuts.indexOf(j) >= 0;
          if (on) seg++;
          box.appendChild(el('span', { cls: 'gap' + (on ? ' cut' : shade()), title: on ? 'Remove this split' : 'Split here',
            onclick: function () { toggle(j); } }));
        }
        box.appendChild(el('span', { cls: 'w' + shade(), text: w }));
      });
      // offered only while the line carries no split, so marking it can never discard one
      if (!cuts.length) {
        box.appendChild(el('button', { cls: 'nos' + (st === 'one_qs' ? ' on' : ''), type: 'button',
          text: (st === 'one_qs' ? '\u2611' : '\u2610') + ' one quasi-sentence', onclick: one }));
      } else {
        box.appendChild(el('span', { cls: 'cnt', text: (cuts.length + 1) + ' quasi-sentences' }));
      }
    }
    draw();
    return box;
  }

  // ---------- finish ----------
  function pilotFeedback(t) {
    setHead(t.title, null);
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var box = el('textarea', { cls: 'note', placeholder: 'Optional: anything unclear in the instructions or the examples? Anything that did not work on your screen?' });
    box.style.minHeight = '120px';
    app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'One last question (pilot)' }),
      el('p', { text: 'This is a pilot run. Your comments help us fix the instructions before the main study. You can leave the box empty.' }), box]));
    app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: 'Send and get my code', onclick: function () {
      S.feedback = box.value || ''; S.feedback_done = true; save(); finish(t); } })]));
  }
  function finish(t) {
    if (CROWD && t.phase === 'training') { S.t.training_end = new Date().toISOString(); save(); return PREVIEW ? previewEnd() : startPhase('entry'); }
    if (CROWD && t.phase === 'entry') return entryFinish();
    if (CROWD && t.phase === 'production' && !S.t.production_end) { S.t.production_end = new Date().toISOString(); save(); }
    if (CROWD && D.pilot && t.phase === 'production' && !S.feedback_done) return pilotFeedback(t);
    setHead(t.title, null);
    app.innerHTML = '';
    if (GOLD) {
      app.appendChild(el('div', { cls: 'card' }, [
        el('h2', { text: 'Task finished' }),
        el('p', { text: 'Thanks. Click Download answers and put the file in the shared Dropbox folder.' })]));
      app.appendChild(el('div', { cls: 'nav' }, [
        el('button', { text: 'Back to tasks', onclick: menu }),
        el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
        el('button', { cls: 'primary', text: 'Download answers (CSV)', onclick: download })]));
      return;
    }
    var card = el('div', { cls: 'card' }, [el('h2', { text: 'Task finished' })]);
    app.appendChild(card);
    var nav = el('div', { cls: 'nav' }, [CROWD ? el('span') : el('button', { text: 'Back to tasks', onclick: menu })]);
    app.appendChild(nav);

    function completion() {
      var code = CFG.completion_code || '';
      card.appendChild(el('p', { text: 'Your completion code is:' }));
      card.appendChild(el('p', null, [el('span', { cls: 'code', text: code })]));
      var url = '';
      if (PLAT.name === 'prolific') {
        url = CFG.prolific_return_url || ('https://app.prolific.com/submissions/complete?cc=' + encodeURIComponent(code));
      } else if (PLAT.name === 'cloudresearch') {
        url = CFG.cloudresearch_return_url || '';
      }
      if (url) {
        card.appendChild(el('p', { text: 'Click the button to register your submission. ' +
          'If the page does not return, copy the code above into the platform.' }));
        nav.appendChild(el('a', { cls: 'btn primary', href: url, text: 'Return to ' +
          (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') }));
      } else {
        card.appendChild(el('p', { text: 'Copy this code into the platform to register your submission.' }));
      }
      nav.appendChild(el('button', { text: 'Download a copy (CSV)', onclick: download }));
      nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
