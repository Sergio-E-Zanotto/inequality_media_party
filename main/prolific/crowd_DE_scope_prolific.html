<script id="data" type="application/json">{"built": "20261026173025", "mode": "crowd", "task": "T1_scope", "language": "German", "lang": "de", "title": "Political articles: national or international?", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "DE_S01", "press": false, "title": "", "paras": ["Im Grundsatz ist sich der Weltsicherheitsrat einig: Man will einen Aufruf von UN- Generalsekretär Guterres zur weltweiten Waffenruhe unterstützen. An den Details allerdings entzünden sich schwere Konflikte VON CHRISTIAN ZASCHKE New York – Die Sprache der Diplomatie ist eine Sprache der Details, der vermeintlichen Kleinig- und Winzigkeiten. Wenn es um gemeinsame Kommuniqués oder Resolutionen geht, kann es vorkommen, dass die Diplomaten um einzelne Wörter ringen, und zwar stundenlang. Oder, wie aktuell im Sicherheitsrat der Vereinten Nationen, wochenlang. Vermutlich trägt außerhalb der Lyrik nirgends sonst ein einzelnes Wort so eine Bedeutung wie in der Diplomatie.", "Aktuell geht es darum, dass der UN-Sicherheitsrat eine Resolution zur Corona-Krise verabschieden will. Im Grundsatz sind sich die fünf ständigen Mitglieder und die zehn nicht-ständigen Mitglieder einig darüber, dass sie einen Aufruf des UN-Generalsekretärs António Guterres unterstützen wollen. Dieser hat eine weltweite Waffenruhe gefordert, um den Kampf gegen die Pandemie zu erleichtern. Auf den ersten Blick stellt sich die Frage: Wo sollte das Problem sein? Niemand kann ernsthaft etwas gegen einen solchen Aufruf haben.", "Guterres hat diesen Aufruf allerdings bereits am 23. März gemacht, und seither wird am Sitz der UN in New York um Worte und Wörter gerungen. Frankreich und Tunesien hatten die Initiative übernommen und an einem Text für die Resolution gearbeitet. Die Zusammenarbeit mit den anderen Staaten lief zunächst gedeihlich, viele Vorschläge der übrigen Mitglieder wurden eingearbeitet. Zum Beispiel sollte der Aufruf zur Waffenruhe zunächst für 30 Tage gelten.", "Auf Drängen Deutschlands wurde die Frist auf 90 Tage ausgeweitet. Allmählich schälte sich ein Problem heraus. Ein ehemaliger hochrangiger Mitarbeiter der US- Delegation im Sicherheitsrat sagte der SZ: „Aus unserer Sicht war das Problem ganz klar China.“ Das sehen die Chinesen wenig überraschend anders. Konkret ging es darum, ob – und wenn ja, wie – die Weltgesundheitsorganisation (WHO) im Resolutionstext erwähnt wird. China wollte die WHO verankert wissen, die USA waren strikt dagegen.", "Die amerikanische Regierung wirft der WHO Versagen in der Corona-Krise vor und zudem übergroße China-Freundlichkeit. Die Amerikaner sind der Ansicht, dass die WHO mitschuldig daran sei, dass China die Verbreitung des Virus lange habe kleinreden können. Präsident Donald Trump hat daher Anfang April die US-Zahlungen an die WHO aussetzen lassen. Die amerikanische Befürchtung war, dass die Aufnahme der WHO in den Resolutionstext die chinesische Darstellung unterstütze, Peking habe in Sachen Virus angemessen reagiert. „Sie wollten das Gesicht wahren“, sagt der ehemalige Mitarbeiter, „und genau das wollten wir nicht.“ Nach langen Verhandlungen tauchte die WHO schließlich im Text nicht namentlich auf, dafür aber der Hinweis auf „spezialisierte Gesundheitsagenturen“ der UN.", "Alle wussten, dass damit nur die WHO gemeint sein konnte. Zunächst schienen sich die Amerikaner auf diese Formulierung einzulassen, dann aber ließen sie die Resolution vor einer Woche platzen. Besonders die deutsche Delegation unter Führung des UN-Botschafters Christoph Heusgen wollte sich damit nicht abfinden. Heusgen ist bekannt dafür, dass er im Rat ungewöhnlich deutliche Worte findet. Im vergangenen Jahr hat er zum Beispiel die amerikanische Nahostpolitik offen kritisiert.", "„Wir glauben nicht an die Macht des Stärkeren. Für uns ist Völkerrecht kein À-la-carte-Menü\", sagte er damals, was für diplomatische Verhältnisse fast einer Rüge gleichkommt. Nun machte er sich gemeinsam mit der Delegation Estlands daran, einen neuen Text zu gestalten. Dieser neue Text ist wesentlich schlanker, er klammert das Konfliktthema WHO komplett aus und konzentriert sich rein auf das Thema Waffenstillstand. Besonders in Krisenregionen wie Libyen, Syrien, Jemen, der Demokratischen Republik Kongo sowie dem Südsudan sollen die Waffen ruhen.", "Nicht betroffen von dem Aufruf wären militärische Operationen gegen Terrormilizen wie den Islamischen Staat oder al-Qaida. Heusgen sagte im Rat, die Unterstützung des Aufrufs von Guterres müsse „Vorrang vor allen anderen Prioritäten“ haben. Seit Dienstag kursiert der Entwurf unter den Mitgliedsstaaten. Zugleich unternahmen jedoch Frankreich und Tunesien den Versuch, ihren Entwurf zu retten, was die Debatten nicht unbedingt vereinfacht. Die entscheidende Frage wird sein, ob sich China auf den verschlankten Entwurf einlässt.", "Die USA hatten ursprünglich gewollt, dass in dem Text auch Transparenz im Umgang mit dem Ausbruch der Pandemie verlangt wird. Das richtete sich gegen China. Die Amerikaner wären nun wohl bereit, auf diesen Punkt zu verzichten – allerdings nur, wenn China einwilligt, der Resolution ohne auch nur den leisesten Hinweis auf die WHO zuzustimmen. Ob der deutsch-estnische Vorstoß den Durchbruch bringt, ist ungewiss. Einerseits sollte der Entwurf zustimmungsfähig sein.", "Andererseits geht es eben nicht nur um Inhalte. Diese seit nun schon acht Wochen dauernde Debatte im Sicherheitsrat ist längst auch Ausdruck des sich verschärfenden Machtkampfs zwischen China und den USA geworden. Den Aufruf des UN-Generalsekretärs zu einer weltweiten Waffenruhe zu unterstützen, muss Vorrang vor allen anderen Prioritäten haben.“ UN-Botschafter Heusgen Wo sollte das Problem sein? UN-Generalsekretär António Guterres will eine Welt ohne Krieg, wenigstens während Corona wütet."], "gold": {"q2": "international", "q1": "yes"}, "note": "both experts agree on scope (the only international article in the gold)"}, {"id": "DE_X02", "press": false, "title": "", "paras": ["Prinzessin Diana hält die fünf Jahre alte und völlig aufgelöste Clementine Hambro, ihre jüngste Brautjungfer, auf dem Arm und tröstet sie. Es ist eine private Momentaufnahme bei der Hochzeit von Charles und Diana, die bislang nur der engste Familienkreis kannte, aufgenommen von Lord Patrick Lichfield (1939 bis 2005). Dem Großcousin der Königin, den sie zugleich als ihren Hoffotografen schätzte, war es als einzigem Gast der Trauung am 29. Juli 1981 erlaubt, Fotos zu machen. Mehr als 30 Jahre lang waren die Aufnahmen unter Verschluss, doch Mitte September wird die Sammlung von 14 Schwarzweiß- und Farbaufnahmen nun von einem Auktionshaus in Boston versteigert.", "Die Bilder sind allesamt nach der Vermählung entstanden, kurz bevor die offiziellen Hochzeitsfotos im Thronsaal aufgenommen wurden. Mindestgebot pro Bild: 300 Dollar. Auf mehreren Aufnahmen ist die kleine Clementine Hambro zu sehen, eine Urenkelin von Sir Winston Churchill. Der Grund für ihre Tränen: Kurz zuvor war sie auf der Galerie gestürzt und hatte sich den Kopf gestoßen. Für das Kind war der kleine Fauxpas eine große Katastrophe.", "Lange hatten die Brautjungfern sich auf diesen Tag akribisch vorbereitet - und dann stolperte Clementine in einem entscheidenden Moment über die eigenen Füße. Die Königin hingegen war von dem Malheur auch amüsiert. Zu Clementines Mutter soll sie gesagt haben: \"Clemmie ist in der Bildergalerie hingefallen, aber kein Grund zur Sorge - dort waren genügend Staatschefs, um ihr wieder auf die Füße zu helfen.\" (judo.)"], "gold": {"q1": "no"}, "note": "both experts: not political (coded 20-21 Oct 2026); non-political entry-test item (Q1 must be right)"}, {"id": "DE_S11", "press": true, "title": "", "paras": ["Zu den Eckpunkten zur Entgeltgleichheit erklären Beate Müller-Gemmeke, Sprecherin für Arbeitnehmer Innenrechte, und Ulle Schauws, Sprecherin für Frauenpolitik: Nach langem Hin und Her gibt es nun tatsächlich Eckpunkte für ein Gesetz zur Entgeltgleichheit zwischen Männern und Frauen. Wir haben schon nicht mehr damit gerechnet. Aber die Freude ist gedämpft, denn schon jetzt zeichnet sich ab, dass die geplanten Regelungen nicht ausreichen. Das Gesetz soll nur für Betriebe ab 200 Beschäftigten gelten. Damit bleibt das Gesetz für die meisten Frauen wirkungslos, denn viele von Ihnen arbeiten gerade in kleinen Betrieben.", "Außerdem sollen auch tarifgebundene Betriebe ausgenommen werden. Ein diskriminierungsfreier Tarifvertrag garantiert aber noch lange nicht, dass die Betriebe den Tarifvertrag bei der Eingruppierung auch entsprechend anwenden. Der verhandelte Kompromiss ist unzureichend, denn Entgeltgleichheit muss für alle Frauen gelten. Was bei dem Gesetzentwurf völlig fehlt, sind flankierende Maßnahmen. So müssen sich Frauen weiterhin alleine über den individuellen Klageweg gegen unfaire Bezahlung wehren.", "Es wird sich aber wenig ändern, wenn Frauen mit den Risiken einer Klage auch zukünftig alleine bleiben. Deswegen fordern wir ein Verbandsklagerecht, beispielsweise für Gewerkschaften und Verbände. Trotz all dieser Mängel formiert sich gleich wieder Widerstand in den Unionsfraktionen mit der Begründung, für die unterschiedliche Entlohnung von Frauen und Männern sei beispielsweise die unterschiedliche Berufswahl verantwortlich. Diese Begründung ist unsinnig. Natürlich verdient eine Bauingenieurin mehr als eine Altenpflegerin, aber – und hier liegt das Problem – sie verdient dennoch weniger als ihr männlicher Kollege.", "Das sollten die Unionsfraktionen endlich zur Kenntnis nehmen."], "gold": {"q2": "national"}, "note": "fully agreed; entry test from 23 Oct (replaces DE_S03); press release, so Q1 is skipped and only the scope counts"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "DE_T1_01", "press": false, "title": "Prozess gegen Glaeseker und Schmidt beginnt", "paras": ["vL. HANNOVER, 8. Dezember. An diesem Montag beginnt vor dem Landgericht Hannover ein weiterer Korruptionsprozess, bei dem es um das Umfeld des früheren Bundespräsidenten und niedersächsischen Ministerpräsidenten Wulff geht. Dabei wird dessen früherer Sprecher und engster Berater in Hannover und später in Berlin, Olaf Glaeseker, wegen Bestechlichkeit angeklagt, sein Freund Manfred Schmidt wegen Bestechung.", "Mit dem Prozess gegen Wulff wegen Vorteilsannahme, der möglicherweise in zehn Tagen verkürzt oder vorzeitig beendet wird, ist der Prozess gegen Glaeseker und Schmidt nicht nur wegen der handelnden Personen eng verbunden. Aussagen in dem Glaeseker-Prozess könnten dem Ansehen Wulffs stärker schaden als jene im bereits laufenden Verfahren gegen ihn. Der Sachverhalt, um den es dort geht - drei sogenannte Nord-Süd-Dialoge der beiden Bundesländer Niedersachsen und Baden-Württemberg, die der Eventmanager Schmidt mit einigem finanziellen Gewinn organisierte -, ist nicht Gegenstand des Wulff-Verfahrens. Die Staatsanwaltschaft, in beiden Prozessen sind es dieselben Kläger, hatte die Vorgänge dazu untersucht, in der Frage der Nord-Süd-Dialoge aber nur Anklage gegen Glaeseker und Schmidt, nicht gegen Wulff erhoben. Vorgeworfen wird dem früheren Staatssekretär Glaeseker, er habe in den Jahren 2007 bis 2009 Sponsoren aus der Wirtschaft für die Netzwerk-Treffen in Hannover und Stuttgart gesucht und sich dafür vom Veranstalter Schmidt mehrfach nach Spanien und nach Portugal einladen lassen.", "Glaeseker - er wurde ebenso wie im Wulff-Prozess der mitangeklagte Filmproduzent David Groenewold niemals von den Staatsanwälten zu den Vorwürfen vernommen - hält dem entgegen, zwischen Schmidt und ihm gebe es eine alte und tiefe Freundschaft, bei denen es beiderseitige und ausgeglichene Einladungen gegeben habe. Zudem sei die Sponsorensuche nicht eine - als Teil des Straftatbestandes vorausgesetzte - \"dienstliche Handlung\" gewesen, sondern eine Privathandlung im Landesinteresse. Die Vorsitzende Richterin hat zwanzig Verhandlungstermine bis zunächst April angesetzt. Im Prozess sind mehrere bekannte Zeugen vorgeladen, darunter die Fernsehmoderatorin Sabine Christiansen. Wulff soll im Februar als Zeuge befragt werden.", "Das niedersächsische Kabinett entband Wulff am vergangenen Dienstag von seiner Schweigepflicht und erteilte ihm eine Aussagegenehmigung im Glaeseker-Prozess. Bei polizeilichen Vernehmungen soll Wulff sich von Glaeseker distanziert und behauptet haben, er habe von vielen Vorgängen und Urlauben nichts gewusst. Dem widersprachen andere Beteiligte: Er habe von den Urlauben Glaesekers gewusst und mit ihm in dieser Zeit auch Kontakt gehabt. Wulff hatte Glaeseker im Dezember 2011, wenige Wochen vor seinem Rücktritt vom Amt des Bundespräsidenten, ohne Begründung entlassen, ihn aber zuvor vielfach als seinen siamesischen Zwilling bezeichnet, ohne den nichts gehe. Im Rahmen der langjährigen Zweckfreundschaft hatte Glaeseker als \"Spindoctor\" das Bild Wulffs gewandelt von einem farblosen Oppositionsführer im Niedersächsischen Landtag zu einem \"Liebling aller Schwiegermütter\" und die Trennung Wulffs von seiner ersten Ehefrau durch Zusammenarbeit mit der \"Bild\"-Zeitung publizistisch wohlwollend begleiten lassen.", "Die Freundschaft zwischen Wulff und Glaeseker ist inzwischen, wie es heißt, zerbrochen. (Kommentar Seite 10.)"]}, {"id": "DE_T1_02", "press": false, "title": "Wieder deutlich mehr Kirchentagsbesucher", "paras": ["Nach Angaben der Veranstalter haben sich in Dresden 117 957 Dauerteilnehmer für den Evangelischen Kirchentag angemeldet. Das ist ein deutlicher Zuwachs im Vergleich mit dem Evangelischen Kirchentag in Bremen vor zwei Jahren, als die - für die Veranstalter wichtige - Schwelle von 100 000 Teilnehmern erreicht wurde. 1997 in Leipzig, beim ersten Evangelischen Kirchentag in Ostdeutschland nach der friedlichen Revolution, war die Zahl der Teilnehmer noch hinter den Erwartungen der Veranstalter zurückgeblieben. Das wurde vor allem auf das mäßige Interesse an Religion in den neuen Ländern zurückgeführt, während der Besucherstrom aus dem Westen damals recht konstant blieb. Befürchtungen, dies könnte sich dieses Jahr in Dresden wiederholen, haben sich nicht bestätigt: Unter den Dauerteilnehmern sind allein 26930 aus der lutherischen Landeskirche Sachsens - ein für eine Minderheitskirche erstaunlich hoher Mobilisierungsgrad. 89 Prozent der Kirchentagsbesucher sind evangelisch, acht Prozent katholisch. Mit 60 Prozent sind auch in Dresden wieder die Frauen in der klaren Mehrheit. 38 Prozent der Teilnehmer sind jünger als 30 Jahre.", "Wie gewohnt stellen Einzelteilnehmer, Gruppenteilnehmer und Mitwirkende jeweils etwa ein Drittel der Teilnehmer. Aus den Gemeinden sind allein 527 Bläserchöre mit 6151 Bläsern angereist. Zur Finanzierung des Kirchentagshaushalts von 14,8 Millionen Euro tragen laut Veranstalterangaben Teilnehmerbeiträge und Sponsoren sechs Millionen Euro, der Freistaat Sachsen 5,5 Millionen Euro, die Stadt Dresden zwei Millionen Euro, die Landeskirche eine Million Euro und der Bund 400000 Euro bei. (bin.)"]}, {"id": "DE_T1_03", "press": false, "title": "Hofft auf Obama", "paras": ["Die Hohepriesterin der spanischen Sozialistischen Partei hat für das neue Jahr ein \"historisches Ereignis\" von geradezu \"planetarischer\" Bedeutung vorausgesagt. Leire Pajín, Organisationssekretärin der PSOE, sah bei einem Blick in ihre politische Kristallkugel ein kosmisches Zusammentreffen \"zweier fortschrittlicher Führungskräfte auf beiden Seiten des Atlantiks\": Drüben die fortdauernd wohltuende Präsidentschaft Barack Obamas und hüben die Übernahme der rotierenden EU-Ratspräsidentschaft durch Spanien und dessen Ministerpräsidenten José Luis Rodríguez Zapatero. Der spanische Außenminister Moratinos hielt es dann zum Stichtag am 1. Januar eine Nummer kleiner, indem er versicherte, sein Chef und er würden ihre Aufgaben an der Spitze der Union \"mit Demut und Bescheidenheit\" verrichten. Zum Beweis beteuerte auch Zapatero, dass Madrid nicht daran denke, dem neuen EU-Führungsduo Herman van Rompuy und Catherine Ashton das Rampenlicht streitig zu machen.", "Im Gegenteil: Die Spanier wollen nach dem Inkrafttreten des Lissabonner Vertrags sogleich einen protokollarischen Präzedenzfall schaffen und den ständigen Präsidenten aus Belgien auch ständig präsidieren lassen. Wie sich doch die Zeiten geändert haben, seit der stets auf die Innenpolitik konzentrierte damalige Oppositionsführer sitzen blieb, als auf einer Madrider Militärparade die amerikanische Fahne an ihm vorbeizog. Es folgten nach seinem Wahlsieg 2004 (er hatte 2000 den Vorsitz der Sozialistischen Partei errungen) fünf Jahre der absichtsvollen Nichtzurkenntnisnahme im Weißen Haus, weil der Hausherr George W. Bush dem spanischen Regierungschef den abrupten Abzug der spanischen Soldaten aus dem Irak nicht verzieh. Erst mit Obama kam die erste Einladung.", "Nun hofft der Spanier, der als Gastgeschenk gerade eine Erhöhung des Truppenkontingents in Afghanistan ankündigte, so sehr zu Obamas Liebling zu werden, wie sein Vorgänger Aznar dies bei Bush gewesen war. Der unvermittelte internationale Ehrgeiz des 1960 in Valladolid geborenen Zapatero in seiner zweiten Amtsperiode fällt mit einer schweren Wirtschaftskrise daheim und dem entsprechendem Niedergang seiner Popularität zusammen. Sein Motto für die sechs Monate des EU-Postens, nämlich \"mehr Europa\", ist daher auch eine Flucht nach vorn. Die Themen Abbau der Arbeitslosigkeit (sie beträgt 20 Prozent), Wachstum (noch negativ) und Staatsdefizit (10 Prozent) will er in einen europäischen Rahmen einbetten. Das Gleiche soll für die Nachbereitung von Kopenhagen (Klimawandel), Sicherheitsfragen (Terrorismus, Immigration, Piraterie) gelten.", "Schließlich steht noch ein ganzer Strauß profilierungsfähiger EU-Gipfeltreffen auf der Tagesordnung: mit Obama, Russland, Japan, Marokko, der Mittelmeerunion, Lateinamerika, dem Maghreb. Und sogar auf einem heimischen Feld will der diskrete Büroraucher für alle EU-Gäste sichtbar Führungskraft vorführen: bei der Verschärfung des löchrigen Rauchverbots in Spanien. LEO WIELAND"]}, {"id": "DE_T1_04", "press": false, "title": "Risiko Pilot", "paras": ["Es ist verständlich, dass die Lufthansa den Absturz in Frankreich im ersten Schreck als Folge eines extremen Einzelfalls dargestellt hat, der nichts über die Flugtauglichkeit und Gesundheit ihres übrigen Personals aussagt. Dass der Kopilot den Dienst antrat, obwohl er krankgeschrieben war, ist ein Hinweis darauf, dass da in der Tat jemand am Werke war, der - aus welchen Gründen auch immer - seinen Arbeitgeber und die ihm anvertrauten Menschen in einem Maße hintergangen hat, das in einem verantwortungsvollen Beruf eine seltene Ausnahme sein sollte. Trotzdem ist der Vorfall so schwerwiegend, dass grundsätzlich darüber nachzudenken ist, wie der Flugverkehr vor dem Risiko Pilot besser geschützt werden kann. Wenn 149 Kunden und Mitarbeiter ums Leben kommen, muss das betroffene Unternehmen, aber auch der Gesetzgeber jedes Verfahren überprüfen und in Frage stellen. Dass die deutschen Fluggesellschaften nun vereinbart haben, dass künftig kein Pilot mehr allein im Cockpit bleiben darf, ist ein erster Schritt in die richtige Richtung.", "In einem Szenario, wie es sich vermutlich auf dem Germanwings-Flug abgespielt hat, könnte eine Flugbegleiterin immerhin noch die Tür für den ausgeschlossenen Piloten öffnen oder vielleicht durch ihre bloße Anwesenheit das Schlimmste verhindern. Der andere Schluss, den die bisher bekannten Umstände nahelegen, lautet, dass die Fluglinien sich besser um die mentale Stabilität ihres Personals kümmern müssen. Wenn ein Pilot über längere Zeiträume psychische Probleme hat, dann sollte ein Facharzt durchaus in der Lage sein, das zu erkennen. Auf Hinweise der Arbeitskollegen kann man da nicht vertrauen, denn dafür sind sie nicht geschult. Gegen solche Maßnahmen wird oft eingewandt, dass es keine hundertprozentige Sicherheit geben könne.", "Auch der Vorstandsvorsitzende der Lufthansa hat so argumentiert. Das ist richtig, trifft aber nicht den Kern der Sache. Eine Fluggesellschaft unterlässt ja auch nicht das Warten ihrer Turbinen, weil stets die Gefahr des Vogelschlags besteht. In der Flugsicherheit geht es darum, erkannte Risiken so weit wie möglich zu verringern. Auf dieser langen Liste steht nun auch der Selbst- und Massenmörder im Cockpit.", "Jede Vorkehrung, die nur einen von seiner Tat abhält, rettet viele Menschenleben."]}, {"id": "DE_T1_05", "press": false, "title": "Bild, Kurz, Lexikon", "paras": ["Vertrauen ist gut, Kontrolle ist besser – die Weisheit wird häufig Lenin zugeschrieben. Der Satz findet sich in keiner Quelle, aber er entspricht wohl den Überzeugungen Lenins. Vertraue, aber prüfe nach, soll er oft gesagt haben. Wer als Politiker zu sehr auf Vertrauen setzen muss, hat keine Kontrolle mehr – das zeigt das Beispiel Angela Merkels, deren Kandidat Kauder in der Unionsfraktion durchfiel. Verschiedentlich wird ihr empfohlen, im Bundestag nun die Vertrauensfrage zu stellen.", "Die Frage ist in parlamentarischen Demokratien ein dem Regierungschef vorbehaltenes Mittel, um seine Koalition auf Linie zu zwingen und so Handlungsfähigkeit zu demonstrieren. Nach Artikel 68 des Grundgesetzes kann der Bundespräsident, verfehlt der Kanzler die Mehrheit, auf dessen Vorschlag binnen 21 Tagen den Bundestag auflösen; dieses Recht erlischt, sobald das Parlament einen anderen Kanzler wählt. Die Kanzler Brandt, Kohl und Schröder nutzten 1972, 1982 und 2005 die Vertrauensfrage, um auf verfassungsrechtlich fragwürdige Weise durch bewusst herbeigeführte Niederlagen Neuwahlen zu erzwingen. Das lohnte sich für Brandt und Kohl, für Schröder nicht. Merkel will die Vertrauensfrage nicht stellen; sie scheint nicht überzeugt zu sein, die Kontrolle zu haben.", "Neuwahlen will sie auch nicht."]}, {"id": "DE_T1_06", "press": false, "title": "Wenn das Schule macht", "paras": ["An der Tafel steht in Schreibschrift: „I love communism – ich liebe den Kommunismus.“ Gleichzeitig wird im Off die akute Bedrohung erläutert, der österreichische Schüler Tag für Tag ausgesetzt sind: „Viele Lehrer scheuen nicht davor zurück, ihr meist linkes Gedankengut in die Köpfe der Schüler zu verpflanzen.“ Diese Warnung, verbunden mit dem Hinweis, dass Parteiwerbung an Schulen verboten sei und auch „schulfremde Experten“ Parteien nicht „in den Schmutz ziehen“ dürften, finden sich auf der neuen Webseite www.parteifreie-schule.at. Indoktrination, Manipulation und Kommunistenliebe – alles das kann neuerdings per Formular samt Beweismaterial hochgeladen und gemeldet werden. Ein Schelm, wer Böses denkt, wenn er liest, wohin Schüler oder Lehrer Agitprop-Vorfälle in Zukunft melden sollen: direkt an die FPÖ. Die ist nun zwar eindeutig eine Partei; sie will die Fälle, die ihr bekannt werden, aber von unabhängiger Seite prüfen lassen. Den konkreten Anlass, der die Aktion „parteifreie Schule“ ausgelöst hat, den hat die FPÖ in Oberösterreich indes gleich selbst geliefert.", "Der Direktor eines Linzer Gymnasiums hatte unlängst einen Vortrag über Extremismus abbrechen lassen, nachdem der Elternvertreter und FPÖ-Parlamentsabgeordnete Roman Haider im Direktorat angerufen und, dem Vernehmen nach unterlegt mit Drohungen gegen den zuständigen Lehrer, eine Intervention des Rektors erzwungen hatte. Er war zuvor von seinem Sohn aus dem Unterricht heraus alarmiert und mit Handyfotos versorgt worden. Haiders Vorwurf: In dem Vortrag werde die FPÖ mit Rechtsextremismus in Verbindung gebracht. Der Redner, ein Welser Grünen-Politiker, sei „Pseudo-Experte und Linksextremist“. Mit der SZ wollte Haider nicht sprechen, er schickte aber Material: parlamentarische Anfragen zu politischen Aktivitäten in Schulen und zu der Frage, wie viel Schüler für Vorträge zahlen müssten.", "Thomas Rammerstorfer, im Hauptberuf in der Altenpflege tätig und seit Jahren als Autor und Vortragender in Sachen Extremismus unterwegs, kann Auskunft geben: Er bekam 170 Euro. Die Folien zu seinem Vortrag kann man nachlesen. Die FPÖ kommt einmal vor – im Zusammenhang mit ihrer intensiven Verquickung mit schlagenden, oft rechtsextremen Verbindungen. Als er auf Druck der FPÖ gestoppt wurde, diskutierte die Klasse gerade über Scientology. Rammerstorfer, der auch in KPÖ-Broschüren publiziert, wird seither in Linz persönlich bedroht.", "Als Angestellter des FPÖ-dominierten Magistrats in Wels ist er nun auch beruflichem Druck ausgesetzt. Noch beweist er Humor: Derzeit gebe er „zehn Prozent Rabatt auf abgebrochene Vorträge“. Eine Untersuchung habe keine Verfehlung des Redners oder des Lehrers ergeben, sagt Landesschulratspräsident Fritz Enzenhofer. Er habe Haider, dem erregten Vater und Politiker, angeboten, selbst vor der Klasse zu reden, aber der habe abgelehnt. Enzenhofer hält das Ganze für eine „Inszenierung“, um Druck auf Schulbehörden auszuüben.", "Natürlich müsse eine Schule abwägen, wo Staatsbürgerkunde aufhöre und Parteipolitik anfange. Solange aber Sozialkunde in Österreich immer noch Teil des Geschichtsunterrichts sei, gebe es eher zu wenig politische Bildung an den Schulen."]}, {"id": "DE_T1_07", "press": false, "title": "Bild, Prozessbericht, Überblick", "paras": ["Europa und der Datenschutz Eigentlich war es schon lange klar: US- Geheimdienste greifen auf Massen von Internetdaten zu, deshalb können Daten in den USA nicht sicher sein. Nun hat dies auch der Europäische Gerichtshof festgestellt. Das Urteil trifft Facebook und andere Unternehmen, die vom Wissen über ihre Kunden profitieren. Werden sie den Datenschutz jetzt ernst nehmen? Ende einer Legende Die Vereinbarung zwischen EU und Amerika zum Datenschutz war von Anfang an mangelhaft.", "Nun müssen Europas Behörden entscheiden, wie streng sie das Urteil umsetzen Natürlich mussten ein paar Superlative her, um die historische Dimension des Luxemburger Facebook-Urteils begreifbar zu machen. Es sei ein „starkes Signal“, ein „Paukenschlag“, ein „Meilenstein für den Datenschutz“, war nach der Verkündung des Urteils zu lesen. Aber anders als im sonst üblichen Wettbewerb um die lauteste Vokabel war nichts davon übertrieben. Man muss sich das einmal vor Augen halten: Der globale Datenfluss bildet das Adernsystem der digitalen Wirtschaft, der Schutz persönlicher Informationen gilt da eher als Sand im ökonomischen Getriebe und noch dazu als Sicherheitsrisiko, falls man den nimmermüden Sammlern in den US-Geheimdiensten glauben mag. Die Zeichen deuten also eher auf Erosion – und just in dieser Situation spricht der Europäische Gerichtshof (EuGH) ein Machtwort.", "Es lautet: Der europäische Datenschutz ist ein starkes Grundrecht, das sogar über den Atlantik hinausreicht. Der Datenfluss gen USA ist an EU-Standards gebunden, das Grundrecht bleibt nicht irgendwo im Glasfaserkabel hängen. Das Verfahren hat das Zeug zu einer echten Heldengeschichte. Dem findigen Wiener Jurastudenten Max Schrems gelingt es, von Facebook eine endlose Liste seiner dort gespeicherten Daten zu erhalten. Und weil Facebook, wie man durch Edward Snowdens Enthüllungen gelernt hat, ein Selbstbedienungsladen für den datenhungrigen US- Geheimdienst NSA ist, klagt er sich bis zum EuGH durch.", "Und zwar – Glück für ihn – in einer Phase, in der sich der EuGH als europäisches Grundrechtegericht zu positionieren beginnt; das Gericht hat die Vorratsdatenrichtlinie gekippt und Google („Recht auf Vergessenwerden“) in die Schranken gewiesen. Dass der EuGH vor einer personellen Zäsur steht – Präsident Vassilios Skouris räumt an diesem Mittwoch nach zwölf Jahren seinen Schreibtisch –, mag die Bereitschaft für ein geschichtsträchtiges Urteil begünstigt haben. Jedenfalls, so ist zu hören, standen die Richter mit großer Mehrheit hinter dem Spruch; nur einer von fünfzehn soll dagegen gestimmt haben. Die Grundaussage des Urteils ist klar. Der Gerichtshof hat das sogenannte Safe-Harbor- Abkommen zum „angemessenen Schutzniveau“ in den USA für ungültig erklärt.", "Das war im Grunde wenig verwunderlich, denn Safe Harbor war, rechtsstaatlich gesehen, schon immer ein merkwürdiges Konstrukt. Damit wurde unterstellt, europäische Daten landeten bei ihrem Transfer in die USA in einem „sicheren Hafen“ – allerdings ohne hinreichende Kontrolle durch US-Behörden und auf der Grundlage einer „Selbstzertifizierung“ der beitretenden Unternehmen, die sich damit gleichsam selbst den datenschutzrechtlichen Persilschein ausstellten. Die Pointe des Urteils: Laut EuGH ergibt sich nicht einmal aus der Safe-Harbor-Erklärung selbst, welche die EU-Kommission im Jahr 2000 abgegeben hat, dass die Daten in den USA hinreichend geschützt seien – die Geschichte vom sicheren Hafen war schon immer eine Legende. Die Erklärung enthalte „keine hinreichenden Feststellungen“ zu den Maßnahmen, mit denen die USA ein „angemessenes Schutzniveau“ gewährleisten wollten. Ganz im Gegenteil, die Kommission selbst habe erklärt, dass nach US-Recht im Zweifel der Datenschutz hinter der nationalen Sicherheit zurückstehen müsse.", "Anders ausgedrückt: Der Datenschutz stand unter dem Vorbehalt eines Zugriffs der NSA, etwa im Zuge des Programms Prism, mit dem massenhaft Internetdaten erfasst werden. „Das ist eine späte Genugtuung für Edward Snowden“, sagt der Hamburger Datenschutzbeauftragte Johannes Caspar. Der Datenschützer, zuständig auch für Facebook Deutschland, wird sich am Donnerstag in Brüssel mit seinen europäischen Kollegen und am Freitag in Hannover mit den deutschen Datenschützern treffen, um über die Konsequenzen aus dem Urteil zu beraten. Denn mit dem Urteil kommt den Datenschützern eine Schlüsselrolle zu. Sie wollen sich auf ein gemeinsames Vorgehen verständigen, auch, weil einzelne Behörden im Konflikt mit den Konzernen womöglich überfordert sind; das Hamburger Landesamt verfügt über gerade mal 16Mitarbeiter.", "Zwei Optionen sind denkbar: entweder eine Übergangsfrist für die rund 4400 Unternehmen, die im Safe-Harbor-Abkommen aufgelistet sind, oder, der schlimmste Fall für die Wirtschaft, der sofortige Stopp des Datenflusses. Das müssen nun Europas Datenschützer entscheiden. Zwar haben sich die Unternehmensjuristen bereits auf die Suche nach Auswegen begeben. Denkbar sind etwa sogenannte Standardvertragsklauseln oder auch konzerninterne Datenschutzgarantien; auch über eine ausdrückliche Einwilligung der Nutzer zum Datentransfer in den unsicheren Hafen wird nachgedacht. Ob das angesichts der Grundsatzkritik des EuGH am US-Datenschutz reichen wird, ist allerdings fraglich: „Nach diesem Urteil wird es ganz schwer, den Datenfluss in die USA über andere Instrumente aufrechtzuerhalten“, sagt Caspar.", "Ähnlich sieht es Tobias Neufeld von der Anwaltskanzlei Allen & Overy: „Das Prism-Problem bekommen wir dadurch nicht gelöst.“ Bleiben die laufenden politischen Verhandlungen zwischen EU und USA über ein neues Schutzabkommen. Und dort liegen künftig nicht nur die Wirtschaftsinteressen auf dem Tisch, sondern auch die EU-Grundrechtecharta. Der EuGH hat hier ein paar Brandmauern eingezogen. Erstens: Das Datenschutzniveau in den USA muss jenem in der EU „gleichwertig“ sein – und nicht nur „angemessen“, wie die bisherige, eher wachsweiche Formulierung lautete. Zweitens: Wer der NSA eine Hintertür öffnet, rührt an den Kern des Datenschutzes.", "Eine Regelung, die den US-Behörden den generellen Zugriff auf den Inhalt elektronischer Kommunikation gestatte, verletze den „Wesensgehalt“ des Grundrechts auf Achtung des Privatlebens. Und drittens: Das oberste EU-Gericht behält sich eine „strikte Kontrolle“ vor. Dieser letzte Punkt dürfte zu den wichtigsten Aussagen des Urteils gehören. Der „Wertungsspielraum“ der Kommission sei „eingeschränkt“ – was nichts anderes bedeutet, als dass die Zeit für faule Kompromisse vorbei ist. Die Richter in Luxemburg wollen sich den Datenschutz nicht mehr aus den Händen nehmen lassen.", "Bisher konnten sich die Unternehmen selbst einen Persilschein ausstellen Die Richter behalten sich eine „strikte Kontrolle“ der Umsetzung vor Er hat eine Entscheidung des Europäischen Gerichtshofs erstritten: der Wiener Jurastudent Max Schrems am Dienstag in Luxemburg."]}, {"id": "DE_T1_08", "press": false, "title": "Bild, Glosse / Satire", "paras": ["(SZ) Wenn man den deutschen Außenminister mit einem Tier vergleichen wollte – was man übrigens unterlassen sollte, denn Tiervergleiche gelten als unstatthaft –, dann müsste es die Eule sein. Nicht die ganz normale Eule mit ihrem feinen Schuhu-Ruf zu Zeiten, wenn alles schläft und über deutschen Flughäfen das Nachtflugverbot hängt. Nein, die Eule der Minerva wäre als Referenzeule für den Minister angemessen. Allerdings käme für Heiko Maas einzig die Hegel’sche Eule der Minerva infrage, jene also, die erst in der Dämmerung ihren Flug beginnt, zu einem Zeitpunkt, da alle geschichtlichen Ereignisse bereits geschehen sind. Maas hat nämlich am Wochenende schon wieder einen Flug verpasst, weil eine Hilfsturbine zu wenig Druckluft zum Starten auf der Pfanne hatte.", "Deshalb musste von außen Luft reingepustet werden. Was sind das denn bitte für irre Allegorien? Rein statistisch gesehen steht Heiko Maas mit seinen bislang drei Flugverspätungen in diesem Jahr einigermaßen gut da. Ein durchschnittlicher Easyjet-Kunde, der womöglich noch in Tegel starten oder landen muss, ist naturgemäß darauf eingestellt, einen Großteil seines künftigen Lebens unten im Sicherheitsbereich oder oben in der Warteschleife verbringen zu müssen. Aber ein Minister, der mit den besten Maschinen seines Landes unterwegs ist und bei jeder Reise Gefahr läuft, verspätet einzutreffen, muss mit höhnischen Schulterklopfszenarien seiner Kollegen rechnen.", "Kollegen aus Burundi, Nepal und Österreich sind mit ihren lustigen Flugzeugen pünktlich und erholt am Zielort eingetroffen. Nur der deutsche Minister bekommt seine Zeitzonen gewissermaßen von der Flugbereitschaft mitgeliefert. Warum sind die Verspäteten, obwohl man ihrer ungeduldig harrt, nicht gern gesehen? Warum gilt das eigentlich sympathische „Fangt schon mal ohne mich an“ immer noch als Zeichen von Unzuverlässigkeit und weniger als freundliche Absage an die Wichtigtuerei? Wäre Cäsar später zur Senatssitzung gekommen, hätte Brutus ins Leere gestochen.", "Die größte Verachtung für notorisches Zuspätkommen muss die Deutsche Bahn einstecken – und es stimmt natürlich, die traurigen Momente des außerplanmäßigen Halts sind die großen strategischen Niederlagen unseres durchgetakteten Lebens. Aber was würden wir kleinen und großen Rädchendreher schimpfen und blöd aus der Baldessarini-Wäsche gucken, wenn die Bahn plötzlich zu früh käme. Wenn der Zug bereits drei Minuten vor unserer Ankunft mit der wehenden Flagge der vorauseilenden Pünktlichkeit Richtung Frankfurt Flughafen abratterte? Und womit wäre uns und unserem Land gedient, wenn Heiko Maas zu jedem Gipfeltreffen einen Tag früher einträfe als alle anderen? Wir wären isoliert.", "Lassen wir Heiko Maas Zeit; nennen wir seine Art, zu spät zu kommen, diplomatisch und deeskalierend, ja nennen wir sie freundlich „erweiterte Pünktlichkeit“."]}, {"id": "DE_T1_09", "press": true, "title": "", "paras": ["Der Rechtsausschuss des Europaparlaments hat für die umstrittene Reform des europäischen Urheberrechts gestimmt. Joana Cotar, Af D-Bundestagsabgeordnete und stellv. Obfrau im Ausschuss Digitale Agenda, nimmt dazu wie folgt Stellung: „Netz DG und DSGVO sind anscheinend nicht genug, nun sollen auch noch Uploadfilter folgen. Es ist mir völlig unverständlich, wie der Rechtsausschuss des Europaparlaments einer so weitreichenden, freiheitsfeindlichen und undurchdachten Richtlinie zustimmen konnte. Ebenfalls unverständlich ist die Tatsache, dass sich die Gro Ko im Koalitionsvertrag ausdrücklich gegen Uploadfilter ausgesprochen hat, Verhandlungsführer Axel Voss von CDU sich aber auf europäischer Ebene vehement für solche Filter einsetzt.", "Hier werden die deutschen Wähler an der Nase herumgeführt. Die geplanten Uploadfilter bedeuten das Aus für das Internet wie wir es kennen. Algorithmen sind gänzlich ungeeignet, um Urheberrechtsverletzung sinnvoll zu erkennen, Overblocking ist vorprogrammiert. Wie beim Netz DG sind die warnenden Stimmen der Fachleute und Internetpioniere laut, doch die Mehrheit der Abgeordneten ignorierte diese Bedenken, sie stimmte für eine Regelung, die der Zensur Tür und Tor öffnet und für ein Leistungsschutzrecht, das in Deutschland bereits krachend gescheitert ist. Die Einführung auf EU-Ebene entbehrt schlicht jeglicher Logik.", "Die Af D lehnt diesen weiteren Angriff auf die Meinungsfreiheit strikt ab und fordert die Bundesregierung dazu auf, alles dafür zu tun, dass dieses Vorhaben der EU keine Realität wird. Setzen Sie sich wenigstens einmal lautstark FÜR die Freiheit ein, liebe Kollegen der Union und der SPD!“"]}, {"id": "DE_T1_10", "press": true, "title": "", "paras": ["„Die deutsche Entwicklungspolitik hat in Afghanistan ihre Hausaufgaben gemacht. Fortschritte beim Aufbau des Landes sind sichtbar und kommen bei der Bevölkerung an. Dadurch spüren die Menschen, dass es sich für sie lohnt, die afghanische Regierung zu unterstützen und mit der internationalen Staatengemeinschaft zusammenzuarbeiten: Den Verlockungen der Extremisten und Terroristen wird damit der Boden entzogen. Die christlichliberale Koalition ist bereit, sich mit deutscher Entwicklungszusammenarbeit langfristig in Afghanistan zu engagieren. Dies erfordert aber, dass sich auch die Regierung von Afghanistan, angefangen beim Präsidenten, stärker dem langfristigen Gemeinwohl verschreibt und die Korruption und den Drogenanbau bekämpft.", "Tut sie dies nicht oder nur halbherzig, ist der Einsatz deutscher Steuermittel in Afghanistan nicht zu rechtfertigen. Trotz erreichter Erfolge bleiben viele Aufgaben bestehen. Angesichts des geringen Ausgangsniveaus der Entwicklung ist es eine langfristige Aufgabe der afghanischen Regierung und der internationalen Entwicklungszusammenarbeit, in der Breite nachhaltig gute Lebensbedingungen zu erreichen. Deutschland wird daher auch nach der Beendigung der internationalen militärischen Präsenz über die Entwicklungszusammenarbeit in Afghanistan präsent bleiben, sofern die Sicherheitslage dies zulässt.“ Hintergrund: In afghanischen Städten haben eine Million Menschen dank deutscher Hilfe eine bessere Trinkwasserversorgung. 800.000 Menschen haben eine bessere Stromversorgung. Tausende von Haushalten erhalten durch den Aufbau einer Mikrofinanzbank Kredite.", "Tausende Schüler können zusätzlich in Grundschulen gehen. Mehr als 2.000 Auszubildende erhalten eine berufliche Bildung (Quelle: Bundesministerium für wirtschaftliche Zusammenarbeit und Entwicklung)."]}, {"id": "DE_T1_11", "press": true, "title": "", "paras": ["Zur Unterzeichnung des Kooperationsvertrags zwischen dem Goethe-Institut und den großen technischen Universitäten in Deutschland erklären die Sprecherin für Auswärtige Kultur- und Bildungspolitik der SPD-Bundestagsfraktion Ulla Schmidt und die zuständige Berichterstatterin Ulla Burchardt: Die SPD-Bundestagsfraktion begrüßt, dass in Zukunft das Goethe-Institut im Rahmen der Partnerschulinitiative (PASCH) mit den TU9, der Allianz der führenden technischen Universitäten in Deutschland kooperieren wird. Das Goethe-Institut betreut im Rahmen der PASCH-Initiative weltweit Schulen, an denen die Deutsche Sprache vermittelt wird. Durch diese Kooperation wird das Goethe-Institut dazu beitragen, Schülerinnen und Schüler in vielen Ländern auf ein Studium in den so genannten MINT-Fächern in Deutschland vorzubereiten (MINT = Mathematik, Informatik, Naturwissenschaft, Technik). Viele Absolventinnen und Absolventen werden in Deutschland bleiben und mit ihrer hochwertigen Qualifikation einen wichtigen Beitrag auf dem Deutschen Arbeitsmarkt leisten. Absolventinnen und Absolventen, die in ihre Herkunftsländer zurückkehren, sind wichtige Mittler im kulturellen Dialog und können in ärmeren Ländern zur Entwicklung beitragen.", "Die SPD-Bundestagsfraktion fordert, die Partnerschulinitiative weiter auszubauen, auch mit dem Ziel, noch mehr jungen Menschen aus anderen Ländern ein Studium in Deutschland zu ermöglichen – unter anderem in den MINT-Fächern. Dazu fordern wir, Mittel aus dem Sonderprogramm „Bildung und Forschung“ zusätzlich zu investieren. Diese Mittel werden dem Auswärtigen Amt in Höhe von 92 Millionen Euro zur Verfügung gestellt. Sie dürfen nicht zum Stopfen von Haushaltslöchern verwendet werden."]}, {"id": "DE_T1_12", "press": true, "title": "", "paras": ["Zur Bekanntgabe der Details zum Ankaufprogramm der EZB für ABS erklärt Dr. Gerhard Schick, Sprecher für Finanzpolitik: Der von der EZB angekündigte Aufkauf von ABS-Papieren wird keines der Probleme in Europa lösen. Im Gegenteil, erneut könnten Risiken aus dem Bankensektor von der Öffentlichkeit übernommen werden. An der derzeitigen Investitionsschwäche, an den Arbeitslosenquoten in Europa bis zu 25 Prozent und an der anhaltenden Deflationsgefahr wird das ABS-Programm der EZB nichts ändern. Denn es sind nicht Finanzierungsengpässe, die die Unternehmen bei Investitionsentscheidungen zögern lassen, sondern die schwache gesamtwirtschaftliche Nachfrage.", "Nur ein europäisches Investitionsprogramm kann hier Abhilfe schaffen. Der Ankauf von ABS-Papieren ist hingegen aus zweierlei Gründen höchst problematisch: Erstens drohen neue Risiken für die Steuerzahler. Die EZB wird am Markt für die ABS-Papiere allenfalls etwas bewegen können, wenn sie auch Papiere aufkauft, die sonst am Markt keine Abnehmer finden. Sie übernimmt auf diese Weise zwangsläufig Risiken aus den Bankbilanzen, die am Ende entweder bei der EZB verbleiben oder von den Mitgliedstaaten übernommen werden. De facto wird so versucht, Banken zu stabilisieren.", "Bankenrettung ist aber nicht Aufgabe der EZB, schon gar nicht zum Nulltarif. Auch hier sind die Regierungen und die Bankenaufsichten gefordert, die dafür sorgen müssen, dass die Banken ihre Bilanzen in Ordnung bringen und zwar nicht auf Kosten der Allgemeinheit, sondern unter Beteiligung der Eigentümer und gegebenenfalls auch der Gläubiger. Zweitens verfestigt sich das Bild einer Zentralbank, die immer dann einspringt, wenn die Politik nicht handeln will. Der Teufelskreis schwache Nachfrage, schwache Investitionen und hohe Arbeitslosigkeit kann nur von den Regierungen durchbrochen werden. Die Politik muss sich dieser Aufgabe endlich stellen und nicht darauf warten, dass die Zentralbank mit Maßnahmen der Geldpolitik realwirtschaftliche Probleme zu lösen versucht.", "Dies kann nicht gelingen."]}, {"id": "DE_T1_13", "press": true, "title": "", "paras": [". Der Bundesrat hat heute das Gesetz zur Neuregelung der Bestandsdatenauskunft gebilligt. Dazu erklärt die stellvertretende Vorsitzende und innenpolitische Sprecherin der FDP-Bundestagsfraktion Gisela PILTZ: Der Bundesrat hat heute dem Gesetz zur Neuregelung der Bestandsdatenauskunft zugestimmt und so den Weg für ein deutliches Plus an rechtsstaatlichen Hürden bei den Befugnissen der Sicherheitsbehörden frei gemacht. Das vom Bundesverfassungsgericht für verfassungswidrig erklärte Gesetz, das von Rot-Grün eingeführt worden war, wurde durch die Neuregelung mit rechtsstaatlichen Hürden wie Benachrichtigungspflichten und Richtervorbehalt versehen. Die Abfragebefugnis richtet sich nur auf Bestandsdaten, nicht auf Verkehrsdaten und erst recht nicht auf Inhaltsdaten von Telekommunikation.", "Es geht etwa um Daten wie den Inhaber einer Telefonnummer oder auch einer IP-Adresse zu einem bestimmten Zeitpunkt. Eine Speicherverpflichtung der Provider ist mit dem Gesetz nicht verbunden. Das Gesetz regelt zudem nur die Abfrage in konkreten Einzelfällen, keine Massenabfragen. Ein Zugriff der Sicherheitsbehörden auf Daten zum Surfverhalten oder gar auf E-Mail-Inhalte ist mit dem Gesetz nicht verbunden. Anders als zu rotgrünen Zeiten sind nun die Befugnisse der Sicherheitsbehörden mit strikten rechtsstaatlichen Vorgaben versehen.", "Anders als nach der bisherigen Rechtslage dürfen nur noch die im Gesetz explizit genannten Behörden überhaupt auf die Daten zugreifen. Zudem dürfen Zugangssicherungsdaten wie PINs oder PUKs, die bisher nach dem verfassungswidrigen rotgrünen Gesetz ohne besondere Sicherungsmechanismen abgefragt werden durften, nur noch mit Richtervorbehalt abgefragt werden. Zudem müssen die Betroffenen der Abfrage von dynamischen IP-Adressen anders als bisher benachrichtigt werden. Wie schon im bisher geltenden, von Rot-Grün eingeführten Recht ist die Abfrage zu Zwecken der Verfolgung von Straftaten und Ordnungswidrigkeiten sowie zur Gefahrenabwehr möglich. Eine Ausweitung der Befugnisse liegt darin nicht.", "Das Bundesverfassungsgericht hatte diese Zwecke ausdrücklich als verfassungsgemäß anerkannt. Selbstverständlich dürfen die Daten aber nicht willkürlich abgefragt werden, sondern nur dort, wo die Kenntnis eines bestimmten Bestandsdatums es erforderlich ist, um einen Verstoß gegen die Rechtsordnung zu verfolgen. 358-Piltz-Grundrechtsschutz.pdf"]}, {"id": "DE_T1_14", "press": true, "title": "", "paras": ["„Obamas Atom-Gipfel geht am eigentlichen Problem vorbei. Atomwaffen bleiben generell gefährlich, nicht nur, wenn sie in falsche Hände fallen“, kommentiert der stellvertretende Vorsitzende der Fraktion DIE LINKE, Jan van Aken, den Beginn des zweitägigen Atomgipfels in Washington zur Nichtverbreitung und Sicherung von militärischem und zivilem Nuklearmaterial. Van Aken weiter: „Die Atomtechnologie ist immer eine Gefahr, egal wo sie eingesetzt und von wem sie kontrolliert wird. Mit jedem AKW und mit jedem Jahr Laufzeit wächst die Gefahr, dass nukleares Material für Bomben oder Atomwaffen verwendet wird. Die Bedrohung ist real, aber die Antworten in Washington auf diese Bedrohung sind die falschen.", "Auch mit noch so viel Kontrollen und Drohungen wird sich das nukleares Spaltmaterial auf dieser Welt nicht von Militärs und Terroristen fernhalten lassen.Wirkliche Sicherheit bietet nur ein weltweiter Atomausstieg. Dazu gehört eine umfassende atomare Abrüstung in Ost und West, ein sofortiger Stopp aller Atomexporte, ein schneller Atomausstieg in Deutschland und zum Beispiel auch ein Aussetzen des Atomdeals zwischen Indien und den USA. Obama ist unglaubwürdig, wenn er einerseits vor den atomaren Gefahren warnt, andererseits aber Indien indirekt bei der atomaren Aufrüstung unterstützt.Nichtweiterverbreitung und Abrüstung von Atomwaffen sind wichtige Ziele. Auf der Konferenz zum Atomwaffensperrvertrag im Mai in New York kann Obama zeigen, wie wichtig sie ihm sind.“"]}, {"id": "DE_T1_15", "press": true, "title": "", "paras": ["Wie der parlamentarische Staatssekretär im Innenministerium, Stephan Mayer (CSU), bekannt gab, soll es eine Erschwerniszulage für Bundespolizisten geben, die Abschiebeflüge begleiten. Der Af D-Bundestagsabgeordnete und Mitglied des Innenausschusses, Lars Herrmann, zeigt sich darüber erfreut: „Da ich als Bundespolizist selbst lange Zeit mit der Abschiebung vor allem nordafrikanischer Flüchtlinge befasst war, kenne ich die tatsächliche Situation sehr gut und hatte diesen Vorschlag bereits vor über einem Jahr gemacht. Damals hatte ich im Innenausschuss gegenüber Innenminister Seehofer genau das gefordert, was das Innenministerium nun umsetzt. Seehofer schloss seinerzeit eine solche Zulage noch aus. Lapidar meinte er, dass man nicht für alles eine Zulage zahlen könne.", "Der dienstliche Alltag von den sogenannten ‚Personenbegleitern Luft‘ ist jedoch alles andere als leicht. Neben Widerstandshandlungen – vor allem bei Schüblingen aus afrikanischen Ländern – müssen die Beamten nicht nur körperlich fit sein, sondern auch seelische Stabilität vorweisen. Umso erfreulicher ist es, dass die Bundesregierung nun eine Forderung der Af D übernimmt. Ich hoffe, dass das entsprechende Gesetz zur Modernisierung der Beamtenbesoldung bald vorgelegt wird. Als Af D ist es uns egal, wer ‚sein‘ Gesetz durchbekommt.", "Wichtig ist, dass sich in der Sache etwas zum Positiven verändert. Ich freue mich, mit meinem Vorschlag etwas für meine Kollegen bewegt zu haben. Af D wirkt!“"]}, {"id": "DE_T1_16", "press": true, "title": "", "paras": ["„Auch im 66. Jahr nach Verabschiedung der Allgemeinen Erklärung der Menschenrechte ist der Weg zu ihrer weltweiten Umsetzung noch weit. Vor allem durch die aktuellen Krisen im Nahen Osten und in der Ostukraine haben die Menschenrechtsverletzungen ein Ausmaß angenommen, das wir längst überwunden geglaubt hatten.So kosteten der Bürgerkrieg in Syrien und der Krieg gegen das Terrornetzwerk des sogenannten Islamischen Staates allein im zurückliegenden Monat mehr als 5.000 Menschenleben. Der syrischen Beobachtungsstelle für Menschenrechte zufolge waren mehr als 4.000 Tote in Syrien zu beklagen. Im Irak verloren allein im Monat November 1.000 Menschen ihr Leben.Auch die Meldungen aus der Ostukraine über den Tod Tausender erschrecken uns zutiefst.", "Immer mehr Menschen fliehen aus der Region. Nach Angaben des UNHCR wurden rund 430.000 innerhalb des Landes vertrieben.Nach der völkerrechtswidrigen Annexion der Krim spüren die Minderheiten dort einen wachsenden Druck aus Moskau. Vor allem die Krimtataren fürchten, erneut zum Verlassen der Heimat gezwungen zu sein. Diese Angst sitzt tief und ist offenbar wohl begründet: So wurde die Ankündigung der Minderheit, am Tag der Menschenrechte gegen die Einschränkung ihrer Rechte auf die Straße gehen zu wollen, mit einer Warnung der russischen Behörden vor illegalen Demonstrationen unterbunden. Wir fordern Russland mit Nachdruck dazu auf, auf der annektieren Halbinsel Krim die Rechte der Minderheiten zu wahren.Der Internationale Tag der Menschenrechte erinnert vor allem an die Bedeutung der Freiheit.", "Die westlichen Demokratien müssen den weltweiten Herausforderungen entschlossen und auf der Basis gemeinsamer Werte einheitlich entgegentreten. Die Wahrung der europäischen Nachkriegsordnung, der Kampf gegen die Expansion des Terrornetzwerks IS, die Linderung der Not der Flüchtlinge in Syrien, im Irak, aber auch in der Ukraine sind das Gebot der Stunde. Nur so können wir den Menschenrechten weltweit Geltung verschaffen.“"]}]], "screeners": [{"id": "DE_S09", "press": true, "title": "", "paras": ["Ein Interview der badenwürttembergischen Wirtschaftsministerin Nicole Hoffmeister-Kraut in der „Wirtschafts Woche“ und ihre Kritik an den Automobilunternehmen belegt exemplarisch, dass die kurzsichtige und ideologische Verkehrs- und Wirtschaftspolitik der Regierung massiv Arbeitsplätze gefährdet. Dirk Spaniel, verkehrspolitischer Sprecher der Af D-Fraktion erklärt dazu: „Die CDU-Politikerin, die selbst aus einer Unternehmerfamilie stammt, befürchtet, dass 50 Prozent aller Arbeitsplätze im produzierenden Bereich gefährdet sind, wenn 2030 jedes zweite verkaufte Auto ein reines E-Auto sein sollte, wie von der Regierung gewünscht. Die Lage kleiner und mittlerer Zulieferer und damit ganzer Regionen sei zum Teil noch ernster als die der global aufgestellten Autohersteller, gibt sie zu Protokoll. Dieselbe Befürchtung äußert die Af D-Fraktion seit sie im Bundestag ist. Ihre Forderung, Hersteller sollten mehr bezahlbare Pkw-Modelle anbieten, ist naiv.", "Die Zellproduktion ist teuer und bislang wird der Löwenanteil aus Asien bezogen. Hier hat es die Politik versäumt, frühzeitig neue Angebote zu machen. Dennoch widerspricht es marktwirtschaftlichen Prinzipien, eine Technologie vorrangig durch Subventionen aus dem Säckel des Steuerzahlers zu fördern. Das Elektroauto ist keine Erfolgsgeschichte. Weltweit gibt es rund eine Milliarde Autos.", "Davon sind sechs Millionen elektrifiziert. Das sind 0,6 Prozent. Weltweit gesehen, ist der Anteil also verschwindend gering, ähnlich wie in Deutschland mit 100 000 Elektroautos auf 47 Millionen Bestandsfahrzeuge. Derzeit wächst die E-Mobilität jährlich um 40 Prozent. Bei den minimalen Prozentzahlen, sind die Zuwächse indes ein Tropfen auf dem heißen Stein.", "In China, wo die meisten Kohlekraftwerke weltweit in Betrieb sind und weiter wachsen, ist dazu der Strommix noch miserabler als in Deutschland (60 Prozent fossile Energie). Die einseitige Propagierung der Elektromobilität wird unserer Schlüsselindustrie nicht helfen. Sinnvoller ist eine Infrastruktur für synthetische Kraftstoffe, um den Verbrennungsmotor CO2-neutral zu betreiben, wie es die Af D-Fraktion im November 2018 (Antrag 19/6007) vorgestellt hatte. Es ist bedauerlich, dass sich alle Fraktionen gegen diesen vernünftigen Beitrag stemmen.“"], "gold": {"q2": "national"}, "note": "both experts: national; attention check only (cannot catch a national default)"}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political articles: national or international? — German</h1>\n<p class=\"lead\">You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Political article:</b> an article about politics: government, parties, politicians, elections, laws, economic policy, strikes; foreign politics counts. Not political: politics not mentioned or only in passing (sport, culture, celebrity and human-interest stories, accidents, crime), or a politician as a private person.</p><p class=\"gnum\"><b>1.2 National scope:</b> the main political issue sits in the German national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the national government, parliament or parties respond to it.</p><p class=\"gnum\"><b>1.3 International scope:</b> the article is mainly about another country&#x27;s politics, or about international affairs with no domestic focus.</p>\n<h2>2. Task description</h2><p>You read one article at a time. For a newspaper article answer Q1 (is it about politics?) and, if yes, Q2 (mainly national or international?). Party press releases are political by definition, so for them only Q2 is asked. Judge the whole article, not a single sentence.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q1 when politics is a main theme of the article, not merely mentioned.</p><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A politician appearing as a private person or as a celebrity does not make an article political. Human-interest stories without a political actor, institution or policy are NO.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = NO</div><p class=\"ttl\">Hund Flecki ist wieder bei seinen Besitzern</p><div class=\"text\" lang=\"de\"><p>STUTTGART, 2. August. Zwölf Tage streunte der kroatische Mischlingshund Flecki durch die Felder und Wiesen am Südrand der Schwäbischen Alb: Am Freitagabend entdeckte eine Frau aus Blaubeuren dann den scheuen Hund bei sich im Garten. Um 19.30 Uhr ging bei der Sanitäterin der &quot;UNA-Tierrettung&quot; sowie bei den Hundehaltern Lisa Metzler und Sven Hossalla die erlösende Meldung ein. Seit Mittwoch hatte ein Team der …</p></div><p class=\"how\">Not political: a lost dog and its owners; no political actor, institution or policy is the topic — although the article appeared in a newspaper&#x27;s politics pages. [Pending: enters the training only if both expert codings say “not political”.]</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Coding the article above as political because a politician or a newspaper politics page is involved.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Decide Q2 by the main topic: domestic institutions, parties and laws → NATIONAL; another country&#x27;s politics or international affairs → INTERNATIONAL. A foreign event discussed through the national reaction to it is NATIONAL.</p><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> One sentence about another country does not make a national article international, and vice versa — the article as a whole decides.</p></div>"}</script>

  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);

  function chooseBatch() {

        nav.appendChild(el('a', { cls: 'btn primary', href: url, text: 'Return to ' +
          (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') }));
      } else {
        card.appendChild(el('p', { text: 'Copy this code into the platform to register your submission.' }));
      }
      nav.appendChild(el('button', { text: 'Download a copy (CSV)', onclick: download }));
      nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
