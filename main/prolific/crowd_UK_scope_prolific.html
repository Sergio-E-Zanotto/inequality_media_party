<script id="data" type="application/json">{"built": "20261102123642", "mode": "crowd", "task": "T1_scope", "language": "UK", "lang": "en", "title": "Political articles: national or international?", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "UKC_015", "press": false, "title": "", "paras": ["The electoral watchdog is investigating up to 1,000 complaints about people illegally voting twice at the general election on 8 June. The Electoral Commission said there were “troubling” reports of double-voting, with 38 MPs raising concerns about the activity in their constituencies. It is legal for students to be registered in university accommodation and in their home town, but they must vote only once. The commission’s report said: “Although people may lawfully be registered to vote in more than one place in certain circumstances, it is troubling that some voters appear to have admitted voting more than once at the general election, which is an offence.” It is working with police on how best to investigate the allegations and called for the government to consider ways of cutting the risk of abuse of voting rules. The report also documented the rise in registrations of young voters, with nearly 2 million applying after Theresa May called the snap election.", "About 500,000 more people were registered for the 8 June poll than for the 2015 general election, taking the electorate to a record 46.8 million. A surge in young voters is credited with helping fuel support for Jeremy Corbyn. About 70% of those trying to register to vote in the runup to the election were under 34 but most of these applicants were already on the register. The Electoral Commission called for ministers to look at introducing a system to allow voters to check if they are already registered and to consider whether to adopt automatic registration schemes similar to the one used in Australia. Sir John Holmes, chair of the Electoral Commission, said: “The size of the registered electorate for the general election demonstrates the UK’s strong tradition of democratic engagement, and reflects the hard work of all concerned.", "“However, if we are to keep pace with modern habits and practice in a digital world, the electoral registration system must continue to evolve, and consider innovative solutions such as direct or automatic enrolment processes. “These have the potential to deliver significant improvements to the accuracy and completeness of electoral registers as well as efficiencies for local authorities and the public purse.” Labour MP Cat Smith, shadow minister for voter engagement and youth affairs, urged the government to be cautious when introducing any measures that could hinder voting. “We welcome the Electoral Commission’s report, which shows that 46.8 million people were registered to vote at the 2017 UK general election – making it the largest electorate for a UK-wide poll,” she said. “To build a healthy democracy we need active participation of all citizens, which is why the Labour party delivered a ground-breaking digital campaign which sought to maximise the number of young people registering to vote during the election period. “Double voting is a serious crime and it is vital that the police have the resources they need to bring about prosecution.", "“However, we urge caution when looking at measures to tackle this issue – a blanket ban on being registered at two addresses would exclude those who for reasons of work or study need to be registered in two places.”"], "gold": {"q2": "national", "q1": "yes"}, "note": "Q1 pilot 2 entry item (chosen 2 Nov 2026, SZ + assistant): Electoral Commission investigates double voting — domestic institutions"}, {"id": "UKC_025", "press": false, "title": "", "paras": ["The US military has grounded the entire fleet of Lockheed Martin Corp F-35 fighter jets – the same model the Australian government has committed to buying for $12.4bn – because of engine concerns. The inspections were triggered after one plane caught fire at a Florida airbase last Tuesday. Witnesses reported the engine tore through the top of the plane, CBC News reports. The rest of the fleet would be grounded until inspections of the single-engine made by Pratt and Whitney had been carried out in all the aircraft, Reuters said. The US Defence Department had been preparing to send the jet to Britain to fly by a naming ceremony for Britain's new aircraft carrier.", "Whether that will go ahead is now in doubt. The purchase of the planes by the Australian government in April was one of the biggest spends in Australia’s defence history. At the time, the defence minister, David Johnston, said there was flexibility in the purchase for the government to defer payments if they were “unhappy customers”. A spokesman told Guardian Australia Johnston had immediately been made aware of the engine fire and the planes’ grounding. “The ‘engine concerns’ will not affect the purchase of 58 aircraft,” the spokesman said.", "“While the F135 engine has successfully completed nearly 32,000 hours of testing, availability has remained steady at about 98%. Single-engine fighters are operated by many air forces and defence remains confident the F-35 Joint Strike Fighter will be reliable and safe.” Johnston had full confidence in the joint strike fighter program, he said. The purchase of the jets was controversial because the cost and reliability of the single-engine plane has been repeatedly questioned. The One Dead Pilot report from the Canadian Centre for Policy Alternatives said the single-engine plane was risky because if the engine failed there was no back-up."], "gold": {"q2": "international", "q1": "yes"}, "note": "Q1 pilot 2 entry item: US military grounds F-35 fleet, Australia's purchase — foreign politics"}, {"id": "UKN_008", "press": false, "title": "", "paras": ["Captain America now battles a mysterious new foe called the Winter Soldier, but the watchable action pyrotechnics and a twisty new \"conspiracy thriller\" theme can't cover up the fact that Chris Evans's shield-wielder is the dullest superhero in the Marvel canon. Evans is upstaged here by every single member of the cast: Garry Shandling's portly, grimacing senator, Stan Lee's pop-eyed museum guard, a photo of Dominic Cooper glimpsed briefly on the wall ... they all exude more super-charisma and on-screen presence than poor old Evans. Captain America's co-star is leather-clad Black Widow (Scarlett Johansson), that ass-kicking ex-Soviet adventuress whose auburn hairstyle is matched by her distinctive fake tan-type maquillage and restrained ochre lipstick. Samuel L Jackson is back as the SHIELD chief Nick Fury, coiled with eponymous rage. There is an excellent small role for Robert Redford as charismatic politician Alexander Pierce, nursing a top-secret new defence project.", "Captain America is not just a handsome face and a mighty pair of guns: he has a liberal conscience and like Edward Snowden, has developed an urgent fear that the nation's real enemy is the military-industrial-surveillance complex. And so it proves, leading to sensational disclosures of intimate betrayal, but the implications pop like bubblegum and make no appreciable difference to the superheroes' relation to each other and the world. Thanks to Johansson, Jackson and Redford, this is all good fun. It's a shame the weak link is the Captain himself."], "gold": {"q1": "no"}, "note": "Q1 pilot 2 entry item: Captain America film review — not political (a fictional senator appears)"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "UK_P2_01", "press": false, "title": "William Hague calls on Russians to help punish Syrian regime", "paras": ["The foreign secretary, William Hague, is expected to press his Russian counterpart on the spiralling crisis in Syria during his one-day visit to Moscow. Although long-planned, the visit gained new urgency following the weekend massacre in Houla, when more than 90 people, including 32 children, were killed in an attack claimed to have been backed by the regime of Bashar al-Assad. \"Our urgent priority is to establish a full account of this appalling crime and to move swiftly to ensure that those responsible are identified and held to account,\" Hague said on Sunday, pledging a \"strong response\" to the massacre. \"In Moscow tomorrow [Monday]. Will call on Russia to support rapid &amp; unequivocal pressure on Assad regime and accountability for crimes,\" he said in a Twitter message late on Saturday.", "Russia has firmly backed Assad, blocking UN sanctions on his regime. Syria is Russia's main ally in the Middle East and home to its only military base outside the former Soviet Union. Russia maintains that on principle it rejects what it sees as western meddling in the domestic affairs of sovereign nations. It continues to supply weapons to Syria despite international outcry. Russia's support would be key to a new plan being proposed by the Obama administration that would involve Assad peacefully leaving power while leaving the structure of his government intact, the New York Times reported over the weekend.", "During his one-day visit to Moscow, Hague is also due to meet \"other senior interlocutors\", British sources have said, declining to provide details. \"He will engage them on a wide range of issues of concern to Britain and Russia – chief among them the situations in both Iran and Syria,\" a source said."]}, {"id": "UK_P2_02", "press": false, "title": "Echoes of UK politics in showdown between Kevin Rudd and Julia Gillard", "paras": ["Tony Blair has been out of office for so long – five years in June – that his supporters are now able to laugh off his battles with Gordon Brown. But at the time their daily, even hourly, battles felt like regular nuclear strikes, according to those involved. What seemed like a titanic struggle over the direction of public service reform and Britain's place in Europe was a minor playground skirmish compared with the battle playing out in the Australian Labor party. This will finally come to a head on Monday when Kevin Rudd, who resigned as foreign minister in an early morning press conference in Washington earlier this week, challenges the prime minister Julia Gillard. The best British comparison is with Sir John Major's \"put up or shut up\" challenge to the right wing eurosceptic \"bastards\" in his cabinet in 1995.", "Major resigned as Tory leader, though not as prime minister, to trigger a leadership contest. In the end John Redwood, who was too junior to be in Major's sights at the time of his \"bastards\" outburst in 1993, was the only minister with the guts to resign and challenge a sitting prime minister. Rudd appears to have pre-empted a move against him by resigning while abroad. Gillard moved quickly and called a leadership ballot of Labor's parliamentary caucus in Canberra on Monday. She will be hoping that the abrasive Rudd, who is loathed by many Labor colleagues, will struggle to build his support in the 103-strong caucus.", "It is thought Rudd has around 30 supporters. Pity John McTernan, one of the smartest brains during the New Labour years in Britain, who is Gillard's director of communications. McTernan, who had a ringside seat for the denouement of the Blair / Brown battle as the No 10 political secretary between 2005-2007, needs no reminding of the corrosive effect of internal party battles. Many Labor figures are weeping. The Australian economy is performing well, unemployment is falling and the opposition centre right Liberal Party is led by the pugilistic Tony Abbott who repels many mainstream voters.", "And yet Labour is tearing itself apart. The problem for Gillard, who overthrew Rudd as prime minister in 2010 in a palace coup, is that she lacks gravitas. This may be unfair because she is implementing progressive reforms in the face of strong opposition from Abbott. She is, for example, aiming to restore the Australian budget to a surplus by cutting the rebates higher tax payers receive for their health insurance contributions. Rudd has plenty of gravitas and is a towering intellectual figure in Australia.", "But he shares what might be politely described as Gordon Brown's people management skills. The Labor party hopes that Monday's contest will end the long running Rudd / Gillard soap opera. This will happen if Rudd wins because Gillard will retire to the backbenches and renounce any future claims to the premiership. But if Rudd loses – but shows he has a reasonable level of support – then the soap opera will continue as he assesses whether to mount a challenge in the future. Gillard, who was born in Barry in South Wales, may then feel she is reliving the experiences of both Major and Blair.", "A weak prime minister would limp on with a major figure waiting to pounce."]}, {"id": "UK_P2_03", "press": false, "title": "This week’s new games: reviewed", "paras": ["Pokémon Rumble World, Nintendo 3DS As in all Pokémon games, Rumble World wants you to hunt and capture its 719 sub-species of Pokémon. The major difference is that it’s free to download, your quest to catch Pokémon for the king of the Toy Kingdom coming initially at no fee. Unlike mainstream Pokémon games where you use turn-based combat to subdue and trap beasts, Rumble World relies on pressing a single button to win battles. Bafflingly, it actually takes this a stage further, automatically attacking nearby enemies, thereby shrinking your role to steering your chosen Pokémon and occasionally swapping it for another one from your collection. As well as tolerating its gross oversimplification, you’ll also need to buy balloons in order to fly to monster-hunting grounds.", "The first one’s free but subsequent balloons cost gems, which you win very gradually in the game or have to pay real money to purchase. You’ll soon discover that balloons need a substantial period of time to “recharge”, something you can also cover with expensive gems. Not so much a game, as a brazen pocket money Hoover. Nintendo, free Affordable Space Adventures, Wii U Taking to the cosmos in budget space tour operator Uexplore’s appallingly under-equipped ship, you arrive on the vast uncharted wilderness of planet Spectaculon with minimal preparation, the broken hulks of past Uexplore missions ominously scattered around the landing site. And so begins this wry-humoured 2D exploration game that has you piloting your wobbly little craft through subterranean passages where everything you encounter looms large above you, the gigantic scenery varying between organic and machine-like.", "Ancient alien artefacts you encounter will automatically blow you up if they see you, forcing you to turn down or temporarily disable the ship’s subsystems as you crawl past, alternating between a smoke-belching fuel engine and quietly humming electric motor depending on each artefact’s sensors. Puzzles get steadily more testing, encouraging greater use of your ship’s “heads-down display” on the Wii U gamepad. You can also split control among up to three players in a process that will test your relationships in the same way as teaching a relative to drive. Oh, the humanity. KnapNok Games, £16.99 The Trace: Murder Mystery Game, iOS A bit like stepping into an interactive episode of CSI, The Trace: Murder Mystery Game puts you in the polythene shoe covers of a forensic detective, piecing together evidence left behind at crime scenes.", "With a toolkit made familiar by police procedurals, you’ll use a UV light to spot fingerprints and a handy scanner to match them with the police database, creating leads that correlate with the mysteries thrown up by each investigation. Using the touch screen to search rooms and examine objects, you can turn things over and manipulate them, taking IDs out of wallets and examining dropped phones for serial numbers in a process that feels instantly intuitive. Concluding your detective work involves dragging pieces of evidence into specially marked boxes. Get it right and you’re rewarded with a dramatic reconstruction to illustrate your newly acquired knowledge, and once you’ve answered every question in a crime scene the full picture emerges, letting you wrap up the case. Relentless Software, £3.99"]}, {"id": "UK_P2_04", "press": false, "title": "Lauren Laverne on style: dressing gowns", "paras": ["I'm a style omnivore: I love clothes of all kinds and I'll learn lessons about what to wear wherever I can. I'm interested in fashion, but it's very much the herby garnish atop the aesthetic main course rather than the dish itself. This week I'm going to talk about what Cherie Blair can teach all of us about getting dressed (please keep reading). I can't say I often make aesthetic notes when I'm catching up on current affairs – apart from occasionally wishing Vladimir Putin would put his top back on – but on 12 May 1997, when Mrs Blair opened the front door to a flower delivery guy and also by accident the world's press, she illustrated how important it is to own a dressing gown. Do not mistake me for someone who would dispute Cherie's right to kick back in her Tatty Teddy sleep tee, or indeed to pose on the doorstep in it if she so desired.", "It's just that she obviously wasn't, and as such this incident illustrates the only question facing anyone who wants to dress well: how to make their clothes an appropriate buffer between themselves and their life. The contents of a person's wardrobe should make them more comfortable (in both senses of the word) and the day-to-day easier; beyond that is all the fun stuff like expressing yourself and the message you communicate to the world. In Mrs Blair's case, having woken up married to the prime minister (side note: would someone please write the romcom that follows this set-up?) suddenly necessitated something more substantial to answer the door in. When it comes to style, needs are the place to start, and fashion should follow. Obviously the rest of us are unlikely to run into a bank of paparazzi when we open the front door, but having something nice to wear when you're padding around the house is a pleasure all of its own.", "It's one of the few times when what you're wearing is all about you, and as such is a chance to say something to yourself (whether that's \"I'm cosy\" or \"still got it\" is up to you). As the mother of small children, I find that mornings (or evenings with my feet up watching Mad Men) are much more enjoyable when I'm wearing something that makes me happy. If you are minded to style up your downtime, here are a few buys to try. Good Morning Beautiful and Verry Kerry are great options for ethical shoppers. Both make stunning kimonos in natural fabrics, as opposed to the poly blends you'll find elsewhere (Verry Kerry's daywear is definitely worth a look, too).", "On the high street, head to M&amp;S Limited, Rosie for Autograph or B by Ted Baker at Debenhams. For simple, chic styling try Figleaves's own label, which is very Calvin Klein, as is Calvin Klein. Or invest in a cute jersey piece from Eberjey at Net a Porter."]}, {"id": "UK_P2_05", "press": false, "title": "Keep Our NHS Public role not undemocratic", "paras": ["There is no secrecy and nothing in Labour party rules to prevent it from seeking advice from non-party members (Labour health advisers angered by John McDonnell’s parallel group, 30 June). I am a recently retired consultant paediatrician and director of children’s services in Lewisham when Jeremy Hunt tried to close our hospital. I am a member of no party. Dr Louise Irvine, a GP and chair of the Save Lewisham Hospital Campaign, who stood against Hunt at the 2015 election, probably did more for the NHS than any other candidate by making a principled defence of a publicly funded and provided, and accountable NHS. Keep Our NHS Public is part of an effort to build a broad consensus to win back a national health service and which helped establish Health Campaigns Together.", "Following a meeting at the House of Commons in April with the then shadow health secretary, Heidi Alexander, John McDonnell and their teams, our request for an ongoing conversation was agreed by them. Full minutes, including a paper I myself authored about this planned forum, are on the HCT website. So where is the secrecy? At a time when the NHS is being deliberately underfunded and contracts worth over £10bn have gone to private companies since 2010, it is important that the Labour party leads the fightback. There is nothing undemocratic in offering an array of talent from health policy, journalism, clinicians, patient experience and law to the shadow team.", "Who is trying to undermine such a worthwhile initiative and to use it to undermine the elected leadership? Dr Tony O’Sullivan Co-chair, Keep Our NHS Public and member of HCT"]}, {"id": "UK_P2_06", "press": false, "title": "Strike threat over public sector fury", "paras": ["The largest trade union has accused the government of treating public sector workers like \"devils\" and warned of co-ordinated strike action in response to swingeing spending cuts. Len McCluskey, assistant general secretary of Unite, urged trade unionists to react against George Osborne's introduction of a two-year public sector pay freeze for 6 million workers, alongside £32bn of spending and welfare cuts. \"It's a question of giving vent to the frustration of workers, to co-ordinate properly,\" he said. \"We need to create an alliance of resistance because our members don't want pay freezes, pay cuts and a tax on their services and communities.\" In an interview with the Guardian, McCluskey said unions should not allow a repeat of the 1980s, when the government faced down disputes such as the miners' strike. \"If workers have confidence, anything is possible.", "Look at what happened with Thatcher and the poll tax. It was people power.\" There are 7.6 million trade union members, down from 13.2 million in 1979, but representing about a fifth of the working-age population. Unite has about 1.6 million members, including 250,000 employees from the public sector including hospital porters, dinner ladies, teaching assistants and cleaners. Its strongest constituency is in the private sector, where it represents a diverse group including 11,000 British Airways cabin crew and more than 3,000 fuel truck drivers. Asked if Unite was proposing UK-wide strike action, McCluskey said: \"Absolutely.", "They talk about public sector workers as if they're devils. We're talking about people who teach our children, treat the sick, clean our streets. We need to tell our private sector workers this is their fight too. \"It's an old trick of divide and rule. We have to counter that by explaining to private sector workers that cuts will affect their lives.", "If our members need to take industrial action, we have to hit the streets and say we are not prepared to accept this.\" A spokeswoman for Unison, the largest public sector trade union, said: \"It is important that all the unions are working together to oppose the cuts.\" McCluskey, 59, who is standing in Unite's general secretary election later this year, also urged trade unions to claim back the Labour party in the wake of the election defeat. \"The soul has been sucked out of it by the new Labour cuckoos in our nest.\""]}, {"id": "UK_P2_07", "press": true, "title": "", "paras": ["The European Commission is eyeing new powers over the car industry, as it is prepares a proposal to create central oversight of national vehicle authorisations. In the wake of the Volkswagen emissions scandal, industry commissioner Elzbieta Bienkowska told the Sueddeutsche Zeitung paper the European Commission wants to monitor the national authorities that approve new cars before they are allowed on the market. Responding UKIP Transport spokeswoman MEP Jill Seymour said: “The European Commission asking for control of national vehicle authorisations is like a fox asking for control of the chicken coop. The Financial Times revealed that the Commission knew what was going on for two years about VW emissions and did absolutely nothing. People in the UK who have suffered from emission caused health problems have the European Commission to blame, as it connived in the malpractice.“The European Commission is now using a crisis, which they knowingly presided over for two years, as an excuse to grab more power over national institutions.", "This sorry episode shows that the Brussels Commission is both incompetent and power-hungry at the same time.”"]}, {"id": "UK_P2_08", "press": false, "title": "The Last Children of Tokyo by Yoko Tawada review – an eco-terror mini epic", "paras": ["The high concept of Yoko Tawada’s surprising new novel, translated by Margaret Mitsutani, is that old people are living longer than ever, but children are dying before adulthood. It’s hinted that this may be due to some environmental collapse, which has isolated Japan from the rest of the world. The main thread follows four generations of a family struggling with what this means for their youngest member, Mumei. In 144 pages we get a mini-epic of eco-terror, family drama and speculative fiction. “We must save Tokyo even if it means sacrificing all the outlying prefectures!” But this is no dystopian novel like The Children of Men.", "Tawada’s interest is satirical as much as tragic, with public holidays chosen by popular vote (Labour Day becomes Being Alive Is Enough Day) and a privatised police force whose activities now centre on its brass band. It’s this askew way of looking at things amid the ostensibly grim premise, and a sprightly use of language (orphans are renamed “independent children”), that makes The Last Children of Tokyo a book unlike any other. The Last Children of Tokyo by Yoko Tawada (Granta, £9.99). To order a copy for £8.49, go to guardianbookshop.com or call 0330 333 6846. Free UK p&amp;p over £10, online orders only.", "Phone orders min. p&amp;p of £1.99."]}, {"id": "UK_P2_09", "press": false, "title": "Lack of independent Liam Fox inquiry 'puzzling', says ex-standards chief", "paras": ["David Cameron is at risk of responding to allegations surrounding Liam Fox \"on the hoof\" by failing to set up an independent inquiry to explore whether the ministerial code has been breached, the former standards chief said. Sir Alistair Graham, who was the chairman of the Committee on Standards in Public Life until 2007, said he was \"genuinely puzzled and surprised\" that the Fox inquiry had not been handed to an independent adviser on ministers' interests. An initial inquiry into the allegations, carried out by the Ministry of Defence permanent secretary, Ursula Brennan, found that the defence secretary had met Adam Werritty 40 times in 16 months both in Britain and on foreign trips and was set up by Fox himself. On Tuesday, it emerged that the cabinet secretary, Sir Gus O'Donnell, had taken overall charge of the inquiry's second stage. But speaking on BBC Radio 4's Today programme, Graham said such a process was inappropriate.", "\"The prime minister is in danger of falling into same trap as Tony Blair did where he tended to deal with allegations of breaches on the hoof involving civil servants,\" he added. \"I don't think that's appropriate. I argued very strongly with Tony Blair that you should have an independent person outside of government.\" Sir Philip Mawer, who was appointed in 2008 by Gordon Brown, is understood to still be in the role of adviser, although the circumstances of his work are unclear. He has conducted only one inquiry – a 2009 investigation into the rental arrangements of the former Labour minister Shahid Malik, who stepped down from his post only to be cleared by Mawer and reinstated in the government. Graham said it was \"unclear\" whether Mawer was still working for the government, but added: \"If he is, it would be right [that he conducted the Fox inquiry].\" He quoted from the ministerial code of conduct, which states: \"It is not the role of the cabinet secretary or other officials to enforce the code.", "\"If there is an allegation about a breach of the code and the prime minister, having consulted the cabinet secretary, feels that it warrants further investigations, he will refer the matter to the independent adviser on ministers' interests.\" He added: \"Why that hasn't happened, why we haven't got an independent investigation taking place – I'm really genuinely puzzled and surprised. \"You do need a standard process. When these allegations arise, there should be a set process, rather than Liam Fox announcing his own inquiry, then the prime minister saying: 'Well, we're going to have a bigger inquiry led by the cabinet secretary' rather than going to an independent person.\""]}, {"id": "UK_P2_10", "press": true, "title": "", "paras": ["Labour Calls For Urgent Summit on FIFA NEWS FROM LABOUR: Labour Calls For Urgent Summit on FIFA In a letter to the Prime Minister today, Chris Bryant MP, Labour’s Shadow Culture Secretary, has called for an urgent summit to bring together UK sponsors, broadcasters and FAs to establish a common position towards FIFA. This summit should consider UEFA withdrawing from FIFA. Dear Prime Minister, The recent events at FIFA have sickened and angered everyone who cares about football in this country and overseas. I hope you will agree that Britain cannot stand idly by, but should do everything possible to make sure that there is swift reform and that you will also agree that all those engaged in corrupting international sport are properly punished. I am writing to urge you as a matter of urgency to bring together all the British sponsors of FIFA and the World Cup, all the UK broadcasters and the Football Associations of the Home Nations in order to establish a common position.", "If no substantial change is forthcoming at FIFA, serious consideration should be given to the option of UEFA withdrawing from FIFA and coordinating alternative competitions. In addition the UK prosecuting authorities need to be fully engaged. The whole country was outraged with Sepp Blatter’s re-election on Friday. For too long, he has presided over an organisation that has become infamous for corruption, patronage, and bribery. FIFA is not fit for purpose.", "It needs fundamental and urgent reform, which Mr Blatter cannot deliver. It is completely inappropriate for him to be President while so many aspects of FIFA are under investigation – including his own election in 2011. I’m disappointed that after the pioneering investigative reporting of the Sunday Times and Panorama it has been left to the US and Swiss to start prosecutions. So, can you confirm whether the Financial Conduct Authority and Serious Fraud Office are investigating whether bribery took place on British soil, used British financial institutions or involved British sponsors or broadcasters? If they are investigating corruption at FIFA, do they have the resources they need to prosecute their investigations vigorously and swiftly?", "If they are not investigating, why not? We cannot just be commentators or spectators, shouting at the TV or complaining from the side lines. We must be on the pitch itself, putting pressure on Blatter and FIFA. I await your reply. Given the public interest in this issue I will be releasing this letter to the media.", "Yours sincerely, Chris Bryant Labour’s Shadow Secretary of State for Culture, Media and Sport May 31, 2015 (7:03 pm)malachi485 liked this scott1984fp reblogged this from labourpress scott1984fp liked this labourpress posted this"]}, {"id": "UK_P2_11", "press": false, "title": "Zac Goldsmith handed life peerage and keeps environment role", "paras": ["Zac Goldsmith, who lost his seat in the general election, has been given a life peerage so that he can keep his role as environment minister. The former MP for Richmond Park in Greater London was beaten by the Liberal Democrats by nearly 8,000 votes last week in one of the few high-profile Conservative losses of the election. The government confirmed on Thursday that Goldsmith would be reappointed to his old post as a minister in the department for the environment, food and rural affairs and the department for international development. “The Queen has been pleased to signify her intention of conferring a peerage of the United Kingdom for life on Zac Goldsmith,” said the announcement. A government spokesperson confirmed Goldsmith would continue to attend cabinet meetings.", "The confirmation follows widespread suggestions that the move was planned. Goldsmith, the son of the billionaire businessman James Goldsmith, is a long-time ally of Johnson and his partner Carrie Symonds. His London mayoral campaign was accused of being racist and Islamophobic for trying to suggest that Labour’s Sadiq Khan had links with terrorists and extremists. The shadow cabinet office minister, Jon Trickett, said: “It says everything you need to know about Boris Johnson’s respect for democracy that he has ignored the voters of Richmond Park and appointed Goldsmith to government.” “The public deserve better than a government appointed by ‘jobs for mates’. At a time when the Conservatives are investigating racism in their party, they’ve appointed the person who ran an overtly racist campaign against Sadiq Khan.", "Zac Goldsmith is not fit to hold any government position.” It is the second time in a week that Johnson has chosen to make a colleague a life peer in order to keep them in his cabinet. Nicky Morgan, who stood down as an MP ahead of the election, was appointed to the House of Lords so that she could stay on as culture secretary. Responding to earlier reports that Goldsmith was in line for a peerage, Darren Hughes, chief executive of the Electoral Reform Society, said: “The bloated House of Lords is already packed full of defeated and former MPs – over 200 of them. Politicians shouldn’t be rewarded with votes on our laws for life after losing their seat. “This issue we’ve seen across parties for years and makes an absolute joke of democratic accountability.", "Our second chamber should not be some absurd insurance policy for trounced MPs.” Goldsmith has been an outspoken advocate for voters having the right to recall MPs outside a general election. Putting a proposal before parliament in 2014, he said: “What is at stake now is a matter of principle. Do we trust our voters to hold us to account or not?”"]}, {"id": "UK_P2_12", "press": false, "title": "Brazilian president doles out economic advice to David Cameron", "paras": ["Brazil's president made a timely, though probably innocent, intervention during Britain's party political conference season when she hailed the importance of stimulating economic growth. President Dilma Rousseff, a former Marxist, said it was important to stimulate the economy during a downturn. Standing next to David Cameron, who is pushing an austerity programme in the UK, she delivered a speech at the presidential palace in Brasilia that could gave been written by the Labour party. She said: \"I stressed the importance of expanding efforts with a view to improving the conditions that will prove conducive to a recovery of the international economy, not only as regards developed countries but also as regards emerging countries,\" said the socialist president. \"I have told the prime minister that Brazil has done its share in efforts to improve the recovery of the world economy by means of stimuli to jobs and growth.\" The president lavished praise on Cameron for his successful visit to Brazil, saying she was impressed that he visited all three main cities – São Paulo, Rio de Janeiro and Brasilia.", "Cameron responded by supporting Brazil's campaign to have a permanent seat on the UN security council. He said: \"As Brazil takes its place on the global stage, so it's case for permanent membership of the UN security council becomes ever stronger. We support Brazilian membership. \"We won't always agree about every issue, but what's important is that we have open and honest conversations about the difficult issues and form practical partnerships to get things done together.\" Cameron ended his trip to Brazil by launching a treaty to encourage the production of more Anglo-Brazilian blockbuster films. Speaking at his press conference with Rousseff, Cameron said he wanted to see more productions of films such as the James Bond adventure Moonraker that was shot in Rio.", "Cameron, who claims to be a big Bond fan, said: \"In film [we have agreed] a new film co-production treaty which will offer incentives for our budding film makers to work together and make a new generation of blockbusters with those unforgettable moments like Bond hanging over Sugar Loaf Mountain.\" The treaty, signed by the trade minister Lord Green and the Brazilian foreign minister Antonio Patriota, was one of 10 treaties signed during his visit to Brasilia. • This article was amended on 1 October 2012 because the original said described Antonio Patriota as the Brazilian culture minister. He is the foreign minister."]}, {"id": "UK_P2_13", "press": false, "title": "Charlotte Gainsbourg – review", "paras": ["\"The songs that we sing, do they mean anything to the people we're singing them to?\" asks Charlotte Gainsbourg, closing the main part of her show with the 2006 track The Songs That We Sing. Good question. The actor/musician daughter of Serge Gainsbourg and Jane Birkin has spent the past hour shepherding her band through a set of tunes comprised mainly of texture and atmosphere, with a figurative fug of Gauloise smoke drifting above. Their \"meaning\" is debatable, but, as with Gainsbourg's musical career as a whole, their effect derives from their Gallic coolness. Dressed in white and seated for most of the set, Gainsbourg is a picture of languid detachment, loading every syllable, both English and the occasional French, with disenchantment.", "It's classic chanteuse stuff – for the US version, see Lana del Rey – but colossally seductive, and all the more so for the fact that she barely speaks except to introduce Ouvertures Eclair – \"written by my father, and one of my first songs\". This is a breezy 80s synth-ditty that summons up a time when French pop wasn't mentioned in polite company; she has since, suffice to say, moved on. She collaborated with Beck on her last studio album, IRM, and his influence looms over these ethereal, distorted symphonies. Seemingly dozens of discrete sounds form a dizzying whole – guitarist Connan Mockasin, an established Kiwi songwriter, seems responsible for half the effects – over which, perched on her stool, Gainsbourg aloofly presides. The Jarvis Cocker co-composition Jamais shows the vulnerable Gainsbourg, as she whispers, \"Don't believe what you read in those interviews\", and a frisky cover of Bowie's Ashes to Ashes displays a sense of fun.", "In the booming Paradisco, she even has the obligatory dance number. But the prevailing image is of Gainsbourg sitting behind her mic, detached and unknowable."]}, {"id": "UK_P2_14", "press": true, "title": "", "paras": ["Only by leaving the EU will we be able to fairly tax firms like Google. EU taxation rules stop Britain from making multinationals like Google pay their fair share George Osborne has admitted. Speaking in Brussels at the European finance ministers summit (ECOFIN) on Friday, Osborne blamed EU taxation rules for his impotence. In particular the rules governing what are called 'Transfer pricing'. Talking about the EU's latest proposed to introduce greater transparency in reporting taxation, based on an OECD model Osborne said, \"This directive, for perfectly understandable reasons it is not the right directive, does not address the transfer pricing issue.", "The transfer pricing issue has been one of the issues that has caused greatest concern. This is where companies artificially shift profits and therefore can not be taxed on where the economic activity took place that generates those profits took place. It is one of the most complicated areas of the international tax law.\" Nigel Farage, the UKIP leader said, \"This is a devastating admission from the Chancellor. Current, and even proposed EU rules, will continue to allow firms like Google to stick two fingers at the British treasury and British taxpayers. It blows a huge hole in any argument that it is in Britain's economic interest to stay in the European Union.\"\"The whole country is up in arms about how companies like Google can do hundreds of millions of pounds of business in the UK, employ thousands of people here, but pay the taxes of businesses only a fraction of their size.", "In admitting to the fact that it is EU rules that stop the Treasury from raising fair taxes he is basically admitting that the only way that we can make them pay their fair share is to leave the European Union,\" continued Farage."]}, {"id": "UK_P2_15", "press": false, "title": "North Korea: China again urged by May to use its leverage", "paras": ["Theresa May has reiterated her call for China to put more pressure on North Korea to limit its missile programmes as the UK tries to get Beijing to participate in imposing tougher sanctions on Pyongyang. After a state-linked Chinese newspaper labelled May “weak” for pressing China over the issue, the prime minister told a press conference in Tokyo that Beijing needed to match its words of condemnation towards North Korea with deeds. It is understood that Britain is backing international moves for oil exports from North Korea to China to be barred under beefed-up sanctions in response to Pyongyang’s decision to fire a missile over northern Japan on Tuesday. This would follow an earlier ban on North Korean coal, iron and lead imports to China, Pyongyang’s biggest trading partner and occasional ally. May, who said on Wednesday that China was “the key” to international pressure on North Korea, told a press conference alongside Japan’s prime minister, Shinzo Abe, that action was required.", "“China has been involved,” she said. “It was involved during the UN security council debate earlier this week, and there was condemnation from that debate from all parties on the actions that North Korea had taken. “Now we need to ensure that it’s not just the words of condemnation, but that action is taken. And China does have a particular position in this. “They have leverage on North Korea and I believe we should be encouraging China to exercise that leverage to do what we all want, which is to ensure that North Korea is not conducting these illegal acts and we can ensure the security and safety of nations in this region, including, of course, Japan.” Speaking at the press conference, Abe said the UK had its own reasons to counter the “unprecedented, serious and grave threat” from North Korea, beyond just supporting Japan.", "“They [North Korea] have conducted two launches of ICBMs [intercontinental ballistic missiles]. That threat is felt not just by our country or Asia alone. It has become a global threat, including Europe. North Korea will launch ICBMs again and the range will include almost the entire region of Europe.” Earlier on Thursday, the Global Times, a nationalist Chinese Communist party tabloid that sometimes reflects official views, linked May’s earlier comments to the June general election in which her Conservative party squandered its parliamentary majority. “May’s Conservative party lost many seats, turning her into a vulnerable prime minister,” argued an editorial in the newspaper’s Chinese-language edition.", "“Weak people often look for opportunities to show their ‘strength’.” “Perhaps prime minister May doesn’t know much about the Korean peninsula. Her comments sounded just like a rehashing of Washington’s rhetoric,” the sometimes undiplomatic newspaper continued, claiming that many Chinese citizens felt puzzled by what it called British meddling in Asian affairs. “If the British government genuinely wants to protects its business and investment interests in the region, it should speak and act cautiously ... rather than pointing fingers and making irrelevant remarks,” added the article, which was headlined: “Beijing does not need London to teach it how to deal with North Korea.”"]}, {"id": "UK_P2_16", "press": false, "title": "How Jann Mardenborough went from Gran Turismo on a PlayStation to being a racing driver", "paras": ["Jann Mardenborough won the Nissan PlayStation GT Academy competition in 2011, earning the chance to take part in professional racing. Backed by Nissan, he has since competed extensively in sports car racing and completed one season in single seaters; he's finished with a class podium at the Le Mans 24 Hours and as runner-up in the Toyota Racing Series in New Zealand. As part of the Infiniti Red Bull Racing driver development programme, he will race for Arden International in this year's GP3 Championship – one of the most important feeder series for Formula One. I started gaming when I was seven Playing Gran Turismo on the original PlayStation, really just racing games, I played the odd shooting game now and then but the majority of it was racing, I've always had a passion for Gran Turismo and to drive cars I'd probably never, ever, get to drive. For my A-levels I designed a gaming pod to race in I made it out of MDF wood and bought myself a wheel paddle with some money I saved up, and then I was away.", "About a year later GT Academy came round, and served me pretty well. Winning GT Academy was the best moment of my life I knew that my life was going to change massively. After that, the first time I drove a fast GT car, a fast road car, that was a pretty cool moment – to be released round Silverstone in a 500-horse power Nissan GT-R was pretty crazy for a 19-year-old. The transition from videogame to real-life driving wasn't that difficult The controls and physics engines in games these days are crazy, they take real-life data from cars and then put them into code so that the way that the car pitches and brakes and the steering input works very well in racing games. Of course you feel the G-force which you don't in the game, but you're so tightly strapped into the seat, that it's not really an issue.", "People think gaming is just lounging around But it can actually be something that's fantastic and, although it's all happened very, very quickly, it's a amazingly cool situation to find myself in. In a way, I'm sort of living out my childhood dream, so it's very fulfilling that gaming is what has allowed me to do that. It would be the absolute pinnacle for me to reach F1 But I'm concentrating this year on GP3 and will try to develop and improve. The Infiniti Red Bull Racing driver development programme means I can use their simulators to train so that I can arrive at a track I've never driven at before and can be on the pace in the first practice session. A lot of guys have made the jump into the top of the sport from GP3, so it's nice to know that I'm in the correct championship, and with a great team as well, I'm in a great position to get the ball rolling.", "The GP3 season begins in Spain on 9 May, Sky are televising all the races"]}]], "screeners": [{"id": "UKC_002", "press": false, "title": "", "paras": ["George Osborne was keen to present the spending review, on Wednesday, as the latest stage in a strategic plan to fix the British economy, rather than an emergency cost-cutting exercise. He set out three rather Brownite-sounding principles, of reform, growth and fairness, which had guided the Treasury's decisions about where the cuts should fall, and which he claimed would help create a \"Britain on the rise\". As part of this drive to kick-start growth, the business secretary, Vince Cable, managed to secure a minimal 6% cut in his department's budget, with spending on science and apprenticeships protected. And even as it cut back in some areas, the Foreign Office promised to expand embassies in fast-growing emerging economies to help create shopfronts for British businesses abroad. Osborne also emphasised strong infrastructure spending as a key part of his plan.", "Capital expenditure was cut sharply in the coalition's spending review in 2010 but since then the Treasury has sought to find extra pounds to spend on upgrading roads, railways and broadband connections, to create the conditions for a sustainable economic recovery. To that end, the chancellor promised that capital spending would amount to £50bn in 2015-16, and add up to £300bn over 10 years – though that claim was based on gross investment, not the net figure normally used in analysing public spending, which excludes deterioration in existing assets. And, even on that measure, capital spending will stand unchanged between 2014-15 and 2015-16. Capping Britain's welfare budget each year in cash terms was also presented by Osborne as part of his economic vision; he said slapping a ceiling on benefits spending would act as a \"limit on the nation's credit card\". However, he excluded some of those benefits, including Jobseeker's Allowance, which rise rapidly when growth slows down.", "Economists call such payments automatic stabilisers because they help in hard times to limit the speed of a slowdown."], "gold": {"q2": "national", "q1": "yes"}, "note": "Q1 pilot 2 hidden screener: Osborne presents the spending review"}, {"id": "UKN_028", "press": false, "title": "", "paras": ["The climb out of New Quay in Ceredigion on the Wales Coast Path is short and very steep, but worth the effort, for the views over Cardigan Bay, the choughs and fulmars and bottlenose dolphins. Back in town, I make for the Black Lion, a 19th-century inn with views out to sea. It looks austere and a bit nonconformist. In April 2013, it reopened as a nine-room hotel. The refurb is very evident.", "There's a smell of \"new\" when I come into reception but the decor is plain, pared down, and everything looks sturdy, solid and functional. My room, one of five with sea views, has high ceilings and sash windows on three sides, with plenty of west Wales light pouring in, even on a drizzly autumn day. Cream, beige, brown and olive linens make the room feel vaguely autumnal too, and an original oil entitled Welsh Winter completes the effect. The bathroom is big and warm, with Cole &amp; Lewis soaps but, sadly, no bath; walkers in need of a restorative soak may want to ask for one of four rooms with a tub. Owners Llinos and Mike Young are away and their young stand-ins, Sam Knight and Cara Cook, are super-efficient and chatty.", "But they appear to know little about Dylan Thomas, who lived nearby in a bungalow called Majoda (his \"shack at the end of the cliff\") in 1944-5 and was a regular at the inn. The town became popular with cyclists in the 1890s but by Thomas's era it was a bohemian redoubt – perfect for skint poets who liked a drink. Now New Quay draws walkers, nature lovers, foodies and watersports fans. The Black Lion pays discreet homage to Thomas's memory, with black-and-white photographs of him smoking, drinking, being the family man. The food is posh pub grub, with daily hiker-friendly specials such as hunter's chicken, pasta and meatballs, and steak and Doom ale pie.", "I dine early on creamy chicken liver paté and fresh chutney. The Black Lion is a free house, with guest ales, including fruity Purple Moose from Porthmadog; I have one with my steak pie, plus a few beers from Mantle, a microbrewery that opened in nearby Cardigan in August. An army officer tried to kill Thomas during his year in New Quay, possibly because of the poet's communist sympathies, more probably because he was sleeping with the soldier's wife. Nothing so exciting happened during my stay. The pub, like the town, was sleepy, and my own slumber was assisted by the sound of lapping waves.", "But it feels new, fresh, hopeful. Sam tells me the Black Lion is fast becoming New Quay's local boozer – important in a town where half the houses are second homes. Next year is the centenary of Dylan Thomas's birth (dt100.info). The pub is firmly on the pilgrim trail. It just needs a few books, some poetry readings, and a bit of the poet's spirit – hair down, glasses full, the possibility of chaos – to be a great inn. • Accommodation was provided by the Black Lion Inn"], "gold": {"q1": "no"}, "note": "Q1 pilot 2 hidden screener: Black Lion hotel review, New Quay — not political"}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political articles: national or international? — UK</h1>\n<p class=\"lead\">You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Political article:</b> an article about politics: government, parties, politicians, elections, laws, economic policy, strikes; foreign politics counts. Not political: politics not mentioned or only in passing (sport, culture, celebrity and human-interest stories, accidents, crime), or a politician as a private person.</p><p class=\"gnum\"><b>1.2 National scope:</b> the main political issue sits in the UK national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the national government, parliament or parties respond to it.</p><p class=\"gnum\"><b>1.3 International scope:</b> the article is mainly about another country&#x27;s politics, or about international affairs with no domestic focus.</p>\n<h2>2. Task description</h2><p>You read one article at a time. For a newspaper article answer Q1 (is it about politics?) and, if yes, Q2 (mainly national or international?). Party press releases are political by definition, so for them only Q2 is asked. Judge the whole article, not a single sentence.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q1 when politics is a main theme of the article, not merely mentioned.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"en\"><p>Ed Miliband is suffering more vicious attacks at the hands of newspapers than his predecessors, according to former Labour leader Lord Kinnock, including his own famously hostile treatment during the 1992 general election campaign. Kinnock said the Daily Mail&#x27;s attacks on Miliband&#x27;s late father, Ralph, were &quot;worse than I had&quot; and accused the media of being out to &quot;scrag Ed from the start&quot;. He spoke out as Miliband&#x27;s …</p></div><p class=\"how\">Both experts: political and national — a former Labour leader on press treatment of the current one; Westminster politics is the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A politician appearing as a private person or as a celebrity does not make an article political. Human-interest stories without a political actor, institution or policy are NO.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = NO</div><p class=\"ttl\">Shaken Vince Cable proves he can still be a mover on the Strictly Come Dancing Christmas special</p><div class=\"text\" lang=\"en\"><p>Like so much else this Boxing Day and whenever we&#x27;re festooned in snow – novelty underwear for a fiancee, or even thinking of drinking eggnog – it must have &quot;seemed like a good idea at the time&quot;. Dr Vincent Cable had been on track for superfast upgrade to the lobby of the waiting hall of &quot;national treasure&quot;: just a twitch behind the likes of Bruce Forsyth, who hosted Vince&#x27;s vaunted appearance last night on the …</p></div><p class=\"how\">Not political: a minister appears as a celebrity on a dance show. A politician as a private person or entertainer does not make the article political.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Coding the article above as political because a politician or a newspaper politics page is involved.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Decide Q2 by the main topic: domestic institutions, parties and laws → NATIONAL; another country&#x27;s politics or international affairs → INTERNATIONAL. A foreign event discussed through the national reaction to it is NATIONAL.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"en\"><p>Ed Miliband is suffering more vicious attacks at the hands of newspapers than his predecessors, according to former Labour leader Lord Kinnock, including his own famously hostile treatment during the 1992 general election campaign. Kinnock said the Daily Mail&#x27;s attacks on Miliband&#x27;s late father, Ralph, were &quot;worse than I had&quot; and accused the media of being out to &quot;scrag Ed from the start&quot;. He spoke out as Miliband&#x27;s …</p></div><p class=\"how\">Both experts: political and national — a former Labour leader on press treatment of the current one; Westminster politics is the topic.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · international</div><p class=\"ttl\">Kavita Krishnan: &#x27;I was accused by one minister of standing for free sex&#x27;</p><div class=\"text\" lang=\"en\"><p>India&#x27;s answer to Speakers&#x27; Corner attracts a motley crowd of activists. Men in white Nehru caps call for an expansion of India&#x27;s creaking rail network and banks of TV cameras cover the latest political soap opera. Today, a disgruntled leader is on hunger strike against his own party. The noise of speakers shouting into sound systems wired up to car batteries is immense. Kavita Krishnan, 41, a member of India&#x27;s …</p></div><p class=\"how\">Research team: political and international — an Indian activist, an Indian party and Indian ministers are the topic; no British actor or institution is involved.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"en\"><p>2013 is the worst year in a decade in A&amp;E and David Cameron’s fingerprints are all over it - Andy Burnham Andy Burnham MP, Labour’s Shadow Health Secretary, on today’s A&amp;E waiting figures, said: “Patients are waiting hours on end to be seen in England’s A&amp;E. And yet David Cameron and his Ministers deny that A&amp;E is in crisis. &quot;This dangerous complacency can’t go on. That is why, in the …</p></div><p class=\"how\">Party press releases are political by definition, so only Q2 is asked. Research team: national — Labour&#x27;s shadow health secretary on England&#x27;s A&amp;E figures and the Prime Minister.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> One sentence about another country does not make a national article international, and vice versa — the article as a whole decides.</p></div>"}</script>

<script>
// app.js v12 — per-page localStorage key (pilot 23 Oct: a coder who had failed DE articles opened DE paragraphs and inherited the failed session); v11 — practice phase is hands-on (answer first, then the research team's answer), skipped when a task has no practice items; v10 — guidelines screen (embedded TRAINING_*.html) shown first after the introduction; Guidelines button in the header reopens it.
(function () {

  var D = JSON.parse(document.getElementById('data').textContent);
  var CFG = JSON.parse(document.getElementById('config').textContent);
  var KEY = 'annotation-' + D.mode + '-' + (D.task || '') + '-' + (D.lang || D.language || '') + '-' + D.built;   // v12: per page, so a coder doing several tasks never inherits another page's state
  var GOLD = D.mode === 'gold';
  var app = document.getElementById('app');

  // ---------- platform context (Prolific / CloudResearch Connect) ----------
  function params() {

    if (!s) return q;
    s.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); }
      catch (e) { q[k] = v; }
    });
    return q;
  }
  function detect(q) {
    var names = Object.keys(q), lower = {};
    names.forEach(function (n) { lower[n.toLowerCase()] = n; });

      }
      return null;
    }

    var pp = pick(CFG.id_params.prolific);

    else if (q.platform === 'prolific' || q.platform === 'cloudresearch') plat.name = q.platform;
    var order = plat.name === 'cloudresearch'
      ? CFG.id_params.cloudresearch.concat(CFG.id_params.prolific)
      : CFG.id_params.prolific.concat(CFG.id_params.cloudresearch);
    var idk = pick(order);
    if (idk) plat.pid = q[idk];
    var sk = pick(['STUDY_ID', 'projectId', 'project_id']);
    if (sk) plat.study = q[sk];
    var ssk = pick(['SESSION_ID', 'assignmentId', 'assignment_id']);
    if (ssk) plat.session = q[ssk];
    plat.dry = q.dry_run === '1' || q.preview === '1';
    return plat;
  }
  var Q = params();
  var PLAT = detect(Q);

  // ---------- state ----------
  // Health probe. A sandboxed preview (Dropbox, Drive, an e-mail client) can make
  // localStorage throw and block downloads; silently swallowing that is how a whole
  // session gets lost, so it is detected up front and shown on every screen.
  var STORAGE_OK = (function () {
    try {
      var t = '__probe_' + Date.now();
      localStorage.setItem(t, '1');
      var ok = localStorage.getItem(t) === '1';
      localStorage.removeItem(t);
      return ok;
    } catch (e) { return false; }
  })();
  var FRAMED = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
  var SAVE_FAILED = false;

  function load() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { SAVE_FAILED = true; }
  }
  var S = load() || { coder: '', ans: {}, started: new Date().toISOString() };
  if (!S.started) S.started = new Date().toISOString();
  S.plat = PLAT;
  save();

  // ---------- older builds (answers from a previous version of this page) ----------
  var CARRY = ['q1', 'q2', 'q4', 'q5', 'econ', 'chances', 'rights', 'note', 'cuts'];
  function coded(st) {
    var n = 0;
    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {
      var a = st.ans[ik];
      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }
    });
    return n;
  }
  // Older slots for this mode, richest first: a build that was merely opened must not

  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('annotation-' + D.mode + '-') !== 0 || k === KEY) continue;
        var n = 0;
        try { n = coded(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        if (n) out.push({ key: k, n: n, build: k.slice(('annotation-' + D.mode + '-').length) });
      }
    } catch (e) {}
    out.sort(function (x, y) { return y.n - x.n || (x.build < y.build ? 1 : -1); });
    return out;
  }
  function importOlder(k) {
    var old;
    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) { return 0; }
    if (!old || !old.ans) return 0;
    var n = 0;
    Object.keys(old.ans).forEach(function (ik) {
      var from = old.ans[ik], to = S.ans[ik] || (S.ans[ik] = {}), took = false;
      CARRY.forEach(function (f) {
        if (from[f] !== undefined && to[f] === undefined) { to[f] = from[f]; took = true; }
      });
      if (took) n++;
    });
    if (!S.coder && old.coder) S.coder = old.coder;
    save();
    return n;
  }

  // ---------- helpers ----------
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'cls') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function items(t) {

    if (t.type === 't1') {
      return t.articles.map(function (a) { return { kind: 'article', d: a }; })
        .concat(t.splits.map(function (p) { return { kind: 'split', d: p }; }));
    }
    return t.items.map(function (q) { return { kind: 'qs', d: q }; });
  }
  function lang(t) { if (CROWD) return D.lang || 'en'; return /-DE$/.test(t.id) ? 'de' : 'en'; }
  function key(t, it) { return t.id + '|' + it.d.id; }
  function A(t, it) { var k = key(t, it); if (!S.ans[k]) S.ans[k] = {}; return S.ans[k]; }
  function peek(t, it) { return S.ans[key(t, it)] || {}; }
  function toks(s) { return s.text.split(/\s+/).filter(Boolean); }

  // a split line is resolved when it carries a cut or was marked as one quasi-sentence
  function lineState(a, si) {
    var c = (a.cuts || {})[si] || [];
    if (c.length) return 'split';
    if ((a.nosplit || {})[si]) return 'one_qs';
    return 'unresolved';
  }
  function done(t, it) {
    var a = peek(t, it);
    if (it.kind === 'article') return it.d.press ? !!a.q2 : (a.q1 === 'no' || (a.q1 === 'yes' && !!a.q2));
    if (it.kind === 'split') {
      for (var si = 0; si < it.d.sentences.length; si++) if (lineState(a, si) === 'unresolved') return false;
      return true;
    }
    return a.q4 === 'no' || (a.q4 === 'yes' && !!a.q5 && !!(a.econ || a.chances || a.rights));
  }
  function progress(t) {
    var its = items(t), n = 0;
    its.forEach(function (it) { if (done(t, it)) n++; });
    return [n, its.length];
  }
  function allDone() {
    for (var i = 0; i < D.tasks.length; i++) { var p = progress(D.tasks[i]); if (p[0] < p[1]) return false; }
    return true;
  }

  function banner() {
    if (STORAGE_OK && !FRAMED && !SAVE_FAILED) return null;
    var why = (!STORAGE_OK || SAVE_FAILED)
      ? 'This browser is NOT saving your answers. '
      : 'This page is open inside another website, so the download may be blocked. ';
    return el('div', { cls: 'alarm' }, [
      el('strong', { text: 'Stop \u2014 do not code in this window. ' }),
      el('span', { text: why +
        'Close it, download the file to your computer, and open it from there (double-click it). ' +
        'The page needs no internet. Opening it from inside Dropbox, Drive or an e-mail preview ' +
        'does not work.' })]);
  }
  function setHead(title, i, n) {
    document.getElementById('htitle').textContent = title;
    document.getElementById('hprog').textContent = i == null ? '' : 'Item ' + (i + 1) + ' of ' + n;
    document.getElementById('hbar').style.width = i == null ? '0' : (100 * (i + 1) / n) + '%';
  }


  // ================= crowd mode: training -> entry test -> production (+ hidden screeners) =================
  var CROWD = D.mode === 'crowd';
  function crowdKind() { return D.task === 'T1_scope' ? 'article' : D.task === 'T1_split' ? 'split' : 'qs'; }
  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);
    h = ((h & 0xffff) * 16777619 + ((((h >>> 16) * 16777619) & 0xffff) << 16)) >>> 0; } return h >>> 0; }
  function chooseBatch() {
    var n = (D.batches || []).length || 1, q = parseInt(Q.batch, 10);
    if (q >= 1 && q <= n) return q;
    if (PLAT.pid) return 1 + (hash32(PLAT.pid) % n);
    return 1;
  }
  // one screener after every `every` production items, never two in a row, never as the last item
  function interleave(prod, scr, every) {
    var out = [], si = 0;
    for (var i = 0; i < prod.length; i++) {
      out.push(prod[i]);
      if (scr.length && every > 0 && (i + 1) % every === 0 && i < prod.length - 1) { out.push(scr[si % scr.length]); si++; }
    }
    return out;
  }
  var BATCH = null;
  if (CROWD) {
    BATCH = chooseBatch();
    D.tasks = [
      { id: 'training', phase: 'training', type: 'crowd', title: 'Practice', items: D.training || [], q2: D.q2 },
      { id: 'entry', phase: 'entry', type: 'crowd', title: 'Qualification', items: (D.entry && D.entry.items) || [], q2: D.q2 },
      { id: 'production', phase: 'production', type: 'crowd', title: 'Coding',
        items: interleave((D.batches || [[]])[BATCH - 1] || [], D.screeners || [], D.screener_every || 15), q2: D.q2 }
    ];
    if (!S.t) S.t = {};
    S.batch = BATCH; save();
  }
  function phaseTask(name) { for (var i = 0; i < D.tasks.length; i++) if (D.tasks[i].phase === name) return D.tasks[i]; return null; }
  function stamp(name) { if (CROWD && !S.t[name]) { S.t[name] = new Date().toISOString(); save(); } }
  function secs(a, b) { return (a && b) ? Math.round((new Date(b) - new Date(a)) / 1000) : null; }

  // ---- per-item scoring against gold (shared by entry test and screeners) ----
  function scoreItem(t, it) {
    var a = peek(t, it), g = it.d.gold || {}, r = { item_id: it.d.id, kind: it.kind };
    if (it.kind === 'article') {
      r.q1_correct = (g.q1 === undefined) ? true : a.q1 === g.q1;
      r.scope_correct = (g.q1 === 'no') ? r.q1_correct : (!!g.q2 && a.q2 === g.q2);
      r.nonpolitical = g.q1 === 'no';
      r.pass = r.scope_correct && r.q1_correct;
    } else if (it.kind === 'split') {
      var lines = g.lines || [], ok = 0, det = 0, nsplit = 0;
      r.lines = [];
      lines.forEach(function (gl, si) {
        var st = lineState(a, si), cuts = (a.cuts && a.cuts[si]) || [];
        var statusOk = st === gl.status;
        var detected = false;
        if (gl.status === 'split') {
          nsplit++;
          detected = st === 'split' && (gl.cuts == null || cuts.some(function (c) { return gl.cuts.indexOf(c) >= 0; }));
          if (detected) det++;
        }
        if (statusOk) ok++;
        r.lines.push({ si: si, status_correct: statusOk, detected: detected });
      });
      r.n_lines = lines.length; r.status_correct = ok; r.n_split_lines = nsplit; r.split_detected = det;
      r.pass = ok === lines.length && det === nsplit;
    } else {
      r.q4_correct = !!g.q4 && a.q4 === g.q4;
      r.type_hit = g.q4 === 'yes' && a.q4 === 'yes' &&
        ((g.econ && a.econ) || (g.chances && a.chances) || (g.rights && a.rights)) ? true : false;
      r.pass = r.q4_correct && (g.q4 === 'no' || r.type_hit);
    }
    return r;
  }
  function scoreEntry() {
    var t = phaseTask('entry'), its = items(t), rule = (D.entry && D.entry.rule) || {};
    var per = its.map(function (it) { return scoreItem(t, it); });
    var res = { per_item: per, rule: rule };
    if (D.task === 'T1_scope') {
      res.scope_correct = per.filter(function (p) { return p.scope_correct; }).length;
      res.passed = res.scope_correct >= (rule.min_scope_correct || its.length) &&
        per.every(function (p) { return p.q1_correct; });
    } else if (D.task === 'T1_split') {
      res.status_correct = per.reduce(function (s_, p) { return s_ + p.status_correct; }, 0);
      res.n_lines = per.reduce(function (s_, p) { return s_ + p.n_lines; }, 0);
      res.split_detected = per.reduce(function (s_, p) { return s_ + p.split_detected; }, 0);
