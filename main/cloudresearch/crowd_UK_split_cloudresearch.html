<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#d0d5dd; --accent:#2f5bd3;

.nav { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-bottom:14px; }
button { font:inherit; border-radius:8px; border:1px solid var(--line); background:#fff; padding:8px 16px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:disabled { opacity:.4; cursor:not-allowed; }

.sent { padding:8px 0; border-top:1px solid #eaecf0; line-height:2; }

.w { padding:2px 0; }
.seg1 { background:#e8f0fe; } .seg2 { background:#fdf0e6; }
.gap { display:inline-block; width:10px; height:1.6em; vertical-align:middle; cursor:pointer; position:relative; }
.gap::after { content:''; position:absolute; left:4px; top:2px; bottom:2px; width:0; border-left:2px dotted transparent; }
.sent:hover .gap::after { border-left-color:#c8ced8; }
.sent .gap:hover::after { border-left:2px solid var(--cut); }
.sent .gap.cut { background:none; width:14px; }
.sent .gap.cut::after { border-left:3px solid var(--cut); left:5px; }
.cnt { font-size:12px; color:var(--cut); margin-left:6px; }

.tname { font-weight:600; } .tright { display:flex; gap:10px; align-items:center; }
input[type=text] { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; width:200px; }

a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.warn { color:var(--cut); }

.dump { width:100%; min-height:260px; font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:12px; border:1px solid var(--line); border-radius:8px; padding:8px;
        white-space:pre; overflow:auto; }

.alarm { background:#fde7e5; border:2px solid var(--cut); border-radius:10px; padding:12px 14px;
         margin-bottom:14px; font-size:14px; line-height:1.45; color:#7a140c; }
.alarm strong { color:var(--cut); }

.gold { border-color:#2f5bd3; background:#f4f7ff; }
.gold .ans { font-weight:600; margin:4px 0; }
ol { padding-left:20px; } li { margin:4px 0; }

/* guidelines card (embedded TRAINING_*.html), overlay and header button */
.guide h1 { font-size:1.35em; margin:0 0 8px; } .guide h2 { font-size:1.1em; margin-top:26px; color:#333; border-bottom:2px solid #ddd; padding-bottom:4px; }

<script id="data" type="application/json">{"built": "20261026173428", "mode": "crowd", "task": "T1_split", "language": "UK", "lang": "en", "title": "Political sentences: where does a new statement begin?", "intro": "You will see short paragraphs, one sentence per line, and mark where a new political statement (a quasi-sentence) begins inside a sentence.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "G-UK_H02-1", "line_ids": ["UK_H02-1"], "sentences": [{"idx": 1, "text": "Since 2007, we have introduced world-leading equal marriage and LGBT hate crime laws, we passed a progressive Turing Law to apologise for and pardon historical discriminatory convictions, and we opened adoption and IVF up to same-sex couples."}], "gold": {"lines": [{"status": "split", "cuts": [13, 27]}], "note": "Both experts agree: three achievements listed one after the other — equal marriage and hate-crime laws; the Turing Law; adoption and IVF for same-sex couples — so three units of meaning, cut at each comma that starts a new achievement."}}, {"id": "G-UK_H03-1", "line_ids": ["UK_H03-1"], "sentences": [{"idx": 1, "text": "The Liberal Democrat leader, Nick Clegg, last night spelled out the four \"tests\" he will set for Labour and the Conservatives if they are to seek his party's support in a hung parliament following the general election."}], "gold": {"lines": [{"status": "one_qs", "cuts": []}], "note": "Both experts agree: one unit of meaning. A long sentence, but it reports one thing — Clegg setting out his tests; who, when and for whom are details of that one statement."}}], "entry": {"items": [{"id": "G-UK_H10-2-UK_H03-2", "line_ids": ["UK_H10-2", "UK_H03-2"], "sentences": [{"idx": 1, "text": "Third, we will put reducing inequality, tackling climate change and promoting human rights at the core of our agenda."}, {"idx": 2, "text": "His \"four steps to fairness\" are: reform of the tax system to lift 4 million people earning £10,000 a year or less out of income tax altogether, financed by higher taxes for the rich; a \"pupil premium\" to target extra education spending at the most disadvantaged children; a switch to a greener economy with less reliance on financial services; and voting reform for Westminster elections."}], "gold": {"lines": [{"status": "split", "cuts": [6, 9]}, {"status": "split", "cuts": null}]}}, {"id": "G-UK_H01-3-UK_H03-3", "line_ids": ["UK_H01-3", "UK_H03-3"], "sentences": [{"idx": 1, "text": "Beyond this one overarching theme, there are a few more signals of the shift that Miliband might like to describe as from New Labour to Next Labour."}, {"idx": 2, "text": "Clegg declined to say whether his party would lean towards Labour or the Tories if neither party secured an overall majority in the poll expected on 6 May ."}], "gold": {"lines": [{"status": "one_qs", "cuts": []}, {"status": "one_qs", "cuts": []}]}}], "rule": {"min_status_correct": 3, "min_split_detected": 1}}, "batches": [[{"id": "UK_P01", "sentences": [{"idx": 1, "text": "Well that’s the point, the hypocrisy is in the law because it protects some’s right not to be offended over others hence..."}, {"idx": 2, "text": "NC: Well as I was just trying to explain to you, whether it is changing the law so that you can insult other people which was deemed to be unlawful under Labour, whether it’s changing the outdated blasphemy laws, whether it’s changing the laws on protest that used to inhibit protests which were deemed to be offensive to others."}, {"idx": 3, "text": "Those are changes which I have actually and my party have actually spearheaded precisely for the reason that you say Ali, which is that freedom of expression is not a sort of selective thing of course it’s not or it shouldn’t be at least."}]}, {"id": "UK_P14", "sentences": [{"idx": 1, "text": "In some cases the gender pay gap is enormous – rising to more than 70 per cent."}, {"idx": 2, "text": "It might not be surprising then that in male dominated sectors such as banking and finance, bonus gaps of more than 60 per cent were not uncommon. = Reports suggest it'll take 100 years to close the gender pay gap."}]}, {"id": "UK_P11", "sentences": [{"idx": 1, "text": "In 2015-16, seven out of ten children in poverty in Scotland were living in a household where someone was in work."}, {"idx": 2, "text": "Women still get paid less than men, are less likely to be in full time employment, and more likely to stay at home due to caring commitments."}, {"idx": 3, "text": "More people are in work in Scotland than the pre-recession high but job opportunities vary considerably across regions."}]}, {"id": "UK_P27", "sentences": [{"idx": 1, "text": "Generated a wealth of policy ideas in the 1970s and is looking to do the same again."}, {"idx": 2, "text": "Centre for Social Justice The Centre for Social Justice is an independent thinktank established, by Rt Hon Iain Duncan Smith MP in 2004, to seek effective solutions to the poverty that blights parts of Britain."}, {"idx": 3, "text": "CentreForum Independent, progressive public-policy thinktank providing an alternative entry-point into the political process through ideas and debates."}, {"idx": 4, "text": "Chatham House Chatham House is a centre for policy research on international affairs."}]}, {"id": "UK_P26", "sentences": [{"idx": 1, "text": "If you only have 5 minutes …"}, {"idx": 2, "text": "The seven leaders in their own words The phrases they wanted to lodge in our brains: Bennett decent, peaceful political revolution; Clegg fair, don’t lurch this way or that; Sturgeon change, Scotland, progressive; Cameron long term economic plan, mistakes of the past; Wood hope, communities, Wales; Miliband working people, future, fairer choices; Farage what no one talks about, get real."}, {"idx": 3, "text": "The seven leaders in our columnists’ words Jonathan Freedland: Miliband struggled; Sturgeon easy command; Farage rant; Wood applause; Cameron remote."}, {"idx": 4, "text": "Gaby Hinsliff: Cameron stuck; Clegg triangulated; Miliband earnest; Farage spluttered; Wood least impressive; Bennett human; Sturgeonaspirational."}]}, {"id": "UK_P24", "sentences": [{"idx": 1, "text": "What is your response to that?'"}, {"idx": 2, "text": "\"Those women who are losing, or on the verge of losing, their jobs – they're saying: 'What can you tell me that will make me know this isn't endless?' \" Patel saw child benefit as a particularly important issue for a lot of women – who, she said, \"even if they live in nuclear family set-ups with two parents, are often are not in control of finances\"."}, {"idx": 3, "text": "Long was also concerned about some cuts to benefits, which, she said, \"do disproportionately hit women, particularly lone mothers\"."}]}, {"id": "UK_P18", "sentences": [{"idx": 1, "text": "He has called for an end to the cuts to public services and welfare that drive women and families into poverty, including the cuts to women’s refuges and services for domestic violence."}, {"idx": 2, "text": "He also wants all companies to publish details of their equal pay arrangements, intends his cabinet to be made up of 50% women and wants to “work towards” 50% of all Labour MPs being women."}, {"idx": 3, "text": "Corbyn has floated the idea of reintroducing women-only carriages on trains to cut sexual assault cases."}]}, {"id": "UK_P02", "sentences": [{"idx": 1, "text": "\"And why we should fear so much for Britain if we go back to a Tory government."}, {"idx": 2, "text": "And I want to do so in the context of fairness.\"I want to show that our policies are rooted in fairness."}, {"idx": 3, "text": "And that those of our opponents are not just wrong but wrong because they are unfair."}]}, {"id": "UK_P22", "sentences": [{"idx": 1, "text": "However, the authors, economists Howard Reed and Stewart Lansley, argue that a transitional system could be created at an annual cost of £8bn, which would leave many means-tested benefits in place."}, {"idx": 2, "text": "The tax-free personal allowance, currently worth £11,000, would be abolished, and tax rates would rise; but every adult would receive a payment of £71 a week – or £51 for pensioners – and £59 for children."}, {"idx": 3, "text": "They say such a system would cut child poverty by 45%, and 60% of those in the bottom fifth of the income distribution would gain more than 20%."}]}, {"id": "UK_P20", "sentences": [{"idx": 1, "text": "IFS says the universal credit work allowance has already been cut by 6%."}, {"idx": 2, "text": "(The work allowance is what people are allowed to earn before they start losing benefit.) It seems that those in the audience do not have a high opinion of the universal credit implementation."}, {"idx": 3, "text": "IFS says the biggest gains have gone to higher income households."}]}, {"id": "UK_P29", "sentences": [{"idx": 1, "text": "Politics, ideas and views that we thought were rejected and defeated after the Second World War — in large part due to the leadership and sacrifices of the US — have resurfaced and are creeping back into the political mainstream."}, {"idx": 2, "text": "This includes hatred of those who are different and the deliberate stoking of people’s basest fears and insecurities, instead of trying to address them; a constant focus on that which divides us, rather than that which unites us; and the awful scapegoating of some of the most vulnerable people in our societies."}, {"idx": 3, "text": "This offends many Londoners."}, {"idx": 4, "text": "In the interview, after being read back of the above passage, Khan said: What I said was actually we need to be careful about the rise of narrow populist movements across not just Europe, but across the world."}]}, {"id": "UK_P23", "sentences": [{"idx": 1, "text": "Even “King” Phil Green didn’t enjoy it."}, {"idx": 2, "text": "Every little helps, so while we’re on the subject, why not require boards to address their staff’s low pay as well as high pay?"}, {"idx": 3, "text": "Jeremy Corbyn has just come up with an idea to raise corporation tax by 1% and the top income tax rate to 50p (again) to fund a public sector pay rise after years of freeze/cap."}]}, {"id": "UK_P15", "sentences": [{"idx": 1, "text": "Read more about our action to raise attainment here."}, {"idx": 2, "text": "Using new social security powers to help low-income families meet essential costs of looking after young children A new Best Start Grant will be introduced from summer 2019 to increase support for parents on low incomes at key stages in a child’s life."}, {"idx": 3, "text": "We will reintroduce payments for second and subsequent children too."}]}, {"id": "UK_P10", "sentences": [{"idx": 1, "text": "Those who do move often end up in the private rented sector which means a higher Housing Benefit bill for the taxpayer."}, {"idx": 2, "text": "The Department for Work and Pensions’ own impact assessment shows: • Over 400,000 of those affected are disabled, according to the government’s own figures • The tax also hits 220,000 households with children which, based on average UK family size, could mean as many as 375,000 children affected • Families hit will be forced to move or face losing an average £14 a week, or £720 a year."}, {"idx": 3, "text": "In addition, there is mounting evidence that the policy is resulting in unanticipated costs and perverse consequences as families are pushed into more expensive private rented accommodation while local housing providers’ budgets are hit by mounting arrears."}]}, {"id": "UK_P19", "sentences": [{"idx": 1, "text": "You have to pay for it through general taxation, no question about that.”"}, {"idx": 2, "text": "In his manifesto, titled Working with Women, Corbyn also pledges to: Force companies to publish mandatory equal pay audits Deliver equal protection to workers from discrimination Challenge sexism by promoting personal, social health and economic (PSHE) education in schools."}, {"idx": 3, "text": "This would include sex and relationship education Appoint a shadow cabinet with equal numbers of men and women and work towards ensuring that 50% of Labour MPs are women Corbyn said: “Women face abuse, mistreatment and persistent discrimination, and they face it in work, at home and on our streets."}]}, {"id": "UK_P17", "sentences": [{"idx": 1, "text": "Because we have a a strong economy."}, {"idx": 2, "text": "Third, the Tories are legislating for tax-free child care, and recognising marriage in the tax system."}, {"idx": 3, "text": "Fourth, the Tories would continue to cut the deficit, he says."}]}, {"id": "UK_P12", "sentences": [{"idx": 1, "text": "We will undertake new work, starting this summer, with the aim of persuading a clear majority of people in Scotland that independence is the best future for our country."}, {"idx": 2, "text": "A Scottish approach to social security – with fairness and dignity at its heart We will create a Scottish Social Security Agency, with fairness and dignity at its core."}, {"idx": 3, "text": "We will increase Carer’s Allowance so that it matches Jobseeker’s Allowance."}]}, {"id": "UK_P16", "sentences": [{"idx": 1, "text": "By 2020, the obligation to do this would be extended to smaller firms."}, {"idx": 2, "text": "Other gender-equality policy ideas would include to extend statutory maternity pay from nine to 12 months, free childcare for two- to four-year-olds, and better employment protection for pregnant women."}, {"idx": 3, "text": "Laura Pidcock, the shadow employment secretary, said: “For far too long the interests of working women have been at the bottom of the list of priorities for government."}]}, {"id": "UK_P30", "sentences": [{"idx": 1, "text": "On his belief in equality And what made him this great architect of a free South Africa was this burning belief that everyone, every man and woman was equal, everyone born to be free, everyone created not with a destiny to be in poverty, but created to have dignity in life ..."}, {"idx": 2, "text": "On his fight against poverty He himself wrote that in the first part of his life he climbed one great mountain, to end apartheid."}, {"idx": 3, "text": "But now in his later life he wanted to climb another great mountain, to rid the world of poverty, and especially the outrage of child poverty ..."}, {"idx": 4, "text": "On his legacy Hung by Mandela on the bare walls of that bleak prison cell was the facsimile of the British painting by the famous artist, Frederick Watts."}]}, {"id": "UK_P03", "sentences": [{"idx": 1, "text": "The opportunity for Scotland to take action to tackle inequality was also highlighted by Professor Stiglitz – who said that the “underlying drive of this is a belief, of a large number of people in Scotland, almost surely a majority that the approach to success of reducing inequality within Scotland is a more what you might call social democratic approach.”"}, {"idx": 2, "text": "Professor Stiglitz argued that Scotland could have more success in tackling inequality than the rest of the UK as it benefits from “An approach which emphasises free university education for everybody, a more social solidarity, programmes that continue to get access to healthcare for everybody and those policies are working."}, {"idx": 3, "text": "And that’s a very different view from say the Cameron conservative policies in England where they are raising tuition for universities so the two parts of the UK are moving in very different directions.”"}]}, {"id": "U  said: the coalition will hold” is one unit (who speaks belongs to what is said). A sentence contains one or several quasi-sentences; a quasi-sentence never runs across two sentences.</p><p class=\"gnum\"><b>1.3 Boundary:</b> the point where one unit ends and the next begins, usually at a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” has one boundary (two units). You decide where the units end.</p><h2>2. Task description</h2><p>For every line decide whether it contains one unit of meaning or several. To mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole line is one unit of meaning, press “one quasi-sentence”. Every line must be resolved before you can continue.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Separate demands or measures are separate quasi-sentences, even when they share one verb or are joined by “and” or a semicolon.</p><div class=\"card ex ok\"><div class=\"part\">✓ correct</div><div class=\"sent\" lang=\"en\"><span class=\"w\">In</span><span class=\"gap\"></span><span class=\"w\">particular:</span><span class=\"gap\"></span><span class=\"w\">a</span><span class=\"gap\"></span><span class=\"w\">higher</span><span class=\"gap\"></span><span class=\"w\">minimum</span><span class=\"gap\"></span><span class=\"w\">wage;</span><span class=\"gap cut\"></span><span class=\"w seg1\">serious</span><span class=\"gap seg1\"></span><span class=\"w seg1\">restrictions</span><span class=\"gap seg1\"></span><span class=\"w seg1\">on</span><span class=\"gap seg1\"></span><span class=\"w seg1\">zero-hours</span><span class=\"gap seg1\"></span><span class=\"w seg1\">contracts;</span><span class=\"gap cut\"></span><span class=\"w =\"gap\"></span><span class=\"w\">expectation</span><span class=\"gap\"></span><span class=\"w\">that</span><span class=\"gap\"></span><span class=\"w\">workers’</span><span class=\"gap\"></span><span class=\"w\">voices</span><span class=\"gap\"></span><span class=\"w\">would</span><span class=\"gap\"></span><span class=\"w\">be</span><span class=\"gap\"></span><span class=\"w\">heard</span><span class=\"gap\"></span><span class=\"w\">on</span><span class=\"gap\"></span><span class=\"w\">directors’</span><span class=\"gap\"></span><span class=\"w\">remuneration</span><span class=\"gap\"></span><span class=\"w\">too.</span><span class=\"cnt\">one quasi-sentence</span></div><p class=\"how\">Marking the whole line as one quasi-sentence hides that it contains several separate demands.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> Words that only introduce a statement — “The right answer is:”, “In particular:”, “he told the paper that” — belong to the statement they introduce. Do not cut after them.</p><div class=\"card ex ok\"><div class=\"part\">✓ correct</div><div class=\"sent\" lang=\"en\"><span class=\"w\">But</span><span class=\"gap\"></span><span class=\"w\">he</span><span class=\"gap\"></span><span class=\"w\">told</span><span class=\"gap\"></span><span class=\"w\">the</span><span class=\"gap\"></span><span class=\"w\">Independent</span><span class=\"gap\"></span><span class=\"w\">he</span><span class=\"gap\"></span><span class=\"w\">would</span><span class=\"gap\"></span><span class=\"w\">talk</span><span class=\"gap\"></span><span class=\"w\">to</span><span class=\"gap\"></span><span class=\"w\">the</span><span class=\"gap\"></span><span class=\"w\">party</span><span class=\"gap\"></span><span class=\"w\">that</span><span class=\"gap\"></span><span class=\"w\">won</span><span class=\"gap\"></span><span class=\"w\">the</span><span class=\"gap\"></span><span class=\"w\">&quot;strongest</span><span class=\"gap\"></span><span class=\"w\">mandate&quo     'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
