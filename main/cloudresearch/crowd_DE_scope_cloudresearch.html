// app.js v12 — per-page localStorage key (pilot 23 Oct: a coder who had failed DE articles opened DE paragraphs and inherited the failed session); v11 — practice phase is hands-on (answer first, then the research team's answer), skipped when a task has no practice items; v10 — guidelines screen (embedded TRAINING_*.html) shown first after the introduction; Guidelines button in the header reopens it.
(function () {

  var D = JSON.parse(document.getElementById('data').textContent);
  var CFG = JSON.parse(document.getElementById('config').textContent);
  var KEY = 'annotation-' + D.mode + '-' + (D.task || '') + '-' + (D.lang || D.language || '') + '-' + D.built;   // v12: per page, so a coder doing several tasks never inherits another page's state
  var GOLD = D.mode === 'gold';
  var app = document.getElementById('app');

  // ---------- platform context (Prolific / CloudResearch Connect) ----------
  function params() {
    var q = {}, s = String(location.search || '').replace(/^\?/, '');
    if (!s) return q;
    s.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); }
      catch (e) { q[k] = v; }
    });
    return q;
  }
  function detect(q) {
    var names = Object.keys(q), lower = {};
    names.forEach(function (n) { lower[n.toLowerCase()] = n; });
    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        var hit = lower[list[i].toLowerCase()];
        if (hit && q[hit]) return hit;
      }
      return null;
    }
    var plat = { name: 'none', pid: '', study: '', session: '', query: location.search || '' };
    var pp = pick(CFG.id_params.prolific);
    var cc = pick(CFG.id_params.cloudresearch);
    if (pp) plat.name = 'prolific';
    else if (cc) plat.name = 'cloudresearch';
    else if (q.platform === 'prolific' || q.platform === 'cloudresearch') plat.name = q.platform;
    var order = plat.name === 'cloudresearch'
      ? CFG.id_params.cloudresearch.concat(CFG.id_params.prolific)
      : CFG.id_params.prolific.concat(CFG.id_params.cloudresearch);
    var idk = pick(order);
    if (idk) plat.pid = q[idk];
    var sk = pick(['STUDY_ID', 'projectId', 'project_id']);
    if (sk) plat.study = q[sk];
    var ssk = pick(['SESSION_ID', 'assignmentId', 'assignment_id']);
    if (ssk) plat.session = q[ssk];
    plat.dry = q.dry_run === '1' || q.preview === '1';
    return plat;
  }
  var Q = params();
  var PLAT = detect(Q);

  // ---------- state ----------
  // Health probe. A sandboxed preview (Dropbox, Drive, an e-mail client) can make
  // localStorage throw and block downloads; silently swallowing that is how a whole
  // session gets lost, so it is detected up front and shown on every screen.
  var STORAGE_OK = (function () {
    try {
      var t = '__probe_' + Date.now();
      localStorage.setItem(t, '1');
      var ok = localStorage.getItem(t) === '1';
      localStorage.removeItem(t);
      return ok;
    } catch (e) { return false; }
  })();
  var FRAMED = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
  var SAVE_FAILED = false;

  function load() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { SAVE_FAILED = true; }
  }
  var S = load() || { coder: '', ans: {}, started: new Date().toISOString() };
  if (!S.started) S.started = new Date().toISOString();
  S.plat = PLAT;
  save();

  // ---------- older builds (answers from a previous version of this page) ----------
  var CARRY = ['q1', 'q2', 'q4', 'q5', 'econ', 'chances', 'rights', 'note', 'cuts'];
  function coded(st) {
    var n = 0;
    if (st && st.ans) Object.keys(st.ans).forEach(function (ik) {
      var a = st.ans[ik];
      for (var f = 0; f < CARRY.length; f++) if (a[CARRY[f]] !== undefined) { n++; return; }
    });
    return n;
  }
  // Older slots for this mode, richest first: a build that was merely opened must not
  // shadow one that was actually coded in.
  function olderKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('annotation-' + D.mode + '-') !== 0 || k === KEY) continue;
        var n = 0;
        try { n = coded(JSON.parse(localStorage.getItem(k))); } catch (e) {}
        if (n) out.push({ key: k, n: n, build: k.slice(('annotation-' + D.mode + '-').length) });
      }
    } catch (e) {}
    out.sort(function (x, y) { return y.n - x.n || (x.build < y.build ? 1 : -1); });
    return out;
  }
  function importOlder(k) {
    var old;
    try { old = JSON.parse(localStorage.getItem(k)); } catch (e) { return 0; }
    if (!old || !old.ans) return 0;
    var n = 0;
    Object.keys(old.ans).forEach(function (ik) {
      var from = old.ans[ik], to = S.ans[ik] || (S.ans[ik] = {}), took = false;
      CARRY.forEach(function (f) {
        if (from[f] !== undefined && to[f] === undefined) { to[f] = from[f]; took = true; }
      });
      if (took) n++;
    });
    if (!S.coder && old.coder) S.coder = old.coder;
    save();
    return n;
  }

  // ---------- helpers ----------
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'cls') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function items(t) {
    if (t.type === 'crowd') return t.items.map(function (x) { return { kind: x.kind || crowdKind(), d: x }; });
    if (t.type === 't1') {
      return t.articles.map(function (a) { return { kind: 'article', d: a }; })
        .concat(t.splits.map(function (p) { return { kind: 'split', d: p }; }));
    }
    return t.items.map(function (q) { return { kind: 'qs', d: q }; });
  }
  function lang(t) { if (CROWD) return D.lang || 'en'; return /-DE$/.test(t.id) ? 'de' : 'en'; }
  function key(t, it) { return t.id + '|' + it.d.id; }
  function A(t, it) { var k = key(t, it); if (!S.ans[k]) S.ans[k] = {}; return S.ans[k]; }
  function peek(t, it) { return S.ans[key(t, it)] || {}; }
  function toks(s) { return s.text.split(/\s+/).filter(Boolean); }

  // a split line is resolved when it carries a cut or was marked as one quasi-sentence
  function lineState(a, si) {
    var c = (a.cuts || {})[si] || [];
    if (c.length) return 'split';
    if ((a.nosplit || {})[si]) return 'one_qs';
    return 'unresolved';
  }
  function done(t, it) {
    var a = peek(t, it);
    if (it.kind === 'article') return it.d.press ? !!a.q2 : (a.q1 === 'no' || (a.q1 === 'yes' && !!a.q2));
    if (it.kind === 'split') {
      for (var si = 0; si < it.d.sentences.length; si++) if (lineState(a, si) === 'unresolved') return false;
      return true;
    }
    return a.q4 === 'no' || (a.q4 === 'yes' && !!a.q5 && !!(a.econ || a.chances || a.rights));
  }
  function progress(t) {
    var its = items(t), n = 0;
    its.forEach(function (it) { if (done(t, it)) n++; });
    return [n, its.length];
  }
  function allDone() {
    for (var i = 0; i < D.tasks.length; i++) { var p = progress(D.tasks[i]); if (p[0] < p[1]) return false; }
    return true;
  }

  function banner() {
    if (STORAGE_OK && !FRAMED && !SAVE_FAILED) return null;
    var why = (!STORAGE_OK || SAVE_FAILED)
      ? 'This browser is NOT saving your answers. '
      : 'This page is open inside another website, so the download may be blocked. ';
    return el('div', { cls: 'alarm' }, [
      el('strong', { text: 'Stop \u2014 do not code in this window. ' }),
      el('span', { text: why +
        'Close it, download the file to your computer, and open it from there (double-click it). ' +
        'The page needs no internet. Opening it from inside Dropbox, Drive or an e-mail preview ' +
        'does not work.' })]);
  }
  function setHead(title, i, n) {
    document.getElementById('htitle').textContent = title;
    document.getElementById('hprog').textContent = i == null ? '' : 'Item ' + (i + 1) + ' of ' + n;
    document.getElementById('hbar').style.width = i == null ? '0' : (100 * (i + 1) / n) + '%';
  }


  // ================= crowd mode: training -> entry test -> production (+ hidden screeners) =================
  var CROWD = D.mode === 'crowd';
  function crowdKind() { return D.task === 'T1_scope' ? 'article' : D.task === 'T1_split' ? 'split' : 'qs'; }
  function hash32(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i);
    h = ((h & 0xffff) * 16777619 + ((((h >>> 16) * 16777619) & 0xffff) << 16)) >>> 0; } return h >>> 0; }
  function chooseBatch() {
    var n = (D.batches || []).length || 1, q = parseInt(Q.batch, 10);
    if (q >= 1 && q <= n) return q;
    if (PLAT.pid) return 1 + (hash32(PLAT.pid) % n);
    return 1;
  }
  // one screener after every `every` production items, never two in a row, never as the last item
  function interleave(prod, scr, every) {
    var out = [], si = 0;
    for (var i = 0; i < prod.length; i++) {
      out.push(prod[i]);
      if (scr.length && every > 0 && (i + 1) % every === 0 && i < prod.length - 1) { out.push(scr[si % scr.length]); si++; }
    }
    return out;
  }
  var BATCH = null;
  if (CROWD) {
    BATCH = chooseBatch();
    D.tasks = [
      { id: 'training', phase: 'training', type: 'crowd', title: 'Practice', items: D.training || [], q2: D.q2 },
      { id: 'entry', phase: 'entry', type: 'crowd', title: 'Qualification', items: (D.entry && D.entry.items) || [], q2: D.q2 },
      { id: 'production', phase: 'production', type: 'crowd', title: 'Coding',
        items: interleave((D.batches || [[]])[BATCH - 1] || [], D.screeners || [], D.screener_every || 15), q2: D.q2 }
    ];
    if (!S.t) S.t = {};
    S.batch = BATCH; save();
  }
  function phaseTask(name) { for (var i = 0; i < D.tasks.length; i++) if (D.tasks[i].phase === name) return D.tasks[i]; return null; }
  function stamp(name) { if (CROWD && !S.t[name]) { S.t[name] = new Date().toISOString(); save(); } }
  function secs(a, b) { return (a && b) ? Math.round((new Date(b) - new Date(a)) / 1000) : null; }

  // ---- per-item scoring against gold (shared by entry test and screeners) ----
  function scoreItem(t, it) {
    var a = peek(t, it), g = it.d.gold || {}, r = { item_id: it.d.id, kind: it.kind };
    if (it.kind === 'article') {
      r.q1_correct = (g.q1 === undefined) ? true : a.q1 === g.q1;
      r.scope_correct = (g.q1 === 'no') ? r.q1_correct : (!!g.q2 && a.q2 === g.q2);
      r.nonpolitical = g.q1 === 'no';
      r.pass = r.scope_correct && r.q1_correct;
    } else if (it.kind === 'split') {
      var lines = g.lines || [], ok = 0, det = 0, nsplit = 0;
      r.lines = [];
      lines.forEach(function (gl, si) {
        var st = lineState(a, si), cuts = (a.cuts && a.cuts[si]) || [];
        var statusOk = st === gl.status;
        var detected = false;
        if (gl.status === 'split') {
          nsplit++;
          detected = st === 'split' && (gl.cuts == null || cuts.some(function (c) { return gl.cuts.indexOf(c) >= 0; }));
          if (detected) det++;
        }
        if (statusOk) ok++;
        r.lines.push({ si: si, status_correct: statusOk, detected: detected });
      });
      r.n_lines = lines.length; r.status_correct = ok; r.n_split_lines = nsplit; r.split_detected = det;
      r.pass = ok === lines.length && det === nsplit;
    } else {
      r.q4_correct = !!g.q4 && a.q4 === g.q4;
      r.type_hit = g.q4 === 'yes' && a.q4 === 'yes' &&
        ((g.econ && a.econ) || (g.chances && a.chances) || (g.rights && a.rights)) ? true : false;
      r.pass = r.q4_correct && (g.q4 === 'no' || r.type_hit);
    }
    return r;
  }
  function scoreEntry() {
    var t = phaseTask('entry'), its = items(t), rule = (D.entry && D.entry.rule) || {};
    var per = its.map(function (it) { return scoreItem(t, it); });
    var res = { per_item: per, rule: rule };
    if (D.task === 'T1_scope') {
      res.scope_correct = per.filter(function (p) { return p.scope_correct; }).length;
      res.passed = res.scope_correct >= (rule.min_scope_correct || its.length) &&
        per.every(function (p) { return p.q1_correct; });
    } else if (D.task === 'T1_split') {
      res.status_correct = per.reduce(function (s_, p) { return s_ + p.status_correct; }, 0);
      res.n_lines = per.reduce(function (s_, p) { return s_ + p.n_lines; }, 0);
      res.split_detected = per.reduce(function (s_, p) { return s_ + p.split_detected; }, 0);
      res.n_split_lines = per.reduce(function (s_, p) { return s_ + p.n_split_lines; }, 0);
      res.passed = res.status_correct >= (rule.min_status_correct || res.n_lines) &&
        res.split_detected >= (rule.min_split_detected || 1);
    } else {
      res.q4_correct = per.filter(function (p) { return p.q4_correct; }).length;
      res.type_hit = per.filter(function (p) { return p.type_hit; }).length;
      res.passed = res.q4_correct >= (rule.min_q4_correct || its.length) &&
        res.type_hit >= (rule.min_type_hit || 1);
    }
    return res;
  }
  function scoreScreeners() {
    var t = phaseTask('production'); if (!t) return [];
    return items(t).filter(function (it) { return !!it.d.gold; }).map(function (it) {
      var r = scoreItem(t, it); return { item_id: r.item_id, passed: !!r.pass, answered: done(t, it) };
    });
  }

  // ---- crowd screens ----
  var PREVIEW = (params().preview === 'training') || !!D.preview_training;
  function previewEnd() {
    setHead(D.title || 'Annotation task', null);
    app.innerHTML = '';
    app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'End of the preview' }),
      el('p', { text: 'In the real study the qualification would start here. This preview shows only the instructions and the practice examples.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [el('button', { text: 'Back to the start', onclick: crowdMenu }), el('button', { cls: 'primary', text: 'See the examples again', onclick: function () { startPhase('training'); } })]));
  }
  function crowdMenu() {
    setHead(D.title || 'Annotation task', null);
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var where = PLAT.name === 'none' ? 'Opened outside a recruitment platform: nothing you enter is collected.'
      : 'Opened from ' + (PLAT.name === 'prolific' ? 'Prolific' : 'CloudResearch') +
        (PLAT.pid ? '.' : ' (no participant id in the link).') + (PLAT.dry ? ' Dry run: nothing will be submitted.' : '');
    var steps = [
      D.guide_html ? 'Guidelines: the definitions, the task and examples with the correct and the wrong coding. Please read them first; you can reopen them at any time with the Guidelines button at the top.' : null,
      (D.training || []).length ? 'Practice (short, not scored): ' + (D.training || []).length + ' example' + ((D.training || []).length === 1 ? '' : 's') + ' you code yourself, each followed by the answer of the research team.' : null,
      'Qualification: ' + ((D.entry && D.entry.items) || []).length + ' items you code yourself; you continue only if you pass.',
      'Coding: ' + ((D.batches || [[]])[BATCH - 1] || []).length + ' items. At the end you receive your completion code.'];
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: D.title || 'Annotation task' }),
      el('p', { text: D.intro || '' }),
      PREVIEW ? el('p', { cls: 'how', text: 'PREVIEW for the research team: this file shows the instructions and the practice examples exactly as coders will see them. Nothing is recorded or sent.' }) : el('span'),
      el('ol', null, steps.filter(function (x) { return x; }).map(function (x) { return el('li', { text: x }); })),
      el('p', { cls: 'how', text: where })]));
    var label = 'Start', target = 'training';
    if (S.entry && S.entry.passed) { label = 'Continue coding'; target = 'production'; }
    else if (S.entry && !S.entry.passed) { label = 'Show result'; target = 'screenout'; }
    else if (S.t.training_end) { label = 'Continue to qualification'; target = 'entry'; }
    else if (S.t.training) { label = 'Continue the practice'; target = 'training'; }
    else if (D.guide_html && !S.t.guide_read) { label = 'Start'; target = 'guide'; }
    app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: label, onclick: function () {
      if (target === 'screenout') return screenOut();
      if (target === 'guide') return showGuide();
      startPhase(target);
    } })]));
  }
  // ---- guidelines: the first screen after the introduction; reopenable from the header at any time ----
  function guideNode() { var n = el('div', { cls: 'card guide' }); n.innerHTML = D.guide_html || ''; return n; }
  function showGuide() {
    setHead(D.title || 'Annotation task', null); stamp('guide_open');
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('p', { cls: 'how', text: 'Please read the guidelines below. The same text stays available during the whole task: click Guidelines at the top of the page.' }));
    app.appendChild(guideNode());
    app.appendChild(el('div', { cls: 'nav' }, [el('button', { text: 'Back', onclick: menu }),
      el('button', { cls: 'primary', text: 'I have read the guidelines \u2014 continue to the ' + ((D.training || []).length ? 'practice' : 'qualification'), onclick: function () {
        S.t.guide_read = new Date().toISOString(); save(); startPhase('training'); } })]));
    window.scrollTo(0, 0);
  }
  function guideOverlay() {
    var ov = el('div', { cls: 'overlay' });
    var box = el('div', { cls: 'overlay-box' }, [
      el('div', { cls: 'nav' }, [el('span', { cls: 'ttl', text: 'Guidelines' }), el('button', { cls: 'primary', text: 'Close', onclick: function () { ov.remove(); } })]),
      guideNode()]);
    ov.appendChild(box); ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  function startPhase(name) {
    var t = phaseTask(name); stamp(name);
    if (name === 'training' && !(D.training || []).length) { S.t.training_end = S.t.training_end || new Date().toISOString(); save(); return startPhase('entry'); }   // no practice items: straight to the qualification
    if (name === 'training') return showTraining(t, 0);
    start(t);
  }
  function goldSummary(it) {
    var g = it.d.gold || {}, out = [];
    if (it.kind === 'article') {
      if (g.q1 !== undefined) out.push('Q1 political: ' + g.q1);
      if (g.q2) out.push('Q2 scope: ' + g.q2);
    } else if (it.kind === 'qs') {
      out.push('Q4 refers to equality: ' + g.q4);
      if (g.q4 === 'yes') out.push('Q5 kind: ' + ['econ', 'chances', 'rights'].filter(function (k) { return g[k]; })
        .map(function (k) { return { econ: 'economic equality', chances: 'equal chances', rights: 'equal rights' }[k]; }).join(', '));
      if (g.q4 === 'yes' && g.q5) out.push('Q6 position: ' + g.q5);
    } else if (it.kind === 'split') {
      (g.lines || []).forEach(function (gl, si) {
        var c = (gl.cuts || []).length;
        out.push('Line ' + (si + 1) + ': ' + (gl.status === 'split'
          ? (c + 1) + ' quasi-sentences (the cut' + (c > 1 ? 's are' : ' is') + ' marked in the line above)'
          : 'one quasi-sentence \u2014 no cut'));
      });
    }
    return out;
  }
  function expertCard(t, it) {
    var g = it.d.gold || {}, kids = [el('h3', { text: 'Answer of the research team' })];
    if (it.kind === 'split') {
      (it.d.sentences || []).forEach(function (snt, si) {
        var gl = (g.lines || [])[si] || {}, tk = toks(snt), cuts = gl.cuts || [], seg = 0;
        var line = el('div', { cls: 'sent', lang: lang(t) });
        tk.forEach(function (w, j) {
          if (j > 0 && cuts.indexOf(j) >= 0) { seg++; line.appendChild(el('span', { cls: 'gap cut' })); }
          else if (j > 0) line.appendChild(el('span', { cls: 'gap' + (seg ? (seg % 2 ? ' seg1' : ' seg2') : '') }));
          line.appendChild(el('span', { cls: 'w' + (seg ? (seg % 2 ? ' seg1' : ' seg2') : ''), text: w }));
        });
        line.appendChild(el('span', { cls: 'cnt', text: gl.status === 'split' ? ((cuts.length || 1) + 1) + ' quasi-sentences' : 'one quasi-sentence' }));
        kids.push(line);
      });
    }
    kids = kids.concat(goldSummary(it).map(function (x) { return el('p', { cls: 'ans', text: x }); }))
      .concat(g.note ? [el('p', { cls: 'how', text: g.note })] : []);
    return el('div', { cls: 'card gold' }, kids);
  }
  function showTraining(t, i) { return show(t, i); }
  function entryFinish() {
    S.entry = scoreEntry(); S.t.entry_end = new Date().toISOString(); save();
    if (S.entry.passed) {
      app.innerHTML = '';
      app.appendChild(el('div', { cls: 'card' }, [el('h2', { text: 'Qualification passed' }),
        el('p', { text: 'Thank you. The coding task starts now. From here on there are no more examples with answers.' })]));
      app.appendChild(el('div', { cls: 'nav' }, [el('span'), el('button', { cls: 'primary', text: 'Start coding', onclick: function () { startPhase('production'); } })]));
      return;
    }
    screenOut();
  }
  function screenOut() {
    setHead(D.title || 'Annotation task', null);
    app.innerHTML = '';
    var card = el('div', { cls: 'card' }, [el('h2', { text: 'Thank you for taking part' }),
      el('p', { text: 'Based on the qualification items, this study is not a good match, so it ends here. ' +
        'You will be paid for the time spent on the qualification according to the study description.' })]);
    app.appendChild(card);
    var nav = el('div', { cls: 'nav' }, [el('span')]);
    app.appendChild(nav);
    function showCode() {
      var code = CFG.screenout_code || '';
      card.appendChild(el('p', { text: 'Your code is:' }));
      card.appendChild(el('p', null, [el('span', { cls: 'code', text: code })]));
      var url = '';
      if (PLAT.name === 'prolific') url = CFG.prolific_screenout_url || ('https://app.prolific.com/submissions/complete?cc=' + encodeURIComponent(code));
      else if (PLAT.name === 'cloudresearch') url = CFG.cloudresearch_screenout_url || '';

  // ---------- the splitting widget ----------
  function sentence(a, s, si, lg, onchange) {
    var tk = toks(s);
    if (!a.cuts) a.cuts = {};
    if (!a.nosplit) a.nosplit = {};
    var box = el('div', { cls: 'sent', lang: lg });
    var last = 0, lastJ = -1;

    function toggle(j) {
      var now = Date.now();
      if (j === lastJ && now - last < 400) return;   // only a repeat on the SAME gap is a double-click
      last = now; lastJ = j;
      var c = (a.cuts[si] || []).slice(), k = c.indexOf(j);
      if (k >= 0) c.splice(k, 1); else c.push(j);
      c.sort(function (x, y) { return x - y; });
      a.cuts[si] = c;
      if (c.length) delete a.nosplit[si];            // a split answers the line
      draw(); onchange();
    }
    function one() {
      if (a.nosplit[si]) delete a.nosplit[si];
      else { a.nosplit[si] = true; a.cuts[si] = []; }
      draw(); onchange();
    }
    function draw() {
      var cuts = a.cuts[si] || [], seg = 0, st = lineState(a, si);
      box.innerHTML = '';
      box.className = 'sent' + (st === 'unresolved' ? ' todo' : '');
      function shade() { return seg === 0 ? '' : (seg % 2 ? ' seg1' : ' seg2'); }
      tk.forEach(function (w, j) {
        if (j > 0) {
          var on = cuts.indexOf(j) >= 0;
          if (on) seg++;
          box.appendChild(el('span', { cls: 'gap' + (on ? ' cut' : shade()), title: on ? 'Remove this split' : 'Split here',
            onclick: function () { toggle(j); } }));
        }
        box.appendChild(el('span', { cls: 'w' + shade(), text: w }));
      });
      // offered only while the line carries no split, so marking it can never discard one
      if (!cuts.length) {
        box.appendChild(el('button', { cls: 'nos' + (st === 'one_qs' ? ' on' : ''), type: 'button',
          text: (st === 'one_qs' ? '\u2611' : '\u2610') + ' one quasi-sentence', onclick: one }));
      } else {
        box.appendChild(el('span', { cls: 'cnt', text: (cuts.length + 1) + ' quasi-sentences' }));
      }
    }
    draw();
    return box;
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];

            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));

  function csvText() {

    }).join('\r\n');

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {

      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });

    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();

  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
