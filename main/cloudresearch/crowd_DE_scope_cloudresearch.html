<script id="data" type="application/json">{"built": "20261102123642", "mode": "crowd", "task": "T1_scope", "language": "German", "lang": "de", "title": "Political articles: national or international?", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "DEC_033", "press": false, "title": "", "paras": ["rüb. WASHINGTON, 7. Mai. In beispielloser Deutlichkeit hat die amerikanische Regierung Peking Angriffe auf die Computernetze des Pentagons und anderer Ministerien in Washington sowie von Privatunternehmen vorgeworfen. \"China nutzt seine Möglichkeiten zum Eindringen in Computernetze, um Informationen über diplomatische, wirtschaftliche sowie militärische Belange zu sammeln\", heißt es im Jahresbericht des Verteidigungsministeriums zur Entwicklung des chinesischen Militärs.", "Die Hacker-Angriffe könnten \"direkt auf die chinesische Regierung und das Militär zurückgeführt\" werden. China könne die gestohlenen Informationen für seine eigene Rüstungsindustrie nutzen. In dem Bericht wird außerdem festgestellt, dass Peking bei der Entwicklung der Tarnkappentechnik für Jagdbomber sowie beim Aufbau seiner Flugzeugträgerflotte beträchtliche Fortschritte gemacht habe. Chinas Aufrüstung reflektiere das Bestreben Pekings, größeren Einfluss in der gesamten Region zu gewinnen, statt sich wie in den vergangenen Jahrzehnten vor allem auf einen möglichen Konflikt mit Taiwan vorzubereiten. Nach offiziellen Angaben Pekings ist der Militäretat in den letzten zehn Jahren inflationsbereinigt jährlich um etwa zehn Prozent auf 106 Milliarden Dollar im Jahr 2012 gestiegen.", "Die tatsächlichen Ausgaben dürften nach Einschätzung des Pentagons aber zwischen 135 und 215 Milliarden Dollar gelegen haben. Der amerikanische Verteidigungsetat liegt im laufenden Haushaltsjahr bei mehr als 500 Milliarden Dollar. Die Regierung in Peking wies die Vorwürfe zurück. Die Sprecherin des chinesischen Außenministeriums Hua Chunying sagte, das Pentagon habe schon oft \"unverantwortliche Kommentare zu Chinas normalen und gerechtfertigten Rüstungsaufwendungen abgegeben\". China verfolge lediglich den Schutz seiner nationalen Unabhängigkeit und Souveränität.", "Die Hacker-Vorwürfe entbehrten jeder Grundlage und beschädigten die Bemühungen um Zusammenarbeit und Dialog."], "gold": {"q2": "international", "q1": "yes"}, "note": "Q1 pilot 2 entry item (chosen 2 Nov 2026, SZ + assistant): US Defense Dept report on Chinese hacking — foreign politics, no German actor"}, {"id": "DEC_014", "press": false, "title": "", "paras": ["tifr. KOBLENZ, 4. Dezember. Die Innenminister der Länder haben nach einem Treffen mit dem Leiter des Bundesamts für Migration und Flüchtlinge (BAMF), Frank-Jürgen Weise, in Koblenz heftige Kritik an diesem geübt. Dem Vernehmen nach wurde sein Auftritt allgemein als ignorant bis arrogant aufgefasst.", "Das hatte süffisante Äußerungen der Landesminister zur Folge. Der Vorsitzende der Innenministerkonferenz, der Rheinland-Pfälzer Roger Lewentz (SPD), sagte auf einer Pressekonferenz, Weise sei \"gerngesehener Gast, aber Gast\". Sein nordrhein-westfälischer Amtskollege Ralf Jäger (SPD) sprach davon, dass Weise \"seine Rolle noch finden muss\". Der Innenminister von Mecklenburg-Vorpommern, Lorenz Caffier (CDU), fügte hinzu, er habe dem nichts hinzuzufügen. Später setzte wiederum Jäger nach: \"Herr Weise ist Präsident einer nachgeordneten Behörde des Bundesinnenministers.\" Einer der Auslöser für die Verstimmung war eine kurze Schilderung des saarländischen Innenministers Klaus Bouillon (CDU), in dessen Landesaufnahmestelle Flüchtlinge im Zwei-Schicht-Betrieb registriert werden.", "Auf seine Nachfrage, ob das nicht auch für das BAMF erwogen werden könnte, reagierte Weise nach Darstellung der Landesminister zurückhaltend bis ablehnend. Angeblich verwies er auf rechtliche Hindernisse. Das führte Caffier zu der Anmerkung: \"Im Zweifelsfall sind auch im öffentlichen Dienst Überstunden möglich.\" An die Adresse von Bundeskanzlerin Angela Merkel (CDU) gerichtet, sagte er, was den Kommunen und Ländern abverlangt werde, müsse auch vom Bund geleistet werden. Für weiteren Unmut sorgte, dass Weise sich angeblich außerstande sah, den Innenministern zu sagen, wie viele Asylanträge etwa in diesem Jahr bearbeitet werden könnten. Was er mitteilte, war, dass er die Produktivität bei der Bearbeitung habe steigern können.", "Auch die Zahl der täglich bearbeiteten Anträge habe sich erhöht, von tausend auf 1600. Das halten die Minister aber für nicht ausreichend. Es gebe einen Rückstand von 300000 nicht bearbeiteten Anträgen, sagte Lewentz, hinzu kämen Hunderttausende Flüchtlinge, die ihren Antrag noch nicht gestellt hätten. Die Minister wiesen im Gespräch mit Weise darauf hin, dass selbst bei der konservativen Annahme, dass täglich 3000 Flüchtlinge nach Deutschland kämen, 1600 bearbeitete Anträge nicht genug seien. Die Differenz von 1400 habe Weise aber \"nicht anerkannt\", sagte Caffier.", "Erst am Vortag hatten die Innenminister dem sicherheitspolitisch motivierten Vorhaben von Bundesinnenminister Thomas de Maizière (CDU) zugestimmt, die Einzelfallprüfung auch für syrische Flüchtlinge wieder einzuführen. Sie hatten aber verlangt, das dürfe nicht mit weiteren Verzögerungen bei der Registrierung einhergehen. De Maizière sagte daraufhin, das verstehe sich von selbst."], "gold": {"q2": "national", "q1": "yes"}, "note": "Q1 pilot 2 entry item: Länder interior ministers criticise BAMF head Weise — domestic institutions"}, {"id": "DEC_060", "press": false, "title": "", "paras": ["pps. FRANKFURT, 31. Januar. Als Terry Wogan 2008 als Kommentator des \"Eurovision Song Contest\" (ESC) für die BBC abtrat, gab er seinem Nachfolger Graham Norton den Rat mit auf den Weg, nicht vor dem neunten Lied mit dem Alkohol anzufangen, weil ESC-Abende ziemlich lange dauern können. Wogan saß bekanntermaßen beim alljährlichen Musikwettbewerb stets mit mindestens einer Flasche Wein (oder war es doch Whisky?) in seiner Kommentatorenbox, nicht allein weil er ohne Alkohol so manchen Gesang nicht ertragen hätte, sondern auch weil er gerne und, wie er selbst sagte, meist zu viel trank.", "Der Mann, der wie kein anderer schuld an der ESC-Begeisterung seiner Landsleute war, weil er so herrlich gemein über alles und jeden beim ESC herzog (\"der einzige Sinn der Veranstaltung ist doch, dass man sich über die anderen lustig macht\"), kommentierte erstmals 1971 den Grand Prix, damals noch fürs Radio, wenig später dann fürs Fernsehen. Im Guildo-Horn-Jahr 1998 stand er sogar selbst als Moderator auf der Bühne und führte mit Ulrika Jonsson durch den Abend in Birmingham. Sir Michael Terence Wogan (unser Bild) war Ire. Der 1938 in Limerick geborene spätere Jesuitenschüler, der zunächst in einer Bank arbeitete, bevor er 1956 beim irischen Sender RTÉ anfing, begann in den sechziger Jahren für die BBC zu moderieren. Eine seiner erfolgreichsten Sendungen war \"Wake Up to Wogan\" für Radio 2 mit teilweise acht Millionen Zuhörern.", "Zudem kümmerte er sich um Kinder in Not und gründete die Spendengala \"Children in Need\" mit. 2005 wurde Wogan britischer Staatsbürger und von Königin Elisabeth II. zum Ritter geschlagen. Noch bis zum November war er regelmäßig auf Radio 2 (\"Weekend Wogan\") zu hören. Am Sonntag ist er nach kurzer Krankheit gestorben. Wie seine Frau Helen Joyce, mit der er vier Kinder hatte und fast 51 Jahre verheiratet war, sagte, starb ihr Mann an Krebs. Norton zollte Wogan am Sonntag Respekt und teilte mit, er werde beim ESC im Mai in Stockholm ein Extra-Glas beim neunten Lied auf ihn trinken."], "gold": {"q1": "no"}, "note": "Q1 pilot 2 entry item: obituary of ESC commentator Terry Wogan — not political"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "DE_P2_01", "press": false, "title": "Ritterschlag", "paras": ["In wenigen Tagen, kurz vor Weihnachten, wird Jan Philipp Albrecht 33 Jahre alt. Zum ersten Mal in den vergangenen vier Jahren wird der Europaabgeordnete der Grünen seinen Geburtstag wohl wieder ohne Gedanken zum Datenschutz begehen können. Vor beinahe vier Jahren hat die EU-Kommission ihren Vorschlag zur Reform der EU-Datenschutzregeln vorgelegt. Wenig später erhielt Albrecht, der 2009 als jüngster deutscher Abgeordneter nach einer Parteikarriere bei der Grünen Jugend ins Europaparlament eingezogen war, den Zuschlag für die Aufgabe des Berichterstatters für die Datenschutzgrundverordnung im Europäischen Parlament. Das klingt nach einem langweiligen Posten, ist aber tatsächlich die zentrale Schnittstelle für die Abstimmung der Parlamentslinie zu Gesetzesvorschlägen.", "Der Berichterstatter muss versuchen, die Änderungswünsche der Fraktionen unter einen Hut zu bekommen, und die nötige Mehrheit organisieren. Das ist Fluch und Segen zugleich. Einerseits kann er damit maßgeblich Einfluss auf die Entwicklung des Gesetzes nehmen. Zugleich wird er bei wichtigen Dossiers geradezu von Lobbyisten und den Vertretern der anderen Fraktionen mit Änderungswünschen überhäuft. 3999 davon häuften sich am Ende der Beratungen im Europaparlament auf dem Schreibtisch von \"JPA\", ein Parlamentsrekord. Der in Siegen und Wolfenbüttel aufgewachsene Jurist, der in Bremen, Brüssel und Berlin studierte, ist die Rolle des \"Underdogs\" gewohnt.", "Eine große Flagge des Fußballklubs FC St. Pauli dominiert sein Büro im Brüsseler Parlament. Dennoch brachten ihn die Verhandlungen über die Datenschutzgrundverordnung an den Rand seiner Kräfte. Es ist die beeindruckendste Szene in dem Dokumentarfilm \"Democracy - im Rausch der Daten\", wie Albrecht nach einer neuen Runde im Parlament mit leerem Blick auf seinem Stuhl sitzt und \"Wir werden das nie fertig bekommen\" sagt. Sie haben es fertig bekommen in der Nacht zum Mittwoch - in den abschließenden Verhandlungen zwischen Europaparlament und Ministerrat, mit Albrecht als Chefunterhändler.", "Der verheiratete Grüne, der sein Privatleben gut abschirmt und am Anfang vehement für viel striktere Datenschutzstandards als nun beschlossen eintrat, erwies sich dabei als der Pragmatiker, der nach vier Jahren Verhandlungen für eine Einigung gebraucht wird. \"Er wollte einfach nur noch fertig werden und einen Schlussstrich ziehen\", sagen viele, die ihn gut kennen. Auch das ist manchmal nötig, um Kompromisse zu finden. Für den Grünen ist die Einigung ein Ritterschlag. Er hat die Aufmerksamkeit, die der Datenschutz 2013 nach den Enthüllungen des ehemaligen amerikanischen Geheimdienstmitarbeiters Snowden erhielt, geschickt genutzt, um sich zu profilieren.", "Die Hauptrolle in dem Film \"Democracy\" fiel ihm faktisch vor die Füße. Die Dreharbeiten dafür begannen Anfang 2012, als niemand wusste, dass der Datenschutzvorschlag der Kommission einmal ein großes Thema werden könnte und der junge Abgeordnete Albrecht auch in Brüssel noch vollkommen unbekannt war. HENDRIK KAFSACK"]}, {"id": "DE_P2_02", "press": false, "title": "May: Wir haben die Pflicht, das Ergebnis des Referendums zu verwirklichen", "paras": ["job./now. LONDON/BRÜSSEL, 14. Januar. Am Tag vor der Abstimmung über das Austrittsabkommen mit der EU hat die britische Premierministerin Theresa May vor einem Stopp des Brexits gewarnt. In einer Rede vor Fabrikarbeitern in Stoke-on-Trent sagte sie, ein ungeregelter Austritt bleibe zwar eine ernstzunehmende Möglichkeit, sollte ihr Deal an diesem Dienstag niedergestimmt werden.", "Wahrscheinlicher sei aber, dass das Parlament in eine \"Lähmung\" verfallen werde, an deren Ende kein Brexit stehe. Sie appellierte an die Gegner des Abkommens, die Konsequenzen zu bedenken, und warnte vor den \"katastrophalen Folgen\", die eine Umkehr des Referendumsergebnisses für das Vertrauensverhältnis zwischen Parlament und Wählern haben würde. \"Wir haben die Pflicht, das Ergebnis des Referendums zu verwirklichen\", sagte sie. Vor dem britischen Unterhaus wiederholte May ihre Warnung. Sollte das Parlament den Brexit blockieren, wäre dies ein \"Angriff auf unsere Demokratie\".", "Handelsminister Liam Fox gab am Montag als erstes Kabinettsmitglied zu, dass eine Bestätigung des Austrittsabkommens durch das Unterhaus an diesem Dienstagabend \"unwahrscheinlich\" sei. Der Parlamentarische Geschäftsführer der Konservativen im Unterhaus, Gareth Johnson, legte am Montag sein Amt nieder mit der Begründung, das Austrittsabkommen laufe den \"Interessen der Nation\" zuwider. Sollte der Deal durchfallen, muss May dem Unterhaus spätestens am Montag kommender Woche einen Alternativplan vorlegen. Oppositionsführer Jeremy Corbyn hat ein Misstrauensvotum gegen May angekündigt, das \"bald\" eingebracht werden solle. In einem Brief an May versicherten EU-Ratspräsident Donald Tusk und EU-Kommissionspräsident Jean-Claude Juncker, die 27 EU-Partner wollten auf die Auffanglösung (\"Backstop\") für Nordirland allenfalls vorübergehend zurückgreifen.", "Sie soll für den Fall, dass die Gespräche über einen Partnerschaftsvertrag der EU mit London länger als geplant dauern, eine \"harte Grenze\" zwischen Nordirland und dem EU-Mitglied Irland verhindern. Die von den EU-Partnern dazu im Dezember veröffentlichte Erklärung habe einen \"juristischen Wert\". Die von May gewünschte Zusage zur \"Backstop\"-Befristung gaben Juncker und Tusk nicht. \"Wir sind nicht in der Lage, uns auf etwas zu verständigen, das den Austrittsvertrag verändern oder mit ihm nicht in Einklang stehen würde\", heißt es in dem Schreiben. (Siehe Seite 3 sowie Wirtschaft, Seite 17.)"]}, {"id": "DE_P2_03", "press": false, "title": "Großes Unwissen bei Masern und Impfungen", "paras": ["agr. BERLIN, 5. Oktober. Die Wissenslücken vieler junger Menschen bei den Themen Masern und Impfschutz sind groß. Zu diesem Schluss kommt die Bundeszentrale für gesundheitliche Aufklärung (BZgA) in einer Studie.", "\"Es besteht ganz großer Informationsbedarf\", sagte BZgA-Direktorin Elisabeth Pott am Freitag in Berlin. Erste Ergebnisse der Repräsentativbefragung zeigen: 81 Prozent der nach 1970 geborenen Erwachsenen in Deutschland haben keine Ahnung, dass für sie seit 2010 eine Masern-Impfempfehlung besteht, sofern sie in der Kindheit nicht oder nur einmal geimpft wurden. Nur 13 Prozent dieser noch unzureichend vor Masern geschützten Altersgruppe beabsichtigten, sich impfen zu lassen. 60 Prozent äußern, dass sie niemand auf die Notwendigkeit der Impfung hingewiesen hat. 24 Prozent der Befragten geben an, bislang von einer Impfung abgesehen zu haben, weil sie Masern für keine besonders schwere Krankheit halten. Offensichtlich betrachteten Menschen Krankheiten, die sie zu den Kinderkrankheiten zählten, als harmlos. Dabei gehörten die Masern zu den \"ansteckendsten Krankheiten\".", "Sie könnten zu Mittelohr-, Lungen- oder Gehirnentzündungen führen. Diese Wissensdefizite greift die BZgA nun mit der Kampagne \"Deutschland sucht den Impfpass\" auf. Plakate und Postkartenaktionen, auch in Schulen und Universitäten, sowie ein interaktiver Video-Impfcheck im Internet sollen die Aufmerksamkeit auf das Thema lenken. \"Impfen muss wieder einen anderen Stellenwert haben\", forderte Direktorin Pott. Das Ziel der Weltgesundheitsorganisation, die Masern in Europa zu beseitigen, sei bei 1607 Masernfällen allein in Deutschland (2011) noch nicht erreicht."]}, {"id": "DE_P2_04", "press": false, "title": "Mutter wirft ihre drei Kinder aus dem Fenster", "paras": ["reb. DÜSSELDORF, 13. Juni. In Krefeld soll eine Mutter am frühen Montagmorgen ihre drei kleinen Kinder aus dem Fenster ihrer Wohnung geworfen haben. Anschließend versuchte die Frau, sich in der Wohnung das Leben zu nehmen.", "Die zwei Jungen im Alter von drei und fünf Jahren sowie ihre sechs Jahre alte Schwester erlitten nach Angaben der Polizei lebensgefährliche Verletzungen. Ein zufällig vorbeikommender Radfahrer fand die schreienden und weinenden Kinder um kurz vor fünf Uhr früh auf dem Gehweg neben dem Haus im Krefelder Stadtteil Hüls und alarmierte die Polizei. Wie die Staatsanwaltschaft Krefeld mitteilte, ist die alleinerziehende Mutter, die anders als ihre Kinder nicht in Lebensgefahr schwebt, dringend tatverdächtig. Sie sei zur Tatzeit allein mit ihren Kindern in der Wohnung im Dachgeschoss des Mehrfamilienhauses gewesen. Eine Beteiligung Dritter schließen die Ermittler aus.", "Warum die 33 Jahre alte Frau, die getrennt vom Vater der Kinder lebte, die Tat begangen haben könnte, sei \"völlig unklar\", so die Ermittler. \"Wir stehen noch ganz am Anfang\", sagte ein Sprecher der Krefelder Staatsanwaltschaft. Die Verdächtige habe sich bisher noch nicht zu den Vorwürfen äußern wollen. Auch wie die Frau versucht hat, sich selbst zu töten, wollten die Ermittler zunächst nicht mitteilen. Es werde zurzeit noch geprüft, ob gegen sie Untersuchungshaft beantragt wird oder ob sie möglicherweise in die Psychiatrie verbracht werden muss.", "Der Online-Dienst der \"Rheinischen Post\" zitierte einen Anwohner mit den Worten, die Frau habe oft mit ihren Kindern auf der Terrasse gespielt. \"Sie hat den Eindruck vermittelt, dass sie ihre Kinder abgöttisch liebt.\""]}, {"id": "DE_P2_05", "press": false, "title": "Scharfe Kritik an Pegida-Demonstranten in Sachsen", "paras": ["lock. DRESDEN, 14. Oktober. Das Mitführen eines symbolischen Galgens für Bundeskanzlerin Angela Merkel (CDU) und Bundeswirtschaftsminister Sigmar Gabriel (SPD) bei einer Pegida-Demonstration hat in Sachsen zu scharfen Reaktionen geführt. \"Wer Menschen bespuckt und angreift, wer Politiker an einen Galgen knüpfen will, wer die Presse bedroht, 'Volksverräter' brüllt, wer von Berliner Diktatoren schwafelt, wer Rassenschande schreit, wer hetzt und Hass sät, der steht außerhalb dessen, was für Demokraten akzeptabel ist\", sagte Sachsens stellvertretender Ministerpräsident Martin Dulig (SPD).", "Unter dem Jubel vieler würden bei Pegida-Demonstrationen Grenzen überschritten. \"Das sollte sich jeder vor Augen führen, der bei diesen Demonstrationen mitmarschiert und damit selbst Hass und Angst verantwortet.\" Auch der CDU-Fraktionsvorsitzende Frank Kupfer, der den Demonstranten bisher mit Verständnis begegnet war, erklärte, es sei eine Grenze überschritten worden. \"Jeder, der dort mitläuft, muss sich ernsthaft fragen, ob er all das noch mit sich vereinbaren kann.\" Sachsens Justizminister Sebastian Gemkow (CDU) sagte, er halte die \"weitere Eskalation von Sprache und Gestus für brandgefährlich\". Zuvor hatte Bundestagspräsident Norbert Lammert (CDU) Pegida \"unverantwortliche Stimmungsmache\" vorgeworfen. Selbstverständlich dürften in Deutschland Sorgen, Zweifel und Kritik auf der Straße geäußert werden.", "Angesichts der jüngsten Entgleisungen aber müsse sich jeder Teilnehmer fragen, ob er sich dafür mit in Anspruch nehmen lassen wolle. Nach Angaben der Staatsanwaltschaft Dresden konnte die Identität des Mannes, der den Galgen am Montagabend zeigte, noch nicht ermittelt werden. Der ermittelnde Staatsanwalt hat unterdessen Morddrohungen erhalten. In der Poststelle der Staatsanwaltschaft seien mehrere entsprechende E-Mails eingegangen, sagte ein Sprecher des Justizministeriums am Mittwochabend."]}, {"id": "DE_P2_06", "press": false, "title": "Ein Fortschritt", "paras": ["Für die Flüchtlingspolitik der Bundesregierung, die bisher von so wenig Erfolg gekrönt war, ist das Abkommen mit Marokko ein Fortschritt. Aus den Maghreb-Staaten kommen immer mehr Migranten, und in diesem Fall ist die Motivlage ziemlich eindeutig: Politische Verfolgung im Sinne des deutschen und europäischen Asylrechts gibt es dort sehr wenig; es handelt sich vorwiegend um Wirtschaftsmigration. Deshalb ist es richtig, dass der Bundesinnenminister in diesen Ländern auf eine zügige Rücknahme von abgelehnten Asylbewerbern drängt. Das Asylrecht ist für Schutzbedürftige gedacht, nicht für Arbeitssuchende. Die Erfahrung mit den Balkan-Ländern hat erst im vergangenen Jahr gelehrt, dass sich eine enge Zusammenarbeit mit den Regierungen der Herkunftsländer schnell in der Asylbewerberstatistik niederschlägt.", "Gerade für Arbeitsmigranten spielen Kostenerwägungen eine große Rolle. Wenn sie den Eindruck haben, dass die lange und teure Reise nach Europa mit einer Abschiebung enden könnte, dann werden die allermeisten von ihrem Vorhaben absehen. Allerdings sollte man die Wirkung von de Maizières Bemühungen nicht überschätzen. Von den mehr als 90 000 Asylsuchenden, deren Ankunft im Januar in Deutschland registriert wurde, kamen gerade einmal 1600 aus Marokko. Die größten Herkunftsländer bleiben Syrien, der Irak und Afghanistan.", "Hier kann man nur hoffen, dass die Waffenruhe in Syrien und die jüngsten Fortschritte im Kampf gegen den sogenannten \"Islamischen Staat\" mittelfristig zu einem Rückgang der Flüchtlingszahlen führen. Eine restriktivere Flüchtlingspolitik sollte nicht zur Folge haben, dass Europa sich gegenüber den Maghreb-Staaten abschottet oder sie ihrem Schicksal überlässt. Das libysche Beispiel zeigt, was geschehen kann, wenn ein Land in der südlichen Nachbarschaft der EU instabil wird. Es gab einmal die Idee der \"zirkulären Migration\", die gerade nordafrikanischen Arbeitskräften einen zeitlich begrenzten Zugang zum europäischen Arbeitsmarkt bieten sollte. Wenn in der Wirtschaft tatsächlich ein Bedarf an Arbeitskräften aus nichteuropäischen Ländern besteht, könnte er auf diese Weise sinnvoller gestillt werden als durch eine ungesteuerte Einwanderung über das Asylrecht."]}, {"id": "DE_P2_07", "press": true, "title": "", "paras": ["„Dies ist ein großer Erfolg für seinen jahrzehntelangen Kampf. Unser Einsatz für den US-amerikanischen Journalisten wird weitergehen. DIE LINKE fordert für Mumia Abu-Jamal ein faires Verfahren und unterstützt seine Forderung, den Prozess neu zu eröffnen“, so Annette Groth zur Ankündigung der Staatsanwaltschaft, ihre Forderung nach Todesstrafe für Mumia Abu-Jamal fallen zu lassen. Die menschenrechtspolitische Sprecherin der Fraktion DIE LINKE weiter:„Endlich kommt Mumia Abu Jamal aus der Todeszelle. 30 Jahre nach seiner Festnahme nimmt dieser Justizskandal endlich eine Wendung in die richtige Richtung. „Free Mumia“ haben Hundertausende in den letzten 30 Jahren in fast allen Ländern der Welt gefordert und um das Leben von Mumia Abu-Jamal gekämpft.", "Durch seine Persönlichkeit und seinen persönlichen Einsatz wurde Mumia zum weltweiten Symbol gegen eine rassistische und menschenrechtsverletzende Justizpolitik in den USA.Wir fordern Präsident Obama auf, sich endlich offensiv für die Abschaffung der Todesstrafe in den USA einzusetzen. Es ist schizophren, wenn die USA auf der einen Seite Demokratie und Rechtsstaatlichkeit beschwören, während sie gleichzeitig die menschenverachtende und barbarische Todesstrafe praktiziert.“"]}, {"id": "DE_P2_08", "press": false, "title": "Ingenieur", "paras": ["Nicht nur für die 33 Bergleute, die am 5. August in der chilenischen Kupfer- und Goldmine San José verschüttet wurden, wird es immer eine Zeit davor und danach geben. Auch André Sougarret Laroquette schlug vor gut zwei Monaten die Stunde. Anruf am Sonntag, dem 8. August, die Stimme des Vorstandsvorsitzenden des staatlichen Bergbaukonzerns Codelco, Gerardo Jofré: Staatspräsident Piñera habe entschieden, die Rettung der Kumpel in staatliche Regie zu nehmen; er, Sougarret, sei ausersehen, diese Aufgabe zu bewältigen.", "Wenige Monate zuvor schien das Leben des 46 Jahre alten Bergbauingenieurs eine andere, nicht minder endgültige Wendung genommen zu haben. 1982 hatte André Sougarret sich wie sein um ein Jahr älterer Bruder Jorge an der \"Universidad de Chile\" eingeschrieben, um sich auf den Spuren des Onkels Luis Sougarret Seitz der \"mineria\" zu verschreiben. 1992 trat Sougarret nach einigen Lehrjahren bei dem Bergbaukonzern Anglo American in die Dienste Codelcos, des größten Kupferproduzenten der Welt. Das Bergwerk \"El Teniente\", etwa 80 Kilometer südlich der Hauptstadt Santiago auf 2500 Meter über dem Meeresspiegel gelegen, schien seine Bestimmung zu sein. Der Ingenieur mit einem MBA der Loyola Universität Maryland stieg schnell in die Spitze des Unternehmens auf. Als Bergwerkdirektor trug er bald die Verantwortung für den Betrieb der mit etwa 2400 Kilometern unterirdischer Strecken größten Kupfermine der Welt. Sougarret überschaute auch die Planungen für die Erschließung neuer Erzvorkommen.", "Im April erläuterte er, wie Codelco in den kommenden Jahren mehr als drei Milliarden Dollar investieren werde, um im Jahr 2017 eine neue Abteilung in Betrieb zu nehmen. 2500 Millionen Tonnen Erz sollen den Fortbestand von \"El Teniente\" auf Jahrzehnte hinaus sichern. Unversehens hieß es Leben retten. Der chilenische Winter war nicht zu Ende, als Sougarret Anfang August an der Spitze einiger seiner besten Mitarbeiter das Leben mit seiner Frau und seinen drei Töchtern gegen das in einer Zeltstadt in der Atacama-Wüste etwa 800 Kilometer nördlich von Santiago tauschte: Unter sich 33 Männer, durch Tonnen losen Gesteins in fast 700 Meter Tiefe von der Außenwelt abgeschnitten; um sich herum die verzweifelten Familien; vor sich die schwierigste Aufgabe seines Lebens. Man habe die Rettungsarbeiten niemand Besserem anvertrauen können, hieß es in Chile schon, als der Kampf gegen die Zeit immer aussichtsloser schien. \"Wir werden es schaffen\" war das Einzige, was sich der Ingenieur während der bangen Tage im August entlocken ließ, in denen sich das Bohrgerät den Kumpel entgegen fräste.", "Am 22. August war er Zeuge, als das erste Lebenszeichen aus der Tiefe ans Tageslicht kam. Am Samstag war er zur Stelle, als seine Mannschaft den ersten Rettungsschacht abgeteuft hatte. Aber erst in dieser Woche wird André Sougarret wohl sagen können: \"Wir haben es geschafft.\" DANIEL DECKERS"]}, {"id": "DE_P2_09", "press": false, "title": "Spielen ums Überleben", "paras": ["Mit einem ganzen Orchester hat Guy Montavon am Samstag in Erfurt ein wohlklingendes Warnsignal an die thüringische Landesregierung gesendet. Von elf Uhr an ließ der Generalintendant des Erfurter Theaters vor der Staatskanzlei aufspielen, um für den Erhalt der Kultur zu demonstrieren. Montavon sorgt sich um die Finanzierung der thüringischen Theaterlandschaft und hatte sich deshalb die Aktion \"Auf die Plätze! Theater! Los!\" ausgedacht.", "Außer in Erfurt spielten auch Orchester und Ensembles in Altenburg, Gera, Eisenach, Meiningen, Nordhausen, Rudolstadt und Weimar eine halbe Stunde lang an öffentlichen Orten sozusagen um ihr Überleben. Zwar existieren zurzeit keine konkreten Sparpläne innerhalb der Regierung von Ministerpräsidentin Christine Lieberknecht (CDU). Aber demnächst werden Land, Kommunen und Theater aushandeln, wie die Spielstätten ab 2012 finanziert werden sollen. Montavon erwartet in Zeiten leerer öffentlicher Kassen schwierige Verhandlungen und wollte deshalb so früh wie möglich ein Zeichen setzen. \"Thüringen ist seit Jahrhunderten ein Ort, an dem berühmte Künstler oder Komponisten gewirkt haben, und heute ein hochkulturelles Bundesland.", "Das muss unbedingt erhalten werden\", sagt Montavon. Einen ersten Erfolg hat er mit seiner Aktion nach eigenen Angaben schon erzielt. Christoph Matschie, der für Kultur zuständige SPD-Minister, habe zugesagt, frühzeitig mit den Thüringer Intendanten sprechen zu wollen. Matschie sei ein Mann, der bemüht sei, die Dinge erst einmal positiv anzugehen und nicht gleich zu sagen, er habe kein Geld, sagt Montavon. Um auch die Ministerpräsidentin vom Erhalt der Kulturlandschaft zu überzeugen, hatte der Erfurter Intendant am Samstag zusätzlich einen Blumenstrauß dabei.", "Eine subtilere Botschaft enthielt das ausgewählte Musikstück: Der 49 Jahre alte Montavon ließ die Ouvertüre zur Oper \"Die lustigen Weiber von Windsor\" spielen. Darin gehe es um starke Frauen, die \"die Oberhand behalten\", sagt Montavon. Er hätte nichts dagegen, wenn das auch Frau Lieberknecht bei den Finanzierungsverhandlungen täte - sofern sie sich als Fürsprecherin der Thüringer Theater entpuppt. MARTIN GROPP"]}, {"id": "DE_P2_10", "press": true, "title": "", "paras": ["Zum Streit zwischen Arbeitsministerin von der Leyen und Familienministerin Schröder über die Ausweitung von Minijobs und zu den jüngsten Niedriglohndaten des Statistischen Bundesamtes, erklärt Brigitte Pothmer, Sprecherin für Arbeitsmarktpolitik: Wir fordern einen gesetzlichen Mindestlohn und die Eindämmung von Minijobs. Wenn, wie die Daten des Statistischen Bundesamtes belegen, die meisten Niedriglöhner Minijobber sind, dann ist die Ausweitung der geringfügigen Beschäftigung falsch und die Einführung eines Mindestlohns richtig. Aber statt endlich einen Mindestlohn-Gesetzentwurf vorzulegen, ist Arbeitsministerin von der Leyen damit beschäftigt, die Grundlagen für die Anhebung der Minijob- Grenze zu schaffen. Dabei ignoriert sie nicht nur die Kritik Ihrer Kabinettskollegin Schröder und die Einwände der Arbeitsmarktexperten, sie handelt offenbar auch gegen ihre eigene Überzeugung. Noch im vergangenen Jahr hatte sie sich gegen die Erhöhung der Minijob-Grenzen ausgesprochen - jetzt exekutiert sie schlicht den schwarz- gelben Koalitionsvertrag.", "Aber auch die Familienministerin hat außer Kritik nichts zu bieten: Aus Koalitionsraison stimmt ihr Ministerium der Ausweitung der Minijobs zu. Leidtragende dieser Politik sind vor allem die Frauen. Sie stellen die Mehrheit bei den Beschäftigten mit einem Stundenlohn unter 8,50 Euro und bei den geringfügig Beschäftigten."]}, {"id": "DE_P2_11", "press": false, "title": "NRW droht Mangel bei Kita-Plätzen", "paras": ["reb. DÜSSELDORF, 19. März. In Nordrhein-Westfalen wird es im kommenden Kindergartenjahr für jedes dritte Kind unter drei Jahren (U3) einen Betreuungsplatz geben. Im statistischen Mittel erfüllen die Städte und Gemeinden damit die vom Deutschen Jugendinstitut für Nordrhein-Westfalen prognostizierte Quote von 33 Prozent.", "Das geht aus einem Überblick hervor, den die nordrhein-westfälische Familienministerin Ute Schäfer (SPD) am Dienstag präsentierte. Frau Schäfer sprach von einer \"beispielhaften Aufholjagd\" und einer \"Punktlandung\". Der Rechtsanspruch auf einen Kita-Platz für ein und zwei Jahre alte Kinder könne wie versprochen vom 1. August an erfüllt werden. Insgesamt gibt es nach Angaben der Ministerin in Nordrhein-Westfalen derzeit rund 144 883 U3-Plätze, davon rund 106 567 in Kitas und 38 316 in der Kindertagespflege.", "Seit 2010 sei so viel Geld in den Kita-Ausbau geflossen wie noch nie zuvor in Nordrhein-Westfalen. Die Aufholjagd sei jedoch nicht beendet. Die Ministerin wies darauf hin, dass sich erst im Mai beziffern lasse, wie viele Plätze die Eltern von unter drei Jahre alten Kindern in Anspruch nehmen. Tatsächlich zeichnet sich schon ab, dass vor allem in größeren Städten der Bedarf zunächst nicht gedeckt werden kann. Dort wird teilweise mit doppelt so hoher Nachfrage gerechnet wie im Landesdurchschnitt.", "Für den nordrhein-westfälischen Städtetag gibt es deshalb \"trotz der Erfolge beim Ausbau von Kindergarten- und Tagespflegeplätzen für unter Dreijährige noch keinen Grund zu Entwarnung\", wie Geschäftsführer Stefan Articus sagte. Den Städten helfe kein Durchschnittswert. \"Deshalb sind das Land und der Bund als Urheber des Rechtsanspruchs auch weiterhin in der politischen Mitverantwortung, sollte es zu Klagen von Eltern kommen.\" Zudem forderte der Städtetag von Nordrhein-Westfalen eine verbindliche Anmeldefrist von drei Monaten, um frühzeitig einen genaueren Überblick über die Ansprüche der Eltern zu bekommen. Die Opposition im nordrhein-westfälischen Landtag kritisierte die rot-grüne Landesregierung. \"Nicht ein virtuelles Drittel der Kinder ist Maßstab der Erfüllung des Rechtsanspruchs, sondern die tatsächliche Nachfrage\", hieß es von der FDP.", "Die Landesregierung feiere einen vermeintlichen Erfolg. Eine Landesregierung, die sich das Motto \"Kein Kind zurücklassen\" auf die Fahne schreibe, dürfe tatsächlich keine Familie bei der versprochenen Kinderbetreuung zurücklassen. Die CDU kritisierte, die Politik von Familienministerin Schäfer sei \"gekennzeichnet von Qualitätseinbußen, Rechentricks und unklaren Fristen\". Mit Notverordnungen und Provisorien werde die Hürde statistisch genommen."]}, {"id": "DE_P2_12", "press": false, "title": "Malaysisches Schmierentheater", "paras": ["Von Till Fähnders SINGAPUR, 7. März. Es ist vielleicht der letzte Akt in einem langen politischen Schmierentheater. Ein malaysisches Berufungsgericht hat den populären Oppositionsführer Anwar Ibrahim am Freitag doch noch wegen angeblicher homosexueller Handlungen schuldig gesprochen. Die Richter folgten damit dem Antrag der Staatsanwaltschaft, die eine Aufhebung des Freispruchs aus dem Jahr 2012 gefordert hatte.", "Durch den Gerichtssaal sei ein Raunen gegangen, als die Entscheidung verkündet wurde, schrieb die Zeitung \"The Malaysian Insider\" in ihrer Onlineausgabe. Im Publikum gab es demnach entsetzte Aufschreie. Das Strafmaß wurde nur wenig später festgesetzt. Es lautet auf fünf Jahre Haft. Anwar Ibrahim und seine Anhänger der oppositionellen Volksallianz (Pakatan Rakyat) haben den Prozess mit Recht als \"politisch motiviert\" verurteilt.", "Das Parteienbündnis hatte der Regierung bei den Parlamentswahlen im vergangenen Jahr viele Stimmen streitig gemacht. Die Opposition wirft der Regierung Wahlmanipulation vor und glaubt, um ihren rechtmäßigen Sieg betrogen worden zu sein. Sie vermutet nun nicht ohne Grund, dass der Zeitpunkt des Urteils von Freitag mit den Nachwahlen für den Wahlkreis Kajang Ende des Monats und der angekündigten Kandidatur Anwar Ibrahims zusammenhängt. Ein Sieg des 66 Jahre alten Politikers schien sicher. Er hätte damit Aussicht gehabt, als \"Chief Minister\" die Macht im wohlhabenden und bevölkerungsreichen Bundesstaat Selangor zu übernehmen.", "Als solcher wäre Anwar dem amtierenden Ministerpräsidenten Najib Razak, der politisch schon stark geschwächt ist, noch gefährlicher geworden. Doch nach der Verurteilung darf Anwar zumindest vorerst keine politischen Ämter mehr übernehmen. Das ist ein schwerer Schlag für die Opposition. Für den erfahrenen Anwar Ibrahim ist es womöglich sogar das politische Aus. Internationale Organisationen reagierten empört auf das demütigende Urteil.", "\"In diesem Prozess ging es allein darum, Anwar Ibrahim aus der Politik zu werfen. Die Regierung war bereit, alles dafür Nötige zu tun\", sagte Phil Robertson von Human Rights Watch in Bangkok. Anwar und seine Familie seien in einem endlosen Albtraum gefangen, sagte Robertson weiter. Das angebliche Verbrechen hätte überhaupt niemals als solches gesehen werden sollen, so der Menschenrechtler. Anwar Ibrahim waren sexuelle Handlungen mit einem früheren Mitarbeiter im Jahr 2008 vorgeworfen worden.", "Homosexualität ist im mehrheitlich muslimischen Malaysia verboten. In der Vergangenheit hatte sich Anwar mehrfach derartiger Vorwürfe vor Gericht erwehren müssen. Einst waren die Staatsanwälte nicht einmal davor zurückgeschreckt, Matratzen mit Spermaspuren in den Gerichtssaal zu schleppen. Auch diesmal sparten die Ankläger wohl nicht mit Details. Sie stellten vor allem die Entscheidung der niedrigeren Instanz in Bezug auf eine umstrittene DNA-Spur in Frage.", "Das Gericht hatte damals entschieden, dass eine Manipulation an der Probe nicht ausgeschlossen sei und die DNA als Beweismittel deshalb nicht ausreiche. Eine Hoffnung bleibt Anwar aber immerhin noch. Seine Anwälte haben angekündigt, in Berufung gehen zu wollen. Er kann bis zur letztinstanzlichen Entscheidung deshalb gegen Zahlung einer Kaution auf freiem Fuß bleiben. Als politischer Zögling des früheren Ministerpräsidenten Mahathir Mohamad (\"Dr.", "M\") war der damalige Finanzminister nach der Finanzkrise in Asien Ende der neunziger Jahre in Ungnade gefallen. Vor Gericht wurde Anwar Ibrahim erst wegen Korruption und dann wegen vermeintlicher Sexualdelikte verurteilt. Nach seiner überraschenden Freilassung im Jahr 2004 wurde er zum wichtigsten Gegenspieler der seit 1957 in der Regierung vertretenen Partei Umno und ihrer Koalition. Im Jahr 2008 noch einmal wegen homosexuellen Geschlechtsverkehrs verurteilt, war er erst vor zwei Jahren freigesprochen worden. Mit dem neuen Schuldspruch haben sich die Justiz und Politik in Malaysia nun aber wieder selbst diskreditiert."]}, {"id": "DE_P2_13", "press": false, "title": "Wilfried W. gesteht unterlassene Hilfeleistung ein", "paras": ["PADERBORN, 14. November. Im Prozess um den Tod zweier Frauen in einem Haus in Höxter hat der Angeklagte Wilfried W. gegenüber dem psychiatrischen Gutachter Michael Osterheider unterlassene Hilfeleistung gestanden. Bisher hatte W. stets alle Schuld an den Taten geleugnet. Laut Osterheider, der am Dienstag noch nicht sein Gutachten vorstellte, sondern zunächst als Zeuge befragt wurde, hob Wilfried W. im Zuge der insgesamt 16 Stunden dauernden psychiatrischen Explorationen mehrmals hervor, er sei \"zu willensschwach\" gewesen, um sich gegen Angelika W., die bei den Misshandlungen die treibende Kraft gewesen sei, durchzusetzen und die Frauen zu schützen.", "Schuld am Tod der Frauen sei er aber nicht. \"Ich habe es einfach nur geschehen lassen, ich hätte mir nie vorstellen können, dass es zu zwei toten Frauen kommt.\" Er selbst sei fast nie handgreiflich geworden, und wenn, dann nur, weil er \"überfordert\" gewesen sei von Angelika W., die \"massiv eifersüchtig\" gewesen sei auf die anderen Frauen. Anders als Angelika W. ausgesagt habe, sei eine der Frauen, Anika W., nicht an einem Schädel-Hirn-Trauma nach einem ungebremsten Sturz auf den Hinterkopf gestorben, sondern weil Angelika W. sie erwürgt habe. Auch gab Wilfried W. gegenüber Osterheider an, Alkoholiker zu sein - wohl, weil er im Gefängnis gehört hatte, dass sich dies strafmildernd auswirken könnte. \"Ist das glaubhaft?\", fragte Richter Bernd Emminghaus den Gutachter.", "\"Nein\", entgegnete Osterheider, nichts weise darauf hin. Und Wilfried W. habe gleichzeitig erklärt, nie unter Entzugserscheinungen gelitten zu haben. Insgesamt wurde durch die Aussagen Osterheiders deutlich, dass Wilfried W. seine Taten auch in all den Befragungen durch den Psychiater kein einziges Mal bereut oder gestanden hat. Das dürfte sich negativ auf das zu erwartende Strafmaß auswirken. Angelika W., die wegen Mordes durch Unterlassen angeklagt ist (wie auch ihr geschiedener Ehemann Wilfried W.), folgte den Ausführungen des psychiatrischen Gutachters ohne erkennbare Regung, während sich Wilfried W. immer wieder interessiert vorbeugte.", "Was sein mögliches Strafmaß angeht, so rechnet W. optimistisch mit \"zehn bis zwölf Jahren\". Danach, auch das hat er dem Psychiater erzählt, will er \"in ein katholisches Kloster ziehen, um nicht allein zu sein und endlich Freunde zu finden\". Wilfried W.s Anwalt Detlev Binder kritisierte die Aussagen Osterheiders scharf und erkundigte sich nach einigen konkreten Fragen, die Osterheider dem Angeklagten während der Exploration zum Tod von Anika W. gestellt hatte. Wie schon zu Beginn des Prozesses vor gut einem Jahr forderte er Emminghaus auf, einen anderen Gutachter zu beauftragen. Der Richter war allerdings nicht bereit, diese Entscheidung in der laufenden Verhandlung zu fällen.", "KATRIN HUMMEL"]}, {"id": "DE_P2_14", "press": true, "title": "", "paras": ["Mit dem geplanten Abkommen zwischen der EU und der Türkei werden sämtliche europäischen Werte verraten und verkauft. Solange Präsident Erdogan einen schmutzigen Krieg gegen Teile der eigenen Bevölkerung führt und die Presse- und Versammlungsfreiheit mit Füßen tritt, müssen die EU-Beitrittsverhandlungen gestoppt statt beschleunigt werden. Wer wie Union und SPD einem Unrechtsregime den Weg in die EU ebnen will, zerstört jede Perspektive auf eine demokratische und friedliche Entwicklung – in der Türkei wie in Europa, erklärt Sahra Wagenknecht zum Beschluss auf dem EU-Flüchtlingsgipfel, neue EU-Beitrittskapitel für die Türkei zu eröffnen. Die Vorsitzende der Fraktion DIE LINKE weiter: Statt etwas gegen Fluchtursachen zu unternehmen, lässt sich die Bundeskanzlerin ausgerechnet vom Terrorpaten Erdogan erpressen, der für die Fluchtwelle aus Syrien mitverantwortlich ist. Wer systematisch Menschenrechte verletzt, darf aber nicht mit Milliardensummen, baldiger Visafreiheit oder gar einem EU-Beitritt belohnt werden.", "Außerdem sind pauschale Abschiebungen in die Türkei mit dem Völkerrecht, dem EU-Recht und dem Grundgesetz schlicht nicht vereinbar. Wir werden den schmutzigen Deal mit der Türkei im Bundestag zur Abstimmung stellen, damit jeder sehen kann, wer sich am Ausverkauf von Grundrechten und europäischen Werten beteiligt."]}, {"id": "DE_P2_15", "press": true, "title": "", "paras": ["„Die Nah-Ost-Reise des US-Präsidenten Obama ist zu einer Reise der Enttäuschung geworden. Weltweit wurde erwartet und erhofft, dass Präsident Obama nach den Wahlen in den USA ernsthaft eine Vermittlungsaktion im Nahen Osten anpacken würde. Das Gegenteil ist der Fall“, so Wolfgang Gehrcke, Mitglied im Vorstand der Fraktion DIE LINKE, anlässlich der Reise Obamas nach Israel inklusive seines Abstechers für ein Gespräch mit dem palästinensischen Präsidenten Abbas und Ministerpräsident Fayyad. Gehrcke: „Obama hat dem israelischen Ministerpräsidenten Netanjahu mit seiner Erklärung der uneingeschränkten Solidarität Handlungsfreiheit für fast jede Aktion im Nahen Osten gegeben. Das betrifft auch die Freiheit für eine mögliche militärische Aktion gegen den Iran.", "Die Feststellung Obamas, der Iran wäre innerhalb eines Jahres in der Lage, die Atombombe zu bauen, ist durch nichts belegt. Gerade am 10. Jahrestag des Beginns des Irak-Krieges erinnert dieses Vorgehen stark an das Agieren von Obamas Amtsvorgänger Bush, dessen Behauptung, Saddam Hussein wäre im Besitz von Massenvernichtungswaffen, längst als Lüge entlarvt worden ist.Das Zeitfenster für eine Zwei-Staaten-Lösung zwischen Israel und Palästina schließt sich. Die israelische Regierung denkt nicht daran, ihre aggressive Siedlungspolitik zurückzunehmen. Das so genannte Nahost-Quartett ist handlungsunfähig, die USA handlungsunwillig.", "Die Aufforderung Obamas zu direkten Verhandlungen zwischen Israel und Palästina ist so allgemein wie zeitlos. Notwendig wäre, die konkreten Verhandlungspunkte zu benennen und Israel aufzufordern, einen schriftlichen Vorschlag für eine Zwei-Staaten-Lösung vorzulegen. Europäische Initiativen sind unverzichtbar. Diese Verantwortung liegt jetzt vor allem bei Deutschland und der Bundeskanzlerin. Wer tatsächlich eine Zwei-Staaten-Lösung will, muss mehr bieten als Sonntagsreden.“"]}, {"id": "DE_P2_16", "press": false, "title": "Pestbakterium löste schon Schwarzen Tod aus", "paras": ["pps. FRANKFURT, 30. August. Der heute bekannte Erreger der Pest, der erst im Jahr 1894 von dem schweizerisch-französischen Bakteriologen Alexandre Émile Jean Yersin entdeckt wurde, war schon im Mittelalter für die wohl schlimmste Seuche in der Menschheitsgeschichte verantwortlich. Dem Schwarzen Tod fielen zwischen 1348 und 1353 fast 25 Millionen Menschen und damit ein Drittel aller Europäer zum Opfer.", "Zweifelsfrei ausgelöst wurde die verheerende Epidemie schon damals von dem Bakterium \"Yersinia pestis\". Zu diesem eindeutigen Ergebnis kommen Wissenschaftler vom Institut für Naturwissenschaftliche Archäologie der Universität Tübingen und der McMaster-Universität in Hamilton in Kanada. Den Forschern um den Tübinger Johannes Krause ist es bei ihren Untersuchungen erstmals gelungen, ein für die Virulenz des Pesterregers wichtiges Ringgenom, das sogenannte \"pPCP1 Plasmid\", das etwa 10 000 Positionen der DNA des Erregers umfasst, aus Skeletten eines Londoner Pestfriedhofs zu entschlüsseln. Dabei wurde die neue Technik des \"molekularen Angelns\" verwendet: Pest-DNA-Fragmente wurden aus einem Zahnextrakt molekular angereichert und anschließend auf DNA-Sequenziermaschinen entschlüsselt. Die so erhaltenen kurzen Fragmente konnten zu einer langen Ringgenom-Sequenz zusammengesetzt werden, die sich als identisch im Vergleich zu heutigen Pesterregern offenbarte.", "Nach Angaben Krauses deutet dies klar darauf hin, dass sich zumindest dieser Teil der Erbinformation in den vergangenen 600 Jahren kaum verändert hat."]}]], "screeners": [{"id": "DEP_007", "press": true, "title": "", "paras": ["„Die Daten zur Kinderbetreuung von der Bertelsmann Stiftung belegen das Versagen der Bundesregierung. Die bekannten Probleme wurden ausgesessen“, kommentiert Norbert Müller, kinder- und jugendpolitischer Sprecher der Fraktion DIE LINKE, den aktuellen Ländermonitor frühkindliche Bildungssysteme der Bertelsmann Stiftung. Müller weiter: „107.200 zusätzliche Vollzeitbeschäftigte zu jährlich rund 4,9 Milliarden Euro mahnt die Studie an, um einen Fachkraft-Kind-Schlüssel herzustellen, der bundesweit einheitlich und nach Ansicht zahlreicher Forscher notwendig wäre, um Frühförderung und gute Standards in der Betreuung zu gewährleisten. Doch dies ist nur eine von mehreren Baustellen. Es fehlt an Fachpersonal, es fehlen bis zu 350.000 Kita-Plätze - ohne die Themen Kitaöffnungszeiten, die immensen Unterschiede bei den Elternbeiträgen und die Aufwertung des Berufsfeldes Kita auch nur gestreift zu haben.", "Der zusätzliche Finanzbedarf im Kitasystem liegt letztendlich bei deutlich über zehn Milliarden Euro jährlich. Dazu schweigt die Bundesregierung konsequent. So darf es nicht weitergehen. DIE LINKE bleibt dabei und fordert ein Kitaqualitätsgesetz und den dauerhaften Einstieg des Bundes auch in die laufenden Betriebskosten der Kitas. Zudem müssen wir schrittweise die Beitragsfreiheit herstellen.", "Nur so können wir sicherstellen, dass Kinder gleichwertige Bedingungen zum Aufwachsen vorfinden und der Verfassungsauftrag zur Herstellung gleichwertiger Lebensverhältnisse im Bundesgebiet umgesetzt wird.“"], "gold": {"q2": "national"}, "note": "Q1 pilot 2 hidden screener: DIE LINKE press release on childcare and federal government"}, {"id": "DEC_046", "press": false, "title": "", "paras": ["Lt. LONDON, 22. April. Die Juwelenräuber, die im August vergangenen Jahres Diamantschmuck im Wert von mehreren Millionen Euro aus einem Juweliergeschäft in der Londoner Bond Street erbeuteten, sind aufgrund von DNA-Spuren ermittelt worden. Neun Mitglieder der Bande stehen jetzt wegen des Raubes vor einem Geschworenengericht in Woolwich.", "Alle bestreiten die Beteiligung an der Tat. Zwei Männer hatten im August, stark geschminkt und in ihrem Äußeren um viele Jahre älter wirkend, die Geschäftsräume des Juweliers Graff in der teuersten Londoner Einkaufsgegend betreten. Die drei Wachleute eines privaten Sicherheitsdienstes an der Eingangstür des Ladens passierten sie unbehelligt. Im Inneren zogen sie Pistolen, zwangen damit Angestellte des Ladens, Vitrinen und Schaufenster zu öffnen, und räumten den Schmuck in einen Plastikbeutel. Als einer der Sicherheitsbeamten Anstalten machte, ihrer habhaft zu werden, gaben die Räuber Schüsse ab.", "Sie verschwanden in mehreren auf der Straße geparkten Wagen; die Beute warfen sie einem wartenden Motorradfahrer zu. Im Laufe der Gerichtsverhandlung stellte sich heraus, dass die Polizeifahnder den Angeklagten durch DNA-Reste auf die Spur kamen, die sich an den Schminkbestecken befanden, mit denen sie Stunden vor der Tat in einem Künstler-Studio ihr Aussehen hatten verändern lassen. Den Mitarbeitern des Schminkstudios hatten die Täter weisgemacht, sie wollten in einem Musikvideo agieren und hätten deswegen älter zu wirken. Offenbar fanden sich Reste ihrer Erbinformationen an einer Mascara-Bürste."], "gold": {"q1": "no"}, "note": "Q1 pilot 2 hidden screener: London jewel robbers on trial — crime report, not political"}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political articles: national or international? — German</h1>\n<p class=\"lead\">You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Political article:</b> an article about politics: government, parties, politicians, elections, laws, economic policy, strikes; foreign politics counts. Not political: politics not mentioned or only in passing (sport, culture, celebrity and human-interest stories, accidents, crime), or a politician as a private person.</p><p class=\"gnum\"><b>1.2 National scope:</b> the main political issue sits in the German national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the national government, parliament or parties respond to it.</p><p class=\"gnum\"><b>1.3 International scope:</b> the article is mainly about another country&#x27;s politics, or about international affairs with no domestic focus.</p>\n<h2>2. Task description</h2><p>You read one article at a time. For a newspaper article answer Q1 (is it about politics?) and, if yes, Q2 (mainly national or international?). Party press releases are political by definition, so for them only Q2 is asked. Judge the whole article, not a single sentence.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Code YES on Q1 when politics is a main theme of the article, not merely mentioned.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> A politician appearing as a private person or as a celebrity does not make an article political. Human-interest stories without a political actor, institution or policy are NO.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = NO</div><p class=\"ttl\">Hund Flecki ist wieder bei seinen Besitzern</p><div class=\"text\" lang=\"de\"><p>STUTTGART, 2. August. Zwölf Tage streunte der kroatische Mischlingshund Flecki durch die Felder und Wiesen am Südrand der Schwäbischen Alb: Am Freitagabend entdeckte eine Frau aus Blaubeuren dann den scheuen Hund bei sich im Garten. Um 19.30 Uhr ging bei der Sanitäterin der &quot;UNA-Tierrettung&quot; sowie bei den Hundehaltern Lisa Metzler und Sven Hossalla die erlösende Meldung ein. Seit Mittwoch hatte ein Team der …</p></div><p class=\"how\">Not political: a lost dog and its owners; no political actor, institution or policy is the topic — although the article appeared in a newspaper&#x27;s politics pages.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><p>Coding the article above as political because a politician or a newspaper politics page is involved.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Decide Q2 by the main topic: domestic institutions, parties and laws → NATIONAL; another country&#x27;s politics or international affairs → INTERNATIONAL. A foreign event discussed through the national reaction to it is NATIONAL.</p><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · national</div><div class=\"text\" lang=\"de\"><p>Impfpflicht Seit Mitte März müssen Mitarbeiterinnen und Mitarbeiter in Pflegeheimen, Krankenhäusern und ähnlichen Einrichtungen nachweisen, dass ihnen ein Vakzin gegen das Coronavirus gespritzt wurde. Beschwerden gegen dieses Gesetz hat das Bundesverfassungsgericht zurückgewiesen. Es hat dabei Aussagen getroffen, die für künftige Pandemien hilfreich sein können Im Zweifel für die Schwachen Das …</p></div><p class=\"how\">Both experts: political and national — a federal law, the Bundesverfassungsgericht and the governing parties are the topic.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ political = YES · international</div><p class=\"ttl\">Kim Jong-un hält Gipfel mit Südkorea für möglich</p><div class=\"text\" lang=\"de\"><p>P.K. PEKING, 1. Januar. Nordkoreas Machthaber Kim Jong-un hat sich überraschend zu einem Treffen mit der südkoreanischen Präsidentin Park Geun-hye bereit erklärt. Wenn die Gegebenheiten und die Atmosphäre es zuließen, gebe es keinen Grund, ein solches Treffen nicht abzuhalten, sagte Kim Jong-un in seiner Neujahrsansprache am Freitag. Es ist das erste Mal, dass der Machthaber, der seit drei Jahren Nordkorea führt, von einem Gipfel spricht. Die Regierung Südkoreas reagierte vorsichtig …</p></div><p class=\"how\">Research team: political and international — North Korea&#x27;s leader and the South Korean government are the topic; no German actor or institution is involved.</p></div><div class=\"card ex ok\"><div class=\"part\">✓ party press release · national</div><div class=\"text\" lang=\"de\"><p>Die drastische Zunahme der Zahl der Aufstocker ist das Ergebnis staatlich forcierten Lohndumpings. Schwarz-Gelb blockiert einen gesetzlichen Mindestlohn und die Gleichbezahlung von Leiharbeit, fördert aber prekäre Beschäftigung wie zum Beispiel Minijobs. Das kommt die Steuerzahler teuer zu stehen. Denn der Staat stockt Jahr für Jahr die Niedriglöhne von Hunderttausenden Erwerbstätigen mit Milliarden Hartz IV-Geldern auf. Für die Betroffenen ist der Gang zum Amt eine Erniedrigung ohnegleichen, kommentiert Sabine Zimmermann Medienberichte …</p></div><p class=\"how\">Party press releases are political by definition, so only Q2 is asked. Research team: national — a German party on the minimum wage, Hartz IV and the federal government.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.4</b> One sentence about another country does not make a national article international, and vice versa — the article as a whole decides.</p></div>"}</script>
