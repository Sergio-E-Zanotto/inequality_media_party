<!doctype html>

<title>Political sentences: where does a new statement begin?</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#d0d5dd; --accent:#2f5bd3;
        --accent-soft:#e8eefc; --hl:#fff0a0; --ctx:#8a94a6; --cut:#d92d20; --how:#f2f4f7; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
header { background:#1f2a44; color:#fff; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header .t { font-weight:600; }
header .p { margin-left:auto; font-size:13px; opacity:.85; }
.bar { height:4px; background:#e4e7ec; } .bar > div { height:4px; background:var(--accent); width:0; transition:width .2s; }
main { max-width:900px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
h2 { font-size:17px; margin:0 0 8px; } h3 { font-size:16px; margin:0 0 6px; }
.part { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
.text { font-size:16px; line-height:1.65; }
.text.long { max-height:60vh; overflow:auto; padding-right:6px; }
.text p { margin:0 0 .8em; } .text p:last-child { margin-bottom:0; }
.ttl { font-weight:700; }
.ctx { color:var(--ctx); }
.qs { background:var(--hl); font-weight:600; padding:1px 3px; border-radius:3px; }
.how { font-size:13px; color:#475467; background:var(--how); border-radius:8px; padding:8px 10px; margin:0 0 10px; white-space:pre-line; }
.opts { display:flex; flex-wrap:wrap; gap:8px; }
.opt { border:1px solid var(--line); border-radius:8px; padding:8px 14px; background:#fff; font:inherit; cursor:pointer; text-align:left; }
.opt:hover { border-color:var(--accent); }
.opt.on { border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
.opt small { display:block; font-weight:400; color:var(--muted); font-size:12px; max-width:250px; }
.stop { font-size:13px; color:var(--muted); font-style:italic; }
.nav { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-bottom:14px; }
button { font:inherit; border-radius:8px; border:1px solid var(--line); background:#fff; padding:8px 16px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:disabled { opacity:.4; cursor:not-allowed; }
.id { font-size:12px; color:var(--muted); }
.sent { padding:8px 0; border-top:1px solid #eaecf0; line-height:2; }
.sent:first-of-type { border-top:0; }
.sent { user-select:none; -webkit-user-select:none; }
.w { padding:2px 0; }
.seg1 { background:#e8f0fe; } .seg2 { background:#fdf0e6; }
.gap { display:inline-block; width:10px; height:1.6em; vertical-align:middle; cursor:pointer; position:relative; }
.gap::after { content:''; position:absolute; left:4px; top:2px; bottom:2px; width:0; border-left:2px dotted transparent; }
.sent:hover .gap::after { border-left-color:#c8ced8; }
.sent .gap:hover::after { border-left:2px solid var(--cut); }
.sent .gap.cut { background:none; width:14px; }
.sent .gap.cut::after { border-left:3px solid var(--cut); left:5px; }
.cnt { font-size:12px; color:var(--cut); margin-left:6px; }
.note { width:100%; min-height:40px; font:inherit; font-size:13px; border:1px dashed var(--line); border-radius:8px; padding:6px 8px; background:transparent; }
.task { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid #eaecf0; flex-wrap:wrap; }
.tname { font-weight:600; } .tright { display:flex; gap:10px; align-items:center; }
input[type=text] { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; width:200px; }
.msg { color:var(--cut); font-size:13px; margin-left:8px; }

/* ---- 2026-10-14 patch: splitting gate, wider targets, platform screens ---- */
.sent { touch-action:manipulation; }
.gap { width:14px; }
.sent .gap.cut { width:18px; }
.sent.todo { background:#fffbea; }
.nos { font-size:12px; margin-left:10px; padding:2px 10px; border:1px solid var(--line);
       border-radius:999px; background:#fff; font:inherit; font-size:12px; cursor:pointer;
       vertical-align:middle; }
.nos:hover { border-color:var(--accent); }
.nos.on { border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
.hint { font-size:13px; color:#475467; margin:0 0 10px; }
.ctxnone { font-size:13px; color:var(--ctx); font-style:italic; }
.code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:20px; letter-spacing:2px;
        background:var(--how); border:1px solid var(--line); border-radius:6px; padding:4px 12px; }
a.btn { display:inline-block; font:inherit; text-decoration:none; border-radius:8px;
        border:1px solid var(--line); background:#fff; padding:8px 16px; cursor:pointer; color:var(--ink); }
a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.warn { color:var(--cut); }

.dump { width:100%; min-height:260px; font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:12px; border:1px solid var(--line); border-radius:8px; padding:8px;
        white-space:pre; overflow:auto; }

.alarm { background:#fde7e5; border:2px solid var(--cut); border-radius:10px; padding:12px 14px;
         margin-bottom:14px; font-size:14px; line-height:1.45; color:#7a140c; }
.alarm strong { color:var(--cut); }

.gold { border-color:#2f5bd3; background:#f4f7ff; }
.gold .ans { font-weight:600; margin:4px 0; }
ol { padding-left:20px; } li { margin:4px 0; }

/* guidelines card (embedded TRAINING_*.html), overlay and header button */
.guide h1 { font-size:1.35em; margin:0 0 8px; } .guide h2 { font-size:1.1em; margin-top:26px; color:#333; border-bottom:2px solid #ddd; padding-bottom:4px; }
.guide .gnum { margin:10px 0 6px; } .guide .gl { margin:0 0 22px; } .guide .ex { margin:8px 0 8px 18px; padding:6px 10px; border-radius:6px; }
.guide .ex.ok { border-left:5px solid #2e7d32; background:#f3f9f3; } .guide .ex.bad { border-left:5px solid #b71c1c; background:#fbf1f1; }
.guide .ex .part { font-weight:600; text-transform:none; letter-spacing:0; font-size:13px; } .guide .ex.bad .part { color:#b71c1c; } .guide .ex.ok .part { color:#2e7d32; }
.guide .ans { font-weight:600; margin:6px 0 0; } .guide .lead { color:#555; }
.overlay { position:fixed; inset:0; background:rgba(16,24,40,.55); z-index:50; overflow:auto; padding:24px 12px; }
.overlay-box { max-width:900px; margin:0 auto; } .overlay-box .nav { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:1; }
header .hbtn { background:#fff; color:#1f2a44; border:0; border-radius:6px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
</style>

<script id="data" type="application/json">{"built": "20261028125942", "mode": "crowd", "task": "T1_split", "language": "German", "lang": "de", "title": "Political sentences: where does a new statement begin?", "intro": "You will see short paragraphs, one sentence per line, and mark where a new political statement (a quasi-sentence) begins inside a sentence.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about German national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the federal government, the Bundestag, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the German government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [{"id": "G-DE_H01-3", "line_ids": ["DE_H01-3"], "sentences": [{"idx": 1, "text": "Auch darum wollen wir das Grundgesetz ändern, damit endlich Bund und Länder zusammenarbeiten dürfen und gemeinsam eine optimale Unterstützung und Förderung der Kinder und Jugendlichen ermöglichen - unabhängig vom Geldbeutel der Eltern."}], "gold": {"lines": [{"status": "split", "cuts": [14]}], "note": "Both experts agree: two units of meaning — the demand to change the Grundgesetz so that Bund and Länder may cooperate, and what this cooperation should achieve for children regardless of their parents' income. The cut is before “und gemeinsam”."}}, {"id": "G-DE_H05-2", "line_ids": ["DE_H05-2"], "sentences": [{"idx": 1, "text": "Denn die Antwort auf unsere kleine Anfrage zeigt: Alle Familiensplittingmodelle öffnen die Schere zwischen armen und reichen Familien noch weiter."}], "gold": {"lines": [{"status": "one_qs", "cuts": []}], "note": "Both experts agree: one unit of meaning. “Denn die Antwort auf unsere kleine Anfrage zeigt:” only introduces the finding; introduction and finding together are one quasi-sentence."}}], "entry": {"items": [{"id": "G-DE_H07-2-DE_H09-2", "line_ids": ["DE_H07-2", "DE_H09-2"], "sentences": [{"idx": 1, "text": "Wir investieren in Schulen, Kitas und Pflege, schaffen einen sozialen Arbeitsmarkt, stärken die dezentrale Energieversorgung und mobilisieren Milliarden für den öffentlichen Wohnungsbau oder die Schaffung eines flächendeckenden Glasfasernetzes."}, {"idx": 2, "text": "Die Bundesregierung tut viel zu wenig gegen die grassierende Ungerechtigkeit im Bildungssystem."}], "gold": {"lines": [{"status": "split", "cuts": null}, {"status": "one_qs", "cuts": []}]}}, {"id": "G-DE_H02-4-DE_H03-2", "line_ids": ["DE_H02-4", "DE_H03-2"], "sentences": [{"idx": 1, "text": "Es wird keine betriebliche Vermögensteuer geben, die Unternehmen daran hindert, ihre Eigenkapitalbasis zu stärken und zu investieren."}, {"idx": 2, "text": "DIE LINKE wird u.a. weiterhin darauf hinwirken, dass Unternehmen dazu gedrängt werden, Menschen mit Behinderung einzustellen, das Teilhaberecht menschenrechtskonform überarbeitet sowie eine vollständige Barrierefreiheit geschaffen wird.“"}], "gold": {"lines": [{"status": "one_qs", "cuts": []}, {"status": "split", "cuts": [16, 20]}]}}], "rule": {"min_status_correct": 3, "min_split_detected": 1}}, "batches": [[{"id": "DE_P01", "sentences": [{"idx": 1, "text": "Zwar haben erweiterte Antidiskriminierungsgesetze sowie das Professorinnenprogramm des Bundes und der Länder grundsätzlich zu einer Verbesserung der Karrierechancen von Frauen in der Wissenschaft beigetragen."}, {"idx": 2, "text": "Dennoch sind die Zahlen immer noch erschreckend: Obwohl über die Hälfte der Studierenden und knapp die Hälfte der Doktoranden Frauen sind, besetzen sie am Ende nur ein Fünftel der Professorenstellen."}, {"idx": 3, "text": "Dies ist eine Verschwendung von Potenzial und Talenten, die wir uns schlicht nicht leisten können."}]}, {"id": "DE_P14", "sentences": [{"idx": 1, "text": "Zur heutigen Debatte im Deutschen Bundestag für mehr Chancengleichheit von Frauen in Wissenschaft und Forschung erklärt die zuständige Berichterstatterin der SPD-Bundestagsfraktion Marianne Schieder: Die SPD-Bundestagsfraktion hat bereits vor über einem Jahr einen Antrag in den Bundestag eingebracht, um für mehr Gleichberechtigung in der Wissenschaft zu sorgen."}, {"idx": 2, "text": "Darin werden verbindliche Rahmenbedingungen gefordert, zum Beispiel die Kopplung von Forschungsgeldern an Gleichstellungsstandards oder attraktivere Arbeitsbedingungen für junge Wissenschaftlerinnen."}]}, {"id": "DE_P11", "sentences": [{"idx": 1, "text": "Denn wir wollen nicht nur den Zugang zu MINT-Berufen verbessern, sondern auch, dass mehr Frauen in Führungspositionen und in der Selbstständigkeit vertreten sind."}, {"idx": 2, "text": "Im Koalitionsvertrag sind über die bisherigen Maßnahmen hinaus weitere Schritte zur Verbesserung der Chancengleichheit von Frauen im Arbeitsleben vorgesehen: so sollen Frauen beim beruflichen Wiedereinstieg nach einer Erwerbspause unterstützt werden und leichter wieder in Vollzeit oder vollzeitnahe Arbeit wechseln können."}, {"idx": 3, "text": "Die Tarifpartner sind gefordert, die Arbeit familienfreundlicher zu gestalten und mehr innovative Arbeitszeitmodelle zuzulassen, damit Deutschland gerade für den MINT-Bereich, in dem schon heute ein Fachkräftemangel besteht, mehr qualifizierte Frauen gewinnen kann.“"}]}, {"id": "DE_P27", "sentences": [{"idx": 1, "text": "\" Nun überreichten die Interviewer ein Bildblatt, das einen gestikulierenden Mann im Schattenriss mit einer Sprechblase zeigte, in der stand: \"Was interessieren mich Zahlen und Statistiken in diesem Zusammenhang."}, {"idx": 2, "text": "Wie kann man überhaupt so kalt über ein Thema reden, bei dem es um unser aller Zukunft geht!"}, {"idx": 3, "text": "\" Die Frage dazu lautete: \"Würden Sie sagen, er hat ganz recht oder nicht recht?\" 49 Prozent der Deutschen sind der Ansicht, der Zwischenrufer habe recht, 20 Prozent sagen ausdrücklich, er habe nicht recht, 31 Prozent sind unentschieden."}]}, {"id": "DE_P26", "sentences": [{"idx": 1, "text": "Der Münchner Michael Franz analysiert seit den Siebzigerjahren Handschriften für Unternehmen, die Bewerber einschätzen wollen, oder für Privatleute, die die Echtheit eines Testaments anzweifeln."}, {"idx": 2, "text": "Er schränkt gleich ein: „Eine Unterschrift allein ist ein sehr knappes Untersuchungsmaterial, es lassen sich daraus eigentlich keine seriösen Rückschlüsse ziehen.“"}, {"idx": 3, "text": "Wenn er aber die Unterschriften von Draghi und Lagarde genauer betrachtet, kommt er doch auf einige treffende Aussagen – ohne dass er ihre Persönlichkeiten vorher genauer gekannt hätte."}, {"idx": 4, "text": "„Lagardes Unterschrift ist ein typischer Breitfeder-Wechselzug“, sagt Franz."}]}, {"id": "DE_P24", "sentences": [{"idx": 1, "text": "Armut und Ausgrenzung gehören abgeschafft."}, {"idx": 2, "text": "DIE LINKE fordert daher einen Mindestlohn ohne Ausnahmen in Höhe von 10 Euro, eine Mindestrente und sanktionsfreie Mindestsicherung von 1050 Euro, denn darunter droht Armut."}, {"idx": 3, "text": "Die Teilhabe von Kindern und Jugendlichen muss mit einer ausreichenden Kindergrundsicherung garantiert werden."}]}, {"id": "DE_P18", "sentences": [{"idx": 1, "text": "„Mädchen orientieren sich bei der Berufswahl immer noch an den traditionell vorgegebenen Mustern, während Jungs weiterhin die technischen Berufe vorziehen“."}, {"idx": 2, "text": "Ploetz weiter: „Nach der IG Metall-Ausbildungsbilanz 2011 haben sich die Ausbildungschancen junger Frauen sogar verschlechtert: Im vergangenen Jahr wurden 2.700 weniger Ausbildungsverträge mit Frauen abgeschlossen."}, {"idx": 3, "text": "Der Anteil aller mit Frauen geschlossenen Ausbildungsverträge erreicht mit 40,7 Prozent einen neuen Tiefpunkt."}]}, {"id": "DE_P02", "sentences": [{"idx": 1, "text": "Die soziale Kluft zwischen Ost und West schließt sich viel zu langsam, erklärt Roland Claus zu einer Untersuchung des Statistischen Bundesamtes, der zufolge die Armutsgefährdungsquote in den westlichen Bundesländern bei 14 Prozent, in den östlichen aber bei 19,5 Prozent liegt."}, {"idx": 2, "text": "Der Ostkoordinator der Fraktion DIE LINKE weiter: Die Zahlen des Statistischen Bundesamtes belegen auch: Die Armut in Deutschland hat insgesamt zugenommen, die Armutsgefährdungsquote ist von 14,5 Prozent im Jahr 2010 auf 15,1 Prozent im Jahr 2011 gestiegen."}, {"idx": 3, "text": "Armut ist etwas Alltägliches geworden, nicht für wenige Menschen, sondern für sehr viele, auch für solche, die in Arbeit sind, deren Lohn aber nicht für ein menschenwürdiges Leben reicht."}]}, {"id": "DE_P22", "sentences": [{"idx": 1, "text": "Frage: Aber trotzdem Herr Lindner."}, {"idx": 2, "text": "Die Frage ist doch, oder viele Menschen in Ostdeutschland, die eine schwierige Biografie haben: Da geht doch die Angst um, was mache ich in 20 Jahren."}, {"idx": 3, "text": "Und dieser Fall, der doch immer wieder in der Politik konstruiert wird, da ist also eine Friseuse, die hat den Millionär geheiratet und die kriegt jetzt eine Rente."}]}, {"id": "DE_P20", "sentences": [{"idx": 1, "text": "Denn Frauenarmut entsteht nicht erst am Ende des Lebens, sondern schon vorher."}, {"idx": 2, "text": "Wer Frauenarmut wirklich bekämpfen will, muss die richtigen Weichen stellen und nicht reparieren: Gleicher Lohn für gleich(wertige)e Arbeit auf gesetzlichem Weg, die Abschaffung des Ehegattensplitting und eine Reform der Minijobs sind dafür ebenso unerlässlich wie ein gesetzlicher Mindestlohn."}, {"idx": 3, "text": "Frauen wollen keine Almosen mehr."}]}, {"id": "DE_P29", "sentences": [{"idx": 1, "text": "Ein markantes und viel gescholtenes Beispiel für den Mey’schen Antizyklus ist das Lied „Annabelle“, eine als Liebeshymne verbrämter Spottgesang auf eine progressive Frau: „Annabelle, ach Annabelle/ du bist so herrlich intellektuell/ und zum Zeichen deiner Emanzipation /"}, {"idx": 2, "text": "Beginnt bei dir der Bartwuchs schon.“"}]}, {"id": "DE_P23", "sentences": [{"idx": 1, "text": "Kerstin Tack, Beauftragte für die Belange von Menschen mit Behinderung: Erwachsene Menschen mit Behinderungen, die bei Angehörigen leben, bekommen zukünftig mehr Sozialhilfe."}, {"idx": 2, "text": "Das Bundesministerium für Arbeit und Soziales kündigte an, dass der Regelsatz auf das Niveau für Alleinstehende angehoben wird."}]}, {"id": "DE_P15", "sentences": [{"idx": 1, "text": "Zum heutigen Fraktionsbeschluss über den Antrag „Neue Chancen für Menschen mit Migrationshintergrund am Arbeitsmarkt“ erklären die arbeitsmarktpolitische Sprecherin der SPD-Bundestagsfraktion Anette Kramme und der zuständige Berichterstatter Josip Juratovic: Die SPD will Migrantinnen und Migranten auf dem Arbeitsmarkt eine faire Chance geben."}, {"idx": 2, "text": "Dazu brauchen wir fördernde Arbeitsmarktpolitik, aber müssen auch bestehende Diskriminierung beseitigen."}]}, {"id": "DE_P10", "sentences": [{"idx": 1, "text": "Angelika Glöckner, Beauftragte für die Belange für Menschen mit Behinderungen: Am Donnerstag hat der Deutsche Bundestag gleich zwei wichtige Gesetze verabschiedet, die die Rechte von Menschen mit Behinderungen und die finanzielle Situation ihrer Betreuer verbessern."}, {"idx": 2, "text": "„Mit dem Gesetz zur Anpassung der Betreuer- und Vormündervergütung hat der Deutsche Bundestag am Donnerstagabend nach langen Verhandlungen den Weg frei gemacht für eine Vergütungserhöhung für gesetzliche Betreuer."}]}, {"id": "DE_P19", "sentences": [{"idx": 1, "text": "Zum Armutsbericht 2011 des Paritätischen Wohlfahrtsverbandes erklärt die Sprecherin der Arbeitsgruppe Verteilungsgerechtigkeit und soziale Integration der SPD-Bundestagsfraktion Hilde Mattheis: Besorgniserregend neu am Befund des paritätischen Armutsberichtes 2011 ist: Armut schrumpft nicht, wenn die Wirtschaft wächst."}, {"idx": 2, "text": "Selbst starke konjunkturelle Ausschläge scheinen so gut wie keinen Einfluss mehr auf die Armutsentwicklung zu haben: Armut hat sich so soweit verfestigt, dass sie das Bild von Deutschland zu prägen beginnt, warnt Hilde Mattheis."}, {"idx": 3, "text": "Besorgniserregend neu am Befund des paritätischen Armutsberichtes 2011 ist: Armut schrumpft nicht, wenn die Wirtschaft wächst."}]}, {"id": "DE_P17", "sentences": [{"idx": 1, "text": "Wir wollen eine Garantiesicherung, durch die Hartz IV überwunden wird, das Existenzminimum für alle Menschen garantiert und Erwerbstätigkeit stärker belohnt wird."}, {"idx": 2, "text": "Gegen Kinderarmut fordern wir eine Kindergrundsicherung für alle Kinder und gegen Altersarmut eine Garantierente, mit der kleine Renten ohne Bedürftigkeitsprüfung auf ein Mindestniveau aufgestockt werden."}, {"idx": 3, "text": "Das Asylbewerberleistungsgesetz wollen wir zugunsten einer Einbeziehung Leistungsberechtigter in unsere regulären Sozialleistungssystem abschaffen und darüber hinaus soziale Sicherheit stärker europäisch ausrichten: Hierzu soll die EU verbindliche Mindeststandards in Form einer Mindesteinkommensrichtlinie für angemessene und existenzsichernde Grundsicherungssysteme in den Mitgliedstaaten schaffen."}]}, {"id": "DE_P12", "sentences": [{"idx": 1, "text": "Steuern, Abgaben und soziale Leistungen wollen wir so aufeinander abzustimmen, dass Erwerbstätige mit geringem Einkommen entlastet werden und sich Erwerbsarbeit auch finanziell lohnt."}, {"idx": 2, "text": "Mit der grünen Garantierente und der Weiterentwicklung der Rentenversicherung zur Bürgerversicherung schützen wir die Menschen vor Altersarmut und mit einem sozialen Arbeitsmarkt verschaffen wir Langzeitarbeitslosen wieder einen Zugang zum Arbeitsmarkt."}, {"idx": 3, "text": "Wir wollen Minijobs in sozialversicherungspflichtige Beschäftigung umwandeln, für Leiharbeit muss gleicher Lohn für gleiche Arbeit gelten, wir brauchen ein echtes Entgeltgleichheitsgesetz und Befristungen ohne Sachgrund soll es nicht mehr geben."}]}, {"id": "DE_P16", "sentences": [{"idx": 1, "text": "Thomas Oppermann, Fraktionsvorsitzender: Eine große Sozialdemokratin wird Namensgeberin eines Bundestagsgebäudes."}, {"idx": 2, "text": "Elisabeth Selbert, eine der Mütter des Grundgesetzes, war eine zentrale Vorkämpferin für mehr Gleichberechtigung von Männern und Frauen. „‘Männer und Frauen sind gleichberechtigt.‘ Mit diesem Satz hat Elisabeth Selbert Geschichte geschrieben."}, {"idx": 3, "text": "So selbstverständlich er heute klingt, so umstritten war er bei der Formulierung unseres Grundgesetzes."}]}, {"id": "DE_P30", "sentences": [{"idx": 1, "text": "Walter-Borjans betonte, dass ein Einheitszins allen Ländern zugute käme: „Auch diejenigen, deren Haushalte schon ausgeglichen sind, könnten ihre aufgelaufenen Schulden günstiger finanzieren“, sagte er."}, {"idx": 2, "text": "„Allein Nordrhein-Westfalen könnte jedes Jahr deutlich mehr als 100 Millionen Euro Zinsen für neue Kredite sparen, ohne Lasten auf andere zu verschieben.“"}, {"idx": 3, "text": "Mittel- bis langfristig sei sogar eine Senkung der Zinskosten um fast eine Milliarde Euro möglich."}]}, {"id": "DE_P03", "sentences": [{"idx": 1, "text": "Das dürfte Ihnen bekannt vorkommen, Frau von der Leyen und Frau Schröder."}, {"idx": 2, "text": "Gleiche Forderungen stehen in unserem Positionspapier <U+0084>Besser mit Frauen<U+0093> und in unserem Gesetzentwurf zur Quote für Aufsichtsräte."}, {"idx": 3, "text": "Nehmen Sie die Handlungsempfehlungen Ihrer eigenen Kommission ernst und legen Sie diesen Bericht nicht in die Schublade."}]}, {"id": "DE_P13", "sentences": [{"idx": 1, "text": "Für Frauen ist eine ausreichende Absicherung im Alter und bei Erwerbslosigkeit nötig, die nicht nur bei durchgehender Vollzeiterwerbstätigkeit und bei durchschnittlichem Einkommen gewährleistet sein darf."}, {"idx": 2, "text": "Zudem wollen wir ein gerechteres Steuersystem: Das Ehegattensplitting zementiert die Benachteiligung von Frauen, daher wollen wir es abschmelzen. «"}]}, {"id": "DE_P09", "sentences": [{"idx": 1, "text": "Dieser Tag ist nicht nur ein Anlass, um auf die Situation von Menschen mit Trisomie 21 aufmerksam zu machen, sondern bedeutet für die Betroffenen und deren Familien auch, dass sie Solidarität erfahren und ihre Würde, Fähigkeiten und Rechte anerkannt werden."}, {"idx": 2, "text": "„Für die Teilhabe von Menschen mit Down-Syndrom hat die SPD-Bundestagsfraktion mit dem Bundesteilhabegesetz in der vergangenen Legislaturperiode bereits viel erreicht: Wir haben die Einkommens- und Vermögensfreigrenzen deutlich erhöht und so das Recht auf Sparen gestärkt."}, {"idx": 3, "text": "Durch die Ausweitung des Wunsch- und Wahlrechts haben wir außerdem sichergestellt, dass die Wünsche von Menschen mit Behinderungen gerade im Bereich des Wohnens stärker berücksichtigt werden."}]}, {"id": "DE_P04", "sentences": [{"idx": 1, "text": "Der öffentliche Schulbereich ist nahezu die einzige Branche, in der die Dauer der Anstellung sowie die Art des Lehramtes mehr Einfluss auf die Höhe der Besoldung haben als die Qualität des Unterrichts und das sonstige Engagement, das eine Lehrkraft aufbringt."}, {"idx": 2, "text": "Diese Gleichbehandlung von Ungleichem hat fatale Folgen: Die wenigsten jungen Leute ergreifen den Beruf des Lehrers, weil sie sich dafür begeistern, Kindern Wissen zu vermitteln."}, {"idx": 3, "text": "Viele geben als Grund für ihre Berufswahl an, sie hätten vor allem berufliche Sicherheit gesucht."}]}, {"id": "DE_P06", "sentences": [{"idx": 1, "text": "Anlässlich der heutigen Beschlussfassung zum Haushalt des Bundesministeriums für Bildung und Forschung 2010 im Ausschuss für Bildung, Forschung und Technikfolgenabschätzung erklärt der bildungs- und forschungspolitische Sprecher der SPD-Bundestagsfraktion Ernst Dieter Rossmann: Die Bundesregierung betreibt die Privatisierung von Bildungschancen und verabschiedet sich von Bildung als öffentlichem Gut."}, {"idx": 2, "text": "Mit den geplanten Bildungsschecks für private Nachhilfe, dem nationalen Stipendienprogramm für die „Begabtenelite“ oder auch mit dem Bildungssparen macht sie Bildungserfolge wieder stärker vom Geldbeutel der Eltern abhängig."}, {"idx": 3, "text": "Damit verfestigt sie soziale Selektivität und Ungerechtigkeit im deutschen Bildungssystem, statt sie zu bekämpfen, erklärt Ernst Dieter Rossmann."}]}, {"id": "DE_P28", "sentences": [{"idx": 1, "text": "Andererseits, er ist der Novize: „Ich habe keine Narben“, sagt Madsen."}, {"idx": 2, "text": "Er gibt den Erneuerer aus der Handelskammer und will auch Socken verteilen, Motto: „keine linken Socken, kein rechtes Gesocks.“"}, {"idx": 3, "text": "Was macht die AfD, die bei der Landtagswahl 2016 in Rostock 17,3 Prozent bekam?"}, {"idx": 4, "text": "Der Däne Madsen sagt: „Den Fehler macht ihr Deutschen immer noch, ihr redet bei jeder Gelegenheit von der AfD.“"}]}, {"id": "DE_P08", "sentences": [{"idx": 1, "text": "Lehrkräfte werden zu oft allein gelassen."}, {"idx": 2, "text": "DIE LINKE bleibt dabei: Nur die konsequente Bekämpfung von Armut in unserer Gesellschaft, ein inklusives Bildungssystem, das niemanden ausgrenzt und alle individuell fördert, und eine offene und tolerante Gesellschaft können die anstehenden Probleme lösen.“"}]}, {"id": "DE_P21", "sentences": [{"idx": 1, "text": "Diese Studie belegt leider wieder einmal, dass Frau Schavans Bildungspolitik soziale Selektivität beim Hochschulzugang fördert, anstatt sie zu endlich zu überwinden, so Nicole Gohlke, hochschulpolitische Sprecherin der Fraktion DIE LINKE, mit Blick auf die heute von der Vodafone-Stiftung vorgelegte Studie Aufstiegsangst? zur sozialen Ungleichheit beim Hochschulzugang seit den 1960er Jahren."}, {"idx": 2, "text": "Gohlke weiter: Die Anzahl der Schüler aus sogenannten bildungsfernen Schichten, die eine Studienberechtigung erhalten, ist zwar seit den 60er Jahren von 15 auf 35 Prozent gestiegen, aber spätestens beim faktischen Zugang zur Hochschule ist die Zahl rückläufig."}]}, {"id": "DE_P25", "sentences": [{"idx": 1, "text": "Der Herausgeber eines berühmten Kommentars zum Grundgesetz blieb fortan im Gespräch – mal mit der Ablehnung der drastischen Beschneidung des Asylrechts, mal mit Kritik an der „Selbstbedienung der Parteien“, mal mit einer Klage gegen drei evangelische Bischöfe wegen Verweigerung von Informationen."}, {"idx": 2, "text": "Später setzte er sich, nach eigener Aussage aus Mitleid mit den alten Männern, für angeklagte SS-Leute ein, und schrieb ein Buch über die Massenvergewaltigungen von Frauen durch russische Soldaten."}, {"idx": 3, "text": "Derzeit bringt Münch („Ich schreibe gern“) jedes Jahr ein Buch auf den Markt, zuletzt über „Gute Wissenschaft“ und davor über „Rechtspolitik und Rechtskultur“."}, {"idx": 4, "text": "Nebenbei bekämpft er die neue Rundfunkgebühr."}]}, {"id": "DE_P05", "sentences": [{"idx": 1, "text": "Mehr Hilfen für den Kitaausbau kommen aber nicht."}, {"idx": 2, "text": "Das Betreuungsgeld ist in jeder Hinsicht falsch: Es verschlechtert Bildungschancen, es erschwert Integration, es ist eine Falle für Frauen."}, {"idx": 3, "text": "Die Bilanz dieser Bundesregierung in der Familien- und Gleichstellungspolitik ist mehr als vernichtend, sagt Dagmar Ziegler."}]}, {"id": "DE_P07", "sentences": [{"idx": 1, "text": "Diese fehlen bzw. sind unterrepräsentiert als Entscheider und Multiplikatoren in allen Schlüsselpositionen von Politik, Wirtschaft, Hochschulen und Kultur."}, {"idx": 2, "text": "Die Maßgabe gleichwertiger Lebensverhältnisse, der Ausgleich zwischen Wachstums- und abgehängten Regionen in Ost und West, der Erhalt und Ausbau der Daseinsvorsorge sind zugleich Schlüsselfragen, die DIE LINKE auch in den kommenden Wahlauseinandersetzung betonen wird."}, {"idx": 3, "text": "2019 stehen die Europa- und Kommunalwahlen sowie drei Landtagswahlen im Osten an: in Sachsen, Brandenburg und Thüringen.“"}]}]], "screeners": [{"id": "G-DE_H10-2-DE_H07-1", "line_ids": ["DE_H10-2", "DE_H07-1"], "sentences": [{"idx": 1, "text": "Das soll bis 2014 30,3 Milliarden Euro bringen."}, {"idx": 2, "text": "Diesen Weg gehen wir weiter."}], "gold": {"lines": [{"status": "one_qs", "cuts": []}, {"status": "one_qs", "cuts": []}]}}], "screener_every": 15, "pilot": false, "preview_training": false, "guide_html": "<h1>Annotation guidelines: Political sentences: where does a new statement begin? — German</h1><p class=\"lead\">You will see short paragraphs, one sentence per line, and mark where a new political statement (a quasi-sentence) begins inside a sentence.</p>\n<h2>1. Definitions</h2><p class=\"gnum\"><b>1.1 Sentence:</b> one line on the screen. Every line is exactly one sentence of the original text.</p><p class=\"gnum\"><b>1.2 Quasi-sentence:</b> one unit of meaning: one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details); “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said). A sentence contains one or several quasi-sentences; a quasi-sentence never runs across two sentences.</p><p class=\"gnum\"><b>1.3 Boundary:</b> the point where one unit ends and the next begins, usually at a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” has one boundary (two units). You decide where the units end.</p><h2>2. Task description</h2><p>For every line decide whether it contains one unit of meaning or several. To mark a boundary, click the space between two words: a red line appears and the new quasi-sentence is shaded. Click the red line again to remove it. If the whole line is one unit of meaning, press “one quasi-sentence”. Every line must be resolved before you can continue.</p>\n<h2>3. Guidelines and examples</h2><p class=\"lead\">✓ = correct coding (answer of the research team) · ✗ = wrong coding. All examples were coded identically by both experts.</p><div class=\"gl\"><p class=\"gnum\"><b>3.1</b> Separate demands or measures are separate quasi-sentences, even when they share one verb or are joined by “and” or a semicolon.</p><div class=\"card ex ok\"><div class=\"part\">✓ correct</div><div class=\"sent\" lang=\"de\"><span class=\"w\">Wir</span><span class=\"gap\"></span><span class=\"w\">wollen</span><span class=\"gap\"></span><span class=\"w\">die</span><span class=\"gap\"></span><span class=\"w\">Abgeltungssteuer</span><span class=\"gap\"></span><span class=\"w\">von</span><span class=\"gap\"></span><span class=\"w\">25</span><span class=\"gap\"></span><span class=\"w\">auf</span><span class=\"gap\"></span><span class=\"w\">32</span><span class=\"gap\"></span><span class=\"w\">Prozent</span><span class=\"gap\"></span><span class=\"w\">erhöhen</span><span class=\"gap cut\"></span><span class=\"w seg1\">und</span><span class=\"gap seg1\"></span><span class=\"w seg1\">eine</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Finanztransaktionssteuer</span><span class=\"gap seg1\"></span><span class=\"w seg1\">einführen,</span><span class=\"gap seg1\"></span><span class=\"w seg1\">die</span><span class=\"gap seg1\"></span><span class=\"w seg1\">zu</span><span class=\"gap seg1\"></span><span class=\"w seg1\">85</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Prozent</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Geschäfte</span><span class=\"gap seg1\"></span><span class=\"w seg1\">zwischen</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Finanzinstitutionen</span><span class=\"gap seg1\"></span><span class=\"w seg1\">betrifft.</span><span class=\"cnt\">2 quasi-sentences</span></div><p class=\"how\">Both experts agree: two measures — raise the Abgeltungssteuer, and introduce a Finanztransaktionssteuer — so two units of meaning, cut at “und”. The relative clause “die zu 85 Prozent … betrifft” describes the second measure and stays with it.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><div class=\"sent\" lang=\"de\"><span class=\"w\">Wir</span><span class=\"gap\"></span><span class=\"w\">wollen</span><span class=\"gap\"></span><span class=\"w\">die</span><span class=\"gap\"></span><span class=\"w\">Abgeltungssteuer</span><span class=\"gap\"></span><span class=\"w\">von</span><span class=\"gap\"></span><span class=\"w\">25</span><span class=\"gap\"></span><span class=\"w\">auf</span><span class=\"gap\"></span><span class=\"w\">32</span><span class=\"gap\"></span><span class=\"w\">Prozent</span><span class=\"gap\"></span><span class=\"w\">erhöhen</span><span class=\"gap\"></span><span class=\"w\">und</span><span class=\"gap\"></span><span class=\"w\">eine</span><span class=\"gap\"></span><span class=\"w\">Finanztransaktionssteuer</span><span class=\"gap\"></span><span class=\"w\">einführen,</span><span class=\"gap\"></span><span class=\"w\">die</span><span class=\"gap\"></span><span class=\"w\">zu</span><span class=\"gap\"></span><span class=\"w\">85</span><span class=\"gap\"></span><span class=\"w\">Prozent</span><span class=\"gap\"></span><span class=\"w\">Geschäfte</span><span class=\"gap\"></span><span class=\"w\">zwischen</span><span class=\"gap\"></span><span class=\"w\">Finanzinstitutionen</span><span class=\"gap\"></span><span class=\"w\">betrifft.</span><span class=\"cnt\">one quasi-sentence</span></div><p class=\"how\">Marking the whole line as one quasi-sentence hides that it contains several separate demands.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.2</b> Words that only introduce a statement — “The right answer is:”, “In particular:”, “he told the paper that” — belong to the statement they introduce. Do not cut after them.</p><div class=\"card ex ok\"><div class=\"part\">✓ correct</div><div class=\"sent\" lang=\"de\"><span class=\"w\">Die</span><span class=\"gap\"></span><span class=\"w\">richtige</span><span class=\"gap\"></span><span class=\"w\">Antwort</span><span class=\"gap\"></span><span class=\"w\">lautet:</span><span class=\"gap\"></span><span class=\"w\">Alle</span><span class=\"gap\"></span><span class=\"w\">Kinder</span><span class=\"gap\"></span><span class=\"w\">und</span><span class=\"gap\"></span><span class=\"w\">Jugendlichen</span><span class=\"gap\"></span><span class=\"w\">in</span><span class=\"gap\"></span><span class=\"w\">Deutschland</span><span class=\"gap\"></span><span class=\"w\">müssen</span><span class=\"gap\"></span><span class=\"w\">das</span><span class=\"gap\"></span><span class=\"w\">Recht</span><span class=\"gap\"></span><span class=\"w\">auf</span><span class=\"gap\"></span><span class=\"w\">qualitativ</span><span class=\"gap\"></span><span class=\"w\">hochwertige</span><span class=\"gap\"></span><span class=\"w\">Bildung</span><span class=\"gap\"></span><span class=\"w\">von</span><span class=\"gap\"></span><span class=\"w\">der</span><span class=\"gap\"></span><span class=\"w\">Kita</span><span class=\"gap\"></span><span class=\"w\">bis</span><span class=\"gap\"></span><span class=\"w\">zur</span><span class=\"gap\"></span><span class=\"w\">Hochschule</span><span class=\"gap\"></span><span class=\"w\">haben.</span><span class=\"cnt\">one quasi-sentence</span></div><p class=\"how\">Both experts agree: one unit of meaning. “Die richtige Antwort lautet:” only introduces the demand that follows; introduction and demand together are one quasi-sentence.</p></div><div class=\"card ex bad\"><div class=\"part\">✗ wrong</div><div class=\"sent\" lang=\"de\"><span class=\"w\">Die</span><span class=\"gap\"></span><span class=\"w\">richtige</span><span class=\"gap\"></span><span class=\"w\">Antwort</span><span class=\"gap\"></span><span class=\"w\">lautet:</span><span class=\"gap cut\"></span><span class=\"w seg1\">Alle</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Kinder</span><span class=\"gap seg1\"></span><span class=\"w seg1\">und</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Jugendlichen</span><span class=\"gap seg1\"></span><span class=\"w seg1\">in</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Deutschland</span><span class=\"gap seg1\"></span><span class=\"w seg1\">müssen</span><span class=\"gap seg1\"></span><span class=\"w seg1\">das</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Recht</span><span class=\"gap seg1\"></span><span class=\"w seg1\">auf</span><span class=\"gap seg1\"></span><span class=\"w seg1\">qualitativ</span><span class=\"gap seg1\"></span><span class=\"w seg1\">hochwertige</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Bildung</span><span class=\"gap seg1\"></span><span class=\"w seg1\">von</span><span class=\"gap seg1\"></span><span class=\"w seg1\">der</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Kita</span><span class=\"gap seg1\"></span><span class=\"w seg1\">bis</span><span class=\"gap seg1\"></span><span class=\"w seg1\">zur</span><span class=\"gap seg1\"></span><span class=\"w seg1\">Hochschule</span><span class=\"gap seg1\"></span><span class=\"w seg1\">haben.</span><span class=\"cnt\">2 quasi-sentences</span></div><p class=\"how\">The introduction carries no statement of its own; cutting it off creates a quasi-sentence without meaning.</p></div></div><div class=\"gl\"><p class=\"gnum\"><b>3.3</b> Details, conditions, comparisons and explanations of one statement stay with it. Not every comma or “and” is a boundary.</p><div class=\"card ex ok\"><div class=\"part\">✓ correct</div><div class=\"sent\" lang=\"de\"><span class=\"w\">Je</span><span class=\"gap\"></span><span class=\"w\">weiter</span><span class=\"gap\"></span><span class=\"w\">die</span><span class=\"gap\"></span><span class=\"w\">Meinungen</span><span class=\"gap\"></span><span class=\"w\">zwischen</span><span class=\"gap\"></span><span class=\"w\">Arm</span><span class=\"gap\"></span><span class=\"w\">und</span><span class=\"gap\"></span><span class=\"w\">Reich</span><span class=\"gap\"></span><span class=\"w\">auseinanderliegen,</span><span class       nav.appendChild(el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }));
    }

    // complete_after: 'task' = a code once this task is done (one task per participant,
    // or a pilot); 'all' = every task in the file must be finished first.
    if (!CROWD && CFG.complete_after !== 'task' && !allDone()) {
      card.appendChild(el('p', { text: 'This task is finished, but other tasks are still open. ' +
        'Go back to the task list and finish them before you close the page.' }));
      return;
    }
    if (!CFG.submit_url || PLAT.dry) {
      card.appendChild(el('p', { text: PLAT.dry ? 'Dry run: answers were not submitted.' :
        'No submission endpoint is configured, so answers stay in this browser.' }));
      completion();
      return;
    }
    var status = el('p', { text: 'Sending your answers\u2026' });
    card.appendChild(status);
    submit(function (ok, detail) {
      if (ok) { status.textContent = 'Answers received.'; }
      else {
        status.className = 'warn';
        status.textContent = 'Your answers could not be sent (' + detail + '). ' +
          'Please download a copy with the button below and send it to the researcher, then use the code.';
      }
      completion();
    });
  }

  // ---------- export / submission ----------
  var COLS = ['coder', 'platform', 'participant_id', 'study_id', 'platform_session_id', 'build',
    'task', 'item_id', 'item_type', 'q1_political', 'q2_national',
    'q3_status', 'q3_n_quasi', 'q3_split',
    'q4_relevant', 'q5_economic', 'q5_equal_chances', 'q5_equal_rights', 'q6_position', 'expert_note',
    'phase', 'is_gold_item'];

  function table() {
    var rows = [];
    D.tasks.forEach(function (t) {
      items(t).forEach(function (it) {
        var a = peek(t, it);
        var pre = [S.coder, PLAT.name, PLAT.pid, PLAT.study, PLAT.session, D.built, t.id];
        var tail = [t.phase || '', t.phase === 'training' || t.phase === 'entry' ? 1 : (t.phase === 'production' ? '' : '')];
        if (it.kind === 'split') {
          it.d.sentences.forEach(function (s, si) {
            var tk = toks(s), cuts = (a.cuts && a.cuts[si]) || [], st = lineState(a, si);
            var marked = tk.map(function (w, j) { return (cuts.indexOf(j) >= 0 ? '| ' : '') + w; }).join(' ');
            var n = st === 'unresolved' ? '' : (st === 'one_qs' ? 1 : cuts.length + 1);
            rows.push(pre.concat([it.d.id + '-' + s.idx, 'split_sentence', '', '',
              st, n, st === 'unresolved' ? '' : marked,
              '', '', '', '', '', si === 0 ? (a.note || '') : ''].concat(tail)));
          });
        } else if (it.kind === 'article') {
          rows.push(pre.concat([it.d.id, it.d.press ? 'press_release' : 'article',
            it.d.press ? '' : (a.q1 || ''), (it.d.press || a.q1 === 'yes') ? (a.q2 || '') : '',
            '', '', '', '', '', '', '', '', a.note || ''].concat(tail)));
        } else {
          var y = a.q4 === 'yes';
          rows.push(pre.concat([it.d.id, 'qs', '', '', '', '', '',
            a.q4 || '', y ? (a.econ ? 1 : 0) : '', y ? (a.chances ? 1 : 0) : '', y ? (a.rights ? 1 : 0) : '',
            y ? (a.q5 || '') : '', a.note || ''].concat(tail)));
        }
      });
    });
    return rows;
  }

  function csvText() {
    return '\ufeff' + [COLS].concat(table()).map(function (r) {
      return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
  }

  function filename() {
    var who = (S.coder || PLAT.pid || 'coder').replace(/[^\w-]+/g, '_');
    return 'answers_' + who + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  }

  // Tries the real file download and reports whether the browser accepted it. A
  // sandboxed frame blocks this outright, so the caller always has a fallback.
  function tryDownload() {
    var csv = csvText(), name = filename();
    try {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      var link = el('a', { href: url, download: name });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { /* fall through to the data: URI */ }
    try {
      var link2 = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: name });
      document.body.appendChild(link2); link2.click(); link2.remove();
      return true;
    } catch (e2) { return false; }
  }

  function download() {
    // Where a download cannot be trusted, go straight to the copy-out screen rather
    // than appearing to succeed.
    if (FRAMED || !STORAGE_OK) { showAnswers(true); return; }
    if (!tryDownload()) { showAnswers(true); return; }
    showDownloaded();
  }

  function showDownloaded() {
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: 'Answers downloaded' }),
      el('p', { text: 'Your browser was asked to save ' + filename() + ' \u2014 look in your Downloads ' +
        'folder, then put the file in the shared Dropbox folder.' }),
      el('p', { cls: 'how', text: 'No file appeared? Nothing is lost. Click \u201cShow answers as text\u201d ' +
        'below and copy them out instead.' })]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Show answers as text', onclick: function () { showAnswers(false); } }),
      el('button', { cls: 'primary', text: 'Download again', onclick: download })]));
  }

  // Fallback for every browser that refuses a blob download (file:// pages, sandboxed
  // previews, download-blocking settings): show the CSV and let it be copied out.
  function showAnswers(becauseBlocked) {
    var csv = csvText();
    app.innerHTML = '';
    var warn = banner(); if (warn) app.appendChild(warn);
    var ta = el('textarea', { cls: 'dump', readonly: 'readonly', spellcheck: 'false' });
    ta.value = csv;
    var msg = el('span', { cls: 'msg' });
    app.appendChild(el('div', { cls: 'card' }, [
      el('h2', { text: becauseBlocked ? 'This window cannot save a file' : 'Answers as text' }),
      el('p', { text: becauseBlocked
        ? 'Your answers are complete and shown below \u2014 nothing is lost. This window cannot ' +
          'write a file, so copy everything in the box and save it as answers.csv.'
        : 'Copy everything in the box below and save it as a file called answers.csv.' }),
      ta,
      el('div', null, [
        el('button', { cls: 'primary', text: 'Copy to clipboard', onclick: function () {
          var ok = false;
          try { ta.select(); ok = !!(document.execCommand && document.execCommand('copy')); }
          catch (e) { ok = false; }
          if (!ok && typeof navigator !== 'undefined' && navigator.clipboard) {
            try { navigator.clipboard.writeText(csv); ok = true; } catch (e) { ok = false; }
          }
          msg.textContent = ok ? 'Copied. Save it as answers.csv'
            : 'Copy did not work \u2014 click in the box, press Ctrl+A then Ctrl+C.';
        } }),
        msg])
    ]));
    app.appendChild(el('div', { cls: 'nav' }, [
      el('button', { text: 'Back to tasks', onclick: menu }),
      el('button', { text: 'Try the download again', onclick: download })]));
  }

  function submit(cb, phase) {
    var payload = {
      build: D.built, mode: D.mode, platform: PLAT.name,
      participant_id: PLAT.pid, study_id: PLAT.study, platform_session_id: PLAT.session,
      query: PLAT.query, coder: S.coder || '',
      phase: phase || (CROWD ? 'completed' : 'completed'),
      task: D.task || D.mode, language: D.language || '', batch: BATCH,
      pilot: !!D.pilot, feedback: S.feedback || '',
      entry: CROWD ? (S.entry || null) : null,
      screeners: CROWD ? scoreScreeners() : null,
      timings: CROWD ? { training_s: secs(S.t.training, S.t.training_end), entry_s: secs(S.t.entry, S.t.entry_end),
                         production_s: secs(S.t.production, S.t.production_end) } : null,
      started_at: S.started, finished_at: new Date().toISOString(),
      columns: COLS, rows: table(), answers: S.ans
    };
    var done = false;
    function once(ok, detail) { if (!done) { done = true; cb(ok, detail); } }
    try {
      var x = new XMLHttpRequest();
      x.open('POST', CFG.submit_url, true);
      // text/plain is a CORS 'simple request' (no preflight), which is what a Google Apps Script
      // web app and most form endpoints accept; the body is still the JSON document.
      x.setRequestHeader('Content-Type', CFG.submit_content_type || 'text/plain;charset=utf-8');
      x.timeout = 20000;
      x.onload = function () { once(x.status >= 200 && x.status < 300, 'status ' + x.status); };
      x.onerror = function () { once(false, 'network error'); };
      x.ontimeout = function () { once(false, 'timeout'); };
      x.send(JSON.stringify(payload));
    } catch (e) {
      once(false, 'blocked');
    }
  }

  var hguide = document.getElementById('hguide');   // static button in the header template (build_crowd_page.py)
  if (CROWD && D.guide_html && hguide) { hguide.style.display = ''; hguide.addEventListener('click', guideOverlay); }
  menu();
})();
</script>
</body>
