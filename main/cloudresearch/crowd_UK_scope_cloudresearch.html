<script id="data" type="application/json">{"built": "20261028125942", "mode": "crowd", "task": "T1_scope", "language": "UK", "lang": "en", "title": "Political articles: national or international?", "intro": "You will read short political texts and answer two questions about each: is it about politics, and is it mainly about national or international politics.", "instr": {"q1": {"q": "Q1. Is this article about politics?", "how": "YES = the article is about politics: government, parties, politicians, elections, laws, economic policy, strikes. Foreign politics is also yes.\nNO = politics is not mentioned, or only in passing: sport, culture, celebrity and human-interest stories, accidents, crime. A politician as a private person is not political.\nJudge the whole article, not one sentence."}, "q3": {"q": "Q3. Where does a new quasi-sentence begin?", "how": "Every line is one sentence. Decide whether it contains ONE unit of meaning or SEVERAL, and mark where each new unit begins.\nONE unit = one statement, demand, measure, judgement or fact, together with all its details. “We will raise the minimum wage to 12 euros next year, as promised before the election” is one unit (one measure with its details). “The minister said: the coalition will hold” is one unit (who speaks belongs to what is said).\nSEVERAL units = several statements, demands or measures in one sentence, usually joined by a semicolon, a comma, “and” or “but”: “We will raise the minimum wage | and cut taxes for families” is two units.\nA unit never runs across two sentences. To mark a boundary, click the space between two words: a red line appears and the new unit is shaded. Click the red line again to remove it. If the whole line is one unit, press “one quasi-sentence”."}, "q4": {"q": "Q4. Does the highlighted statement refer to equality, social justice or the equal treatment of all people?", "how": "Code the highlighted statement (one quasi-sentence) only; the grey text before and after is context.\nYES = the statement refers to economic equality, equal chances or equal rights (the three kinds in Q5), whatever its position: in favour, against, or merely reporting.\nNO = no such reference. Examples of NO: equality before the law, fair application of the rule of law, physical integrity, immigration or asylum as such, crime, as well as names, job titles and datelines."}, "q5": {"q": "Q5. Which kind of equality? Choose ONE category.", "how": "If more than one category applies, decide which ONE is most clearly emphasized.", "opts": [{"key": "econ", "name": "Economic equality", "desc": "Statements mentioning financial and economic equality. Examples: ordinary citizens are doing poorly; economic inequality is on the rise; redistribute from the top to the bottom; the rich should bear a larger burden; society is drifting apart; narrow the gap between rich and poor; wealth tax; share the benefits of globalization fairly; mobility, energy, housing and health care must be affordable for all."}, {"key": "chances", "name": "Equal chances / social mobility", "desc": "Statements mentioning equal educational, economic and social opportunities. Examples: good education for all; higher education accessible for low- and middle-income students; a child's social background should not determine its future; everyone must be given a fair chance regardless of their parents' income."}, {"key": "rights", "name": "Equal rights / anti-discrimination", "desc": "Statements mentioning discrimination based on disability, race, colour, religion, sex or gender; LGBTQ rights; equal pay for women (gender pay gap). Examples: we are the party of diversity and inclusion; we want a diverse society; a quota for women on supervisory boards."}]}, "q6": {"q": "Q6. What position does the statement take on equality?", "how": "SUPPORTS = in favour of more equality or against inequality — demands, measures that reduce inequality, criticism of inequality; saying that inequality exists, grows or is a problem also counts.\nAGAINST = argues against more equality or against the measures for it, or presents inequality as acceptable, deserved or necessary.\nMENTIONS = refers to the topic without taking a position (neutral facts, events, agendas).\nReported speech: code the position of the actor who is reported ('Labour calls for a wealth tax' = supports). The position is about equality, not about a party: 'The tax cuts only help the rich' = supports."}}, "q2": {"q": "Q2. Is it mainly about UK national politics or international politics?", "how": "NATIONAL = the main political issue sits in the national arena: the UK government, Westminster, national parties and their leaders, national laws, elections and policy debates. A foreign event counts as national when the article is about how the UK government, parliament or parties respond to it.\nINTERNATIONAL = mainly another country's politics, or international affairs with no domestic focus.\nThe main topic decides, not a single sentence."}, "training": [], "entry": {"items": [{"id": "UK_S25", "press": true, "title": "", "paras": ["Mr Speaker, I would like to thank the Prime Minister for the advance copy of her statement. Today we embark on the country’s most important negotiations in modern times. The British people made the decision to leave the European Union and Labour respects that decision. The next steps along this journey are the most crucial and if the Prime Minister is to unite this country, as she says she aims to do the Government needs to listen, consult and represent the whole country, not just the hard-line Tory ideologues on her own benches. Britain is going to change as a result of leaving the European Union.", "The question is how. The Conservatives want to use Brexit to turn our country into a low wage tax haven. Labour is determined to invest in a high skill, high tech, high wage future, to rebuild and transform Britain, so no one and no community is left behind. Mr Speaker, the direction the Prime Minister is threatening to take this Country is both reckless and damaging and Labour will not give this Government a free hand to use Brexit to attack rights and protections, cut services and create a tax dodgers’ paradise. So let me be clear, the Prime Minister says that no deal is better than a bad deal but the reality is; no deal is a bad deal.", "Less than a year ago the Treasury estimated that leaving the European Union on World Trade Organisation terms would lead to a 7.5 per cent fall in GDP and a £45 billion loss of tax receipts. Has the Treasury updated those figures or do they still stand? If updated, can they be published? If not, what deal could be worse than those consequences of ‘no deal’? It would be a national failure of historic proportions if the Prime Minister comes back from Brussels without having secured protection for jobs and living standards.", "So we will use every parliamentary opportunity to ensure the Government is held to account at every stage of the negotiations. Mr Speaker, We all have an interest in ensuring the Prime Minister gets the best deal for this country. To safeguard jobs and living standards Britain needs full access to the single market. The Secretary of State for exiting the EU seems to agree with this. He stated in this House on 24 January the Government’s plan is a: “comprehensive free trade agreement and a comprehensive customs agreement that will deliver the exact same benefits as we have” That is what they have pledged.", "So will the Prime Minister confirm today, that she intends to deliver a trade and customs agreement with “the exact same benefits”? The same goes for protecting workers’ rights and environmental standards, protecting Britain’s nations and regions, protecting Britain’s financial sector and services and making sure there is no return to a hard border in Northern Ireland. And when does she expect to be able to guarantee the rights of all those EU nationals who live, work and contribute to this country? And for those British nationals who live in the EU, including guaranteeing their UK pensions will not be frozen post-Brexit? Mr Speaker, Brexit would be a huge task for any government.", "Yet so far they seem utterly complacent about the scale of the task ahead and government ministers can’t make up their minds about their real objectives. The Foreign Secretary said in October: “Our policy is having our cake and eating it.” Today the Chancellor said: “We can’t have our cake and eat it.” These might seem flippant exchanges from ministers, but these reflect serious differences about Britain’s negotiating aims. The Government must speak with a united voice. The Foreign Secretary is the same man who promised our NHS £350 million pounds a week once we left the EU. Now he believes that leaving the EU without a deal would be “perfectly ok”.", "It would not be “perfectly OK”. It would damage our economy and people’s living standards. Will the Prime Minister confirm she rejects such complacency? Labour has set out our tests for this Government’s Brexit negotiations And we will use all means possible to make sure we hold the Government to their word on full access to the single market, on protecting Britain from being dragged into a race to the bottom, and ensuring our future relationship with the EU is strong and co-operative. A relationship where we can work together to bring prosperity and peace to our continent.", "If the Prime Minister can deliver a deal that meets our tests, we will back her. More than ever, Britain needs a government that will deliver for the whole country, not just the few. And that is the ultimate test of the Brexit deal that the Prime Minister must now secure. Ends"], "gold": {"q2": "national"}, "note": "both experts agree on scope (second UK entry item; no international UK article exists in the gold)"}, {"id": "UK_S18", "press": false, "title": "", "paras": ["Gordon Brown is expected to give assurances to Labour MPs on Monday about his future election strategy and possibly the personnel that will lead it. It will be his first meeting with the parliamentary party since it rejected this week's extraordinary calls for a coup against his leadership, but senior figures in the cabinet want assurances that it will be a balanced strategy that will be more open about the need for some spending cuts, and so reach out to those in middle Britain concerned by the scale of the budget deficit. The cabinet met for 90 minutes today and did not discuss the plot or its causes, but was instead told by Brown to focus on the economy and a co-ordinated response to the weather. But separately Brown met the defence secretary Bob Ainsworth, cited as being unhappy with Brown's leadership in the week, and had a further meeting with the justice secretary, Jack Straw. He was also understood to have had a joint meeting with Lord Mandelson, the business secretary, and Douglas Alexander, the international development secretary, to discuss the election and the likelihood of holding a special political cabinet next week.", "The meeting of the parliamentary party on Monday is being billed as a call to arms rather than a post-mortem. Nevertheless there have been tensions at the top of the party over strategy and decision-making style ever since the pre-budget report in early December appeared to bundle the party back to a crude \"Labour investment versus Tory cuts\" line. The prime minister will need to galvanise MPs in the face of a ComRes poll for the BBC today showing Labour is seen as by the far most divided party, and a YouGov poll for the Sun which saw the Tories ahead by 11 points. \"I am sure every cabinet member believes that if they could get back to Monday by paying £500 they would do so because we were winning on Monday. Divided parties are toxic with the electorate.", "We all know that,\" said one cabinet minister. Some advisers are urging Brown to set out precisely how the election campaign team will function, including the respective roles of Lord Mandelson, Douglas Alexander and Harman. The issue is developing emblematic significance it probably does not warrant, but is still seen as important. Behind it lies the question of the extent of the influence of Ed Balls, the schools secretary, on election strategy – an influence that is resented elsewhere in the cabinet. And behind that lies the issue of whether the government has adopted a sufficiently balanced and open account of how it will halve the deficit in four years.", "Balls, repeatedly accused of wanting to fighting a class war – something he has denied in repeated interviews – does want to run a more traditional \"investment v cuts\" attack that colleagues say is largely unsustainable given the scale of the deficit. Yet even this dispute has been one of emphasis, rather than deep ideology: the budget numbers have been set out and agreed in the pre-budget report. Newspaper reports suggested that some cabinet ministers held meetings with Brown on Wednesday in which they urged him to change his style and emphasis. But Mandelson said today: \" I don't think that the discussions that have taken place have quite followed those lines.\" Asked if Brown had been told not to pursue a \"core vote strategy\", Mandelson said: \"I have never heard any of my colleagues, and certainly not the prime minister, ever suggest that the Labour party can or should win on the basis simply of those who are supporting us now.\" Brown was given further space to show leadership when the former defence secretary Geoff Hoon, one of the instigators of the call for a secret ballot of Labour MPs on Brown's leadership, accepted defeat. He said \"I think it's probably over.", "I accept that we made that opportunity and we don't appear to have succeeded.\" Brown is unlikely on Monday to adopt the apologetic tone he did when he spoke to Labour MPs after the last challenge to his leadership, in June 2009. The pledge of more collegiate government and to consult colleagues is familiar fare for a leader in trouble, and if Brown did renew these promises in private conversations over Wednesday with cabinet minsters such as Jack Straw and Harriet Harman, few will be betting the windfarm on the prime minister changing his ways this time. Similarly there is little prospect of a new Brown in public. As Mandelson said a year ago in a leaked private email to Derek Draper: \"A new public persona cannot be glued on to [Brown]. It cannot be found, it has to emerge.", "It will do so from self-confidence ... when he is being successful and receiving approval. Then he will visibly relax. He will be enjoying himself. Not so angry.\" It is possible Brown, finally relieved of threat to his leadership, will relax, but it is unlikely he will ever excel in emotional intelligence. Yet many Labour MPs may not anyway have an appetite for a big post-mortem into what happened.", "Most of them want a clearer idea about how to take on the Tories in the run-up to the election. They liked the Labour dossier, drawn up by Alistair Darling's office on Monday, \"exposing\" the so-called £34bn black hole in Tory spending plans, and they liked even more David Cameron's admission that he \"messed up\" in response by initially suggesting he was going to drop his party's commitment to recognise marriage in the tax system. One Balls supporter strongly praised Darling's work, saying \"It was probably the first proper day of scrutiny the Tories have come under, and they crumbled.\" Brown is also facing pressure to start getting out an upbeat message and there has been disagreement on how much the election can be won simply by attacking the Tories, or by putting out a positive message for a fourth term. \"Let us remember that you win elections on the future, not the past,\" Mandelson told the party conference last year. This week the Labour party looked back.", "Now, very late in the day, it has to set out that credible future agenda."], "gold": {"q2": "national", "q1": "yes"}, "note": "both experts agree on scope"}, {"id": "UK_X02", "press": false, "title": "", "paras": ["David Cameron left his eight-year-old daughter in the pub following a Sunday lunch, after a mix-up with his wife Samantha, Downing Street has admitted. The couple's daughter Nancy wandered off to the toilets while they were arranging lifts and they only realised she was not with them when they got home, the Sun said. The prime minister rushed back to the Plough Inn in Cadsden, Buckinghamshire, where he found his daughter with staff. A Downing Street spokesman said: \"The prime minister and Samantha were distraught when they realised Nancy wasn't with them. \"Thankfully when they phoned the pub she was there safe and well.", "The prime minister went down straight away to get her.\" Downing Street said the incident happened \"a couple of months ago\". The story could prove embarrassing for the prime minister, coming on the same day as the government relaunches its £450m troubled families programme. The Camerons were at the Plough Inn, near Chequers, with Nancy and their other children, Arthur, six, and 22-month-old Florence, as well as two other families. When Cameron left the pub he went home in one car with his bodyguards and thought Nancy was with his wife and their other children in another car. Samantha Cameron had assumed her eldest daughter was with her father.", "The mistake was only discovered when they got home. The prime minister drove back to the pub and found Nancy helping staff. She was away from her parents for about 15 minutes. A Downing Street spokeswoman said there was no question of the Camerons blaming security for the incident. \"Sam thought the PM had Nancy, the PM thought Sam had Nancy,\" he said.", "\"They take responsibility for their own children. No one is going to face disciplinary action.\" The spokeswoman declined to discuss whether Cameron had drunk alcohol with his meal. \"He had gone with friends at lunchtime, with a number of families with children, and they left in various different vehicles,\" she said. \"As you know, the prime minister is a very busy man but he always tries to live as normal a life as possible with his family.\" The Sun quoted a Plough insider as telling the paper: \"You'd have thought someone would have done a headcount or something. \"Pub staff found their daughter in the toilet and didn't know what to do.", "\"It's not like you can look up David Cameron in the phone book and then ring to say, 'You've left your daughter behind'. \"It's frightening the prime minister of Britain can forget something so important as his own daughter.\""], "gold": {"q1": "no"}, "note": "both experts: not political (coded 20-21 Oct 2026); non-political entry-test item (Q1 must be right)"}], "rule": {"min_scope_correct": 2}}, "batches": [[{"id": "UK_T1_01", "press": false, "title": "Capitalism and the death of conservatism", "paras": ["There is an omission in Jonathan Aldred’s account of how western capitalism began to shortchange many people from 1980 onwards (The long read, 6 June). For decades after 1945, communist tanks lined the borders of western Europe and communist parties were strong in Italy and France. The western system strove to retain popular loyalty by successfully providing the masses with better lifestyles than could communism – through the NHS, welfare benefits and reasonable wages. This was maintained at least in part by the heavy taxes on the super-rich, whose post-1980 reduction Jonathan Aldred describes. From 1980, Reagan and Thatcher launched a climate of credible military confrontation with Soviet communism, leading to the demise of the latter – and hence no need to moderate capitalism in order to compete with a rival system.", "The gloves are off, the super-rich are getting ever richer, and step by step the benign features of 1945-79 UK capitalism are being dismantled. Charles Patmore York • Jonathan Freedland’s “How Brexit caused the strange death of British conservatism” (8 June) is an extraordinary headline because the conservatism of Edmund Burke and Michael Oakeshott died long ago during Thatcher’s time under the influence of the Institute of Economic Affairs and the Chicago school economists, when Farage was himself a Tory. So now, while the Brexit party may “rail against” a hated elite, their unexplained substantial funding implies reliance on an elite’s money, possibly even the same elite that funds the Tory party. And while its philosophy may be “slash and burn”, the Tory cabinet’s (many now standing for leader) cuts to health, social care, including care for disabled people, and education make them the destroyers. With such alternatives, voting Labour is the best option.", "David Murray Wallington, Surrey • Jonathan Freedland suggests that the current Conservative party is anything but. The Conservative party lost its conservative nature in May 1979. For all the championing of Victorian values, Margaret Thatcher was a radical. Subsequently, any Conservative politician with ambitions has been required to worship at the altar of the blessed Margaret, and to fight others on the field of who can out-Thatcher the other. In the current Conservative and Unionist party (for how much longer?) she would be dismissed for being far too leftwing.", "Nick Pattinson Stockport, Greater Manchester • Join the debate – email guardian.letters@theguardian.com • Read more Guardian letters – click here to visit gu.com/letters • Do you have a photo you’d like to share with Guardian readers? Click here to upload it and we’ll publish the best submissions in the letters spread of our print edition"]}, {"id": "UK_T1_02", "press": false, "title": "Sajid Javid: Why we are changing how charities claim gift aid", "paras": ["Fundraising has changed. Today, people are more likely to be asked to sponsor a friend for charity through online giving pages, or to send a text to donate money to a cause close to their heart on their commute home rather than through more traditional fundraising routes. The government wants to make sure gift aid keeps pace with how charities fundraise. Gift aid is a hugely important source of income for the charity sector, worth more than £1bn a year. We want to make sure that charities can claim their gift aid repayments as quickly and easily as possible.", "To achieve this, we've listened to charities and introduced a way to file gift aid claims online. At Budget 2011 we announced a new IT system – Charities Online – which allows charities to make a gift aid claim through an online portal. Charities Online went live on 22 April and almost 30,000 charities have already signed up to use it. Following conversations with the charity sector, we've also introduced a six-month transition period to allow charities to continue claiming gift aid using the old R68(i) claim forms whilst they prepare for the new system. This transition period is coming to an end on 30 September, so all claims made from 1 October onwards will need to be made using Charities Online.", "HMRC is currently writing to all charities that have claimed gift aid in the last three years reminding them about this change. The new system will make it significantly easier to make repayment claims and shorten the standard processing time from around 27 days under the old R68(i) forms to just five days. This should also significantly reduce the time and money spent by charities on administering their claims. There are three ways for charities to claim – using an online claim form, a database-to-database solution, and a new paper form for those organisations that don't have access to the internet. Built-in checks will make sure errors in claims are identified and can be amended before the claim is submitted, so they aren't sent back to charities and delaying payments.", "And charities will receive their payments much more quickly when they use Charities Online. It is also worth remembering that gift aid can be claimed up to four years after the donation is received. So although all claims will need to be made using the three Charities Online claiming options from 1 October, charities shouldn't miss out on gift aid repayments. Charities Online also enables charities to claim payments under the new gift aid small donations scheme. This is a new scheme, separate from gift aid, which enables charities to claim top-up payments of 25p for every £1 collected on cash donations of £20 or less that it's difficult to get a gift aid declaration for.", "Once the scheme is up and running it's expected this will be worth another £100 million annually to the charity sector. Alongside this we launched the consultation Gift Aid and Digital Giving in July this year, seeking views on a variety of ways gift aid could be changed to make it work better with new ways of fundraising. We want to make it easier for charities to get the money they need to get on with the vital work they're doing and make a difference. The consultation closes on 20 September and so I would urge you to contribute your views to this important debate. Sajid Javid is economic secretary to the Treasury This content is brought to you by Guardian Professional.", "To join the voluntary sector network, click here."]}, {"id": "UK_T1_03", "press": false, "title": "Bin strike was no triumph for workers", "paras": ["It is astonishing how myths perpetuate themselves. Owen Hatherley refers to \"the triumphant outcome of the Leeds bin workers' strike against privatisation and pay cuts\" (The bins that tidy, 25 September). Nothing could be further from the truth. The Liberal Democrat-Conservative administration set up the process to implement equal pay legislation. An independent evaluation, with full trade union involvement, examined all city council jobs.", "Under this evaluation the vast majority remained at the same pay level. Some, including care workers and cleaners, who are currently predominantly women, received substantial pay rises. But a third group, including the bin workers, were evaluated at a lower level than their existing pay. The administration immediately safeguarded the last group's pay for three years while a solution was sought. Initial council proposals were rejected and then, catastrophically for the workers, the unions called a strike with 18 months of the protected-pay period still to run.", "An efficiency savings package that would have safeguarded pay levels was initially rejected, but almost identical proposals were later accepted – after a strike lasting 17 weeks. Thus the Liberal Democrat-Conservative controlled council implemented equal pay, safeguarded threatened pay reductions, and found a solution to the reductions recommended by the independent evaluation. The precipitate and ill-advised strike action of the trade unions failed to make any difference to the proposals and cost their members more than £4,000 each. Some triumph. Michael Meadowcroft Honorary alderman, City of Leeds"]}, {"id": "UK_T1_04", "press": false, "title": "John Prescott's son calls radio station to defend father's peerage", "paras": ["John Prescott's son took the unusual decision to call a radio phone-in today, to defend his father over his decision to accept a seat in the House of Lords. David Prescott called London's LBC radio to scotch claims that Prescott, the former deputy prime minister, had agreed to become a member of the House of Lords for money or to please his wife of 48 years, Pauline. He felt the need to call in and tell listeners that his 72-year-old father had only accepted the peerage in order to continue contributing to political life. David Prescott, who unsuccessfully bid to be a Labour parliamentary candidate at the 2010 general election, called James O'Brien, a presenter on LBC 97.3, to put the record straight the day after his father was sworn in to the Lords as Baron Prescott of Kingston Upon Hull. John Prescott had previously said he would never enter the Lords, despite the wishes of his wife.", "Prescott Jr reiterated the argument that his mother did not need her husband to have a title to be a lady — a comment first publicly expressed by his father. On the suggestion that Prescott Sr was pushed into it by his wife, he said: \"I mean it's very sweet and it makes a very good story, but quite frankly, the reason why John is going in and becoming a lord is because he wants to stay in the Houses of Parliament — not for the money, he just wants to stay there and campaign for the things he really still believes in, like social justice. \"Things that made him become a shop steward in the unions back in the 60s, and then become an MP and then spend 18 years in opposition and then to go on a fight for a Labour victory …\" On his mother, Prescott Jr added: \"We've always said she's always been a lady and she always will remain it and she doesn't need a title or so to basically confirm that in our eyes. We know that anyway...\" Asked by O'Brien why Prescott Sr didn't just remain as MP for Kingston Upon Hull to pursue his political aims, his son pointed out the veteran politician's age and the pace of life in the Commons. \"I think anybody who's been an MP will know the kind of workrate that that actually involves and at the age of 72, and for Pauline as well, I think it's just a case that he wants to do other things now but he still wants to be involved in the finest platform.", "Whether it's as a lord or not, the second chamber is still the Houses of Parliament.\" On the eve of his swearing-in ceremony, John Prescott tweeted that he would use the position to hold the government to account, and as a platform to campaign for issues he believes in. Prescott ruled out a peerage during an interview in 2008 with the Scotsman. The deputy prime minister had by this time announced his intention to stand down as MP at the 2010 general election. Asked about a possible future in the Lords, he said: \"I'm against too much flunkery and titles. But Paul would like me to.", "I tell her, 'What do you want to be Lady Prescott for? You're a lady already'.\" The same year, the Daily Mail reported quotes given by Prescott which firmly ruled out peerage. \"I don't want to be a member of the House of Lords. I will not accept it. My wife Pauline would quite like me to accept it, but why should I be sidelined to the Lords when I could do so much more for the Labour movement?", "\"Being a lord is not for three years or four years, it is for life. There are other things I want to get involved in. People think already that I have retired from public life — I haven't. I am still an MP and after that I still want to make a contribution.\""]}, {"id": "UK_T1_05", "press": false, "title": "Theresa May hopes to set example of female potential in Saudi Arabia", "paras": ["Theresa May has said she hopes to send a message about women in leadership when she visits Saudi Arabia, but stopped short of overtly criticising the country’s approach to equal rights. Speaking ahead of Tuesday’s second leg of her Gulf tour to boost post-Brexit trade ties in the region, the prime minister said she believed she would set an example as a female leader of a powerful government in a country where women are still barred from driving and must obtain permission from a male guardian to travel, marry or in some cases access healthcare. “I hope that people see me as a woman leader, [and] will see what women can achieve and how women can be in significant positions,” May told reporters onboard her plane to Amman in Jordan on Monday. “I’ve talked to the Saudis on a number of occasions now and I raise issues of this sort. I think we have already seen some changes.” May said she backed the Saudi government’s Vision 2030 programme of reform, though critics have said commitments to women’s rights in the strategy are vague pledges to increase numbers in the workforce by a small percentage.", "On her visit, May is set to meet Princess Reema, the first Saudi woman to hold a government position – vice-president of women’s affairs at the country’s sporting authority. May said she would be “talking to her about the role that she plays, and generally we do encourage people to look at a woman’s role in society”. However, May hinted that she felt her role was not to make an overt statement as a female leader, which might jeopardise what she could achieve as a prime minister. “It’s important for me as a woman leader and as leader of the government of the United Kingdom to maintain the relationships that are important to us as a country, for our security, and our trade for the future,” she said. The prime minister has so far avoided making any bold pronouncements about women’s rights on her visits to the region.", "Despite being the first woman to address the Gulf Cooperation Council of the six regional leaders in Bahrain last December, she made no direct mention of women’s issues at that meeting. It remains to be seen how May will interpret the Saudis’ conservative dress code for women. Both the German chancellor, Angela Merkel, and former first lady Michelle Obama have eschewed headscarves on their recent tours of the country, but the Duchess of Cornwall wore a loose scarf on her last visit. During the prime minister’s trip to Jordan on Monday, Downing Street announced a £1bn aid package to boost jobs development and education for Syrian refugees – an allocation of £840m worth of pledges made last year at the London Syria Conference along with £160m of new money. In bilateral meetings with Jordan’s prime minister, Hani al-Mulki, and King Abdullah, who toured military facilities with the British prime minister on Monday, May has also agreed new UK support for the Royal Jordanian air force’s offensive against Islamic State.", "The king and May exchanged gifts, with the prime minister giving the monarch a framed copy of the original recommendation for the Military Cross that his British grandfather, Walter Percy Gardiner, received in 1944 when he served in the Royal Engineers regiment. Though counter-terrorism and the refugee crisis have been at the forefront of the formal announcements, the visit to Jordan and Saudi Arabia marks May’s first diplomatic offensive since the triggering of article 50 to formally explore future trade ties. No 10 said the prime minister was “expected to explore ways of boosting our already very strong ties” with Saudi Arabia, though human rights groups have warned that any new cooperation should not come at the cost of ignoring the country’s chequered human rights record, including juvenile executions and its brutal offensive in Yemen. Commenting on May’s visit, the Labour party leader, Jeremy Corbyn, said: “The prime minister should put human rights and international law at the centre of her talks with Saudi Arabia’s government this week. “Numerous human rights organisations, including the UNHRC and Amnesty International, have documented the dictatorial Saudi monarchy’s shocking human rights record.", "“The Saudi-led coalition bombing in Yemen, backed by the British government, has left thousands dead, 21 million people in need of humanitarian assistance and 3 million refugees uprooted from their homes. “Unless the prime minister challenges the Saudi regime over its abuses this week, it will be clear she is ready to sacrifice human rights and security on the altar of the arms trade.” On Sunday, it was revealed the Met police’s war crimes unit had begun a “scoping exercise” assessing whether criminal prosecutions could be brought over Saudi Arabia’s bombardment of the country, which is estimated to have killed more than 10,000 civilians and displaced more than 3 million people. Amnesty International’s Allan Hogarth said ministers had “buried their heads in the sand” over the conflict. The funding for jobs and education for Syrian refugees, intended to incentivise them to remain in the region, comes under a cloud of criticism that Britain has closed many of the avenues for refugees to come to the UK. The support will include basic humanitarian aid, funding for education and vocational training for Syrian children in Jordan and Lebanon, as well as infrastructure projects with the aim of increasing local employment opportunities for Syrians.", "May said the UK had “led the international response to the defining humanitarian crisis of our generation, and will continue to set the pace”. The government has been keen to stress its commitment to funding regional aid for refugees to deflect fierce criticism of the closure of programmes like the Dubs scheme, which brought lone child refugees to the UK from camps in Europe, though far fewer than expected have arrived. May said the funding would “provide a meaningful alternative to risking their lives trying to reach Europe ... This is clearly in the UK’s national interest.” Separately, the chancellor, Philip Hammond, is to visit Delhi and Mumbai at the head of a major trade delegation to try to drum up post-Brexit commercial opportunities. Joined by the junior international trade minister, Mark Garnier, the Bank of England governor, Mark Carney, and a series of business executives, Hammond will take part in a trade summit hosted by his Indian counterpart, Arun Jaitley, saying it is “more important than ever” for the UK to strengthen its ties with India after leaving the EU."]}, {"id": "UK_T1_06", "press": false, "title": "Do you know the state of your country? Take the test, as poll reveals perception gap", "paras": ["People worldwide tend to exaggerate the proportion of foreign-born prisoners, overestimate teenage pregnancies and underestimate the health of the nation, research shows. The worldwide Ipsos Mori survey, which reveals the gaps between perception and reality, also shows that people tend to think the murder rate – including deaths caused by terrorism – are growing when, in many cases, the opposite is true. When asked in the survey to guess how many prisoners were born in another country, the average answer by American respondents was 32% – six times higher than the actual figure (5.2% in 2014). In the UK, the average estimate was 34%, almost three times the real figure (11.8% in England and Wales in June 2017), while Australians perceived that 40% of prisoners were foreign-born, almost twice the actual figure (18.7% in mid-2016). Meanwhile, respondents from the Netherlands gave an average answer of 51% (the actual figure was 19.1% in September 2015).", "The survey asked people in 37 countries what proportion of teenagers gave birth each year, a question that resulted in vast gaps between perception and reality. Every country in which the survey was conducted overestimated the number of teenagers giving birth. Brazilians, on average, thought almost one in two 15- to 19-year olds gave birth each year – whereas the figure is actually 6.7%, according to the latest World Bank data. South Africans and Colombians also hugely overestimated teenage birthrates, guessing that 44% of 15- to 19-year-olds gave birth each year (in reality the figures are 4.4% and 4.9% respectively). American, British and Australian respondents were also wide of the mark: the average US respondent put the figure at 24% (it is, in fact 2.1%); Britons’ average answer was 19% (in fact it was 1.4% in 2015) while Australians said 18% (it was actually 1.2%).", "Elsewhere, the survey asked people in 30 countries if the murder rate was higher or lower than in 2000. In 25 countries the murder rate fell in the intervening years and remained stable in two others. More than half of Americans (52%), 38% of Australians and 36% of Britons thought the murder rate was higher now despite it falling in all three countries. The annual Ipsos/Mori Perils of Perception survey also shows that people tend to think the number of deaths caused by terrorism has increased even though, in many of the 34 countries surveyed for this question, the opposite is true. While 25 of these countries experienced a decrease in the number of deaths caused by terrorism in the 15 years post-9/11, many respondents said they thought things had got worse.", "Bobby Duffy, managing director of the Ipsos Mori Social Research Institute, said there is one key issue that leads to these misconceptions: “Our brains handle negative information differently and store it more accessibly,” he said. “We overestimate what we worry about: the more we see coverage of an issue, the more prevalent we think it is, especially if that coverage is vivid and threatening.” Methodology: The Ipsos Mori Perils of Perception Survey 2017 interviewed 29,133 people in 38 countries between 28 September and 19 October 2017 with between 500 and 2000 participants in each country covered and the data was weighted to match the profile of the population. A full list of sources and links to the data can be found at http://perils.ipsos.com."]}, {"id": "UK_T1_07", "press": false, "title": "Boris Johnson: 'no easy military solution' after North Korea nuclear test", "paras": ["Boris Johnson has warned there is “no easy military solution” to prevent North Korea escalating its nuclear aggression but said all options were still on the table for retaliation after the regime’s nuclear weapons test. The UK foreign secretary said it was not clear how a military response from the west would be possible, given the proximity of the South Korean capital, Seoul, to the North Korean border. Any military challenge to Kim Jong-un’s regime could come at huge cost to civilian lives in the South, Johnson said. “It’s certainly our view that none of the military options are good,” he told reporters after North Korea announced it had tested a powerful hydrogen bomb that could be loaded on to an intercontinental ballistic missile “It is of course right to say that all options are on the table, but we really don’t see an easy military solution,” he said. Were the west to hit back with force against North Korea, “they could basically vapourise” large parts of the population even with conventional weapons, Johnson said.", "“So that’s not really very easy to threaten and to deliver,” he said. “Much more productive, we think, is to continue with the international diplomatic effort.” The foreign secretary’s comments put him at odds with the US president, Donald Trump, who ramped up the rhetoric on Sunday by accusing South Korea in a tweet of favouring a policy of “appeasement”, telling Seoul that method would not work because the North Koreans “only understand one thing!” Johnson called for “common sense” to prevail in the crisis and urged Beijing to put further pressure on Kim’s regime. “There is no question that this is another provocation. It is reckless. They seem to be moving closer towards a hydrogen bomb, which, if fitted to a successful missile, would unquestionably present a new order of threat.", "“We have to consider how to respond and it’s our view in the UK, overwhelmingly, that peaceful diplomatic means are the best.” The foreign secretary said the UK could not accept China’s suggestion that there was an equivalence between the South Korea-American military exercises and nuclear testing conducted by North Korea. “We don’t accept that: what the South Koreans do is entirely legitimate, it’s peaceful, it’s been going on for years, it doesn’t represent any illegal provocation of that kind,” he said. “Our message to the Chinese is, and we are working ever more closely with them, we think there is more scope for you, the Chinese, to put economic pressure on the North Koreans. It has worked, we have seen signs in the last six months of Chinese pressure actually changing the approach of North Koreans – let’s see if we can do it again.” Theresa May has condemned the latest nuclear test by North Korea as “reckless”, saying it is more pressing than ever to look at increasing the pace of implementing sanctions on the regime. The prime minister said the test, North Korea’s sixth since 2006, “poses an unacceptable further threat to the international community”.", "May reiterated the call she made with the Japanese prime minister, Shinzo Abe, during her trip to Japan last week for tougher action against Kim Jong-Un. “I discussed the serious and grave threat these dangerous and illegal actions present with President Abe in Japan this week and reiterate the call we jointly made for tougher action, including increasing the pace of implementation of existing sanctions and looking urgently in the UN security council at new measures,” she said. “This is now even more pressing. The international community has universally condemned this test and must come together to continue to increase the pressure on North Korea’s leaders to stop their destabilising actions.” China’s foreign ministry said the North Korean test had come “in spite of widespread opposition from the international community ... the Chinese government resolutely opposes and strongly condemns it.” The explosion overnight caused a 6.3-magnitude earthquake felt in Yanji, China, which is about six miles from North Korea’s Punggye-ri nuclear test site. South Korea’s meteorological administration estimated the blast yield to be five to six times more powerful than North Korea’s fifth test in September last year."]}, {"id": "UK_T1_08", "press": false, "title": "David Cameron says 'hard military force' needed to tackle Assad and Isis", "paras": ["David Cameron has said “hard military force” will be needed to remove President Bashar al-Assad from power in Syria and to defeat Islamic State. As he signalled the start of a government push to make the case for greater British military involvement in Syria, the prime minister said that a failure to take military action was “a decision itself and has consequences”. Cameron made his remarks at prime minister’s questions as Harriet Harman, in her last appearance at the dispatch box as Labour’s interim leader, pressed him to put a figure on the number of people Britain was prepared to take from refugee camps in countries neighbouring Syria. The prime minister said: “She talks about going to the causes of these crises. She is absolutely right about that.", "We have to be frank, particularly the eastern Mediterranean crisis is because Assad has butchered his own people and because Isil [Isis] have in their own way butchered others, and millions have fled Syria. “We can do all we can as the moral humanitarian nation taking people, spending money on aid and helping in refugee camps. But we have to be part of the international alliance that says we need an approach in Syria which will mean we have a government that can look after its people. Assad has to go, Isil has to go. Some of that will require not just spending money, not just aid, not just diplomacy but it will on occasion require hard military force.” The prime minister’s remarks suggest the government is preparing the ground to make the case for military action, which could take place on two fronts.", "These are expanding British involvement in airstrikes against Isis targets from Iraq to Syria, and possibly taking action against Assad. The prime minister’s decision to highlight the need for “hard military force” to remove Assad may cause some surprise as he lost a parliamentary vote in August 2013 that was designed to lead to military strikes against the Assad regime. The prime minister has signalled in recent days that he would not seek parliamentary approval for an extension of British involvement in airstrikes from Iraq to Syria unless he could be guaranteed a cross-party consensus. This was seen as a sign that he would not hold a vote if Jeremy Corbyn is elected Labour leader. But the prime minister indicated he would step up his efforts to make the case for military action.", "“When we don’t involve ourselves in these issues and take difficult decisions, that is a decision itself and it has consequences,” he said. “That is what I hope we can debate and discuss in the coming months.” The prime minister responded to Harman’s questions on refugees by saying the government would convene a meeting of councils and the relevant agencies to work out the settlement of the refugees. Government sources indicated a change of tack by saying they have been advised by aid groups that run the camps not to place the emphasis on unaccompanied children. The government had said it would place a focus on orphans. Harman said: “The responsibilities we share as well as the threats we face reach across borders in this globalised world.", "To be British is not to be narrow, inward-looking and fearful of the outside world but to be strong, confident and proud to reach out and engage with the rest of the world. The government should rise to this challenge of our time and I urge him to do so.” The prime minister said he was happy to consider an investigation by the parliamentary intelligence and security committee into the military operation to kill suspected terrorist Reyaad Khan in Syria. But with the government insisting it would not hesitate to take similar action against others on a reported “hitlist” of Isis extremists, he said he would not “contract out” responsibility for the UK’s anti-terror policy. Pressed by the SNP’s Westminster leader, Angus Robertson, who will serve on the committee, to refer the drone strike to the ISC, he said he would be “very happy to discuss that with the new chair”. But he added: “The only proviso I would put on it is that the intelligence and security committee cannot be responsible for overseeing current operations.", "“The responsibility for current operations must lie with the government, and the government has to come to the House of Commons to explain that. “I am not going to contract out our counter-terrorism policy to someone else. I take responsibility for it.”"]}, {"id": "UK_T1_09", "press": true, "title": "", "paras": ["Darren Hall achieves 23% upswing in Green vote in Bristol West *Greens in historic gains in Bristol West - with largest swing in constituency's electoral history*Darren Hall narrowly misses victory in Bristol WestDarren Hall (1), Green Party Candidate for Bristol West, has narrowly missed electoral victory in this three-way marginal constituency.Nonetheless, the Green’s vote share of 26.8% represents an unprecedented swing of 23% in this constituency’s electoral history. The closest contender being Labour’s swing of 10.5% in 1997. In 2010 the Green’s took received 3.8% of the votes cast in Bristol West. Hall, Green Party Home Affairs Spokesperson, said this of these landmark gains: “We have seen the Green Party in Bristol go from a small group of committed activists, to a major force for change in the future of this city.”“We now have powerful foundations from which to build on next year in the all-out elections, and in 2020”\"I’d like to congratulate Thangham, and I truly hope that she can deliver on the promises she has made over the course of her campaign.”The massive swing has not been the only gain - membership for Bristol Green Party has increased ten-fold since 2010, making it the largest local party and the largest Green Party in the UK. These trends have been reflected at a national level.The party’s surging vote share has also seen it achieve a record London result, with Charlotte George taking 11.8% in Hackney South & Shoreditch.Greens have saved a record number of deposits- at least 48 deposits, compared to 22 in 2005.", "The party has achieved its first ever seconds- Martin Dobson in Liverpool Riverside, with 12.1%, Jillian Creasy in Sheffield Central with 15.8% and Laura Bannister in Manchester Gorton with 9.8%Greens have also achieved a large number of third places- for Esther Obiri-Darko in Tooting, Ann Duncan in Oxford East, Caroline Russell in Highbury and Islington, Gulnar Hasnain in Vauxhall, Jaspreet Mahal in Ealing Southall, Charlotte George in Hackney and Shoreditch, Vix Lowthian in the Isle of Wight and Heather Finlay for Hackney North & Stoke Newington.The party has beaten the Lib Dems in over 100 seats.Ends"]}, {"id": "UK_T1_10", "press": true, "title": "", "paras": ["Speaking at the Lord Mayor's banquet in London, the Prime Minister has rejected predictions that Britain is in decline. Instead he stressed Britain's position is as a self-confident nation, sitting at the heart of the world's most powerful institutions and at the centre of global trade and diplomacy. Rejecting Labour's muddled foreign, aid and economic policies, David Cameron outlined how Britain will be 'hard-headed' as it addresses the challenges of an increasingly globalised world. He went on to highlight the need for Britain to keep a tight hold on its public finances in order to ensure a stable return to prosperity and make the most of new opportunities presented to Britain from emerging export markets. Concluding his speech David Cameron set out the central tenets of the Government's foreign policy strategy.", "He said: Our foreign policy is one of hard-headed internationalism: More commercial in enabling Britain to earn its way in the world, more strategic in focus on meeting the new and emerging threats to our national security and firmly committed to upholding our values and defending Britain's moral authority, even in the most difficult circumstances. Above all, our foreign policy is more hard-headed in this respect: it will focus like laser on defending and advancing Britain's national interest. We have the resources - commercial, military and cultural - to remain a major player in the world. We have the relationships - with the most established powers and the fastest growing nations - that will benefit our economy. And we have the values - national values that swept slavery from the seas, that stood up to both fascism and communism that helped to spread democracy and human rights around the planet - that will drive us to do good around the world.", "With these strengths in our armoury we can drive prosperity, we can increase our security, we can maintain our integrity. We are choosing ambition. Far from shrinking back, Britain is reaching out. Read the Prime Minister's speech in full."]}, {"id": "UK_T1_11", "press": true, "title": "", "paras": ["The Democratic Unionist Party has responded to the publication of the publication of the final report by the Ministerial Advisory Group on Shared Education. DUP Leader Peter Robinson and Education Spokesman Mervyn Storey described the report as an opportunity lost, instead choosing to focus more on academic selection. Peter Robinson MLA DUP Leader and First Minister of Northern Ireland Speaking today DUP Leader Peter Robinson said, ‘It is not desirable either economically or socially that we continue to perpetuate a kind of benign apartheid within our education system. It was for that reason that the DUP pressed to establish the Ministerial Working Group to address the issue of shared education. Even a cursory glance at this document reveals the authors lack any conviction or reforming zeal to tackle the core issues.Instead of focusing on the clear desire which exists across the community to promote shared education, they have decided to focus on the divisive issue of academic selection and have placed perceived class issues above the religious divide in their priorities.DUP Education Spokesman Mervyn Storey also queried the focus of the report saying ‘This is a report on shared education which unfortunately makes an assumption that religious segregation within education is a given.", "There is a clear and growing demand from right across our community for shared education to be taken forward, but the report’s authors largely side-stepped the issue.Indeed the report states that the Department of Education should actively support schools with a particular religious, philosophical or cultural status. However, whilst the authors of the report seem more than happy to continue a religious divide within schools they have set their face steadfastly against a school which has a philosophical ethos in favour of academic ability.The authors even recognised the lack of consensus on the issue of academic selection but did not see this as a barrier to making several specific recommendations on the issue, even recognising that these recommendations may not be implemented. However, it would seem that objections to shared education coming from a narrow section of education have prevented them from truly grasping the opportunity to move this debate forward.Two of the three authors of the report have long made their views known on the issue of academic selection, but it is very disappointing that they chose to make this report into a battle of social class instead showing a real desire to act on the clear desire within the community to tackle the segregation which exists in our education system.Many people will be very disappointed that this opportunity has not been seized upon to act on the desire shared by the vast majority of people in Northern Ireland, and articulated most strongly in recent times by the First Minister to tackle a division on grounds of religion within education that simply would not be tolerated across any other service.’"]}, {"id": "UK_T1_12", "press": true, "title": "", "paras": ["It's great to be here with you. I want to start by thanking all the delegates, trade unions, members and the whole Labour movement for your incredible support over the last year. Thanks also to my fantastic shadow Brexit team â-in the Commons and in the Lords.Â What a year it's been.In the conference motion you passed last year, you asked us to vote down Theresa May's flawed deal. We did. You asked us to take all possible steps to prevent No Deal.", "We did. You asked us to keep the option of a public vote on the table. We did.But now we face a very different challenge. Boris Johnson, leading the most right wing government in living memory. A man with no moral compass.", "No principles. And no regard for the truth. A man so unfit for the job that John Major has taken him to court. And even David Cameron has branded him â<U+0080><U+0098>self-serving'.I don't believe a word that Johnson says. And neither should you.", "Johnson told us Brexit would be good for the NHS. It won't. He told us shutting down Parliament wasn't anything to do with Brexit. It was. He told us that he can unite the country.", "He can't.He has never put anyone's interests above his own. And he's not going to start now With Dominic Cummings pulling the strings, he threatens to take us out of the EU without a deal. No Deal might not be a problem for Boris Johnson, Jacob Rees Mogg or Dominic Raab but it would be a disaster for working people across the country. This is not a game.Manufacturing would be torn apart. The service sector decimated.", "There would be chaos and delay at our borders. Vital foods and medicines will not get through. And the Good Friday Agreement could be imperilled. We will never accept that.That's why we were right to work on a cross party basis during the summer, with Jeremy uniting the opposition parties. To come together three weeks ago to pass a law to stop a No Deal Brexit on 31st October.We used to call Theresa May's government a â<U+0080><U+0098>zombie' government: but at least she occasionally won a vote.", "So far with this Prime Minister, it's Johnson 0; Corbyn 6It tells you all you need to know about Boris Johnson that we had to pass a law to stop him taking us out of the EU without a deal and that his first instinct is to try to find ways to break that law.Well, Prime Minister, no one is above the law. And if you think we are going to stand idly by while you break it, you've got another think coming. When Parliament resumes we will be ready.But while preventing No Deal is vital, it's not an end in itself, it's an insurance policy. It won't break the deadlock. The county wants to move on.", "And we have to find a way forwardConference, there is only one way forward – put it to the people!Too much has happened in the last three years for this now to be decided without the consent of the public. We need to ask the public whether they are prepared to leave with the best deal that can be secured. Or whether they wouldn't rather Remain in the EU. The people must have the final say.A referendum in which â<U+0080><U+0098>Remain' should â-and will â-be on the ballot paper. Along with the best leave deal that can be secured.", "We owe it to those who want to leave to secure that leave deal and put it to them in a referendum.Â Conference, we've come a long way. An Election is coming. It is inevitable. We have a Prime Minister with no mandate, no plan, and no majority. We've beaten the Tories in Parliament.", "Soon we will have to beat them at the ballot box.The choice is stark. Lose, and the 2020s could be another lost decade. A No Deal Brexit, on top of a hard-right agenda that will strip back rights and protections and sell off public services. Win, and Labour can pull this country back from the brink: end austerity, rebuild our public services, and invest in our communities. The stakes could not be higher.So Conference, I can announce today that an in-coming Labour government will legislate immediately for that referendum to take place.", "It will take place as soon as possible â-and no later than 6 months from a Labour government taking office.So, I have a very simple message today: If you want a referendum – Vote Labour. If you want a final say on Brexit – Vote Labour. If you want to fight for Remain – Vote Labour. Labour will let the people decide.Conference, you know where I stand on the question of Remain: I've said many times that I will campaign for it. But I profoundly respect those who take a different view.", "And Conference, let's go into this with our eyes open.Â In 2016 Labour campaigned for Remain. We did so because we are internationalists. We stand in solidarity with our friends and neighbours in Europe. We profoundly believe in peace, reconciliation, human rights and collaboration across borders. Socialist values.", "Our values. Then and now. And let those values guide us on the road ahead.Â But we didn't just campaign to Remain. We campaigned to Remain and to Reform. We cannot â-and we should not â-just defend the status quo in Europe or at home.", "We must make the case for radical reform in Europe and at home. We are the largest socialist party in Europe. It is our duty to lead. Let us bring together our sister parties across Europe. And host an international conference to forge our shared plan for a social Europe.", "With the UK at its heart, not sitting on the side-lines. Leading not pleading.But Brexit is deeper and bigger than our relationship with the EU. We will never get past Brexit if we don't understand why – when asked – so many millions said they wanted change. The people didn't just speak. They shouted.", "Millions told us that the current political and economic system isn't working. And they are right about that.The status quo is bust. Inequality and injustice are everywhere. We need a fundamental shift in power, and wealth, and opportunity. That's why our 2017 manifesto was so popular.", "We must build on it.Only a Labour government will end child poverty. Only a Labour government will confront the moral disgrace of homelessness. Only a Labour government will transform our economy to end insecure work – raise wages â-and create good new jobs across the country. Only a Labour government will tackle the climate emergency, so we can look at the next generation in the eye and say â<U+0080><U+0098>we did not let you down'.Â Conference, the Tories have failed: they've wrecked our economy, public services, and welfare state. They've wrecked our international reputation.", "Their time is up.We have to beat them, and we will. We have to defeat Johnson, and we shall. And defeat his politics, to show that decency can triumph. We have to deliver a radical Labour government and give the people the final say on whether we Remain in the EU.Let’s get on with it!Thank you."]}, {"id": "UK_T1_13", "press": true, "title": "", "paras": ["Liberal Democrats will out and about this weekend to promote our record of delivery in government. A number of national Days of Action are taking place across the country and you are invited to join the campaign trail. We want to tell as many people as possible about the work Liberal Democrats are doing locally and what we have delivered in our communities. Our activists will be knocking on doors, pitching up street stalls and delivering leaflets to tell people about Liberal Democrat wins such as delivering an £800 tax cut for millions of workers and the largest increase in the state pension. There are plenty of opportunities for you to join in and help us spread the word.", "Whether you are seasoned activist or a first time campaigner there really is something for everyone. Here are some of the events you can get involved with this weekend. Tweet us your photos and success stories to @libdems #LDdayofaction Sheffield Record of Delivery Day of Action - Friday 18 July Join Sheffield Liberal Democrats at Fulwood Old Chapel for their day of action on Friday. The group will be delivering and canvassing from 2pm to 9pm and food will be provided. For more information and to register click here.", "St Austell Day of Action - Saturday 19 July St Austell Liberal Democrats and Stephen Gilbert MP will be hosting a day of action in St Austell on Saturday, from 10am to 3pm. The group will be out on the doorsteps on the campaign trail to keep St Austell Liberal Democrat. There will be a lunch break at Table Table, The Carclaze from noon until 1pm, for refuelling ahead of the afternoon session. Meet at 10am in Tregonissey Road. For more information and to register click here.", "Montgomeryshire Lib Dems Day of Action - Saturday 19 July Join Montgomeryshire Liberal Democrats and their parliamentary candidate Jane Dodds for a day of door-knocking and delivering. The group will meet at the Park Street office and the day takes place from 10am to 3pm. For more information and to register click here. Bath Lib Dems Day of Action - Saturday 19 July Bath Liberal Democrats will be hosting an action day to spread the word in the community about the work Liberal Democrats are doing in Bath. The group will be introducing their parliamentary candidate Steve Bradley and new council candidates.", "The day takes place from 10.30am to 4.30pm. Meet at Bath Liberal Democrat Office, 31 St James Street West. For more information and to register click here. Liverpool Day of Action - Saturday 19 July Liverpool Liberal Democrats will be out and about in Woolton from 11am to 1pm on Saturday. The group will meet at the corner of Orient Drive and Halewood Road at 11am.", "For more information and to register click here. Penzance National Evening of Action - Tuesday 22 July Join Penzance Liberal Democrats for their National Evening of action on Tuesday from 6pm to 9pm. The group are looking for more volunteers to deliver leaflets and knock on doors. For more information and to register click here."]}, {"id": "UK_T1_14", "press": true, "title": "", "paras": ["American companies won't want Britain to be 'back of the queue' for any trade deal writes UKIP's Mike Hookem MEP. The Prime Minister thought he had achieved a 'slam dunk' when he got President Obama to parrot a line from Number 10 designed to scare people into voting to remain in the EU. \"But even removing the fact that from January next year it will be another president in office in the White House, the idea that the UK would be 'at the back of the queue' for trade is as likely as Cameron selling up his Notting Hill mansion and moving into a council house in Denby.Let's also not forget that the UK is the largest cumulative investor in the US with over US$520bn of investment and remains the country's second largest annual investor at over US$42bn each and every year. For the US to cut trade links with the UK at a time when they have a very precarious recovery would be to deny themselves the US$2 trillion in assets held by US subsidiaries of UK firms (as of 2010), 1 million jobs and US$72bn in wages paid by UK firms to US citizens. Trade is a tricky subject, and one which the Treasury tried to make more complicated with their farcical 'death by equations' dossier.", "So here's an ABC of companies who will not want an outgoing President to get in the way of trade with their cousins across the pond. A is for AppleB is for BoeingC is for ChryslerD is for DuPontE is for EbayF is for FordG is for GoogleH is for Hewlett-PackardI is for IBMJ is for JP MorganK is for KraftL is for Lockheed MartinM is for MicrosoftN is for NikeO is for OracleP is for PepsiCoQ is for Quaker ChemicalsR is for Ralph LaurenS is for SyscoT is for Time WarnerU is for United TechnologiesV is for VisaW is for Walt DisneyX is for XeroxY is for Yahoo!Z is for Zeebo In addition, because the UK is a net food importer we push up our own prices with the Common Agricultural Policy. Outside of the EU, UK food imports from the US would boost trade and save us billions on these subsidies which could instead be spent on measures to promote British industry and investment in the rural economy. Furthermore, the EU sulphur directive means shipping companies have to spend money on equipment to allow their vessels to enter EU waters. Outside the EU, we could become a major hub for Europe as companies would find it better to use British ports - providing a much needed boost to our coastal communities.", "What was that about the 'back' of the queue, Mr Obama? I think you mean 'the front'."]}, {"id": "UK_T1_15", "press": true, "title": "", "paras": ["Today Westminster MPs will vote either to defend the Scottish Parliament or to fundamentally undermine it. It’s a crucial day in the history of devolution. Because of the Scottish Parliament we’ve been able to protect the NHS from the creeping privatisation we see south of the border. We’ve re-instated free university education and we’re helping with the cost of living – through measures such as getting rid of prescription charges. But the powers of the Parliament that people voted for so overwhelmingly back in 1997 are under threat.", "The Westminster Government is using Brexit as cover to launch a devolution power grab. They want to force through their EU Withdrawal Bill even though every party at Holyrood, bar the Tories, has refused to give their consent to the bill as it stands. The issue here is not whether people agree or disagree with Brexit, or whether you’re for or against independence. It’s about protecting devolution. Under their plans, the Tories want to freeze some of the Parliament’s powers for up to seven years whether or not MSPs agree.", "This will directly affect devolved policy areas like farming, fishing and the environment which are currently exercised at EU level. They’ve never given a decent reason for wanting to do this. If it’s because they think there should be a common UK approach to these matters after Brexit, we’ve always said we can reach an agreement – when that is in Scotland’s interests and with the consent of the Parliament. There’s a big point of principle at stake. Ever since the Scottish Parliament was set up Westminster has never passed a law on devolved matters without the consent of Holyrood.", "But today that’s just what the Tories are going to try to do. This is no longer a dispute between the Scottish and UK Governments. It’s about whether the decisions of Holyrood on devolved matters can be over-ridden by Westminster. We all know the Tories fought tooth and nail against devolution in the first place. They haven’t won an election in Scotland for more than 50 years but now act as if they can do anything they want to Scotland and get away with it.", "Even at this late hour I’m calling on them to pull back. Amendments have been tabled to the bill which would protect devolution and enable an agreement to be reached. This article originally appeared in the Daily Record. Share the message 0 Facebook Share Twitter Share Whatsapp Share Facebook Messenger Share Print Share Email Share Linkedin Share Link Share"]}, {"id": "UK_T1_16", "press": true, "title": "", "paras": ["Border chaos a wake-up call for travel post-Brexit warns MEP A South West MEP has warned that the travel chaos experienced by thousands of air passengers to Europe this summer is a taste of what is to come post-Brexit [1]. The delays have been caused by tighter checks at some EU airports. Molly Scott Cato, Green MEP for the South West and Green Party speaker on Brexit, says this should serve as a ‘wake-up call’ for what lies ahead once we leave the EU. She said:“We were promised that taking back control would lead to less red tape. But what we have seen this summer is the inevitability that greater control of borders will result in more not less bureaucracy and paper work.“Once Britain leaves the EU, UK citizens will be covered by the same rules as Americans or Australians.", "This will mean everyone wanting to visit an EU country will likely be required to follow a process similar to applying for a visa, providing personal information including particulars about state of health, any criminal convictions and details of the purpose of travel [2].“It is ironic that the delays experienced by the British travelling public have been so vociferously lambasted by the Brexit headbangers of the right-wing media [3]. Isn’t this exactly what they wanted? To take back control of our borders? Perhaps they naively believed that restrictions on freedom of movement would only apply to people they didn’t want to enter the UK, not UK nationals wishing to travel to the continent. Their reaction borders on the ridiculous, and this is another fine mess that Brexiteers are leading us into.”Notes:1. https://www.theguardian.com/politics/2017/jul/29/uk-border-customs-chaos-hit-hard-brexit 2. http://www.independent.co.uk/travel/news-and-advice/etias-brexit-schengen-area-british-passports-online-visa-a7879876.html3. http://www.dailymail.co.uk/news/article-4748182/EU-border-checks-leave-UK-tourists-queuing-FOUR-hours.html"]}]], "screeners": [{"id": "UK_S19", "press": false, "title": "", "paras": ["David Cameron’s promise during his address to the Conservative party conference that “an all-out assault on poverty” would be at the centre of his second term is undermined by a report that reveals planned welfare cuts will lead to an increase of 200,000 working households living in poverty by 2020. The findings, published on Thursday by the Resolution Foundation, appear to contradict the prime minister’s vow to devote the second five years of his premiership to creating a “Greater Britain” marked by social reform, real equality and less racial discrimination. In a speech that was clearly designed to respond to Jeremy Corbyn’s election as Labour leader, Cameron sought to position his party as the dominant force on the centre ground of politics. The prime minister argued the best way to tackle the deep roots of poverty lay in getting people into better paid work. The Conservatives, Cameron said, must live up to their great traditions of social reform and be the right party “for those who work hard, want to get on and want more money at the end of the month”.", "Insisting Britain was on the brink of something special, he claimed “hope is returning and we are moving into the light”, allowing the Conservatives to be seen as the “party of the fair chance, the party of the equal shot”. But the new research by the Resolution Foundation – now chaired by former Conservative minister David Willetts – suggests the government’s welfare cuts introduced in the budget in a bid to cut the deficit will drive at least 200,000 working households into poverty under a definition that the government is abolishing. The thinktank’s analysis also indicates that the number of all households – both in and out of work – that will be in poverty at the end of the parliament is projected to rise by 700,000 to nearly 4 million. The report will pile further pressure on ministers to rethink how they protect the working poor, following the introduction of controversial plans to cut tax credits in the first budget immediately after the election. Conservative MPs are already braced for protests next April when the cuts to tax credit thresholds, set out in the summer budget, start to bite.", "There are reports that Treasury ministers are considering delaying sending out letters spelling out the details of the cuts until after Christmas. As part of the tax credit reforms ministers are abolishing the long-standing child poverty target that measures the number of children living in households with an income lower than 60% of median household income. The research compiled by the Resolution Foundation shows that under this definition 100,000 working households will fall into poverty next year alone as a result of the summer budget. The calculations take into account planned rises in the national minimum wage towards £9 an hour by the end of the parliament. Willetts has also been pressing ministers to rethink the tax credit cuts due to the damaging impact on the working poor.", "In its key findings the report also estimated that: • A further 200,000 children (predominantly from working households) will fall into poverty in 2016 simply as a result of the tax and benefit measures announced at the summer budget, including the increases in the national minimum wage. • The total number of working households in poverty will have reached 2 million in 2020. • The summer budget measures will lead to income falls of more than 4% in the bottom fifth of earners, contrasting with income rises of 4% for the top third. • The number of children in poverty in working and non-working households is estimated to reach up to 3.9 million by 2020. This is 1.2 million higher than the 2016-17 baseline and 600,000 higher than was projected for 2020 prior to the budget. Cameron made no direct mention of George Osborne’s controversial plans to cut tax credits, which will mean a loss of £1,000 for 3 million of the lowest-paid workers. But he said he would seek to tackle the “scourge of poverty”, which is best achieved by helping people back into work where the new “national living wage” will mark a “giant leap forward”. The prime minister’s aides positioned his conference speech as a pillar of the optimistic narrative put forward by the Conservatives in the wake of Corbyn’s election as they strive to emphasise the need for “social reform”.", "“You can’t have true opportunity without real equality,” said the prime minister, citing examples of black and minority ethnic Britons denied opportunities. “And I want our party to get this right. Yes us – the party of the fair chance, the party of the equal shot, the party that doesn’t care where you come from, but only where you’re going. Us, the Conservatives, I want us to end discrimination and finish the fight for real equality in our country today.” Cameron, who knows he has been defined largely by his privileged background, said he recognised that the reality that someone’s salary depended on what their father’s was was more prevalent in the UK than in any other country in the developed world. “I’m sorry, but for us Conservatives, the party of aspiration, we cannot accept that,” he said.", "In a speech that frequently attacked Labour, Cameron said: “Labour: you’re not for working people, but hurting people. “If you want a lecture about poverty, ask Labour. If you want something done about it, come to us, the Conservatives. There’s another argument we need to win.” Late on Wednesday night, a Treasury spokesperson said: “We’re determined to deliver a new settlement for the British people, one that will create a higher wage, lower tax and lower welfare economy. “Our welfare reforms are fair and necessary, and will take tax credit spending back only to 2008 le
